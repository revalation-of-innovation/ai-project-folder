<script>
/* content/phys-2.js */
/* PHYS 2325 · Units 4–5: Newton's laws and applying them (Young & Freedman Ch 4–5) */
(function () {
  const CQ = window.CQ;
  const { L, U, T, EX, MC, MULTI, TF, NUM, FILL, MATCH, ORDER, G } = CQ.dsl;
  const F = (x, s = 3) => CQ.fmt(x, s);
  const g = 9.8;
  const D = CQ.dg;
  const deg = (r) => (r * 180) / Math.PI;
  const rad = (d) => (d * Math.PI) / 180;
  const sin = (d) => Math.sin(rad(d)), cos = (d) => Math.cos(rad(d));

  /* ================= generators: Unit 4 ================= */
  CQ.gen('p.netforce', (R) => {
    const F1 = R.pick([10, 12, 15, 20, 25]), F2 = R.pick([8, 10, 15, 18, 30]), a2 = R.pick([60, 90, 120, 135, 150, 180]);
    const rx = F1 + F2 * cos(a2), ry = F2 * sin(a2);
    const m = Math.hypot(rx, ry);
    return { t: 'num', q: 'Two forces act on a crate: **' + F1 + ' N along +x** and **' + F2 + ' N at ' + a2 + '°** from +x. What is the magnitude of the net force?', a: m, unit: 'N', abs: 0.05,
      fig: D.fbd({ forces: [{ a: 0, len: 40 + F1 * 2, label: F1 + ' N', cls: 'c1' }, { a: a2, len: 40 + F2 * 2, label: F2 + ' N', cls: 'c2' }] }),
      steps: ['ΣFₓ = ' + F1 + ' + ' + F2 + ' cos ' + a2 + '° = ' + F(rx) + ' N', 'ΣFᵧ = ' + F2 + ' sin ' + a2 + '° = ' + F(ry) + ' N', '|ΣF| = √(ΣFₓ² + ΣFᵧ²) = **' + F(m) + ' N**'] };
  });

  CQ.gen('p.n2', (R) => {
    const m = R.pick([2, 4, 5, 8, 10, 12, 25, 1200]), a = R.pick([0.5, 1.5, 2, 3, 4, 2.5]);
    const Fn = m * a;
    const k = R.int(0, 2);
    if (k === 0) return { t: 'num', q: 'A net force of **' + F(Fn) + ' N** acts on a **' + m + ' kg** object. What is its acceleration?', a, unit: 'm/s²', steps: ['a = ΣF/m = ' + F(Fn) + '/' + m + ' = **' + F(a) + ' m/s²**'] };
    if (k === 1) return { t: 'num', q: 'What net force is needed to accelerate a **' + m + ' kg** object at **' + a + ' m/s²**?', a: Fn, unit: 'N', steps: ['ΣF = ma = ' + m + ' × ' + a + ' = **' + F(Fn) + ' N**'] };
    return { t: 'num', q: 'A **' + F(Fn) + ' N** net force gives an object an acceleration of **' + a + ' m/s²**. What is its mass?', a: m, unit: 'kg', steps: ['m = ΣF/a = ' + F(Fn) + '/' + a + ' = **' + F(m) + ' kg**'] };
  });

  CQ.gen('p.n2.2d', (R) => {
    const m = R.pick([2, 3, 4, 5, 6]), Fx = R.pick([6, 8, 9, 12]), Fy = R.pick([5, 8, 12, 16]);
    const a = Math.hypot(Fx, Fy) / m;
    return { t: 'num', lvl: 4, q: 'A **' + m + ' kg** puck on frictionless ice is pushed by **' + Fx + ' N east** and **' + Fy + ' N north** at the same time. What is the magnitude of its acceleration?', a, unit: 'm/s²',
      steps: ['ΣF = √(' + Fx + '² + ' + Fy + '²) = ' + F(Math.hypot(Fx, Fy)) + ' N', 'a = ΣF/m = **' + F(a) + ' m/s²**'] };
  });

  CQ.gen('p.n2.kin', (R) => {
    const m = R.pick([2, 5, 10, 20]), Fn = R.pick([10, 20, 30, 40, 50]), t = R.pick([2, 3, 4, 5]);
    const a = Fn / m, x = 0.5 * a * t * t;
    return { t: 'num', lvl: 4, q: 'A constant net force of **' + Fn + ' N** pushes a **' + m + ' kg** cart that starts from rest. How far does it travel in **' + t + ' s**?', a: x, unit: 'm',
      hint: 'Newton\'s 2nd law gives a. Then it\'s a kinematics problem.', steps: ['a = F/m = ' + Fn + '/' + m + ' = ' + F(a) + ' m/s²', 'x = ½at² = ½(' + F(a) + ')(' + t + ')² = **' + F(x) + ' m**'] };
  });

  CQ.gen('p.weight', (R) => {
    const m = R.pick([2, 5, 12, 60, 75, 80]);
    const k = R.int(0, 2);
    if (k === 0) return { t: 'num', q: 'What is the weight of a **' + m + ' kg** object on Earth?', a: m * g, unit: 'N', steps: ['w = mg = ' + m + ' × 9.80 = **' + F(m * g) + ' N**'] };
    if (k === 1) return { t: 'num', q: 'An astronaut has a mass of **' + m + ' kg**. What does she weigh on the Moon (g = 1.62 m/s²)?', a: m * 1.62, unit: 'N', steps: ['Mass is the same everywhere: ' + m + ' kg', 'w = mg_Moon = ' + m + ' × 1.62 = **' + F(m * 1.62) + ' N**'] };
    const w = m * g;
    return { t: 'num', q: 'A box weighs **' + F(w) + ' N** on Earth. What is its mass?', a: m, unit: 'kg', steps: ['m = w/g = ' + F(w) + '/9.80 = **' + F(m) + ' kg**'] };
  });

  CQ.gen('p.elev', (R) => {
    const m = R.pick([50, 60, 70, 80]), a = R.pick([1, 1.5, 2, 2.5, 3]), up = R.chance(0.5), speedUp = R.chance(0.5);
    // effective acceleration direction: up if (moving up & speeding up) or (moving down & slowing down)
    const accUp = up === speedUp;
    const n = m * (g + (accUp ? a : -a));
    const desc = 'moving **' + (up ? 'up' : 'down') + '** and **' + (speedUp ? 'speeding up' : 'slowing down') + '** at ' + a + ' m/s²';
    return { t: 'num', lvl: 4, q: 'A **' + m + ' kg** student stands on a scale in an elevator that is ' + desc + '. What does the scale read (in newtons)?', a: n, unit: 'N',
      hint: 'First decide which way the acceleration points. Speeding up means a is along v. Slowing down means a is opposite v.',
      steps: ['Acceleration points **' + (accUp ? 'up' : 'down') + '**', 'ΣFᵧ = n − mg = m(' + (accUp ? '+' : '−') + a + ')', 'n = m(g ' + (accUp ? '+' : '−') + ' a) = ' + m + '(9.8 ' + (accUp ? '+' : '−') + ' ' + a + ') = **' + F(n) + ' N**'],
      why: 'The scale reads the normal force. It reads heavy when a points up and light when a points down. The direction of motion doesn\'t matter.' };
  });

  CQ.gen('p.push2', (R) => {
    const m1 = R.pick([2, 3, 4, 5]), m2 = R.pick([1, 2, 3, 6]), Fp = R.pick([12, 18, 24, 30]);
    const a = Fp / (m1 + m2), c = m2 * a;
    return { t: 'num', lvl: 4, q: 'Two blocks sit side by side on a frictionless floor: **' + m1 + ' kg** (left) and **' + m2 + ' kg** (right). You push the left block to the right with **' + Fp + ' N**. What force does the left block exert on the right block?', a: c, unit: 'N',
      hint: 'Find the shared acceleration first, then look at the right block alone. The only horizontal force on it is the contact force.',
      steps: ['Both together: a = ' + Fp + '/(' + m1 + ' + ' + m2 + ') = ' + F(a) + ' m/s²', 'Right block alone: P = m₂a = ' + m2 + ' × ' + F(a) + ' = **' + F(c) + ' N**', 'By the 3rd law, the right block pushes back on the left with the same ' + F(c) + ' N.'] };
  });

  /* ================= generators: Unit 5 ================= */
  CQ.gen('p.eq.sym', (R) => {
    const m = R.pick([2, 5, 8, 10, 15, 20]), th = R.pick([20, 30, 40, 45, 60, 70]);
    const T2 = (m * g) / (2 * sin(th));
    return { t: 'num', q: 'A **' + m + ' kg** sign hangs from two ropes. Each makes **' + th + '°** with the horizontal (symmetric). What is the tension in each rope?', a: T2, unit: 'N',
      fig: D.ropes({ a1: th, a2: th }),
      steps: ['Horizontal parts cancel by symmetry', 'Vertical: 2T sin ' + th + '° = mg', 'T = [[mg|2 sin ' + th + '°]] = [[' + F(m * g) + '|' + F(2 * sin(th)) + ']] = **' + F(T2) + ' N**'],
      why: th < 30 ? 'Shallow ropes need a lot of tension. Only a small vertical part of each one holds the sign up.' : '' };
  });

  CQ.gen('p.eq.asym', (R) => {
    const m = R.pick([5, 8, 10, 12]), a1 = R.pick([30, 37, 40]), a2 = R.pick([50, 53, 60]);
    const T1 = (m * g * cos(a2)) / sin(a1 + a2), T2 = (m * g * cos(a1)) / sin(a1 + a2);
    const want = R.pick([1, 2]);
    return { t: 'num', lvl: 4, exam: true, q: 'A **' + m + ' kg** lamp hangs from two cords. Cord 1 makes **' + a1 + '°** with the ceiling on the left; cord 2 makes **' + a2 + '°** with the ceiling on the right. Find **T' + (want === 1 ? '₁' : '₂') + '**.', a: want === 1 ? T1 : T2, unit: 'N',
      fig: D.ropes({ a1, a2 }),
      hint: 'Write ΣFₓ = 0 and ΣFᵧ = 0 at the knot: two equations, two unknowns.',
      steps: ['ΣFₓ = 0: T₁ cos ' + a1 + '° = T₂ cos ' + a2 + '°', 'ΣFᵧ = 0: T₁ sin ' + a1 + '° + T₂ sin ' + a2 + '° = mg = ' + F(m * g) + ' N', 'Solve: T₁ = [[mg cos ' + a2 + '°|sin(' + a1 + '° + ' + a2 + '°)]] = ' + F(T1) + ' N, T₂ = [[mg cos ' + a1 + '°|sin(' + (a1 + a2) + '°)]] = ' + F(T2) + ' N', 'T' + (want === 1 ? '₁' : '₂') + ' = **' + F(want === 1 ? T1 : T2) + ' N**'] };
  });

  CQ.gen('p.eq.side', (R) => {
    const m = R.pick([2, 3, 4, 5]), Fh = R.pick([8, 10, 15, 20]);
    const want = R.pick(['T', 'th']);
    const T2 = Math.hypot(Fh, m * g), th = deg(Math.atan(Fh / (m * g)));
    return { t: 'num', q: 'A **' + m + ' kg** ball hangs from a string. A horizontal force of **' + Fh + ' N** pushes it sideways and it hangs at rest. ' + (want === 'T' ? 'What is the tension in the string?' : 'What angle does the string make with the vertical?'), a: want === 'T' ? T2 : th, unit: want === 'T' ? 'N' : '°', abs: want === 'T' ? undefined : 0.6,
      steps: ['ΣFₓ = 0: T sin θ = ' + Fh + ' N', 'ΣFᵧ = 0: T cos θ = mg = ' + F(m * g) + ' N', want === 'T' ? 'T = √(' + Fh + '² + ' + F(m * g) + '²) = **' + F(T2) + ' N**' : 'tan θ = ' + Fh + '/' + F(m * g) + ' → θ = **' + F(th) + '°**'] };
  });

  CQ.gen('p.incl.a', (R) => {
    const th = R.pick([10, 15, 20, 25, 30, 35, 40]);
    return { t: 'num', q: 'A block slides down a **frictionless** ramp inclined at **' + th + '°**. What is its acceleration?', a: g * sin(th), unit: 'm/s²',
      fig: D.incline({ deg: th }), hint: 'Only the part of gravity along the slope accelerates it.',
      steps: ['Along the slope: ΣF = mg sin θ = ma', 'a = g sin θ = 9.8 sin ' + th + '° = **' + F(g * sin(th)) + ' m/s²**', 'The mass cancels.'] };
  });

  CQ.gen('p.incl.n', (R) => {
    const m = R.pick([2, 4, 5, 10, 15]), th = R.pick([15, 20, 30, 37, 45]);
    return { t: 'num', q: 'A **' + m + ' kg** box rests on a ramp tilted **' + th + '°**. What is the normal force on it?', a: m * g * cos(th), unit: 'N',
      fig: D.incline({ deg: th, comps: true }), steps: ['Perpendicular to the ramp nothing accelerates: n = mg cos θ', 'n = ' + m + '(9.8) cos ' + th + '° = **' + F(m * g * cos(th)) + ' N**'], why: 'n is less than mg on a slope. Only the perpendicular part of the weight presses into the surface.' };
  });

  CQ.gen('p.incl.slide', (R) => {
    const th = R.pick([15, 20, 25, 30]), L2 = R.pick([2, 3, 4, 5, 6]);
    const a = g * sin(th);
    const want = R.pick(['v', 't']);
    const v = Math.sqrt(2 * a * L2), t = Math.sqrt((2 * L2) / a);
    return { t: 'num', lvl: 4, q: 'A sled starts from rest at the top of a **' + L2 + ' m** long frictionless slope inclined at **' + th + '°**. ' + (want === 'v' ? 'How fast is it going at the bottom?' : 'How long does it take to reach the bottom?'), a: want === 'v' ? v : t, unit: want === 'v' ? 'm/s' : 's',
      steps: ['a = g sin θ = ' + F(a) + ' m/s² along the slope', want === 'v' ? 'v² = 2aL → v = √{2(' + F(a) + ')(' + L2 + ')} = **' + F(v) + ' m/s**' : 'L = ½at² → t = √{2L/a} = **' + F(t) + ' s**'] };
  });

  CQ.gen('p.incl.push', (R) => {
    const m = R.pick([5, 10, 15, 20]), th = R.pick([15, 20, 25, 30]);
    const Fp = m * g * sin(th);
    return { t: 'num', q: 'What force **parallel to a frictionless ramp** (tilted **' + th + '°**) is needed to push a **' + m + ' kg** crate up at **constant speed**?', a: Fp, unit: 'N',
      steps: ['Constant speed → a = 0 → forces along the slope balance', 'F = mg sin θ = ' + m + '(9.8) sin ' + th + '° = **' + F(Fp) + ' N**'] };
  });

  CQ.gen('p.fric.a', (R) => {
    const m = R.pick([5, 10, 15, 20, 25]), mu = R.pick([0.15, 0.2, 0.25, 0.3, 0.4]);
    const Fp = Math.ceil(mu * m * g + R.pick([10, 15, 20, 30]));
    const a = (Fp - mu * m * g) / m;
    return { t: 'num', q: 'You push a **' + m + ' kg** box across the floor with a horizontal **' + Fp + ' N** force. If **μₖ = ' + mu + '**, what is its acceleration?', a, unit: 'm/s²',
      steps: ['n = mg = ' + F(m * g) + ' N', 'fₖ = μₖn = ' + mu + ' × ' + F(m * g) + ' = ' + F(mu * m * g) + ' N', 'a = [[F − fₖ|m]] = [[' + Fp + ' − ' + F(mu * m * g) + '|' + m + ']] = **' + F(a) + ' m/s²**'] };
  });

  CQ.gen('p.fric.static', (R) => {

      G('p.incl.a'),
      G('p.incl.n'),
      TF('On a frictionless incline, a heavier block slides down with a larger acceleration.', false, 'a = g sin θ, so mass cancels.'),
      G('p.incl.push'),
      G('p.incl.slide'),
    ]),
    L('p5l3', 'Friction', {
      goal: 'Handle static vs kinetic friction, including on slopes.',
      key: 'Kinetic friction (sliding): $fₖ = μₖn$, pointing opposite the sliding. Static friction (not sliding): $fₛ ≤ μₛn$. It is only as large as needed to prevent slipping, up to that maximum. Usually μₖ < μₛ, which is why things are harder to start than to keep going. Always compute n first, since it isn\'t always mg. On a slope: about to slip when $tan θ = μₛ$, and sliding down gives $a = g(sin θ − μₖ cos θ)$.',
      formulas: ['fₖ = μₖn', 'fₛ ≤ μₛn', 'slip angle: tan θ = μₛ', 'down slope: a = g(sin θ − μₖ cos θ)'],
    }, [
      T('Two kinds of friction', `
**Kinetic** (surfaces sliding past each other): $fₖ = μₖ n$, opposite the motion.
**Static** (surfaces stuck together): $fₛ ≤ μₛ n$. It matches whatever force is trying to slide the object, up to that maximum.
>! If a crate sits still while you push with 50 N, static friction is exactly 50 N, **not** μₛn. The formula μₛn only gives the breaking point.
>* Friction depends on **n**, not directly on the weight. Find n from the FBD first.`),
      EX('Pushing a crate', 'You push a 20 kg crate with 100 N horizontally. μₛ = 0.50, μₖ = 0.40. Does it move? If so, what is a?', ['n = mg = 196 N', 'fₛ,max = 0.50 × 196 = 98 N < 100 N → it slides', 'fₖ = 0.40 × 196 = 78.4 N', 'a = (100 − 78.4)/20 = **1.08 m/s²**']),
      G('p.fric.static'),
      MC('Why does it take more force to start a heavy box moving than to keep it moving?', ['μₛ is usually greater than μₖ', 'The box gains mass when it\'s at rest', 'Kinetic friction increases with speed', 'Normal force drops once it moves'], 'Static friction can reach a higher maximum than kinetic friction.'),
      G('p.fric.a'),
      G('p.fric.angle'),
      TF('Static friction always equals μₛn.', false, 'It\'s only as large as needed, up to μₛn.'),
      G('p.fric.incl'),
      G('p.fric.pull'),
    ]),
    L('p5l4', 'Connected Objects', {
      goal: 'Solve pulley and multi-block systems (Atwood, table + hanging mass).',
      key: 'Draw an FBD for each object. Choose each object\'s positive direction so that they all move "together" (if one goes down, the other goes right or up). Objects joined by a taut string share the same size of acceleration. Write ΣF = ma for each, then add the equations to cancel T. Atwood: $a = (m₂ − m₁)g/(m₁ + m₂)$, $T = 2m₁m₂g/(m₁ + m₂)$. Table + hanging mass: $a = (m₂ − μₖm₁)g/(m₁ + m₂)$.',
      formulas: ['Atwood: a = [[(m₂ − m₁)g|m₁ + m₂]]', 'Atwood: T = [[2m₁m₂g|m₁ + m₂]]', 'table: a = [[(m₂ − μₖm₁)g|m₁ + m₂]]'],
    }, [
      T('One string, one acceleration', `
When objects are tied by a taut string, they move with the **same size of acceleration**. Strategy:
1. Draw a separate FBD for each object
2. Pick each object's + direction so that they all move "together"
3. Write ΣF = ma for each object
4. **Add** the equations, and the internal tensions cancel
$$ a = [[(m₂ − m₁)g|m₁ + m₂]] :: Atwood machine: driving force over total mass $$
>* Think of it as "net driving force ÷ total mass". It works for any string-connected system.`, { fig: D.atwood() }),
      EX('Table and hanging block', 'A 4.0 kg block on a frictionless table is tied over a pulley to a hanging 1.0 kg block. Find a and T.', ['Table block (+ toward pulley): T = 4.0a', 'Hanging block (+ down): 1.0(9.8) − T = 1.0a', 'Add: 9.8 = 5.0a → a = **1.96 m/s²**', 'T = 4.0 × 1.96 = **7.84 N**. Less than the hanging weight (9.8 N), as it has to be.']),
      MC('In an Atwood machine with m₂ > m₁, how does the string tension T compare with the weights?', ['m₁g < T < m₂g', 'T = m₂g', 'T = m₁g', 'T > m₂g'], 'T must exceed m₁g to lift m₁ and be less than m₂g to let m₂ fall.'),
      G('p.atw'),
      G('p.tab'),
      TF('In an Atwood machine, the hanging masses accelerate at g.', false, 'Less than g. Only the difference in weight drives the total mass.'),
      G('p.atw'),
      G('p.tab'),
    ]),
    L('p5l5', 'Circular Dynamics', {
      goal: 'Find the force that makes something move in a circle: friction, banking, loops, strings.',
      key: 'Circular motion needs a net inward force: $ΣF_{toward center} = mv²/R$. That is a requirement, not a new force. Something real has to supply it: friction, tension, gravity, a normal force, or a combination. Flat curve: $v_{max} = √{μₛgR}$. Frictionless banked curve: $tan β = v²/gR$. Top of a loop: $n + mg = mv²/R$, so the minimum speed is $√{gR}$. Bottom of a vertical swing: $T = m(g + v²/R)$. There is no outward "centrifugal force" in an inertial frame.',
      formulas: ['ΣF_{in} = [[mv²|R]]', 'flat: v_{max} = √{μₛgR}', 'banked: tan β = [[v²|gR]]', 'loop top: v_{min} = √{gR}'],
    }, [
      T('Who supplies the inward force?', `
To move in a circle, the net force must point to the **center** with size
$$ ΣF_{in} = [[mv²|R]] $$
This isn't an extra force to draw. Ask which real force does the job:
| Situation | Supplies mv²/R |
|---|---|
| car on flat curve | static friction |
| ball on string | tension |
| satellite | gravity |
| loop-the-loop top | normal + gravity |
>! There is no outward "centrifugal force" on your FBD. You feel thrown outward because your body tends to keep going straight (first law).`),
      EX('Top of a loop', 'A coaster car moves through the top of a 10 m radius loop. What is the slowest speed that keeps it on the track?', ['At the top, n and mg both point down, toward the center', 'n + mg = mv²/R', 'Slowest when n → 0: mg = mv²/R', 'v = √(gR) = √(98) = **9.9 m/s**']),
      MC('A car rounds a flat, unbanked curve at constant speed. What force provides the centripetal force?', ['Static friction from the road', 'The normal force', 'Centrifugal force', 'The engine\'s forward force'], 'Tires grip without sliding sideways, so the friction is static.'),
      G('p.circ.flat'),
      G('p.circ.vert'),
      TF('Centrifugal force should be drawn pointing outward on a free-body diagram for circular motion.', false, 'In an inertial frame, only real forces go on the FBD. Their net points inward.'),
      G('p.circ.loop'),
      G('p.circ.bank'),
    ]),
  ]);

  CQ.addUnits('phys', [u4, u5]);
})();

<script>
/* content/phys-3.js */
/* PHYS 2325 · Units 6–8: work & energy, potential energy, momentum (Young & Freedman Ch 6–8) */
(function () {
  const CQ = window.CQ;
  const { L, U, T, EX, MC, MULTI, TF, NUM, FILL, MATCH, ORDER, G } = CQ.dsl;
  const F = (x, s = 3) => CQ.fmt(x, s);
  const g = 9.8;
  const D = CQ.dg;
  const deg = (r) => (r * 180) / Math.PI;
  const rad = (d) => (d * Math.PI) / 180;
  const sin = (d) => Math.sin(rad(d)), cos = (d) => Math.cos(rad(d));

  /* ================= generators: Unit 6 ================= */
  CQ.gen('p.work.const', (R) => {
    const Fp = R.pick([20, 30, 40, 50, 80]), d = R.pick([3, 5, 8, 10, 12, 15]), phi = R.pick([0, 20, 30, 37, 45, 60]);
    const W = Fp * d * cos(phi);
    return { t: 'num', q: 'You push a lawn mower **' + d + ' m** with a **' + Fp + ' N** force directed **' + phi + '°** below the horizontal. How much work does your push do?', a: W, unit: 'J',
      steps: ['W = Fd cos φ, where φ is the angle between the force and the displacement', 'W = ' + Fp + ' × ' + d + ' × cos ' + phi + '° = **' + F(W) + ' J**'],
      why: 'Only the component of force along the motion does work. The downward part of your push does none.' };
  });

  CQ.gen('p.work.signs', (R) => {
    const m = R.pick([2, 5, 10, 15]), h = R.pick([1.5, 2, 3, 4]), up = R.chance(0.5);
    const W = (up ? -1 : 1) * m * g * h;
    return { t: 'num', q: 'A **' + m + ' kg** box is ' + (up ? 'lifted' : 'lowered') + ' **' + h + ' m** at constant speed. How much work does **gravity** do on it?', a: W, unit: 'J',
      steps: ['Gravity (mg = ' + F(m * g) + ' N) points down', up ? 'Displacement is up → φ = 180° → W = −mgh' : 'Displacement is down → φ = 0° → W = +mgh', 'W_grav = **' + F(W) + ' J**'],
      why: 'Work is negative when the force opposes the displacement.' };
  });

  CQ.gen('p.wet.speed', (R) => {
    const m = R.pick([2, 4, 5, 10]), Fp = R.pick([10, 20, 25, 40]), d = R.pick([2, 4, 5, 8]), v0 = R.pick([0, 0, 2, 3]);
    const v = Math.sqrt(v0 * v0 + (2 * Fp * d) / m);
    return { t: 'num', q: 'A constant net force of **' + Fp + ' N** pushes a **' + m + ' kg** cart **' + d + ' m**' + (v0 ? ', starting at **' + v0 + ' m/s**' : ' from rest') + '. What is its final speed?', a: v, unit: 'm/s',
      hint: 'W_net = ΔK. Find the work, then solve for v.',
      steps: ['W_net = Fd = ' + Fp * d + ' J', 'W_net = ½mv² − ½mv₀² → ' + Fp * d + ' = ½(' + m + ')v² − ' + F(0.5 * m * v0 * v0), 'v = **' + F(v) + ' m/s**'] };
  });

  CQ.gen('p.wet.stop', (R) => {
    const v = R.pick([10, 15, 20, 25, 30]), mu = R.pick([0.4, 0.5, 0.6, 0.7, 0.8]);
    const d = (v * v) / (2 * mu * g);
    return { t: 'num', q: 'A car moving at **' + v + ' m/s** locks its brakes and skids to a stop. If **μₖ = ' + mu + '**, how far does it skid?', a: d, unit: 'm',
      steps: ['Only friction does work: −μₖmg·d = 0 − ½mv²', 'd = [[v²|2μₖg]] = [[' + v * v + '|2(' + mu + ')(9.8)]] = **' + F(d) + ' m**', 'Mass cancels. Doubling the speed quadruples the skid.'] };
  });

  CQ.gen('p.spring.k', (R) => {
    const k = R.pick([50, 100, 200, 250, 400, 500, 800]), x = R.pick([0.02, 0.05, 0.1, 0.15, 0.2, 0.25]);
    const kind = R.int(0, 2);
    if (kind === 0) return { t: 'num', q: 'A spring stretches **' + x * 100 + ' cm** when you pull it with **' + F(k * x) + ' N**. What is its spring constant?', a: k, unit: 'N/m', steps: ['Hooke\'s law: F = kx', 'k = F/x = ' + F(k * x) + '/' + x + ' = **' + F(k) + ' N/m**'], hint: 'Convert cm to m first.' };
    if (kind === 1) return { t: 'num', q: 'How much work does it take to stretch a **k = ' + k + ' N/m** spring by **' + x * 100 + ' cm** from its relaxed length?', a: 0.5 * k * x * x, unit: 'J', steps: ['The force grows as you stretch, so W = ∫kx dx = ½kx²', 'W = ½(' + k + ')(' + x + ')² = **' + F(0.5 * k * x * x) + ' J**'] };
    const x2 = x * 2;
    return { t: 'num', lvl: 4, q: 'A **k = ' + k + ' N/m** spring is already stretched **' + x * 100 + ' cm**. How much **more** work stretches it to **' + x2 * 100 + ' cm**?', a: 0.5 * k * (x2 * x2 - x * x), unit: 'J', steps: ['W = ½k(x₂² − x₁²)', '= ½(' + k + ')(' + x2 + '² − ' + x + '²) = **' + F(0.5 * k * (x2 * x2 - x * x)) + ' J**', 'Three times the work of the first ' + x * 100 + ' cm, even though it\'s the same extra distance.'] };
  });

  CQ.gen('p.work.var', (R) => {
    const a = R.pick([2, 3, 4, 5, 6]), x1 = 0, x2 = R.pick([1, 2, 3]);
    const W = (a * x2 * x2 * x2) / 3;
    return { t: 'num', lvl: 4, q: 'A force **Fₓ = ' + a + 'x²** (N, x in m) acts on a particle as it moves from x = 0 to x = ' + x2 + ' m. How much work does the force do?', a: W, unit: 'J',
      steps: ['The force varies, so W = ∫F dx', 'W = ∫₀^{' + x2 + '} ' + a + 'x² dx = [[' + a + 'x³|3]] from 0 to ' + x2, 'W = ' + a + '(' + x2 ** 3 + ')/3 = **' + F(W) + ' J**'] };
  });

  CQ.gen('p.power', (R) => {
    const k = R.int(0, 2);
    if (k === 0) {
      const m = R.pick([50, 60, 70, 80]), h = R.pick([3, 4, 5, 6, 10]), t = R.pick([4, 5, 6, 8, 10]);
      return { t: 'num', q: 'A **' + m + ' kg** student runs up stairs that rise **' + h + ' m** in **' + t + ' s**. What average power does she produce against gravity?', a: (m * g * h) / t, unit: 'W', steps: ['W = mgh = ' + m + '(9.8)(' + h + ') = ' + F(m * g * h) + ' J', 'P = W/t = **' + F((m * g * h) / t) + ' W**'] };
    }
    if (k === 1) {
      const Fd = R.pick([300, 500, 800, 1200]), v = R.pick([10, 15, 20, 25, 30]);
      return { t: 'num', q: 'A car moves at a constant **' + v + ' m/s** against a total drag force of **' + Fd + ' N**. What power must the engine deliver?', a: Fd * v, unit: 'W', steps: ['Constant speed → engine force = drag = ' + Fd + ' N', 'P = Fv = ' + Fd + ' × ' + v + ' = **' + F(Fd * v) + ' W** (' + F((Fd * v) / 746) + ' hp)'] };
    }
    const m = R.pick([500, 800, 1000, 1200]), v = R.pick([0.5, 1, 1.5, 2]);
    return { t: 'num', q: 'An elevator motor lifts a **' + m + ' kg** car at a constant **' + v + ' m/s**. What power does it supply (in kW)?', a: (m * g * v) / 1000, unit: 'kW', steps: ['Constant speed → tension = mg = ' + F(m * g) + ' N', 'P = Fv = ' + F(m * g) + ' × ' + v + ' = ' + F(m * g * v) + ' W = **' + F((m * g * v) / 1000) + ' kW**'] };
  });

  /* ================= generators: Unit 7 ================= */
  CQ.gen('p.cons.drop', (R) => {
    const h1 = R.pick([5, 10, 15, 20, 30]), h2 = R.pick([0, 0, 2, 4]), v1 = R.pick([0, 0, 3, 5]);
    const v = Math.sqrt(v1 * v1 + 2 * g * (h1 - h2));
    return { t: 'num', q: 'A skateboarder ' + (v1 ? 'moving at **' + v1 + ' m/s**' : 'starting from rest') + ' at a height of **' + h1 + ' m** rolls down a frictionless ramp. How fast is she going at a height of **' + h2 + ' m**?', a: v, unit: 'm/s',
      fig: D.bars({ items: [['K₁', 0.5 * v1 * v1 + 0.01, 'c2'], ['U₁', g * h1, 'c4'], ['K₂', 0.5 * v * v, 'c2'], ['U₂', g * h2 + 0.01, 'c4']], alt: 'Energy bar chart: kinetic and potential energy before and after' }),
      hint: 'K₁ + U₁ = K₂ + U₂. The mass cancels.',
      steps: ['½mv₁² + mgh₁ = ½mv₂² + mgh₂ (mass cancels)', 'v₂² = v₁² + 2g(h₁ − h₂) = ' + v1 * v1 + ' + 2(9.8)(' + (h1 - h2) + ')', 'v₂ = **' + F(v) + ' m/s**'],
      why: 'The shape of the ramp doesn\'t matter. Only the change in height does.' };
  });

  CQ.gen('p.cons.pend', (R) => {
    const L2 = R.pick([0.5, 1, 1.5, 2, 3]), th = R.pick([20, 30, 40, 45, 60]);
    const v = Math.sqrt(2 * g * L2 * (1 - cos(th)));
    return { t: 'num', q: 'A pendulum of length **' + L2 + ' m** is released from rest at **' + th + '°** from vertical. How fast is the bob moving at the bottom?', a: v, unit: 'm/s',
      fig: D.pendulum({ deg: th }), hint: 'Find how much height the bob drops: h = L(1 − cos θ).',
      steps: ['Height drop: h = L(1 − cos θ) = ' + L2 + '(1 − cos ' + th + '°) = ' + F(L2 * (1 - cos(th))) + ' m', 'mgh = ½mv² → v = √{2gh}', 'v = **' + F(v) + ' m/s**'],
      why: 'Tension does no work because it is always perpendicular to the motion.' };
  });

  CQ.gen('p.spring.launch', (R) => {
    const k = R.pick([200, 400, 500, 800, 1000]), x = R.pick([0.05, 0.1, 0.15, 0.2]), m = R.pick([0.05, 0.1, 0.2, 0.5]);
    const want = R.pick(['v', 'h']);
    const E = 0.5 * k * x * x;
    if (want === 'v') return { t: 'num', q: 'A spring (**k = ' + k + ' N/m**) is compressed **' + x * 100 + ' cm** and launches a **' + m * 1000 + ' g** ball horizontally on a frictionless surface. What is the ball\'s launch speed?', a: Math.sqrt((2 * E) / m), unit: 'm/s',
      steps: ['½kx² = ½mv²', 'v = x √{k/m} = ' + x + ' √{' + k + '/' + m + '}', 'v = **' + F(Math.sqrt((2 * E) / m)) + ' m/s**'] };
    return { t: 'num', lvl: 4, q: 'A toy gun\'s spring (**k = ' + k + ' N/m**) is compressed **' + x * 100 + ' cm** and fires a **' + m * 1000 + ' g** dart straight up. How high above its launch point does the dart rise?', a: E / (m * g), unit: 'm',
      steps: ['Spring PE → gravitational PE: ½kx² = mgh', 'h = [[kx²|2mg]] = [[' + k + '(' + x + ')²|2(' + m + ')(9.8)]] = **' + F(E / (m * g)) + ' m**'] };
  });

  CQ.gen('p.spring.compress', (R) => {
    const m = R.pick([0.5, 1, 2, 5]), v = R.pick([1, 2, 3, 4]), k = R.pick([100, 200, 500, 800, 1000]);
    const x = v * Math.sqrt(m / k);
    return { t: 'num', q: 'A **' + m + ' kg** block slides at **' + v + ' m/s** on frictionless ice into a spring with **k = ' + k + ' N/m**. What is the spring\'s maximum compression?', a: x, unit: 'm',
      fig: D.spring({ x: 130 }), steps: ['At max compression the block momentarily stops: ½mv² = ½kx²', 'x = v √{m/k} = ' + v + ' √{' + m + '/' + k + '} = **' + F(x) + ' m**'] };
  });

  CQ.gen('p.wother', (R) => {
    const m = R.pick([2, 5, 10, 20]), h = R.pick([3, 5, 8, 10]), frac = R.pick([0.6, 0.7, 0.8]);
    const vIdeal = Math.sqrt(2 * g * h), v = vIdeal * frac;
    const Wf = 0.5 * m * v * v - m * g * h;
    return { t: 'num', lvl: 4, q: 'A **' + m + ' kg** crate starts from rest and slides down a rough ramp whose top is **' + h + ' m** above the bottom. It reaches the bottom at **' + F(v) + ' m/s**. How much work did friction do?', a: Wf, unit: 'J',
      hint: 'K₁ + U₁ + W_other = K₂ + U₂',
      steps: ['0 + mgh + W_f = ½mv² + 0', 'W_f = ½mv² − mgh = ' + F(0.5 * m * v * v) + ' − ' + F(m * g * h), 'W_f = **' + F(Wf) + ' J** (negative: friction removes mechanical energy)'] };
  });

  CQ.gen('p.wother.mu', (R) => {
    const m = R.pick([1, 2, 5]), h = R.pick([2, 3, 5]), mu = R.pick([0.1, 0.2, 0.25, 0.3]);
    const d = h / mu;
    return { t: 'num', lvl: 4, exam: true, q: 'A **' + m + ' kg** block slides from rest down a **frictionless** curved ramp of height **' + h + ' m**, then onto a rough flat floor with **μₖ = ' + mu + '**. How far along the floor does it slide before stopping?', a: d, unit: 'm',
      steps: ['Top to stop: mgh + W_f = 0 (starts and ends at rest)', 'W_f = −μₖmg·d', 'mgh = μₖmg·d → d = h/μₖ = ' + h + '/' + mu + ' = **' + F(d) + ' m**'] };
  });

  CQ.gen('p.Ux', (R) => {
    const a = R.pick([1, 2, 3, 4]), b = R.pick([2, 3, 5, 6]), x = R.pick([1, 2, 3]);
    const Fx = -(3 * a * x * x - b);
    return { t: 'num', lvl: 4, q: 'A particle moves in a potential energy **U(x) = ' + a + 'x³ − ' + b + 'x** (U in J, x in m). What is the force on it at x = ' + x + ' m?', a: Fx, unit: 'N', abs: 0.01,
      steps: ['Fₓ = −dU/dx', 'dU/dx = ' + 3 * a + 'x² − ' + b, 'Fₓ(' + x + ') = −(' + 3 * a + '(' + x * x + ') − ' + b + ') = **' + F(Fx) + ' N**'] };
  });

  /* ================= generators: Unit 8 ================= */
  CQ.gen('p.impulse', (R) => {
    const m = R.pick([0.15, 0.2, 0.4, 0.5]), v1 = R.pick([10, 15, 20, 25]), v2 = R.pick([5, 10, 15, 20]), dt = R.pick([0.002, 0.005, 0.01, 0.02]);
    const dp = m * (v2 + v1);
    const want = R.pick(['J', 'F']);
    return { t: 'num', lvl: want === 'F' ? 4 : 3, q: 'A **' + m * 1000 + ' g** ball hits a wall at **' + v1 + ' m/s** and bounces straight back at **' + v2 + ' m/s**. ' + (want === 'J' ? 'What is the magnitude of the impulse from the wall?' : 'If the contact lasts **' + dt * 1000 + ' ms**, what average force does the wall exert?'), a: want === 'J' ? dp : dp / dt, unit: want === 'J' ? 'N·s' : 'N',
      hint: 'Velocity reverses, so choose a sign convention. Δp = m(v_f − v_i), with one of them negative.',
      steps: ['Take the bounce direction as +: v_i = −' + v1 + ', v_f = +' + v2, 'J = Δp = m(v_f − v_i) = ' + m + '(' + v2 + ' + ' + v1 + ') = ' + F(dp) + ' N·s', ...(want === 'F' ? ['F_avg = J/Δt = ' + F(dp) + '/' + dt + ' = **' + F(dp / dt) + ' N**'] : ['J = **' + F(dp) + ' N·s**'])],
      why: 'A bounce gives a bigger impulse than a stop, because the momentum has to reverse, not just go to zero.' };
  });

  CQ.gen('p.recoil', (R) => {
    const m1 = R.pick([40, 50, 60, 70]), m2 = R.pick([50, 70, 80, 90]), v1 = R.pick([1.5, 2, 2.5, 3]);
    const v2 = (m1 * v1) / m2;
    return { t: 'num', q: 'Two ice skaters, **' + m1 + ' kg** and **' + m2 + ' kg**, stand at rest and push off each other. The ' + m1 + ' kg skater moves away at **' + v1 + ' m/s**. How fast does the other skater move?', a: v2, unit: 'm/s',
      steps: ['Total momentum before = 0', '0 = m₁v₁ + m₂v₂ → v₂ = −m₁v₁/m₂', '|v₂| = ' + m1 + ' × ' + v1 + '/' + m2 + ' = **' + F(v2) + ' m/s** (opposite direction)'] };
  });

  CQ.gen('p.coll.inel', (R) => {
    const m1 = R.pick([1000, 1200, 1500, 2000]), m2 = R.pick([800, 1000, 1500, 3000]), v1 = R.pick([10, 15, 20, 25]), v2 = R.pick([0, 0, 5, -5, -10]);
    const vf = (m1 * v1 + m2 * v2) / (m1 + m2);

      MC('Why do airbags reduce injuries?', ['They increase the stopping time, so the average force is smaller', 'They reduce your change in momentum', 'They reduce your mass', 'They make the collision elastic'], 'Same Δp, so a longer Δt gives a smaller F_av.'),
      G('p.impulse'),
      TF('Momentum and kinetic energy are both vectors.', false, 'Momentum is a vector, while kinetic energy is a scalar.'),
      MC('The area under a **force vs time** graph equals…', ['the impulse (change in momentum)', 'the work done', 'the change in kinetic energy', 'the power'], 'J = ∫F dt. Area under F vs **x** would be work.'),
      NUM('A bat\'s force on a ball rises linearly from 0 to a peak of **4000 N** and back to 0 over **2.0 ms** (a triangle on the F–t graph). What impulse does it deliver?', 4, 'N·s', 'Area of a triangle: ½ × 0.0020 s × 4000 N = 4.0 N·s.', { hint: 'Impulse is the area under F vs t.', steps: ['J = area = ½ × base × height', '= ½ × 0.0020 s × 4000 N = **4.0 N·s**'] }),
      G('p.impulse'),
    ]),
    L('p8l2', 'Conservation of Momentum', {
      goal: 'Apply momentum conservation to explosions, recoil and push-offs.',
      key: 'If the net external force on a system is zero (or negligible during a brief collision), the total momentum is conserved: $Σp_{before} = Σp_{after}$. Internal forces (third-law pairs inside the system) cancel. Use it per component. For objects starting at rest, the total momentum stays zero, so the pieces fly apart with $m₁v₁ = −m₂v₂$.',
      formulas: ['Σvec{p}_{before} = Σvec{p}_{after}', 'from rest: m₁v₁ = −m₂v₂'],
    }, [
      T('Internal forces cancel', `
In a collision or explosion, the objects push on each other with equal and opposite forces (third law), so those **internal** impulses cancel. If outside forces are negligible:
$$ m₁vec{v}₁ + m₂vec{v}₂ = m₁vec{v}₁′ + m₂vec{v}₂′ $$
>* Momentum is conserved in **every** collision, elastic or not, as long as the external forces can be ignored. Kinetic energy is a different story.`),
      EX('Rifle recoil', 'A 4.0 kg rifle fires a 10 g bullet at 400 m/s. Find the recoil speed.', ['Before: total p = 0', 'After: (0.010)(400) + (4.0)v = 0', 'v = −1.0 m/s, so the rifle recoils at **1.0 m/s**']),
      G('p.recoil'),
      MC('A cannon at rest fires a ball. After firing, the total momentum of the cannon + ball is…', ['zero', 'equal to the ball\'s momentum', 'equal to the cannon\'s momentum', 'greater than zero'], 'It started at zero with no external horizontal force, so it stays zero.'),
      TF('Momentum is conserved only in elastic collisions.', false, 'It\'s conserved in all collisions when external forces are negligible.'),
      MC('An astronaut floating at rest in space throws a wrench away from her. She…', ['moves in the opposite direction, slower than the wrench', 'stays at rest', 'moves with the wrench', 'moves opposite at the same speed as the wrench'], 'Total p stays 0: m_you v_you = −m_wrench v_wrench. Her bigger mass means a smaller speed.', { lvl: 2 }),
      G('p.recoil'),
    ]),
    L('p8l3', 'Inelastic Collisions', {
      goal: 'Solve sticking collisions and find how much kinetic energy is lost.',
      key: 'In an inelastic collision, momentum is conserved but kinetic energy is not, because some of it goes to heat, sound and deformation. In a perfectly inelastic collision the objects stick: $v_f = (m₁v₁ + m₂v₂)/(m₁ + m₂)$. Find v_f from momentum, then compare K before and after. Two-stage problems (ballistic pendulum): momentum for the collision, then energy for the swing.',
      formulas: ['v_f = [[m₁v₁ + m₂v₂|m₁ + m₂]]', 'ΔK = K_f − K_i < 0'],
    }, [
      T('Stick together, lose energy', `
When objects **stick**, the collision is *perfectly inelastic*:
$$ v_f = [[m₁v₁ + m₂v₂|m₁ + m₂]] $$
Momentum is conserved, but some **kinetic energy** turns into heat, sound and bent metal.
>! Ballistic pendulum: **momentum** for the collision, **energy** for the swing. Using energy across the collision is the #1 mistake on this problem.`, { fig: D.carts({ v1: 'v₁', v2: null }) }),
      EX('Fender bender', 'A 1500 kg car at 20 m/s rear-ends a 1000 kg car at rest. They lock. Find v_f and the KE lost.', ['v_f = (1500 × 20)/(2500) = **12 m/s**', 'K before = ½(1500)(20²) = 300 kJ', 'K after = ½(2500)(12²) = 180 kJ', 'Lost: **120 kJ** (40%)']),
      G('p.coll.inel'),
      MC('In a perfectly inelastic collision, which is conserved?', ['Momentum only', 'Kinetic energy only', 'Both momentum and kinetic energy', 'Neither'], 'Momentum yes, KE no.'),
      G('p.coll.inel'),
      TF('In a ballistic pendulum, you can set the bullet\'s kinetic energy equal to the block\'s final potential energy.', false, 'KE is lost when the bullet embeds. Use momentum for the collision first.'),
      G('p.ballistic'),
    ]),
    L('p8l4', 'Elastic Collisions', {
      goal: 'Solve 1-D elastic collisions and know the special cases.',
      key: 'Elastic collisions conserve momentum AND kinetic energy. For a 1-D collision with m₂ at rest: $v₁′ = [[m₁ − m₂|m₁ + m₂]]v₁$ and $v₂′ = [[2m₁|m₁ + m₂]]v₁$. Special cases: equal masses swap velocities; a light object hitting a heavy one bounces back; a heavy one hitting a light one keeps going and the light one shoots off at up to 2v₁. The relative speed is the same before and after, it just reverses.',
      formulas: ['v₁′ = [[m₁ − m₂|m₁ + m₂]]v₁', 'v₂′ = [[2m₁|m₁ + m₂]]v₁', 'v₂′ − v₁′ = −(v₂ − v₁)'],
    }, [
      T('Bouncy collisions keep their energy', `
**Elastic** means kinetic energy is conserved too. For a head-on hit on a target at rest:
$$ v₁′ = [[m₁ − m₂|m₁ + m₂]]v₁   ·   v₂′ = [[2m₁|m₁ + m₂]]v₁ $$
| Case | Result |
|---|---|
| m₁ = m₂ | they swap: v₁′ = 0, v₂′ = v₁ |
| m₁ ≪ m₂ | m₁ bounces back at about −v₁ |
| m₁ ≫ m₂ | m₂ flies off at about 2v₁ |`),
      EX('Pool shot', 'A cue ball hits an identical ball at rest, head-on and elastically, at 3.0 m/s. What happens?', ['m₁ = m₂ → v₁′ = 0, v₂′ = v₁', 'The cue ball **stops** and the target moves at **3.0 m/s**']),
      MC('A ping-pong ball hits a bowling ball (at rest) elastically. The ping-pong ball…', ['bounces back with nearly its original speed', 'stops', 'keeps going forward slowly', 'sticks to the bowling ball'], 'm₁ ≪ m₂ → v₁′ ≈ −v₁.'),
      G('p.coll.el'),
      MATCH('Match the collision type to what is conserved.', [['Elastic', 'momentum and KE'], ['Inelastic', 'momentum only'], ['Explosion from rest', 'total momentum stays zero']]),
      G('p.coll.el'),
      TF('In a 1-D elastic collision the relative speed of approach equals the relative speed of separation.', true, 'v₂′ − v₁′ = −(v₂ − v₁). A handy check.'),
    ]),
    L('p8l5', 'Center of Mass', {
      goal: 'Locate the center of mass and use it to describe system motion.',
      key: '$x_{cm} = Σmᵢxᵢ/Σmᵢ$, a mass-weighted average position (same for y). The center of mass moves as if all the mass were there and all the external forces acted on it: $ΣF_{ext} = Ma_{cm}$. With no external force, v_cm stays constant, even through collisions and explosions. Total momentum is $P = Mv_{cm}$.',
      formulas: ['x_{cm} = [[Σmᵢxᵢ|Σmᵢ]]', 'P = Mv_{cm}', 'ΣF_{ext} = Ma_{cm}'],
    }, [
      T('The balance point of a system', `
$$ x_{cm} = [[m₁x₁ + m₂x₂ + …|m₁ + m₂ + …]] $$
It sits closer to the heavier masses. The center of mass moves like a single particle carrying all the mass:
$$ ΣF_{ext} = M a_{cm}   ·   vec{P} = M vec{v}_{cm} $$
>> A firework that explodes mid-flight: the pieces scatter, but their center of mass keeps following the original parabola.`),
      EX('Earth–Moon balance point', 'Earth (6.0×10²⁴ kg) and Moon (7.4×10²² kg) are 3.84×10⁸ m apart. Where is their CM, measured from Earth\'s center?', ['x_cm = (m_E·0 + m_M·d)/(m_E + m_M)', '= (7.4×10²²)(3.84×10⁸)/(6.07×10²⁴)', '≈ **4.7×10⁶ m**, inside the Earth (its radius is 6.4×10⁶ m)']),
      G('p.cm'),
      MC('A projectile explodes into two pieces at the top of its path. Ignoring air, the center of mass of the pieces…', ['continues along the original parabola', 'stops and falls straight down', 'moves in a straight line', 'jumps to the heavier piece'], 'Only gravity acts externally, so the CM motion is unchanged.'),
      TF('The center of mass of an object must be located inside the material of the object.', false, 'A ring or a boomerang has its CM in empty space.'),
      G('p.cm'),
      G('p.coll2d'),
    ]),
  ]);

  CQ.addUnits('phys', [u6, u7, u8]);
})();

<script>
/* content/phys-4.js */
/* PHYS 2325 · Units 9–11: rotation, rotational dynamics, equilibrium & elasticity (Young & Freedman Ch 9–11) */
(function () {
  const CQ = window.CQ;
  const { L, U, T, EX, MC, MULTI, TF, NUM, FILL, MATCH, ORDER, G } = CQ.dsl;
  const F = (x, s = 3) => CQ.fmt(x, s);
  const g = 9.8;
  const D = CQ.dg;
  const PI = Math.PI;
  const deg = (r) => (r * 180) / PI;
  const rad = (d) => (d * PI) / 180;
  const sin = (d) => Math.sin(rad(d)), cos = (d) => Math.cos(rad(d));

  const SHAPES = [
    ['solid disk (cylinder)', 0.5, '½MR²'],
    ['thin hoop (ring)', 1, 'MR²'],
    ['solid sphere', 0.4, '⅖MR²'],
    ['thin spherical shell', 2 / 3, '⅔MR²'],
  ];

  /* ================= generators: Unit 9 ================= */
  CQ.gen('p.rot.conv', (R) => {
    const k = R.int(0, 2);
    if (k === 0) { const rpm = R.pick([30, 45, 60, 120, 300, 1200, 3000]); return { t: 'num', q: 'A motor spins at **' + rpm + ' rpm**. What is its angular speed in rad/s?', a: (rpm * 2 * PI) / 60, unit: 'rad/s', steps: ['1 rev = 2π rad and 1 min = 60 s', 'ω = ' + rpm + ' × [[2π|60]] = **' + F((rpm * 2 * PI) / 60) + ' rad/s**'] }; }
    if (k === 1) { const rev = R.pick([2.5, 3, 5, 10, 12]); return { t: 'num', q: 'A wheel turns through **' + rev + ' revolutions**. How many radians is that?', a: rev * 2 * PI, unit: 'rad', steps: ['θ = ' + rev + ' × 2π = **' + F(rev * 2 * PI) + ' rad**'] }; }
    const w = R.pick([2, 5, 10, 20, 50]);
    return { t: 'num', q: 'A disk spins at **' + w + ' rad/s**. How long does one revolution take?', a: (2 * PI) / w, unit: 's', steps: ['T = [[2π|ω]] = [[2π|' + w + ']] = **' + F((2 * PI) / w) + ' s**'] };
  });

  CQ.gen('p.rot.kin', (R) => {
    const w0 = R.pick([0, 0, 5, 10, 20]), al = R.pick([1.5, 2, 3, 4, 5]), t = R.pick([2, 3, 4, 5, 6]);
    const k = R.int(0, 2);
    const w = w0 + al * t, th = w0 * t + 0.5 * al * t * t;
    if (k === 0) return { t: 'num', q: 'A turbine ' + (w0 ? 'turning at **' + w0 + ' rad/s**' : 'starting from rest') + ' speeds up with constant **α = ' + al + ' rad/s²**. What is its angular speed after **' + t + ' s**?', a: w, unit: 'rad/s', steps: ['ω = ω₀ + αt = ' + w0 + ' + ' + al + '(' + t + ') = **' + F(w) + ' rad/s**'] };
    if (k === 1) return { t: 'num', q: 'A wheel ' + (w0 ? 'at **' + w0 + ' rad/s**' : 'starting from rest') + ' has constant **α = ' + al + ' rad/s²**. How many **revolutions** does it make in **' + t + ' s**?', a: th / (2 * PI), unit: 'rev', steps: ['θ = ω₀t + ½αt² = ' + F(th) + ' rad', 'revolutions = θ/2π = **' + F(th / (2 * PI)) + ' rev**'] };
    const W0 = R.pick([20, 30, 40, 60]), A = R.pick([2, 4, 5, 8]);
    return { t: 'num', lvl: 4, q: 'A spinning fan at **' + W0 + ' rad/s** is switched off and slows with constant **α = −' + A + ' rad/s²**. Through what angle does it turn before stopping?', a: (W0 * W0) / (2 * A), unit: 'rad', steps: ['No time given → ω² = ω₀² + 2αΔθ', '0 = ' + W0 * W0 + ' − 2(' + A + ')Δθ', 'Δθ = **' + F((W0 * W0) / (2 * A)) + ' rad** (' + F((W0 * W0) / (2 * A) / (2 * PI)) + ' rev)'] };
  });

  CQ.gen('p.rot.link', (R) => {
    const r = R.pick([0.1, 0.2, 0.3, 0.5, 1.2]), w = R.pick([4, 6, 10, 15, 20]), al = R.pick([2, 3, 5]);
    const k = R.int(0, 2);
    if (k === 0) return { t: 'num', q: 'A point on a grinding wheel is **' + r * 100 + ' cm** from the axis. The wheel spins at **' + w + ' rad/s**. How fast is the point moving?', a: r * w, unit: 'm/s', fig: D.disk(), steps: ['v = rω = ' + r + ' × ' + w + ' = **' + F(r * w) + ' m/s**'], hint: 'Convert cm to m first.' };
    if (k === 1) return { t: 'num', q: 'A point **' + r * 100 + ' cm** from the center of a wheel spinning at **' + w + ' rad/s**. What is its centripetal (radial) acceleration?', a: w * w * r, unit: 'm/s²', steps: ['a_rad = ω²r = ' + w + '² × ' + r + ' = **' + F(w * w * r) + ' m/s²**'] };
    const at = r * al, ar = w * w * r;
    return { t: 'num', lvl: 4, q: 'A point **' + r * 100 + ' cm** from the axis of a wheel has **ω = ' + w + ' rad/s** and **α = ' + al + ' rad/s²** at some instant. What is the magnitude of its total acceleration?', a: Math.hypot(at, ar), unit: 'm/s²', steps: ['Tangential: a_tan = rα = ' + F(at) + ' m/s²', 'Radial: a_rad = ω²r = ' + F(ar) + ' m/s²', 'They\'re perpendicular: a = √(a_tan² + a_rad²) = **' + F(Math.hypot(at, ar)) + ' m/s²**'] };
  });

  CQ.gen('p.I', (R) => {
    const [name, c, form] = R.pick(SHAPES);
    const M = R.pick([0.5, 1, 2, 3, 5]), r = R.pick([0.1, 0.2, 0.25, 0.4, 0.5]);
    return { t: 'num', q: 'What is the moment of inertia of a **' + name + '** with mass **' + M + ' kg** and radius **' + r + ' m**, about its central axis?', a: c * M * r * r, unit: 'kg·m²', steps: ['I = ' + form, 'I = ' + F(c, 3) + ' × ' + M + ' × ' + r + '² = **' + F(c * M * r * r) + ' kg·m²**'] };
  });

  CQ.gen('p.I.points', (R) => {
    const m1 = R.pick([1, 2, 3]), m2 = R.pick([1, 2, 4]), r1 = R.pick([0.2, 0.3, 0.5]), r2 = R.pick([0.4, 0.6, 0.8]);
    const I = m1 * r1 * r1 + m2 * r2 * r2;
    return { t: 'num', q: 'Two small balls are fixed to a light rod: **' + m1 + ' kg at ' + r1 + ' m** and **' + m2 + ' kg at ' + r2 + ' m** from the rotation axis. Find the moment of inertia.', a: I, unit: 'kg·m²', steps: ['I = Σmr²', '= ' + m1 + '(' + r1 + ')² + ' + m2 + '(' + r2 + ')² = **' + F(I) + ' kg·m²**'] };
  });

  CQ.gen('p.parallel', (R) => {
    const M = R.pick([1, 2, 3, 4]), L2 = R.pick([0.6, 1, 1.2, 2]);
    const Icm = (M * L2 * L2) / 12, d = L2 / 2;
    return { t: 'num', lvl: 4, q: 'A uniform rod (**M = ' + M + ' kg**, **L = ' + L2 + ' m**) has I_cm = [[1|12]]ML² about its center. Use the parallel-axis theorem to find I about one **end**.', a: Icm + M * d * d, unit: 'kg·m²',
      steps: ['I = I_cm + Md², with d = L/2 = ' + d + ' m', '= ' + F(Icm) + ' + ' + M + '(' + d + ')² = **' + F(Icm + M * d * d) + ' kg·m²**', 'That equals ⅓ML², as expected.'] };
  });

  CQ.gen('p.KErot', (R) => {
    const [name, c, form] = R.pick(SHAPES.slice(0, 3));
    const M = R.pick([2, 5, 10, 20]), r = R.pick([0.2, 0.3, 0.5]), w = R.pick([10, 20, 30, 50]);
    const I = c * M * r * r;
    return { t: 'num', q: 'A **' + name + '** flywheel (**M = ' + M + ' kg**, **R = ' + r + ' m**) spins at **' + w + ' rad/s**. How much rotational kinetic energy does it store?', a: 0.5 * I * w * w, unit: 'J', steps: ['I = ' + form + ' = ' + F(I) + ' kg·m²', 'K = ½Iω² = ½(' + F(I) + ')(' + w + ')² = **' + F(0.5 * I * w * w) + ' J**'] };
  });

  /* ================= generators: Unit 10 ================= */
  CQ.gen('p.torque', (R) => {
    const r = R.pick([0.2, 0.25, 0.3, 0.4, 0.5]), Fp = R.pick([20, 40, 50, 80, 100]), phi = R.pick([30, 45, 60, 90, 120]);
    return { t: 'num', q: 'You push on a wrench **' + r * 100 + ' cm** from the bolt with **' + Fp + ' N**, at **' + phi + '°** to the handle. What torque do you apply?', a: r * Fp * sin(phi), unit: 'N·m', fig: D.torque({ deg: phi }),
      steps: ['τ = rF sin φ (φ = angle between r and F)', '= ' + r + ' × ' + Fp + ' × sin ' + phi + '° = **' + F(r * Fp * sin(phi)) + ' N·m**'], why: phi === 90 ? 'Perpendicular pushes give the most torque.' : 'Only the perpendicular part of the force, F sin φ, turns the wrench.' };
  });

  CQ.gen('p.torque.net', (R) => {
    const r1 = R.pick([0.1, 0.2, 0.3]), r2 = R.pick([0.4, 0.5, 0.6]), F1 = R.pick([30, 40, 60, 80]), F2 = R.pick([10, 20, 25, 30]);
    const net = F1 * r1 - F2 * r2;
    return { t: 'num', q: 'A wheel has two forces applied tangentially: **' + F1 + ' N** at radius **' + r1 + ' m** turning it **counterclockwise**, and **' + F2 + ' N** at radius **' + r2 + ' m** turning it **clockwise**. What is the net torque? (CCW = +)', a: net, unit: 'N·m', abs: 0.01,
      steps: ['τ₁ = +' + F1 + ' × ' + r1 + ' = +' + F(F1 * r1) + ' N·m', 'τ₂ = −' + F2 + ' × ' + r2 + ' = −' + F(F2 * r2) + ' N·m', 'Στ = **' + F(net) + ' N·m**' + (net < 0 ? ' (clockwise)' : '')] };
  });

  CQ.gen('p.alpha', (R) => {
    const [name, c, form] = R.pick(SHAPES.slice(0, 2));
    const M = R.pick([2, 4, 5, 10]), r = R.pick([0.2, 0.3, 0.5]), Fp = R.pick([5, 10, 20, 30]);
    const I = c * M * r * r, al = (Fp * r) / I;
    return { t: 'num', q: 'A **' + name + '** (M = ' + M + ' kg, R = ' + r + ' m) can spin freely on a fixed axle. A string wrapped around its rim is pulled with **' + Fp + ' N**. What is its angular acceleration?', a: al, unit: 'rad/s²',
      steps: ['τ = FR = ' + Fp + ' × ' + r + ' = ' + F(Fp * r) + ' N·m', 'I = ' + form + ' = ' + F(I) + ' kg·m²', 'α = τ/I = **' + F(al) + ' rad/s²**'] };
  });

  CQ.gen('p.pulleymass', (R) => {
    const m = R.pick([1, 2, 3, 5]), M = R.pick([2, 4, 6, 10]);
    const a = (m * g) / (m + M / 2), Tt = m * (g - a);
    const want = R.pick(['a', 'T']);
    return { t: 'num', lvl: 4, exam: true, q: 'A **' + m + ' kg** bucket hangs from a rope wrapped around a solid-disk pulley (**M = ' + M + ' kg**, I = ½MR²) that turns without friction. The bucket is released. Find the ' + (want === 'a' ? '**acceleration** of the bucket.' : '**tension** in the rope.'), a: want === 'a' ? a : Tt, unit: want === 'a' ? 'm/s²' : 'N',
      hint: 'Two equations: the bucket (mg − T = ma) and the disk (TR = Iα with α = a/R). The radius cancels.',
      steps: ['Bucket: mg − T = ma', 'Disk: TR = (½MR²)(a/R) → T = ½Ma', 'Add: mg = (m + ½M)a → a = [[mg|m + M/2]] = ' + F(a) + ' m/s²', want === 'a' ? 'a = **' + F(a) + ' m/s²**' : 'T = ½Ma = **' + F(Tt) + ' N**'] };
  });

  CQ.gen('p.roll', (R) => {
    const pick = R.pick([['solid sphere', 0.4], ['solid cylinder', 0.5], ['hoop', 1], ['hollow sphere', 2 / 3]]);
    const h = R.pick([0.5, 1, 1.5, 2, 3]);
    const v = Math.sqrt((2 * g * h) / (1 + pick[1]));
    return { t: 'num', lvl: 4, q: 'A **' + pick[0] + '** rolls without slipping from rest down a ramp of vertical height **' + h + ' m**. What is its speed at the bottom?', a: v, unit: 'm/s', fig: D.roll(),
      hint: 'Energy: mgh = ½mv² + ½Iω², with ω = v/R and I = cMR².',
      steps: ['I = ' + F(pick[1], 3) + 'MR², ω = v/R', 'mgh = ½mv²(1 + ' + F(pick[1], 3) + ')', 'v = √{[[2gh|1 + ' + F(pick[1], 3) + ']]} = **' + F(v) + ' m/s**'],
      why: 'Some of the energy goes into spinning, so it\'s slower than a frictionless slide (√2gh = ' + F(Math.sqrt(2 * g * h)) + ' m/s).' };
  });

  CQ.gen('p.rotpower', (R) => {
    const tau = R.pick([50, 100, 200, 300, 400]), rpm = R.pick([1000, 2000, 3000, 4000]);
    const w = (rpm * 2 * PI) / 60;
    return { t: 'num', q: 'An engine delivers **' + tau + ' N·m** of torque at **' + rpm + ' rpm**. What power is that (in kW)?', a: (tau * w) / 1000, unit: 'kW',
      steps: ['ω = ' + rpm + ' × 2π/60 = ' + F(w) + ' rad/s', 'P = τω = ' + tau + ' × ' + F(w) + ' = ' + F(tau * w) + ' W = **' + F((tau * w) / 1000) + ' kW**'] };
  });

  CQ.gen('p.L', (R) => {
    const k = R.int(0, 1);
    if (k === 0) {
      const I1 = R.pick([3, 4, 5, 6]), f = R.pick([2, 2.5, 3, 4]), w1 = R.pick([2, 3, 4, 6]);
      const I2 = I1 / f;
      return { t: 'num', q: 'A skater spins at **' + w1 + ' rad/s** with arms out (**I = ' + I1 + ' kg·m²**). She pulls her arms in and her moment of inertia drops to **' + F(I2) + ' kg·m²**. What is her new angular speed?', a: w1 * f, unit: 'rad/s',
        steps: ['No external torque → L conserved: I₁ω₁ = I₂ω₂', 'ω₂ = [[I₁ω₁|I₂]] = [[' + I1 + ' × ' + w1 + '|' + F(I2) + ']] = **' + F(w1 * f) + ' rad/s**'] };
    }
    const M = R.pick([100, 150, 200]), Rr = R.pick([1.5, 2, 2.5]), m = R.pick([30, 40, 50, 60]), w1 = R.pick([1, 1.5, 2]);
    const I1 = 0.5 * M * Rr * Rr, I2 = I1 + m * Rr * Rr;

$$ Σvec{F} = 0   ·   Στ = 0 $$
A pair of equal and opposite forces that don't line up (a *couple*) has ΣF = 0 but still spins the object, so the torque condition matters too.
>* For a body in equilibrium, Στ = 0 about **every** point, so you choose the pivot. Put it where an unknown force acts, and that force drops out of the torque equation.`, { fig: D.beam({ supports: [{ x: 0.5, type: 'fulcrum' }], loads: [{ x: 0.18, label: 'm₁g' }, { x: 0.74, label: 'm₂g', cls: 'c4' }] }) }),
      MC('Two equal and opposite forces act at opposite ends of a ruler, perpendicular to it. The ruler…', ['has no net force but starts to rotate', 'stays in equilibrium', 'accelerates in a straight line', 'has a net force but no torque'], 'ΣF = 0 but Στ ≠ 0. That pair is called a couple.'),
      G('p.seesaw'),
      TF('In equilibrium, you can compute torques about any point you like.', true, 'If ΣF = 0, the torque sum is the same about every point.'),
      G('p.seesaw'),
      FILL('A body is in static equilibrium only if the net ___ is zero and the net ___ is zero.', ['force', 'torque'], ['velocity', 'momentum', 'energy'], 'Both conditions are needed.'),
    ]),
    L('p11l2', 'Beams, Ladders & Struts', {
      goal: 'Solve multi-force equilibrium problems with a smart choice of pivot.',
      key: 'Recipe: draw the FBD with the weight at the center of gravity. Pick the pivot at the point with the most unknowns. Write Στ = 0 there to get one unknown, then use ΣFₓ = 0 and ΣFᵧ = 0 for the rest. Ladder on a frictionless wall: the wall force is horizontal, so floor friction = wall force = $w/(2 tan θ)$ for a uniform ladder, and lower angles need more friction.',
      formulas: ['pivot at the unknown force → it drops out', 'ladder: f = n_{wall} = [[w|2 tan θ]]'],
    }, [
      T('The smart-pivot recipe', `
1. FBD: every force, with the weight at the center of gravity
2. Choose the pivot where an **unknown** force acts
3. Στ = 0 about that pivot gives the other unknown
4. ΣFₓ = 0 and ΣFᵧ = 0 give the rest
>! Lever arms are **perpendicular** distances. For a ladder at angle θ, the weight's lever arm about the base is (L/2) cos θ, not L/2.`, { fig: D.ladder({ deg: 60 }) }),
      EX('Plank on two supports', 'A 6.0 m, 300 N uniform plank rests on supports at its ends. A 600 N painter stands 2.0 m from the left end. Find both support forces.', ['Pivot at left (A): n_B(6.0) − 300(3.0) − 600(2.0) = 0', 'n_B = 2100/6.0 = **350 N**', 'ΣFᵧ: n_A = 900 − 350 = **550 N**. The support nearer the painter carries more.']),
      G('p.beam'),
      MC('A ladder leans against a frictionless wall. As you lower its angle (closer to the floor), the friction force needed at the floor…', ['increases', 'decreases', 'stays the same', 'drops to zero'], 'f = w/(2 tan θ). Smaller θ means smaller tan θ, so larger f.'),
      G('p.ladder'),
      TF('Choosing the pivot at a support makes that support\'s force drop out of the torque equation.', true, 'Its lever arm is zero.'),
      G('p.beam'),
    ]),
    L('p11l3', 'Stress, Strain & Young\'s Modulus', {
      goal: 'Compute stress, strain and elongation of loaded rods and wires.',
      key: 'Stress = force per area: $σ = F/A$ (Pa = N/m²). Strain = fractional deformation: $ε = ΔL/L₀$ (no units). In the elastic region, Hooke\'s law gives $σ = Yε$, where Y is Young\'s modulus (steel ≈ 200 GPa). Elongation: $ΔL = FL₀/(AY)$. Doubling the diameter quadruples A and quarters the stretch. Shear and bulk moduli work the same way for other kinds of deformation.',
      formulas: ['σ = F/A', 'ε = ΔL/L₀', 'Y = σ/ε', 'ΔL = [[FL₀|AY]]'],
    }, [
      T('How materials stretch', `
$$ σ = [[F|A]] :: stress (Pa) $$
$$ ε = [[ΔL|L₀]] :: strain (no units) $$
In the elastic (springy) region they're proportional:
$$ Y = [[σ|ε]]   ⇒   ΔL = [[F L₀|A Y]] $$
| Material | Y (GPa) |
|---|---|
| steel | 200 |
| copper | 110 |
| aluminum | 70 |
| bone | ~15 |
>! For a round wire, $A = π(d/2)²$. Doubling the **diameter** makes the area 4× and the stretch ¼.`),
      EX('Elevator cable', 'A steel cable (Y = 200 GPa) 50 m long with A = 2.0 cm² holds 10,000 N. How much does it stretch?', ['A = 2.0 × 10⁻⁴ m²', 'ΔL = FL₀/(AY) = (10⁴)(50)/((2.0×10⁻⁴)(2.0×10¹¹))', 'ΔL = **0.0125 m = 12.5 mm**']),
      G('p.stress'),
      MC('Two steel wires have the same length and load, but wire B has twice the diameter of wire A. Wire B stretches…', ['¼ as much', '½ as much', 'the same', '2 times as much'], 'Area ∝ d², so B has 4× the area and ¼ the stretch.', { lvl: 2 }),
      G('p.stress'),
      TF('Strain has units of meters.', false, 'Strain = ΔL/L₀, which is dimensionless.'),
      MATCH('Match the quantity to its units.', [['stress', 'Pa (N/m²)'], ['strain', 'none'], ['Young\'s modulus', 'Pa'], ['elongation ΔL', 'm']]),
    ]),
  ]);

  CQ.addUnits('phys', [u9, u10, u11]);
})();

<script>
/* content/phys-5.js */
/* PHYS 2325 · Units 12–14: gravitation, periodic motion, mechanical waves (Young & Freedman Ch 13–15) */
(function () {
  const CQ = window.CQ;
  const { L, U, T, EX, MC, MULTI, TF, NUM, FILL, MATCH, ORDER, G } = CQ.dsl;
  const F = (x, s = 3) => CQ.fmt(x, s);
  const g = 9.8;
  const D = CQ.dg;
  const PI = Math.PI;
  const Gc = 6.674e-11, ME = 5.97e24, RE = 6.37e6;

  /* ================= generators: Unit 12 ================= */
  CQ.gen('p.grav.F', (R) => {
    const m1 = R.pick([50, 70, 100, 1000, 5000]), m2 = R.pick([60, 80, 200, 2000]), r = R.pick([0.5, 1, 2, 5, 10]);
    const Fg = (Gc * m1 * m2) / (r * r);
    return { t: 'num', q: 'Two masses, **' + m1 + ' kg** and **' + m2 + ' kg**, are **' + r + ' m** apart (center to center). What is the gravitational force between them? (G = 6.674 × 10⁻¹¹ N·m²/kg²)', a: Fg, unit: 'N',
      steps: ['F = [[Gm₁m₂|r²]]', '= [[(6.674×10⁻¹¹)(' + m1 + ')(' + m2 + ')|' + r + '²]]', 'F = **' + F(Fg) + ' N**, tiny for everyday masses'] };
  });

  CQ.gen('p.grav.ratio', (R) => {
    const k = R.pick([2, 3, 4, 0.5]), mk = R.pick([1, 2, 3]);
    const factor = mk / (k * k);
    return { t: 'mc', lvl: 2, q: 'Two asteroids attract each other with force F. If one asteroid\'s mass is multiplied by **' + mk + '** and the distance between them is multiplied by **' + k + '**, the new force is…',
      opts: CQ.numOpts(factor, [mk / k, mk * k * k, mk / k / k / k, 1 / (k * k)], 3, '× F'),
      steps: ['F ∝ m₁m₂/r²', 'New F = (' + mk + ')/(' + k + ')² × F = **' + F(factor) + ' F**'], why: 'Inverse-square: doubling the distance cuts the force to ¼.' };
  });

  CQ.gen('p.grav.g', (R) => {
    const k = R.int(0, 1);
    if (k === 0) {
      const h = R.pick([400, 1000, 6370, 20000, 36000]) * 1000;
      const gg = (Gc * ME) / ((RE + h) ** 2);
      return { t: 'num', q: 'What is the gravitational acceleration at an altitude of **' + F(h / 1000, 4) + ' km** above Earth\'s surface? (M_E = 5.97 × 10²⁴ kg, R_E = 6370 km)', a: gg, unit: 'm/s²',
        steps: ['g = [[GM_E|(R_E + h)²]]', 'r = ' + F(RE + h) + ' m', 'g = **' + F(gg) + ' m/s²**'], why: h === 400000 ? 'At the ISS altitude g is still about 90% of its surface value. Astronauts float because they\'re in free fall, not because gravity is gone.' : '' };
    }
    const mf = R.pick([0.1, 0.5, 2, 3]), rf = R.pick([0.5, 1, 2]);
    return { t: 'num', q: 'A planet has **' + mf + '×** Earth\'s mass and **' + rf + '×** Earth\'s radius. What is g at its surface? (Earth: 9.80 m/s²)', a: (g * mf) / (rf * rf), unit: 'm/s²',
      steps: ['g = GM/R² ∝ M/R²', 'g = 9.80 × ' + mf + '/' + rf + '² = **' + F((g * mf) / (rf * rf)) + ' m/s²**'] };
  });

  CQ.gen('p.escape', (R) => {
    const pl = R.pick([['Earth', 5.97e24, 6.37e6], ['the Moon', 7.35e22, 1.74e6], ['Mars', 6.42e23, 3.39e6], ['Jupiter', 1.9e27, 6.99e7]]);
    const v = Math.sqrt((2 * Gc * pl[1]) / pl[2]);
    return { t: 'num', q: 'What is the escape speed from the surface of **' + pl[0] + '**? (M = ' + F(pl[1]) + ' kg, R = ' + F(pl[2]) + ' m) Answer in km/s.', a: v / 1000, unit: 'km/s',
      steps: ['Escape: ½mv² − GMm/R = 0', 'v = √{2GM/R}', 'v = ' + F(v) + ' m/s = **' + F(v / 1000) + ' km/s**'], why: 'Escape speed doesn\'t depend on the mass of the rocket or the direction it\'s launched.' };
  });

  CQ.gen('p.gravU', (R) => {
    const m = R.pick([100, 500, 1000, 2000]), h = R.pick([300, 500, 1000, 3000]) * 1000;
    const dU = Gc * ME * m * (1 / RE - 1 / (RE + h));
    return { t: 'num', lvl: 4, q: 'How much energy (in J) does it take to lift a **' + m + ' kg** satellite from Earth\'s surface to an altitude of **' + h / 1000 + ' km** (just the change in gravitational PE)?', a: dU, unit: 'J',
      hint: 'Use U = −GMm/r, not mgh. g changes over this distance.',
      steps: ['ΔU = GM_Em([[1|R_E]] − [[1|R_E + h]])', '= (6.674×10⁻¹¹)(5.97×10²⁴)(' + m + ')([[1|' + F(RE) + ']] − [[1|' + F(RE + h) + ']])', 'ΔU = **' + F(dU) + ' J**'] };
  });

  CQ.gen('p.orbit', (R) => {
    const h = R.pick([300, 400, 800, 2000, 20200, 35800]) * 1000, r = RE + h;
    const v = Math.sqrt((Gc * ME) / r), Tp = (2 * PI * r) / v;
    const want = R.pick(['v', 'T']);
    return { t: 'num', lvl: want === 'T' ? 4 : 3, q: 'A satellite orbits Earth in a circle at an altitude of **' + F(h / 1000, 4) + ' km**. ' + (want === 'v' ? 'What is its orbital speed (in km/s)?' : 'What is its orbital period (in hours)?'), a: want === 'v' ? v / 1000 : Tp / 3600, unit: want === 'v' ? 'km/s' : 'h',
      fig: D.orbit(),
      steps: ['Gravity supplies the centripetal force: GMm/r² = mv²/r', 'r = R_E + h = ' + F(r) + ' m', 'v = √{GM/r} = ' + F(v) + ' m/s', ...(want === 'v' ? ['v = **' + F(v / 1000) + ' km/s**'] : ['T = 2πr/v = ' + F(Tp) + ' s = **' + F(Tp / 3600) + ' h**'])] };
  });

  CQ.gen('p.kepler', (R) => {
    const k = R.pick([2, 4, 9]);
    const Tr = Math.pow(k, 1.5);
    return { t: 'num', q: 'Planet B orbits a star at **' + k + ' times** the orbital radius of planet A. How many times longer is B\'s orbital period?', a: Tr, unit: '× T_A',
      steps: ['Kepler\'s third law: T² ∝ r³', 'T_B/T_A = (' + k + ')^{3/2} = **' + F(Tr) + '**'] };
  });

  /* ================= generators: Unit 13 ================= */
  CQ.gen('p.shm.basic', (R) => {
    const m = R.pick([0.2, 0.5, 1, 2, 4]), k = R.pick([20, 50, 80, 100, 200, 500]);
    const w = Math.sqrt(k / m);
    const want = R.pick(['w', 'f', 'T']);
    const val = want === 'w' ? w : want === 'f' ? w / (2 * PI) : (2 * PI) / w;
    return { t: 'num', q: 'A **' + m + ' kg** mass on a spring with **k = ' + k + ' N/m** oscillates. What is its ' + (want === 'w' ? 'angular frequency ω' : want === 'f' ? 'frequency f' : 'period T') + '?', a: val, unit: want === 'w' ? 'rad/s' : want === 'f' ? 'Hz' : 's',
      fig: D.spring({ x: 160, eq: 190 }),
      steps: ['ω = √{k/m} = √{' + k + '/' + m + '} = ' + F(w) + ' rad/s', ...(want === 'f' ? ['f = ω/2π = **' + F(val) + ' Hz**'] : want === 'T' ? ['T = 2π/ω = 2π√{m/k} = **' + F(val) + ' s**'] : ['ω = **' + F(w) + ' rad/s**'])] };
  });

  CQ.gen('p.shm.max', (R) => {
    const A = R.pick([0.02, 0.05, 0.1, 0.15]), w = R.pick([5, 10, 12, 20, 30]);
    const want = R.pick(['v', 'a']);
    return { t: 'num', q: 'An object in SHM has amplitude **' + A * 100 + ' cm** and angular frequency **' + w + ' rad/s**. What is its maximum ' + (want === 'v' ? 'speed' : 'acceleration') + '?', a: want === 'v' ? A * w : A * w * w, unit: want === 'v' ? 'm/s' : 'm/s²',
      steps: [want === 'v' ? 'v_max = ωA (at equilibrium, x = 0)' : 'a_max = ω²A (at the turning points, x = ±A)', '= ' + (want === 'v' ? w + ' × ' + A : w + '² × ' + A) + ' = **' + F(want === 'v' ? A * w : A * w * w) + (want === 'v' ? ' m/s' : ' m/s²') + '**'] };
  });

  CQ.gen('p.shm.x', (R) => {
    const A = R.pick([0.05, 0.1, 0.2]), w = R.pick([2, 3, 4, 5]), t = R.pick([0.2, 0.3, 0.5, 0.8, 1]);
    const want = R.pick(['x', 'v']);
    const x = A * Math.cos(w * t), v = -A * w * Math.sin(w * t);
    return { t: 'num', lvl: 4, q: 'A block oscillates with **x(t) = (' + A + ' m) cos(' + w + 't)** (t in s). What is its ' + (want === 'x' ? 'position' : 'velocity') + ' at t = ' + t + ' s?', a: want === 'x' ? x : v, unit: want === 'x' ? 'm' : 'm/s', abs: 0.002,
      hint: 'Put your calculator in RADIANS. ωt is in radians.',
      steps: want === 'x' ? ['ωt = ' + w + ' × ' + t + ' = ' + F(w * t) + ' rad', 'x = ' + A + ' cos(' + F(w * t) + ') = **' + F(x) + ' m**'] : ['v = dx/dt = −Aω sin(ωt)', 'ωt = ' + F(w * t) + ' rad', 'v = −' + A + '(' + w + ') sin(' + F(w * t) + ') = **' + F(v) + ' m/s**'],
      why: 'Calculator in degrees is the #1 way to lose points on SHM questions.' };
  });

  CQ.gen('p.shm.E', (R) => {
    const k = R.pick([50, 100, 200, 400]), A = R.pick([0.05, 0.1, 0.2]), m = R.pick([0.5, 1, 2]);
    const xf = R.pick([0.5, 0.6, 0.8]);
    const want = R.pick(['E', 'v']);
    const E = 0.5 * k * A * A, x = xf * A, v = Math.sqrt(k / m) * Math.sqrt(A * A - x * x);
    if (want === 'E') return { t: 'num', q: 'A spring (**k = ' + k + ' N/m**) oscillates with amplitude **' + A * 100 + ' cm**. What is the total mechanical energy?', a: E, unit: 'J', steps: ['At x = ±A, all the energy is spring PE', 'E = ½kA² = ½(' + k + ')(' + A + ')² = **' + F(E) + ' J**'] };
    return { t: 'num', lvl: 4, q: 'A **' + m + ' kg** mass on a **k = ' + k + ' N/m** spring oscillates with amplitude **' + A * 100 + ' cm**. How fast is it moving when it is **' + F(x * 100) + ' cm** from equilibrium?', a: v, unit: 'm/s',
      steps: ['Energy: ½kA² = ½mv² + ½kx²', 'v = √{k/m} √{A² − x²}', '= ' + F(Math.sqrt(k / m)) + ' × √(' + A + '² − ' + F(x) + '²) = **' + F(v) + ' m/s**'] };
  });

  CQ.gen('p.pend', (R) => {
    const k = R.int(0, 2);
    if (k === 0) { const L2 = R.pick([0.25, 0.5, 1, 1.5, 2, 4]); return { t: 'num', q: 'What is the period of a simple pendulum of length **' + L2 + ' m** (small swings)?', a: 2 * PI * Math.sqrt(L2 / g), unit: 's', fig: D.pendulum({ deg: 20 }), steps: ['T = 2π√{L/g} = 2π√{' + L2 + '/9.8}', 'T = **' + F(2 * PI * Math.sqrt(L2 / g)) + ' s**'] }; }
    if (k === 1) { const Tt = R.pick([1, 1.5, 2, 3]); return { t: 'num', q: 'How long must a simple pendulum be to have a period of **' + Tt + ' s**?', a: g * (Tt / (2 * PI)) ** 2, unit: 'm', steps: ['T = 2π√{L/g} → L = g(T/2π)²', 'L = 9.8 × (' + Tt + '/2π)² = **' + F(g * (Tt / (2 * PI)) ** 2) + ' m**'] }; }
    const L2 = R.pick([0.5, 0.8, 1, 1.2]);
    const Tt = 2 * PI * Math.sqrt((2 * L2) / (3 * g));
    return { t: 'num', lvl: 4, q: 'A uniform rod of length **' + L2 + ' m** swings as a physical pendulum, pivoted at one end. What is its period for small swings?', a: Tt, unit: 's',
      steps: ['Physical pendulum: T = 2π√{I/(mgd)}', 'I = ⅓mL², d = L/2', 'T = 2π√{2L/(3g)} = **' + F(Tt) + ' s**'] };
  });

  /* ================= generators: Unit 14 ================= */
  CQ.gen('p.wave.v', (R) => {
    const f = R.pick([2, 5, 50, 256, 440, 1000]), lam = R.pick([0.2, 0.5, 0.78, 1.2, 3]);
    const k = R.int(0, 2);
    const v = f * lam;
    if (k === 0) return { t: 'num', q: 'A wave has frequency **' + f + ' Hz** and wavelength **' + lam + ' m**. What is its speed?', a: v, unit: 'm/s', steps: ['v = fλ = ' + f + ' × ' + lam + ' = **' + F(v) + ' m/s**'] };
    if (k === 1) return { t: 'num', q: 'Sound travels at **343 m/s** in air. What is the wavelength of a **' + f + ' Hz** tone?', a: 343 / f, unit: 'm', steps: ['λ = v/f = 343/' + f + ' = **' + F(343 / f) + ' m**'] };
    return { t: 'num', q: 'Ocean waves move at **' + F(v) + ' m/s** with crests **' + lam + ' m** apart. What is their period?', a: lam / v, unit: 's', steps: ['f = v/λ = ' + F(f) + ' Hz', 'T = 1/f = λ/v = **' + F(lam / v) + ' s**'] };
  });

  CQ.gen('p.wave.fn', (R) => {
    const A = R.pick([0.01, 0.02, 0.05]), k = R.pick([2, 3, 4, 5, 6.28]), w = R.pick([10, 20, 30, 50, 60]);
    const want = R.pick(['v', 'lam', 'f']);
    const val = want === 'v' ? w / k : want === 'lam' ? (2 * PI) / k : w / (2 * PI);
    return { t: 'num', q: 'A wave on a string is described by **y(x,t) = (' + A + ' m) cos(' + k + 'x − ' + w + 't)** (SI units). What is its ' + (want === 'v' ? 'speed' : want === 'lam' ? 'wavelength' : 'frequency') + '?', a: val, unit: want === 'v' ? 'm/s' : want === 'lam' ? 'm' : 'Hz',
      steps: ['Compare with y = A cos(kx − ωt): k = ' + k + ' rad/m, ω = ' + w + ' rad/s', want === 'v' ? 'v = ω/k = **' + F(val) + ' m/s**' : want === 'lam' ? 'λ = 2π/k = **' + F(val) + ' m**' : 'f = ω/2π = **' + F(val) + ' Hz**'],
      why: 'The minus sign in (kx − ωt) means the wave moves toward +x.' };
  });

  CQ.gen('p.wave.string', (R) => {
    const Ft = R.pick([20, 50, 80, 100, 200]), mu = R.pick([0.002, 0.005, 0.01, 0.02]);
    const v = Math.sqrt(Ft / mu);
    const k = R.int(0, 1);
    if (k === 0) return { t: 'num', q: 'A string with linear mass density **μ = ' + mu + ' kg/m** is under **' + Ft + ' N** of tension. How fast do waves travel on it?', a: v, unit: 'm/s', steps: ['v = √{F/μ} = √{' + Ft + '/' + mu + '} = **' + F(v) + ' m/s**'] };
    return { t: 'num', lvl: 3, q: 'You increase the tension in a guitar string from **' + Ft + ' N** to **' + 4 * Ft + ' N**. By what factor does the wave speed change?', a: 2, unit: '×', steps: ['v ∝ √F', '√(4) = **2**: the wave speed doubles'] };
  });

  CQ.gen('p.standing', (R) => {
    const L2 = R.pick([0.5, 0.65, 0.8, 1, 1.2]), v = R.pick([120, 200, 260, 300, 400]), n = R.pick([1, 2, 3, 4]);
    const f = (n * v) / (2 * L2);
    const kind = R.int(0, 1);
    if (kind === 0) return { t: 'num', q: 'A string **' + L2 + ' m** long is fixed at both ends, and waves travel on it at **' + v + ' m/s**. What is the frequency of the **' + (n === 1 ? 'fundamental (n = 1)' : 'n = ' + n + ' harmonic') + '**?', a: f, unit: 'Hz',
      fig: D.standing({ n }), steps: ['Fixed–fixed: λₙ = 2L/n', 'fₙ = n[[v|2L]] = ' + n + ' × [[' + v + '|2(' + L2 + ')]] = **' + F(f) + ' Hz**'] };
    const f1 = v / (2 * L2);
    return { t: 'num', lvl: 4, q: 'A string fixed at both ends has resonances at **' + F(n * f1) + ' Hz** and **' + F((n + 1) * f1) + ' Hz**, with no resonances in between. If the string is **' + L2 + ' m** long, what is the wave speed?', a: v, unit: 'm/s',
      hint: 'Adjacent harmonics differ by exactly the fundamental frequency.',
      steps: ['f₁ = difference between adjacent harmonics = ' + F(f1) + ' Hz', 'f₁ = v/2L → v = 2Lf₁ = 2(' + L2 + ')(' + F(f1) + ') = **' + F(v) + ' m/s**'] };
  });

  /* ================= Unit 12 ================= */
  const u12 = U('p12', 'Gravitation', { sub: 'Newton\'s law, orbits & escape speed', ch: 'Ch 13' }, [
    L('p12l1', 'Newton\'s Law of Gravitation', {
      goal: 'Use the inverse-square law and find g anywhere.',
      key: 'Every pair of masses attracts with $F = Gm₁m₂/r²$, where G = 6.674 × 10⁻¹¹ N·m²/kg² and r is center-to-center. It is inverse-square: double r and F drops to ¼. At distance r from a planet\'s center, $g = GM/r²$, so at altitude h, $g = GM/(R + h)²$. Inside a spherical shell the net pull is zero. Astronauts in orbit are weightless because they\'re in free fall, not because g = 0.',
      formulas: ['F = [[Gm₁m₂|r²]]', 'g = [[GM|r²]]', 'G = 6.674×10⁻¹¹ N·m²/kg²'],
    }, [
      T('One law for apples and moons', `
$$ F_g = [[G m₁ m₂|r²]] :: G = 6.674 × 10⁻¹¹ N·m²/kg² $$
- Always attractive, along the line between the centers
- **Inverse-square:** 2× the distance → ¼ the force
- r is measured **center to center**
Near a planet, the force on m is mg, so
$$ g = [[GM|r²]] $$
>! Astronauts on the ISS still feel about 90% of surface gravity. They float because they are **falling around** the Earth along with their station.`),
      EX('g on the ISS', 'Find g at 400 km altitude. (M_E = 5.97×10²⁴ kg, R_E = 6370 km)', ['r = 6370 + 400 = 6770 km = 6.77×10⁶ m', 'g = GM/r² = (6.674×10⁻¹¹)(5.97×10²⁴)/(6.77×10⁶)²', 'g = **8.69 m/s²**, about 89% of surface g']),
      G('p.grav.ratio'),
      G('p.grav.F'),
      TF('Astronauts aboard the ISS are weightless because there is no gravity at that altitude.', false, 'g is still about 8.7 m/s² there. They\'re in continuous free fall.'),
      G('p.grav.g'),
      G('p.grav.g'),
    ]),
    L('p12l2', 'Gravitational PE & Escape Speed', {
      goal: 'Use U = −GMm/r for large distances and find escape speed.',
      key: 'Far from the surface, use $U = −GMm/r$, which is zero at infinity and negative everywhere else. mgh only works near the surface. Lifting from r₁ to r₂ takes $ΔU = GMm(1/r₁ − 1/r₂)$. Escape speed, the minimum launch speed to reach infinity: $½mv² − GMm/R = 0$, so $v_{esc} = √{2GM/R}$. That\'s 11.2 km/s for Earth, and it doesn\'t depend on the rocket\'s mass.',
      formulas: ['U = −[[GMm|r]]', 'v_{esc} = √{[[2GM|R]]}', 'Earth: v_esc ≈ 11.2 km/s'],
    }, [
      T('Energy in a deep gravity well', `
$$ U = −[[GMm|r]] :: zero at r = ∞ $$
The minus sign means you're **bound**: you have to add energy to get to U = 0 (infinitely far away).
**Escape speed:** launch with just enough kinetic energy to reach infinity with nothing left over:
$$ ½mv² − [[GMm|R]] = 0   ⇒   v_{esc} = √{[[2GM|R]]} $$
>! mgh is the near-surface approximation of this. For altitudes comparable to Earth's radius, use −GMm/r.`),
      EX('Escape from Earth', 'Find Earth\'s escape speed. (M = 5.97×10²⁴ kg, R = 6.37×10⁶ m)', ['v = √(2GM/R) = √(2 × 6.674×10⁻¹¹ × 5.97×10²⁴ / 6.37×10⁶)', 'v = **1.12×10⁴ m/s ≈ 11.2 km/s** (about 40,000 km/h)']),
      MC('Escape speed from a planet depends on…', ['the planet\'s mass and radius only', 'the rocket\'s mass', 'the launch direction', 'the rocket\'s fuel type'], 'v = √(2GM/R). The rocket\'s mass cancels.'),
      G('p.escape'),
      TF('Gravitational potential energy U = −GMm/r is always negative for finite r.', true, 'With U = 0 at infinity, every bound position has U < 0.'),
      G('p.gravU'),
      G('p.escape'),
    ]),
    L('p12l3', 'Orbits & Kepler\'s Laws', {
      goal: 'Find orbital speed and period, and use Kepler\'s third law.',
      key: 'For a circular orbit, gravity supplies the centripetal force: $GMm/r² = mv²/r$, so $v = √{GM/r}$ and $T = 2πr^{3/2}/√{GM}$. Higher orbits are slower and have longer periods. The satellite\'s mass cancels. Kepler: (1) orbits are ellipses with the Sun at one focus, (2) equal areas in equal times, so planets move faster when closer, (3) $T² ∝ r³$. Geosynchronous orbit: T = 24 h, about 36,000 km up.',
      formulas: ['v = √{[[GM|r]]}', 'T = [[2πr^{3/2}|√{GM}]]', 'T² ∝ r³'],
    }, [
      T('Falling around the planet', `
In a circular orbit, gravity is the centripetal force:
$$ [[GMm|r²]] = [[mv²|r]]   ⇒   v = √{[[GM|r]]} $$
$$ T = [[2πr|v]] = [[2π r^{3/2}|√{GM}]] $$
**Kepler's laws:**
1. Orbits are ellipses with the Sun at a focus
2. A line from the Sun sweeps equal areas in equal times, so planets move faster near the Sun
3. $T² ∝ r³$
>* Higher orbit means **slower** speed and **longer** period. The Moon (384,000 km away) takes 27 days, while the ISS (6,770 km from Earth's center) takes 92 minutes.`, { fig: D.orbit() }),
      EX('ISS orbit', 'Find the speed and period of the ISS (r = 6.77×10⁶ m).', ['v = √(GM/r) = √(3.98×10¹⁴/6.77×10⁶) = 7.67 km/s', 'T = 2πr/v = 5546 s ≈ **92 minutes**']),
      G('p.orbit'),
      MC('A satellite moves to a higher circular orbit. Its orbital speed…', ['decreases', 'increases', 'stays the same', 'depends on its mass'], 'v = √(GM/r), so larger r means smaller v.'),
      G('p.kepler'),
      TF('According to Kepler\'s second law, a planet moves fastest when it is closest to the Sun.', true, 'Equal areas in equal times requires faster motion at smaller r.'),
      G('p.orbit'),
    ]),
