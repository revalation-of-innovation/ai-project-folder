<script>
/* js/engine.js */
/* Comet Quest — the session engine: builds lessons, bosses, reviews and exams,
   grades answers, and runs the adaptive flow (re-queue, Rescue, Fast track). */
(function () {
  const CQ = window.CQ;
  let uid = 0;

  const E = (CQ.engine = {});

  /* ---------- turning content cards into playable items ---------- */
  E.instantiate = function (card, R, extra) {
    let c;
    if (card.t === 'gen') {
      const fn = CQ.gens[card.g];
      if (!fn) throw new Error('Missing generator ' + card.g);
      const g = fn(R);
      c = Object.assign({}, g, { lvl: card.lvl || g.lvl || 3, key: card.key, lesson: card.lesson, src: card, gen: true });
      if (card.exam) c.exam = true;
    } else {
      c = Object.assign({}, card, { src: card });
    }
    if (c.t === 'mc') {
      const opts = c.opts.map((o, i) => (Array.isArray(o) ? { text: o[0], fb: o[1], ok: i === 0 } : { text: o, ok: i === 0 }));
      c.choices = c.fixed ? opts : R.shuffle(opts);
    } else if (c.t === 'multi') {
      c.choices = R.shuffle(c.opts.map((o) => ({ text: o[0], ok: !!o[1] })));
    } else if (c.t === 'tf') {
      c.choices = [{ text: 'True', ok: c.a === true }, { text: 'False', ok: c.a === false }];
    } else if (c.t === 'fill') {
      c.tiles = R.shuffle(c.a.concat(c.bank || []).map((w, i) => ({ w, id: i })));
    } else if (c.t === 'match') {
      c.left = R.shuffle(c.pairs.map((p, i) => ({ text: p[0], i })));
      c.right = R.shuffle(c.pairs.map((p, i) => ({ text: p[1], i })));
    } else if (c.t === 'order') {
      let pool = R.shuffle(c.items.map((t, i) => ({ text: t, i })));
      if (pool.every((p, i) => p.i === i) && pool.length > 1) pool = pool.slice(1).concat(pool[0]);
      c.pool = pool;
    }
    c.uid = ++uid;
    return Object.assign(c, extra || {});
  };

  /* ---------- grading ---------- */
  E.correctText = function (c) {
    switch (c.t) {
      case 'mc': case 'tf': return c.choices.find((x) => x.ok).text;
      case 'multi': return c.choices.filter((x) => x.ok).map((x) => x.text).join(' · ');
      case 'num': return (c.show || CQ.fmt(c.a, c.sig || 3)) + (c.unit ? ' ' + c.unit : '');
      case 'txt': return c.a[0];
      case 'fill': return c.a.join(' · ');
      case 'match': return '';
      case 'order': return c.items.map((t, i) => i + 1 + '. ' + t).join('<br>');
    }
    return '';
  };

  E.grade = function (c, resp) {
    switch (c.t) {
      case 'mc': case 'tf': return !!(c.choices[resp] && c.choices[resp].ok);
      case 'multi': return c.choices.every((x, i) => !!x.ok === resp.has(i));
      case 'num': return CQ.numMatch(CQ.parseNum(resp), c.a, c.tol != null ? c.tol : 0.02, c.abs);
      case 'txt': {
        const r = CQ.normText(resp, c.cs);
        return c.a.some((x) => CQ.normText(x, c.cs) === r);
      }
      case 'fill': return c.a.every((w, i) => CQ.normText(resp[i], true) === CQ.normText(w, true));
      case 'match': return resp <= 1; // resp = number of mismatched taps
      case 'order': return resp.every((v, i) => c.items[v] === c.items[i]);
    }
    return false;
  };

  /* ---------- picking questions ---------- */
  const exercisesOf = (lesson) => lesson.cards.filter(CQ.isExercise);
  // Round-robin across groups so every lesson/unit is represented.
  function balanced(R, groups, n) {
    const gs = R.shuffle(groups.map((g) => R.shuffle(g)).filter((g) => g.length));
    const out = [];
    let k = 0;
    while (out.length < n && gs.some((g) => g.length)) {
      const g = gs[k % gs.length];
      if (g.length) out.push(g.shift());
      k++;
    }
    return out;
  }
  const hard = (cards, min) => {
    const h = cards.filter((c) => (c.lvl || 1) >= 2);
    return h.length >= (min || 4) ? h : cards;
  };

  /* ---------- building sessions ---------- */
  // modes: learn | levelup | legend | boss | jump | review | weak | exam
  E.build = function (mode, p) {
    const R = CQ.rng();
    const st = CQ.store.state;
    const S = {
      mode, p, R, items: [], i: 0,
      combo: 0, maxCombo: 0, xp: 0, correct: 0, answered: 0, ftRight: 0, ftTotal: 0,
      wrongStreak: 0, hearts: null, mistakes: [], retries: {}, start: Date.now(), hints: 0,
      rescued: false, fast: 0, answers: [], course: null, lesson: null, unit: null, exam: null,
      noFeedback: mode === 'exam', allowHints: mode !== 'legend' && mode !== 'exam',
    };
    const inst = (card, extra) => E.instantiate(card, R, extra);

    if (mode === 'learn') {
      const l = (S.lesson = CQ.idx.lessons[p.lesson]);
      S.course = l.course; S.unit = CQ.idx.units[l.unit];
      S.items = l.cards.map((c) => inst(c));
      // spiral review: 1-2 due questions from earlier lessons in the same course
      const due = CQ.store.dueKeys(l.course).filter((k) => !k.startsWith(l.id + ':'));
      R.sample(due.slice(0, 8), Math.min(2, due.length)).forEach((k) => S.items.push(inst(CQ.idx.cards[k], { review: true })));
    } else if (mode === 'levelup' || mode === 'legend') {
      const l = (S.lesson = CQ.idx.lessons[p.lesson]);
      S.course = l.course; S.unit = CQ.idx.units[l.unit];
      let cards = hard(exercisesOf(l), 5);
      cards = cards.concat(cards.filter((c) => c.t === 'gen'));
      S.items = R.shuffle(cards).slice(0, mode === 'legend' ? 12 : 14).map((c) => inst(c));
      if (mode === 'legend') S.hearts = 3;
    } else if (mode === 'boss' || mode === 'jump') {
      const u = (S.unit = CQ.idx.units[p.unit]);
      S.course = u.course;
      const units = mode === 'boss' ? [u] : CQ.courses[u.course].units.slice(0, u.n - 1);
      const groups = [];
      units.forEach((uu) => uu.lessons.forEach((l) => groups.push(hard(exercisesOf(l), 3))));
      S.items = balanced(R, groups, 12).map((c) => inst(c));
      S.hearts = 3;
    } else if (mode === 'review' || mode === 'weak') {
      S.course = p.course || null;
      let keys = mode === 'review' ? CQ.store.dueKeys(p.course) : CQ.store.weakKeys(p.course);
      keys = keys.slice(0, mode === 'review' ? 15 : 12);
      if (mode === 'review' && keys.length < 8) {
        const extra = CQ.store.weakKeys(p.course).filter((k) => !keys.includes(k));
        keys = keys.concat(extra.slice(0, 8 - keys.length));
      }
      if (keys.length < 6) {
        const seen = Object.keys(st.srs).filter((k) => CQ.idx.cards[k] && !keys.includes(k) && (!p.course || CQ.idx.cards[k].lesson && CQ.idx.lessons[CQ.idx.cards[k].lesson].course === p.course));
        keys = keys.concat(R.sample(seen, 8 - keys.length));
      }
      S.items = R.shuffle(keys).map((k) => inst(CQ.idx.cards[k]));
    } else if (mode === 'exam') {
      const c = CQ.courses[p.course];
      const ex = (S.exam = c.exams.find((x) => x.id === p.exam));
      S.course = c.id;
      const groups = [];
      ex.units.forEach((uid) => {
        const u = CQ.idx.units[uid];
        if (u) u.lessons.forEach((l) => groups.push(hard(exercisesOf(l), 3)));
      });
      S.items = balanced(R, groups, ex.n || 20).map((c2) => inst(c2));
      S.timeLimit = (ex.mins || Math.round(S.items.length * 2.25)) * 60000;
    }
    S.total = S.items.filter(CQ.isExercise).length;
    return S;
  };

  E.current = (S) => S.items[S.i];
  E.progress = (S, plus = 0) => {
    const ex = S.items.filter(CQ.isExercise);
    const done = S.items.slice(0, S.i).filter(CQ.isExercise).length + plus;
    return ex.length ? done / ex.length : S.i / Math.max(1, S.items.length);
  };

  /* ---------- answering ---------- */
  const REQUEUE = { learn: 1, levelup: 1, review: 1, weak: 1 };
  E.answer = function (S, ok, opts = {}) {
    const st = CQ.store.state;
    const item = E.current(S);
    const first = !item.retry && !item.stepping;
    const out = { ok, gain: 0, mult: 1, retry: false, rescue: false };
    S.answered++;
    if (first) { S.ftTotal++; if (ok) S.ftRight++; }
    S.answers.push({ item, ok, resp: opts.respText });
    st.stats.answered++;
    if (ok) {
      S.correct++; S.combo++; S.wrongStreak = 0;
      S.maxCombo = Math.max(S.maxCombo, S.combo);
      st.stats.correct++;
      st.daily.correct++;
      st.daily.combo = Math.max(st.daily.combo, S.combo);
      st.stats.maxCombo = Math.max(st.stats.maxCombo, S.combo);
      if (!S.noFeedback) {
        let base = (item.lvl || 1) >= 3 ? 2 : 1;
        if (opts.hint) base = 1;
        out.mult = S.combo >= 10 ? 3 : S.combo >= 5 ? 2 : 1;
        out.gain = base * out.mult;
        S.xp += out.gain;
      }
    } else {
      S.combo = 0; S.wrongStreak++;
      if (first) S.mistakes.push(item);
      if (S.hearts != null) S.hearts = Math.max(0, S.hearts - 1);
      const sk = item.key || item.uid;
      if (REQUEUE[S.mode] && (S.retries[sk] || 0) < 2) {
        S.retries[sk] = (S.retries[sk] || 0) + 1;
        S.items.push(E.instantiate(item.src, S.R, { retry: true, review: item.review }));
        out.retry = true;
      }
      // Rescue: two misses in a row in a lesson → re-teach the key idea + an easier question
      if ((S.mode === 'learn' || S.mode === 'levelup') && S.wrongStreak >= 2 && S.lesson && S.lesson.key) {
        const easy = S.lesson.cards.filter((c) => CQ.isExercise(c) && (c.lvl || 1) <= 2 && c.key !== item.key);
        const ins = [{ t: 'rescue', title: 'Quick reset', md: S.lesson.key, lesson: S.lesson.id, uid: 'r' + S.i }];
        if (easy.length) ins.push(E.instantiate(S.R.pick(easy), S.R, { stepping: true }));
        S.items.splice(S.i + 1, 0, ...ins);
        S.wrongStreak = 0;
        S.rescued = true;
        out.rescue = true;
      }
    }
    if (opts.hint) { S.hints++; st.stats.hints++; }
    if (first && item.key) CQ.store.srsRecord(item.key, ok && !opts.hint);
    return out;
  };

  // Move to the next screen. Fast track skips warm-ups while you're on a streak.
  E.advance = function (S) {
    S.i++;
    S.fastNow = 0;
    if (S.mode === 'learn') {
      while (S.i < S.items.length) {
        const n = S.items[S.i];
        const left = S.items.slice(S.i + 1).filter((x) => CQ.isExercise(x)).length;
        if (S.combo >= 3 && CQ.isExercise(n) && (n.lvl || 1) === 1 && !n.retry && !n.review && !n.stepping && left >= 3) {
          S.i++; S.fast++; S.fastNow++;
        } else break;
      }
    }
    return E.isOver(S);
  };

  E.isOver = (S) => S.i >= S.items.length || S.hearts === 0 || (S.timeLimit && Date.now() - S.start > S.timeLimit);

  /* ---------- finishing: rewards & bookkeeping ---------- */
  E.finish = function (S) {
    const store = CQ.store;
    const st = store.state;
    const lvBefore = store.level().n;
    const acc = S.ftTotal ? S.ftRight / S.ftTotal : 1;
    const perfect = S.ftTotal > 0 && S.mistakes.length === 0;
    const passed = S.hearts == null ? true : S.hearts > 0;
    const R = { mode: S.mode, acc, perfect, passed, ms: Date.now() - S.start, xp: S.xp, gems: 0, combo: S.maxCombo, crown: null, items: S.answers };
    store.rollDay();

    const lessonRec = (id) => (st.lessons[id] = st.lessons[id] || { c: 0, best: 0, n: 0 });
    if (S.mode === 'learn' || S.mode === 'levelup' || S.mode === 'legend') {
      const rec = lessonRec(S.lesson.id);
      const want = S.mode === 'learn' ? 1 : S.mode === 'levelup' ? 2 : 3;
      const ok = S.mode !== 'legend' || (passed && acc >= 0.9);
      R.passed = ok;
      if (ok) {
        if (rec.c < want) { R.crown = want; rec.c = Math.max(rec.c, want); }
        if (S.mode === 'legend') st.stats.legends++;
        R.xp += S.mode === 'legend' ? 20 : 10;
        R.gems += S.mode === 'legend' ? 20 : 5;
        if (perfect) { R.xp += 5; R.gems += 5; st.stats.perfect++; st.daily.perfect++; }
        st.stats.lessons++;
        st.daily.lessons++;
        if (S.rescued) st.stats.rescues++;
      }
      rec.n++;
      rec.best = Math.max(rec.best, acc);
    } else if (S.mode === 'boss' || S.mode === 'jump') {
      if (passed) {
        const u = S.unit;
        if (S.mode === 'boss') {
          st.units[u.id] = Object.assign(st.units[u.id] || {}, { boss: true });
          st.stats.bosses++;
        } else {
          CQ.courses[u.course].units.slice(0, u.n - 1).forEach((uu) => {
            st.units[uu.id] = Object.assign(st.units[uu.id] || {}, { jumped: true });
            uu.lessons.forEach((l) => { const r = lessonRec(l.id); r.c = Math.max(r.c, 1); });
          });
          st.units[u.id] = Object.assign(st.units[u.id] || {}, { jumped: true });
          st.stats.jumps++;
        }
        st.daily.bosses++;
        R.xp += 25; R.gems += 20;
      }
    } else if (S.mode === 'review' || S.mode === 'weak') {
      R.xp += 5; R.gems += 5;
      st.stats.reviews++;
      st.daily.reviews++;
    } else if (S.mode === 'exam') {
      const score = Math.round((S.correct / Math.max(1, S.items.length)) * 100);
      R.score = score;
      R.total = S.items.length;
      R.right = S.correct;
      R.unanswered = S.items.length - S.answers.length;
      (st.exams[S.exam.id] = st.exams[S.exam.id] || []).push({ d: CQ.dayKey(), s: score });
      st.stats.exams++;
      R.xp = S.correct + 20; R.gems = 10;
    }
    if (S.course && !st.daily.courses.includes(S.course)) st.daily.courses.push(S.course);
    st.stats.ms += R.ms;
    store.addXP(R.xp);
    st.gems += R.gems;
    R.streakGrew = R.xp > 0 ? store.bumpStreak() : false;
    R.streak = st.streak.n;
    R.levelUp = store.level().n > lvBefore ? store.level() : null;
    R.ach = store.checkAch();
    store.save(true);
    return R;
  };
})();

</script>
<script>
/* js/ui.js */
/* Comet Quest — app shell: skill path, review hub, cheat sheet, profile, modals. */
(function () {
  const CQ = window.CQ;
  const st = () => CQ.store.state;
  const store = () => CQ.store;
  const $ = (s, r = document) => r.querySelector(s);
  const ic = (n, c) => CQ.ic(n, c);
  const esc = CQ.esc;
  const UI = (CQ.ui = { tab: 'learn', sheetCourse: null, reviewCourse: null, peek: false, sheetQuery: '' });

  /* ---------- mascot ---------- */
  let novaId = 0;
  UI.nova = function (mood = 'happy', size = 96, skinId) {
    const skin = store().SKINS.find((s) => s.id === (skinId || st().skin)) || store().SKINS[0];
    const id = 'nv' + ++novaId;
    const ink = '#1E1B3A';
    const mouths = {
      happy: '<path d="M64 64 Q72 72.5 80 64" fill="none" stroke="' + ink + '" stroke-width="3.2" stroke-linecap="round"/>',
      cheer: '<path d="M62.5 62.5 Q72 78 81.5 62.5 Z" fill="' + ink + '"/><path d="M67 69 Q72 73.5 77 69 Q72 66.5 67 69Z" fill="#FF6B8B"/>',
      wow: '<ellipse cx="72" cy="67" rx="4.2" ry="5.2" fill="' + ink + '"/>',
      sad: '<path d="M64.5 69.5 Q72 62.5 79.5 69.5" fill="none" stroke="' + ink + '" stroke-width="3.2" stroke-linecap="round"/>',
      think: '<path d="M65 67.5 Q72 65 79 66.5" fill="none" stroke="' + ink + '" stroke-width="3.2" stroke-linecap="round"/><path d="M76 42 Q82 38.5 87 42" fill="none" stroke="' + ink + '" stroke-width="2.6" stroke-linecap="round"/>',
    };
    const sparkle = mood === 'cheer' ? '<path d="M104 18l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" fill="' + skin.b + '"/><path d="M98 86l1.4 4 4 1.4-4 1.4-1.4 4-1.4-4-4-1.4 4-1.4z" fill="' + skin.a + '"/>' : '';
    return (
      '<svg class="nova nova-' + mood + '" width="' + size + '" height="' + size * 0.84 + '" viewBox="0 0 120 100" aria-hidden="true">' +
      '<defs><radialGradient id="' + id + 'b" cx="42%" cy="38%" r="70%"><stop offset="0" stop-color="' + skin.b + '"/><stop offset="1" stop-color="' + skin.a + '"/></radialGradient>' +
      '<linearGradient id="' + id + 't" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="' + skin.a + '"/><stop offset="1" stop-color="' + skin.b + '" stop-opacity="0"/></linearGradient></defs>' +
      '<g class="nova-tail"><path d="M50 42 Q22 30 3 8 Q28 42 46 68 Z" fill="url(#' + id + 't)"/>' +
      '<path d="M55 33 Q40 18 30 2 Q42 26 60 31 Z" fill="url(#' + id + 't)" opacity=".8"/>' +
      '<path d="M47 66 Q26 74 9 90 Q30 68 52 74 Z" fill="url(#' + id + 't)" opacity=".7"/></g>' +
      '<circle cx="72" cy="56" r="30" fill="url(#' + id + 'b)"/>' +
      '<circle cx="72" cy="56" r="30" fill="none" stroke="' + skin.a + '" stroke-opacity=".5" stroke-width="2"/>' +
      '<ellipse cx="63" cy="52" rx="6" ry="7" fill="#fff"/><ellipse cx="81" cy="52" rx="6" ry="7" fill="#fff"/>' +
      '<circle class="nova-eye" cx="64.6" cy="53" r="3.4" fill="' + ink + '"/><circle class="nova-eye" cx="82.6" cy="53" r="3.4" fill="' + ink + '"/>' +
      '<circle cx="65.8" cy="51.6" r="1.1" fill="#fff"/><circle cx="83.8" cy="51.6" r="1.1" fill="#fff"/>' +
      '<ellipse cx="57" cy="64" rx="4" ry="2.6" fill="#FF6B8B" opacity=".45"/><ellipse cx="87" cy="64" rx="4" ry="2.6" fill="#FF6B8B" opacity=".45"/>' +
      (mouths[mood] || mouths.happy) + sparkle + '</svg>'
    );
  };

  /* ---------- toasts, modals, confetti ---------- */
  UI.toast = function (html, kind = '') {
    const t = document.createElement('div');
    t.className = 'toast ' + kind;
    t.innerHTML = html;
    $('#toasts').appendChild(t);
    setTimeout(() => t.classList.add('out'), 2600);
    setTimeout(() => t.remove(), 3100);
  };

  UI.modal = function (html, opts = {}) {
    const o = $('#overlay');
    o.innerHTML = '<div class="modal ' + (opts.cls || '') + '" role="dialog" aria-modal="true">' + (opts.noClose ? '' : '<button class="modal-x" data-act="close-modal" aria-label="Close">' + ic('x') + '</button>') + html + '</div>';
    o.hidden = false;
    o.onclick = (e) => { if (e.target === o && !opts.noClose) UI.closeModal(); };
    requestAnimationFrame(() => o.classList.add('show'));
    const f = o.querySelector('[autofocus]') || o.querySelector('.btn');
    if (f) setTimeout(() => f.focus(), 50);
  };
  UI.closeModal = function () {
    const o = $('#overlay');
    o.classList.remove('show');
    o.hidden = true;
    o.innerHTML = '';
  };

  UI.confetti = function (n = 140) {
    if (!st().settings.motion || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const cv = $('#confetti');
    const ctx = cv.getContext('2d');
    const W = (cv.width = innerWidth * devicePixelRatio);
    const H = (cv.height = innerHeight * devicePixelRatio);
    const cols = ['#FF6B3D', '#FFC531', '#3FC1FF', '#2BD46B', '#B14CFF', '#FF6B8B'];
    const ps = Array.from({ length: n }, () => ({
      x: W / 2 + (Math.random() - 0.5) * W * 0.3, y: H * 0.35,
      vx: (Math.random() - 0.5) * 26 * devicePixelRatio, vy: (-Math.random() * 22 - 6) * devicePixelRatio,
      s: (5 + Math.random() * 7) * devicePixelRatio, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
      c: cols[Math.floor(Math.random() * cols.length)],
    }));
    let f = 0;
    cv.hidden = false;
    (function tick() {
      ctx.clearRect(0, 0, W, H);
      ps.forEach((p) => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.9 * devicePixelRatio; p.vx *= 0.985; p.r += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
        ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
      });
      if (++f < 120) requestAnimationFrame(tick); else { ctx.clearRect(0, 0, W, H); cv.hidden = true; }
    })();
  };

  /* ---------- shared bits ---------- */
  const course = () => CQ.courses[st().course] || CQ.courses[CQ.courseOrder[0]];
  const courseIcon = (c) => ic(c.icon || 'star');
  UI.ring = function (pct, size = 56, stroke = 7, label) {
    const r = (size - stroke) / 2, C = 2 * Math.PI * r;
    return '<svg class="ring" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '"><circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" class="ring-bg" stroke-width="' + stroke + '"/><circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" class="ring-fg" stroke-width="' + stroke + '" stroke-dasharray="' + C + '" stroke-dashoffset="' + C * (1 - Math.min(1, pct)) + '" transform="rotate(-90 ' + size / 2 + ' ' + size / 2 + ')"/>' + (label != null ? '<text x="50%" y="52%" dominant-baseline="middle" text-anchor="middle">' + label + '</text>' : '') + '</svg>';
  };
  UI.statPills = function () {
    const s = st();
    const lv = store().level();
    const today = s.streak.last === CQ.dayKey();
    return '<div class="pills">' +
      '<button class="pill streak ' + (today ? 'lit' : '') + '" data-act="streak-info" aria-label="Streak">' + ic('flame') + '<span>' + s.streak.n + '</span></button>' +
      '<button class="pill gems" data-act="tab" data-tab="profile" data-scroll="shop" aria-label="Gems">' + ic('gem') + '<span>' + s.gems + '</span></button>' +
      '<button class="pill lvl" data-act="tab" data-tab="profile" aria-label="Level">' + ic('star') + '<span>' + lv.n + '</span></button></div>';
  };
  UI.courseSwitch = function () {
    const c = course();
    return '<button class="course-switch" data-act="course-menu" style="--hue:' + c.color + ';--hue-dk:' + c.dark + '">' +
      '<span class="cs-ic">' + courseIcon(c) + '</span><span class="cs-txt"><b>' + c.code + '</b><small>' + c.name + '</small></span>' + ic('back', 'rot') + '</button>';
  };

  /* ---------- LEARN: skill path ---------- */
  const OFFS = [0, -54, -82, -54, 0, 54, 82, 54];
  UI.renderLearn = function () {
    const c = course();
    const nxt = store().nextLesson(c.id);
    let h = '<header class="topbar">' + UI.courseSwitch() + UI.statPills() + '</header>';
    h += '<section class="today-strip">' + UI.goalCard(true) + '</section>';
    h += '<section class="course-head" style="--hue:' + c.color + ';--hue-dk:' + c.dark + '"><div><div class="eyebrow">' + esc(c.code) + ' · ' + esc(c.school || 'UT Dallas') + '</div><h1>' + esc(c.name) + '</h1><p>' + esc(c.book) + '</p></div>' +
      '<div class="ch-prog">' + UI.ring(store().courseProgress(c.id), 64, 8, Math.round(store().courseProgress(c.id) * 100) + '%') + '</div></section>';
    c.units.forEach((u) => {
      const open = store().unitOpen(u);
      const beaten = store().unitBeaten(u);
      h += '<section class="unit ' + (open ? '' : 'locked') + '" id="u-' + u.id + '" style="--hue:' + c.color + ';--hue-dk:' + c.dark + '">';
      h += '<div class="unit-banner"><div class="ub-txt"><div class="eyebrow">Unit ' + u.n + (u.ch ? ' · ' + esc(u.ch) : '') + '</div><h2>' + esc(u.title) + '</h2><p>' + esc(u.sub || '') + '</p></div>' +
        '<div class="ub-btns"><button class="btn-ghost sm" data-act="guide" data-unit="' + u.id + '">' + ic('book') + '<span>Guidebook</span></button>' +
        (!open ? '<button class="btn-ghost sm" data-act="jump" data-unit="' + u.id + '">' + ic('bolt') + '<span>Jump here</span></button>' : '') + '</div></div>';
      h += '<div class="path">';
      let k = 0;
      const node = (inner) => { const x = OFFS[k % OFFS.length]; k++; return '<div class="node-wrap" style="--x:' + x + 'px">' + inner + '</div>'; };
      u.lessons.forEach((l, i) => {
        const cr = store().crowns(l.id);
        const lopen = store().lessonOpen(l);
        const cur = nxt && nxt.lesson === l;
        const x = OFFS[k % OFFS.length];
        const cls = !lopen ? 'locked' : cr >= 3 ? 'legend' : cr >= 1 ? 'done' : 'open';
        let inner = '<button class="node ' + cls + (cur ? ' current' : '') + '" data-act="node" data-lesson="' + l.id + '" aria-label="' + esc(l.title) + '">' +
          (cr >= 1 ? ic(cr >= 3 ? 'crown' : 'check') : !lopen ? ic('lock') : ic('star')) +
          (cr >= 1 ? '<span class="crowns">' + '<i></i>'.repeat(cr) + '<s></s>'.repeat(3 - cr) + '</span>' : '') + '</button>' +
          '<span class="node-label">' + esc(l.title) + '</span>';
        if (cur) inner = '<div class="start-bubble">' + (store().crowns(l.id) ? 'NEXT' : 'START') + '</div>' + inner + '<div class="path-nova ' + (x > 0 ? 'l' : 'r') + '">' + UI.nova('happy', 64) + '</div>';
        h += cur ? node(inner).replace('class="node-wrap"', 'class="node-wrap has-bubble"') : node(inner);
        if (i + 1 === store().chestAfter(u)) {
          const got = st().units[u.id] && st().units[u.id].chest;
          const can = store().chestOpen(u);
          h += node('<button class="node chest ' + (got ? 'claimed' : can ? 'ready' : 'locked') + '" data-act="chest" data-unit="' + u.id + '" aria-label="Treasure chest">' + ic('chest') + '</button>');
        }
      });
      const bopen = store().bossOpen(u);
      const bcur = nxt && nxt.boss === u;
      h += (bcur ? (s) => s.replace('class="node-wrap"', 'class="node-wrap has-bubble"') : (s) => s)(node((bcur ? '<div class="start-bubble boss">BOSS</div>' : '') + '<button class="node boss ' + (beaten ? 'beaten' : bopen ? 'open' : 'locked') + (bcur ? ' current' : '') + '" data-act="boss" data-unit="' + u.id + '" aria-label="Unit boss">' + ic(beaten ? 'trophy' : bopen ? 'skull' : 'lock') + '</button><span class="node-label">' + (beaten ? 'Boss beaten' : 'Unit boss') + '</span>'));
      h += '</div></section>';
    });
    h += '<div class="path-end">' + UI.nova('cheer', 88) + '<p>Finish every unit and the final exam simulator is all yours.</p></div>';
    $('#main').innerHTML = h;
    UI.renderSide();
    if (!UI._scrolled) {
      UI._scrolled = true;
      requestAnimationFrame(() => { const cur = $('.node.current'); if (cur) cur.scrollIntoView({ block: 'center' }); });
    }
  };

  UI.goalCard = function (compact) {
    const s = st();
    store().rollDay();
    const g = s.settings.goal;
    const pct = Math.min(1, s.daily.xp / g);
    const qs = store().quests();
    const ready = qs.filter((q) => q.done && !q.claimed).length;
    return '<div class="goal-card ' + (compact ? 'compact' : '') + '">' + UI.ring(pct, compact ? 46 : 64, compact ? 6 : 8, compact ? '' : Math.round(pct * 100) + '%') +
      '<div class="gc-txt"><b>Daily goal</b><span>' + s.daily.xp + ' / ' + g + ' XP</span></div>' +
      (compact ? '<button class="btn-ghost sm" data-act="quests">' + ic('target') + '<span>Quests' + (ready ? ' · ' + ready : '') + '</span></button>' : '') + '</div>';
  };

  UI.questList = function () {
    return store().quests().map((q) =>
      '<div class="quest ' + (q.claimed ? 'claimed' : q.done ? 'done' : '') + '"><div class="q-txt"><b>' + esc(q.label) + '</b>' +
      '<div class="bar"><i style="width:' + (q.val / q.target) * 100 + '%"></i><span>' + q.val + ' / ' + q.target + '</span></div></div>' +
      (q.claimed ? '<span class="q-claimed">' + ic('check') + '</span>' : q.done ? '<button class="btn sm gold" data-act="claim" data-q="' + q.id + '">' + ic('gem') + ' ' + q.gems + '</button>' : '<span class="q-gem">' + ic('gem') + q.gems + '</span>') + '</div>').join('');
  };

  UI.upNext = function () {
    return CQ.courseOrder.map((cid) => {
      const c = CQ.courses[cid];
      const n = store().nextLesson(cid);
      const label = n ? (n.lesson ? n.lesson.title : 'Unit ' + n.boss.n + ' boss') : 'All caught up';
      return '<button class="upnext" style="--hue:' + c.color + ';--hue-dk:' + c.dark + '" data-act="upnext" data-course="' + cid + '"' + (n ? '' : ' disabled') + '><span class="un-ic">' + courseIcon(c) + '</span><span class="un-txt"><small>' + c.code + '</small><b>' + esc(label) + '</b></span>' + ic('play') + '</button>';
    }).join('');
  };

  UI.renderSide = function () {
    const side = $('#side');
    if (!side) return;
    const due = store().dueKeys().length;
    const c = course();
    side.innerHTML = UI.statPills() +
      '<div class="panel">' + UI.goalCard(false) + '</div>' +
      '<div class="panel"><h3>Daily quests</h3>' + UI.questList() + '</div>' +
      '<div class="panel"><h3>Up next</h3>' + UI.upNext() + (due ? '<button class="btn wide blue" data-act="start-review">' + ic('review') + ' Review ' + due + ' due</button>' : '') + '</div>' +
      '<div class="panel"><h3>Exam readiness · ' + c.code + '</h3>' + c.exams.map((e) => { const r = store().readiness(e); return '<div class="ready-row"><span>' + esc(e.name) + '</span><div class="bar ' + (r >= 85 ? 'good' : r >= 60 ? 'mid' : '') + '"><i style="width:' + r + '%"></i></div><b>' + r + '%</b></div>'; }).join('') + '<button class="btn-ghost sm wide" data-act="tab" data-tab="review">Open exam simulators</button></div>';
  };

  /* ---------- node actions ---------- */
  UI.openLesson = function (lid) {
    const l = CQ.idx.lessons[lid];
    const u = CQ.idx.units[l.unit];
    const c = CQ.courses[l.course];
    const cr = store().crowns(lid);
    if (!store().lessonOpen(l)) {
      UI.modal('<div class="sheet-head" style="--hue:' + c.color + '"><div class="eyebrow">Unit ' + u.n + ' · Lesson ' + l.n + '</div><h2>' + esc(l.title) + '</h2></div><p class="muted">Finish the lesson before this one to unlock it, or use <b>Jump here</b> on a later unit to test out.</p><button class="btn wide" data-act="close-modal">Got it</button>');
      return;
    }
    const exN = l.cards.filter(CQ.isExercise).length;
    const crownRow = [1, 2, 3].map((n) => '<span class="crown-step ' + (cr >= n ? 'on' : '') + '">' + ic('crown') + '<small>' + ['Learn', 'Level up', 'Legendary'][n - 1] + '</small></span>').join('');
    let btns = '';
    if (cr < 1) btns += '<button class="btn wide" style="--b:' + c.color + ';--bd:' + c.dark + '" data-act="go" data-mode="learn" data-lesson="' + lid + '">Start lesson · +' + (10 + exN * 2) + ' XP</button>';
    else {
      btns += '<button class="btn wide ' + (cr >= 2 ? 'ghost' : '') + '" style="--b:' + c.color + ';--bd:' + c.dark + '" data-act="go" data-mode="levelup" data-lesson="' + lid + '">' + (cr >= 2 ? 'Practice again' : 'Level up · crown 2') + '</button>';
      btns += '<button class="btn wide gold ' + (cr >= 2 ? '' : 'ghost') + '" data-act="go" data-mode="legend" data-lesson="' + lid + '">' + ic('crown') + ' Legendary · 3 hearts, no hints</button>';
      btns += '<button class="btn-ghost wide" data-act="go" data-mode="learn" data-lesson="' + lid + '">Replay the full lesson</button>';
    }
    UI.modal('<div class="sheet-head" style="--hue:' + c.color + '"><div class="eyebrow">Unit ' + u.n + ' · Lesson ' + l.n + ' of ' + u.lessons.length + '</div><h2>' + esc(l.title) + '</h2></div>' +
      '<p class="goal">' + ic('target') + '<span>' + CQ.inl(l.goal || '') + '</span></p>' +
      '<div class="crown-steps">' + crownRow + '</div>' +
      (cr >= 1 && l.key ? '<details class="keyidea"><summary>Key idea</summary><div>' + CQ.md(l.key) + '</div></details>' : '') +
      '<div class="btn-stack">' + btns + '</div>', { cls: 'lesson-sheet' });
  };

  UI.openBoss = function (uid) {
    const u = CQ.idx.units[uid];
    const c = CQ.courses[u.course];
    if (!store().bossOpen(u)) {
      UI.modal('<h2>Boss locked</h2><p class="muted">Finish every lesson in Unit ' + u.n + ' to face the boss.</p><button class="btn wide" data-act="close-modal">Okay</button>');
      return;
    }
    const beaten = store().unitBeaten(u);

      const t = $('#exp-code');
      const done = () => UI.toast(ic('check') + ' Copied');
      try { navigator.clipboard.writeText(t.value).then(done, () => { t.select(); UI.toast('Selected. Press Ctrl/Cmd+C to copy.'); }); } catch (e) { t.select(); UI.toast('Selected. Press Ctrl/Cmd+C to copy.'); }
    },
    import: () => UI.modal('<h2>Paste a save code</h2><p class="muted">This replaces the progress in this browser.</p><textarea class="code" id="imp-code" placeholder="Paste your code here"></textarea><p class="err" id="imp-err" hidden></p><button class="btn wide" data-act="do-import">Load save</button>'),
    'do-import': () => {
      try { store().importCode($('#imp-code').value); UI.closeModal(); UI.applyTheme(); UI.toast(ic('check') + ' Save loaded'); UI.go('learn'); }
      catch (e) { const er = $('#imp-err'); er.hidden = false; er.textContent = 'That code did not load. Copy the whole code from the other device and try again.'; }
    },
    reset: () => UI.modal('<h2>Reset all progress?</h2><p class="muted">This wipes XP, crowns, streaks and review history in this browser. It cannot be undone.</p><div class="btn-stack"><button class="btn wide red" data-act="do-reset">Reset everything</button><button class="btn-ghost wide" data-act="close-modal">Cancel</button></div>'),
    'do-reset': () => { store().reset(); UI.closeModal(); UI.applyTheme(); UI.go('learn'); UI.onboard(); },
    'onboard-done': () => { const g = $('#onb-goal'); st().settings.goal = +g.value; st().onboarded = true; store().save(); UI.closeModal(); CQ.sfx('complete'); UI.render(); },
  });

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = A[el.dataset.act] || (CQ.player && CQ.player.actions[el.dataset.act]);
    if (fn) { e.preventDefault(); fn(el, e); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !$('#overlay').hidden) {
      const x = $('#overlay .modal-x');
      if (x) UI.closeModal();
    }
  });
})();

</script>
<script>
/* js/player.js */
/* Comet Quest — the lesson player: renders every card type, the check bar,
   combo/hearts/timer HUD, and the results screen. */
(function () {
  const CQ = window.CQ;
  const E = () => CQ.engine;
  const UI = () => CQ.ui;
  const st = () => CQ.store.state;
  const $ = (s, r = document) => r.querySelector(s);
  const ic = (n, c) => CQ.ic(n, c);
  const md = (s) => CQ.md(s);
  const inl = (s) => CQ.inl(s);
  const P = (CQ.player = { S: null });

  const PRAISE = ['Nice!', 'Correct!', 'Nailed it!', 'Great work!', 'Exactly!', 'You got it!', 'Brilliant!', 'Spot on!'];
  const COMBO_WORDS = { 5: 'Combo ×2', 10: 'Combo ×3', 15: 'Unstoppable', 20: 'Legendary streak', 30: 'Are you even human?' };
  const LABEL = { mc: 'Choose the answer', tf: 'True or false?', multi: 'Select all that apply', num: 'Calculate', txt: 'Type the answer', fill: 'Fill in the blanks', match: 'Match the pairs', order: 'Put these in order' };
  const touch = () => matchMedia('(pointer: coarse)').matches;

  /* ---------- start / quit ---------- */
  P.start = function (mode, p) {
    let S;
    try { S = E().build(mode, p); } catch (e) { console.error(e); UI().toast('Could not start that session.'); return; }
    if (!S.items.length) {
      UI().toast(mode === 'review' || mode === 'weak' ? 'Nothing to review yet. Finish a lesson first.' : 'No questions here yet.');
      return;
    }
    P.S = S;
    P.reset();
    document.body.classList.add('in-session');
    const el = $('#player');
    el.hidden = false;
    el.className = 'player mode-' + mode;
    const c = S.course && CQ.courses[S.course];
    if (c) { el.style.setProperty('--hue', c.color); el.style.setProperty('--hue-dk', c.dark); }
    P.render();
    clearInterval(P.timer);
    if (S.timeLimit) P.timer = setInterval(P.tick, 1000);
  };

  P.reset = function () {
    P.phase = 'answer';
    P.sel = null;
    P.revealed = 1;
    P.hint = false;
    P.match = null;
    P.lastOk = null;
  };

  P.close = function () {
    clearInterval(P.timer);
    P.S = null;
    const el = $('#player');
    el.hidden = true;
    el.innerHTML = '';
    document.body.classList.remove('in-session');
    UI().render();
  };

  P.askQuit = function () {
    if (!P.S) return P.close();
    const exam = P.S.mode === 'exam';
    UI().modal('<div class="center">' + UI().nova('sad', 110) + '</div><h2 class="center">' + (exam ? 'Leave the exam?' : 'Wait, don\'t go!') + '</h2><p class="muted center">' + (exam ? 'This attempt will not be scored.' : 'You\'ll lose the progress from this session.') + '</p>' +
      '<div class="btn-stack"><button class="btn wide" data-act="close-modal" autofocus>Keep going</button><button class="btn-ghost wide red-text" data-act="quit-now">' + (exam ? 'Leave exam' : 'End session') + '</button></div>');
  };

  /* ---------- HUD ---------- */
  function hud() {
    const S = P.S;
    let h = '<div class="hud"><button class="hud-x" data-act="quit" aria-label="Quit">' + ic('x') + '</button>';
    h += '<div class="prog"><i style="width:' + Math.max(3, E().progress(S) * 100) + '%"></i>' + (S.combo >= 5 ? '<b class="prog-glow"></b>' : '') + '</div>';
    if (S.timeLimit) h += '<span class="timer" id="timer">' + ic('clock') + '<span>' + fmtTime(S.timeLimit - (Date.now() - S.start)) + '</span></span>';
    else if (S.hearts != null) h += '<span class="hearts">' + ic('heart') + '<b>' + S.hearts + '</b></span>';
    else h += '<span class="combo ' + (S.combo >= 5 ? 'hot' : S.combo >= 2 ? 'warm' : '') + '">' + ic('flame') + '<b>' + S.combo + '</b></span>';
    return h + '</div>';
  }
  const fmtTime = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  P.tick = function () {
    const S = P.S;
    if (!S || !S.timeLimit) return;
    const left = S.timeLimit - (Date.now() - S.start);
    const t = $('#timer span');
    if (t) t.textContent = fmtTime(left);
    if (left < 60000) { const tt = $('#timer'); if (tt) tt.classList.add('low'); }
    if (left <= 0) { clearInterval(P.timer); UI().toast(ic('clock') + ' Time is up'); P.finish(); }
  };

  /* ---------- rendering ---------- */
  P.render = function () {
    const S = P.S;
    const it = E().current(S);
    const el = $('#player');
    let body = '';
    if (it.t === 'teach') body = renderTeach(it);
    else if (it.t === 'example') body = renderExample(it);
    else if (it.t === 'rescue') body = renderRescue(it);
    else body = renderQuestion(it);
    // slide in only when a new item appears, not when a tile tap re-renders the same one
    const fresh = P._shown !== it;
    P._shown = it;
    const keepScroll = !fresh && $('#stage') ? $('#stage').scrollTop : 0;
    el.innerHTML = hud() + '<div class="stage" id="stage"><div class="card-wrap' + (fresh ? ' enter' : '') + '">' + body + '</div></div><footer class="checkbar" id="checkbar">' + footer(it) + '</footer>';
    bindInputs(it);
    $('#stage').scrollTop = keepScroll;
  };

  function renderTeach(it) {
    return '<article class="lcard teach"><div class="eyebrow">' + ic('book') + ' New idea</div><h2>' + inl(it.title) + '</h2>' + (it.fig ? '<figure class="fig">' + it.fig + '</figure>' : '') + '<div class="mdx">' + md(it.md) + '</div></article>';
  }
  function renderExample(it) {
    const steps = it.steps.map((s, i) => '<li class="step ' + (i < P.revealed ? 'shown' : '') + '"><span class="sn">' + (i + 1) + '</span><div>' + inl(s) + '</div></li>').join('');
    return '<article class="lcard example"><div class="eyebrow">' + ic('bulb') + ' Worked example</div><h2>' + inl(it.title) + '</h2>' +
      '<div class="problem">' + md(it.q) + '</div>' + (it.fig ? '<figure class="fig">' + it.fig + '</figure>' : '') + '<ol class="steps">' + steps + '</ol>' +
      (P.revealed < it.steps.length ? '<p class="muted small center">Try the next step in your head first, then reveal it.</p>' : '') + '</article>';
  }
  function renderRescue(it) {
    return '<article class="lcard rescue"><div class="rescue-top">' + UI().nova('think', 96) + '<div><div class="eyebrow">' + ic('bulb') + ' Quick reset</div><h2>Let\'s slow down for a second</h2><p class="muted">Two misses in a row usually means one idea isn\'t clicking yet. Here it is again, short version.</p></div></div><div class="mdx keybox">' + md(it.md) + '</div><p class="muted small">Next up is an easier question to get your footing.</p></article>';
  }

  function badge(it) {
    if (it.retry) return '<span class="badge retry">' + ic('review') + ' Try again</span>';
    if (it.stepping) return '<span class="badge step">Stepping stone</span>';
    if (it.review) return '<span class="badge rev">' + ic('review') + ' Review</span>';
    if (it.lvl >= 4 || it.exam) return '<span class="badge hard">' + ic('flag') + ' Exam-level</span>';
    return '';
  }

  function renderQuestion(it) {
    let h = '<article class="lcard q q-' + it.t + '"><div class="q-top"><span class="eyebrow">' + LABEL[it.t] + '</span>' + badge(it) + '</div>';
    if (it.t === 'fill') {
      const parts = it.q.split('___');
      if (!P.sel) P.sel = new Array(parts.length - 1).fill(null);
      h += '<div class="qtext fill-text">' + parts.map((p, i) => inl(p) + (i < parts.length - 1 ? '<button class="slot ' + (P.sel[i] != null ? 'full' : '') + '" data-act="slot" data-i="' + i + '">' + (P.sel[i] != null ? inl(it.tiles[P.sel[i]].w) : '&nbsp;') + '</button>' : '')).join('') + '</div>';
    } else h += '<div class="qtext">' + md(it.q) + '</div>';
    h += it.fig ? '<figure class="fig">' + it.fig + '</figure>' : '';
    h += '<div class="hintbox" id="hintbox"' + (P.hint ? '' : ' hidden') + '>' + ic('bulb') + '<div>' + inl(hintOf(it) || '') + '</div></div>';
    if (it.t === 'mc' || it.t === 'multi') {
      h += '<div class="choices ' + (it.choices.length > 4 || it.choices.some((c) => CQ.strip(c.text).length > 46) ? 'list' : 'grid') + '">' + it.choices.map((c, i) => '<button class="choice" data-act="pick" data-i="' + i + '"><kbd>' + (i + 1) + '</kbd><span>' + inl(c.text) + '</span></button>').join('') + '</div>';
    } else if (it.t === 'tf') {
      h += '<div class="choices tf">' + it.choices.map((c, i) => '<button class="choice tfc ' + (i ? 'f' : 't') + '" data-act="pick" data-i="' + i + '">' + ic(i ? 'x' : 'check') + '<span>' + c.text + '</span></button>').join('') + '</div>';
    } else if (it.t === 'num') {
      h += '<div class="numrow"><input id="ans" class="ans-in" ' + (touch() ? 'readonly inputmode="none"' : 'inputmode="decimal"') + ' autocomplete="off" placeholder="Your answer" aria-label="Your answer">' + (it.unit ? '<span class="u-lbl">' + inl(it.unit) + '</span>' : '') + '</div>' +
        '<p class="muted small">Tip: type 3.2e-5 or 3.2x10^-5 for scientific notation.' + (it.tol && it.tol > 0.02 ? '' : ' Answers within 2% count.') + '</p>' + (touch() ? keypad() : '');
    } else if (it.t === 'txt') {
      h += '<div class="numrow"><input id="ans" class="ans-in txt" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="' + (it.ph || 'Type here') + '" aria-label="Your answer"></div>' + (it.chemPreview ? '<div class="chem-prev" id="chem-prev"></div>' : '');
    } else if (it.t === 'fill') {
      h += '<div class="bank">' + it.tiles.map((t, i) => '<button class="tile ' + (P.sel.includes(i) ? 'used' : '') + '" data-act="tile" data-i="' + i + '">' + inl(t.w) + '</button>').join('') + '</div>';
    } else if (it.t === 'match') {
      if (!P.match) P.match = { l: null, r: null, done: new Set(), bad: 0 };
      const col = (arr, side) => '<div class="mcol">' + arr.map((x, i) => '<button class="tile mt ' + (P.match.done.has(x.i) ? 'matched' : '') + ' ' + ((side === 'l' ? P.match.l : P.match.r) === i ? 'sel' : '') + '" data-act="m' + side + '" data-i="' + i + '"' + (P.match.done.has(x.i) ? ' disabled' : '') + '>' + inl(x.text) + '</button>').join('') + '</div>';
      h += '<div class="match">' + col(it.left, 'l') + col(it.right, 'r') + '</div>';
    } else if (it.t === 'order') {
      if (!P.sel) P.sel = [];
      h += '<div class="order-ans" id="order-ans">' + (P.sel.length ? P.sel.map((pi, k) => '<button class="tile ord" data-act="oans" data-k="' + k + '"><span class="on">' + (k + 1) + '</span>' + inl(it.pool[pi].text) + '</button>').join('') : '<span class="muted small">Tap the steps below in the right order</span>') + '</div>';
      h += '<div class="bank col">' + it.pool.map((p, i) => '<button class="tile ' + (P.sel.includes(i) ? 'used' : '') + '" data-act="opool" data-i="' + i + '">' + inl(p.text) + '</button>').join('') + '</div>';
    }
    return h + '</article>';
  }

  const hintOf = (it) => it.hint || (it.steps && it.steps.length > 1 ? it.steps[0] : null);
  function keypad() {
    const keys = ['7', '8', '9', 'del', '4', '5', '6', '-', '1', '2', '3', 'exp', '0', '.', '/', 'ok'];
    const lab = { del: ic('back'), '-': '−', exp: '×10ⁿ', ok: ic('check'), '/': '/' };
    return '<div class="keypad">' + keys.map((k) => '<button class="key k-' + (k === '.' ? 'dot' : k === '/' ? 'slash' : k === '-' ? 'minus' : k) + '" data-act="key" data-k="' + k + '">' + (lab[k] || k) + '</button>').join('') + '</div>';
  }

  function footer(it) {
    const S = P.S;
    if (it.t === 'teach' || it.t === 'rescue') return '<div class="cb-in"><span></span><button class="btn big" data-act="continue" id="primary">Continue</button></div>';
    if (it.t === 'example') {
      const more = P.revealed < it.steps.length;
      return '<div class="cb-in"><span></span><button class="btn big ' + (more ? 'blue' : '') + '" data-act="' + (more ? 'reveal' : 'continue') + '" id="primary">' + (more ? 'Next step' : 'Got it') + '</button></div>';
    }
    if (it.t === 'match') return '<div class="cb-in"><span class="muted small">Tap one on each side to pair them.</span><button class="btn big" disabled id="primary">Check</button></div>';
    const canHint = S.allowHints && hintOf(it) && !P.hint;
    return '<div class="cb-in">' + (S.noFeedback ? '<button class="btn-ghost" data-act="skip">Skip</button>' : canHint ? '<button class="btn-ghost hint-btn" data-act="hint">' + ic('bulb') + '<span>Hint</span></button>' : '<span></span>') +
      '<button class="btn big" data-act="check" id="primary" disabled>' + (S.noFeedback ? 'Submit' : 'Check') + '</button></div>';
  }

  function enableCheck(on) { const b = $('#primary'); if (b && b.dataset.act === 'check') b.disabled = !on; }

  function bindInputs(it) {
    const inp = $('#ans');
    if (inp) {
      if (P.sel) inp.value = P.sel;
      inp.oninput = () => {
        P.sel = inp.value;
        enableCheck(inp.value.trim().length > 0);
        if (it.chemPreview) { const pv = $('#chem-prev'); if (pv) pv.innerHTML = inp.value ? 'Reads as: <b>' + CQ.esc(CQ.chem(inp.value)) + '</b>' : ''; }
      };
      inp.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); const b = $('#primary'); if (b && !b.disabled) b.click(); } };
      if (!touch()) setTimeout(() => inp.focus(), 30);
    }
  }

  /* ---------- check & feedback ---------- */
  P.check = function () {
    const S = P.S;
    const it = E().current(S);
    let resp = P.sel;
    let respText = '';
    if (it.t === 'mc' || it.t === 'tf') respText = CQ.strip(inl(it.choices[resp].text));
    else if (it.t === 'multi') respText = it.choices.filter((c, i) => resp.has(i)).map((c) => CQ.strip(inl(c.text))).join(', ');
    else if (it.t === 'num' || it.t === 'txt') respText = String(resp || '');
    else if (it.t === 'fill') { resp = P.sel.map((i) => (i == null ? '' : it.tiles[i].w)); respText = resp.join(' · '); }
    else if (it.t === 'order') { resp = P.sel.map((i) => it.pool[i].i); respText = resp.map((i) => it.items[i]).join(' → '); }
    else if (it.t === 'match') { resp = P.match.bad; respText = P.match.bad + ' mismatches'; }
    const ok = E().grade(it, resp);
    const res = E().answer(S, ok, { hint: P.hint, respText });
    if (S.noFeedback) { P.next(); return; }
    P.phase = 'feedback';
    P.lastOk = ok;
    showFeedback(it, ok, res, resp);
  };

  function showFeedback(it, ok, res, resp) {
    const S = P.S;
    CQ.sfx(ok ? 'correct' : 'wrong');
    if (!ok) CQ.buzz(60);
    // mark the choices
    if (it.t === 'mc' || it.t === 'tf' || it.t === 'multi') {
      document.querySelectorAll('.choice').forEach((b, i) => {
        b.disabled = true;
        b.classList.remove('sel');
        if (it.choices[i].ok) b.classList.add('right');
        else if (it.t === 'multi' ? resp.has(i) : i === resp) b.classList.add('wrong');
      });
    }
    document.querySelectorAll('.tile, .slot, .key, #ans').forEach((b) => { b.disabled = true; });
    const card = $('.card-wrap');
    if (card && !ok) card.classList.add('shake');
    // option-specific feedback for the misconception that was picked
    let fb = '';
    if (!ok && it.t === 'mc' && it.choices[resp] && it.choices[resp].fb) fb = '<p class="fb-pick">' + inl(it.choices[resp].fb) + '</p>';
    const title = ok ? (S.combo >= 5 && COMBO_WORDS[S.combo] ? COMBO_WORDS[S.combo] : PRAISE[Math.floor(Math.random() * PRAISE.length)]) : 'Not quite';
    const ans = !ok && it.t !== 'match' ? '<div class="fb-ans"><small>Correct answer</small><div>' + inl(E().correctText(it)) + '</div></div>' : '';
    const why = it.why ? '<div class="fb-why">' + md(it.why) + '</div>' : '';
    const steps = it.steps && it.steps.length ? '<details class="fb-steps" ' + (ok ? '' : 'open') + '><summary>' + (ok ? 'See the full solution' : 'Full solution') + '</summary><ol>' + it.steps.map((s) => '<li>' + inl(s) + '</li>').join('') + '</ol></details>' : '';
    const extra = (res.retry ? '<p class="fb-note">' + ic('review') + ' This one comes back at the end' + (it.gen ? ' with new numbers.' : '.') + '</p>' : '') + (res.rescue ? '<p class="fb-note">' + ic('bulb') + ' Next: a quick reset on the key idea.</p>' : '');
    const cb = $('#checkbar');
    cb.className = 'checkbar ' + (ok ? 'good' : 'bad');
    cb.innerHTML = '<div class="cb-in fb"><div class="fb-body"><div class="fb-head">' + ic(ok ? 'check' : 'x', 'fb-ic') + '<b>' + title + '</b>' + (ok && res.gain ? '<span class="xp-pop">+' + res.gain + ' XP' + (res.mult > 1 ? ' <small>×' + res.mult + '</small>' : '') + '</span>' : '') + '</div>' +
      fb + ans + why + steps + extra + '</div><button class="btn big ' + (ok ? 'green' : 'red') + '" data-act="continue" id="primary">Continue</button></div>';
    if (ok && COMBO_WORDS[S.combo]) CQ.sfx('combo');
    if (!ok && S.hearts != null) { CQ.sfx('heart'); const hh = $('.hearts'); if (hh) { hh.querySelector('b').textContent = S.hearts; hh.classList.add('lose'); } }
    const cmb = $('.combo');
    if (cmb) { cmb.querySelector('b').textContent = S.combo; cmb.className = 'combo ' + (S.combo >= 5 ? 'hot' : S.combo >= 2 ? 'warm' : '') + (ok ? ' bump' : ''); }
    const prog = $('.prog i');
    if (prog) prog.style.width = Math.max(3, E().progress(S, 1) * 100) + '%';
    setTimeout(() => { const b = $('#primary'); if (b) b.focus({ preventScroll: true }); }, 30);
    // make sure the feedback is visible on short screens
    requestAnimationFrame(() => { const s = $('#stage'); if (s) s.style.paddingBottom = cb.offsetHeight + 24 + 'px'; });
  }

  P.next = function () {
    const S = P.S;
    if (!S) return;
    if (S.hearts === 0 && !S.revived && st().gems >= 30 && (S.mode === 'boss' || S.mode === 'jump' || S.mode === 'legend')) return reviveOffer();
    const over = E().advance(S);
    if (over) return P.finish();
    P.reset();
    P.render();
    if (S.fastNow) UI().toast(ic('bolt') + ' Fast track: skipped ' + S.fastNow + ' warm-up' + (S.fastNow > 1 ? 's' : '') + '. You clearly have this.', 'blue');
  };

  function reviveOffer() {
    const S = P.S;
    $('#stage').innerHTML = '<div class="card-wrap enter"><article class="lcard center">' + UI().nova('sad', 120) + '<h2>Out of hearts</h2><p class="muted">Spend 30 gems for one more heart and keep fighting, or call it here.</p></article></div>';
    $('#checkbar').className = 'checkbar';
    $('#checkbar').innerHTML = '<div class="cb-in"><button class="btn-ghost" data-act="give-up">End run</button><button class="btn big gold" data-act="revive">' + ic('heart') + ' +1 heart · ' + ic('gem') + ' 30</button></div>';
  }

  /* ---------- results ---------- */
  P.finish = function () {
    clearInterval(P.timer);
    const S = P.S;
    const R = E().finish(S);
    const el = $('#player');
    const win = R.passed;
    CQ.sfx(win ? 'complete' : 'fail');
    if (win && (S.mode !== 'exam' || R.score >= 70)) UI().confetti();
    const mins = Math.floor(R.ms / 60000), secs = Math.floor((R.ms % 60000) / 1000);
    const tiles = (S.mode === 'exam'
      ? [['gold', 'star', 'Total XP', R.xp], ['green', 'target', 'Score', R.score + '%'], ['blue', 'clock', 'Time', mins + ':' + String(secs).padStart(2, '0')], ['purple', 'check', 'Correct', R.right + ' / ' + R.total]]
      : [['gold', 'star', 'Total XP', R.xp], ['green', 'target', 'Accuracy', Math.round(R.acc * 100) + '%'], ['blue', 'clock', 'Time', mins + ':' + String(secs).padStart(2, '0')], ['orange', 'flame', 'Best combo', R.combo]])
      .map(([c, i, l, v]) => '<div class="rtile ' + c + '"><small>' + l + '</small><div>' + ic(i) + '<b>' + v + '</b></div></div>').join('');
    const head = {
      learn: ['Lesson complete!', R.perfect ? 'Flawless. Not a single miss.' : R.acc >= 0.85 ? 'Right in the zone. That\'s how it sticks.' : 'You worked for that one. The misses are queued for review.'],
      levelup: ['Leveled up!', 'Crown 2 means you can do it without the training wheels.'],
      legend: win ? ['Legendary!', 'Exam-level, no hints, 90%+. This lesson is locked in.'] : ['So close', 'Legendary needs 90% with hearts left. Review the misses and run it again.'],
      boss: win ? ['Boss defeated!', 'The next unit is open.'] : ['The boss won this round', 'Check the solutions below, then come back swinging.'],
      jump: win ? ['You tested out!', 'Everything before this unit is unlocked.'] : ['Not this time', 'Brush up with the earlier lessons and try the jump again.'],
      review: ['Review done!', 'Every answer pushed those memories further out on the schedule.'],
      weak: ['Weak spots drilled', 'Missed ones stay in the drill until they stick.'],
      exam: [R.score >= 85 ? 'A-range run!' : R.score >= 70 ? 'Solid run' : 'Good scouting run', R.score >= 85 ? 'Do one more run to confirm it, and keep your crowns and reviews up so the readiness meter follows.' : 'Work through the review below, drill your weak spots, then run it again.'],
    }[S.mode];
    let h = '<div class="results"><div class="res-hero">' + UI().nova(win ? 'cheer' : 'sad', 150) + '<h1>' + head[0] + '</h1><p>' + head[1] + '</p></div>';
    if (S.mode === 'exam') h += '<div class="exam-score ' + (R.score >= 85 ? 'good' : R.score >= 70 ? 'mid' : 'low') + '"><b>' + R.score + '%</b><span>Readiness now ' + CQ.store.readiness(S.exam) + '%</span></div>';
    h += '<div class="rtiles">' + tiles + '</div>';
    const banners = [];
    if (R.crown) banners.push('<div class="rbanner crown c' + R.crown + '">' + ic('crown') + '<span>Crown ' + R.crown + ' earned · ' + ['', 'Learned', 'Leveled up', 'Legendary'][R.crown] + '</span></div>');
    if (R.gems) banners.push('<div class="rbanner gem">' + ic('gem') + '<span>+' + R.gems + ' gems</span></div>');
    if (R.streakGrew) banners.push('<div class="rbanner streak">' + ic('flame') + '<span>' + R.streak + '-day streak!</span></div>');
    if (R.levelUp) banners.push('<div class="rbanner level">' + ic('star') + '<span>Level ' + R.levelUp.n + ' · ' + R.levelUp.title + '</span></div>');
    R.ach.forEach((a) => banners.push('<div class="rbanner achv">' + ic('trophy') + '<span>Achievement: ' + CQ.esc(a.name) + '</span></div>'));
    if (banners.length) h += '<div class="rbanners">' + banners.join('') + '</div>';
    // review list
    const list = S.mode === 'exam' ? S.items.map((it) => ({ it, a: S.answers.find((x) => x.item === it) })) : S.mistakes.map((it) => ({ it, a: S.answers.find((x) => x.item === it) }));
    if (list.length) {
      h += '<details class="res-review" ' + (S.mode === 'exam' || !win ? 'open' : '') + '><summary>' + (S.mode === 'exam' ? 'Review every question' : 'Review your misses (' + list.length + ')') + '</summary>';
      list.forEach(({ it, a }, k) => {
        const ok = a && a.ok;
        h += '<div class="rv-item ' + (ok ? 'ok' : 'no') + '"><div class="rv-q"><span class="rv-n">' + (k + 1) + '</span>' + ic(ok ? 'check' : 'x') + '<div>' + md(it.t === 'fill' ? it.q.replace(/___/g, '____') : it.q) + '</div></div>' +
          (a && a.resp && !ok ? '<p class="rv-you">You: ' + CQ.esc(a.resp) + '</p>' : !a ? '<p class="rv-you">Skipped</p>' : '') +
          (it.t !== 'match' ? '<p class="rv-a"><b>Answer:</b> ' + inl(E().correctText(it)) + '</p>' : '') + (it.why ? '<div class="rv-why">' + md(it.why) + '</div>' : '') +
          (it.steps ? '<ol class="rv-steps">' + it.steps.map((s) => '<li>' + inl(s) + '</li>').join('') + '</ol>' : '') + '</div>';
      });
      h += '</details>';
    }
    h += '</div>';
    let btns = '<button class="btn big" data-act="done">Continue</button>';
    if (!win && (S.mode === 'boss' || S.mode === 'jump' || S.mode === 'legend')) btns = '<button class="btn-ghost" data-act="done">Back to path</button><button class="btn big" data-act="again">Try again</button>';
    else if (S.mode === 'learn' && R.passed) btns = '<button class="btn-ghost" data-act="again-levelup">Level up now</button><button class="btn big" data-act="done">Continue</button>';
    else if (S.mode === 'exam') btns = '<button class="btn-ghost" data-act="again">Run it again</button><button class="btn big" data-act="done">Done</button>';
    el.innerHTML = '<div class="stage res-stage">' + h + '</div><footer class="checkbar"><div class="cb-in">' + (btns.startsWith('<button class="btn big"') ? '<span></span>' : '') + btns + '</div></footer>';
    if (R.levelUp) setTimeout(() => CQ.sfx('level'), 700);
    P.lastRun = { mode: S.mode, p: S.p };
  };

  /* ---------- actions ---------- */
  P.actions = {
    quit: () => P.askQuit(),
    'quit-now': () => { UI().closeModal(); P.close(); },
    continue: () => {
      const it = E().current(P.S);
      if (it && (it.t === 'teach' || it.t === 'example' || it.t === 'rescue')) CQ.sfx('tap');
      if (P.phase === 'answer' && it && it.t === 'match') return;
      P.next();
    },
    reveal: () => {
      P.revealed++;
      CQ.sfx('reveal');
      const it = E().current(P.S);
      const steps = document.querySelectorAll('.step');
      steps.forEach((s, i) => s.classList.toggle('shown', i < P.revealed));
      const last = steps[P.revealed - 1];
      if (last) last.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      $('#checkbar').innerHTML = footer(it);
      const note = $('.example .muted.small.center');
      if (note && P.revealed >= it.steps.length) note.remove();
    },
    hint: () => {
      P.hint = true;
      $('#hintbox').hidden = false;
      const hb = $('.hint-btn');
      if (hb) hb.replaceWith(Object.assign(document.createElement('span'), { className: 'muted small', textContent: 'Hint used · half XP' }));
      CQ.sfx('reveal');
    },
    skip: () => { E().advance(P.S) ? P.finish() : (P.reset(), P.render()); },
    check: () => P.check(),
    pick: (el) => {
      if (P.phase !== 'answer') return;
      const it = E().current(P.S);
      const i = +el.dataset.i;
      CQ.sfx('tap');
      if (it.t === 'multi') {
        if (!P.sel) P.sel = new Set();
        P.sel.has(i) ? P.sel.delete(i) : P.sel.add(i);
        el.classList.toggle('sel', P.sel.has(i));
        enableCheck(P.sel.size > 0);
      } else {
        P.sel = i;
        document.querySelectorAll('.choice').forEach((b) => b.classList.toggle('sel', b === el));
        enableCheck(true);
      }
    },
    key: (el) => {
      const inp = $('#ans');
      if (!inp || P.phase !== 'answer') return;
      const k = el.dataset.k;
      CQ.sfx('tap');
      if (k === 'ok') { const b = $('#primary'); if (b && !b.disabled) b.click(); return; }
      if (k === 'del') inp.value = inp.value.slice(0, -1);
      else if (k === 'exp') inp.value += '×10^';
      else inp.value += k;
      inp.oninput();
    },
    tile: (el) => {
      if (P.phase !== 'answer') return;
      const i = +el.dataset.i;
      if (P.sel.includes(i)) return;
      const slot = P.sel.indexOf(null);
      if (slot < 0) return;
      P.sel[slot] = i;
      CQ.sfx('tap');
      P.render();
      enableCheck(!P.sel.includes(null));
    },
    slot: (el) => {
      if (P.phase !== 'answer') return;
      P.sel[+el.dataset.i] = null;
      P.render();
      enableCheck(false);
    },
    opool: (el) => {
      if (P.phase !== 'answer') return;
      const i = +el.dataset.i;
      if (P.sel.includes(i)) return;
      P.sel.push(i);
      CQ.sfx('tap');
      P.render();
      enableCheck(P.sel.length === E().current(P.S).pool.length);
    },
    oans: (el) => {
      if (P.phase !== 'answer') return;
      P.sel.splice(+el.dataset.k, 1);
      P.render();
      enableCheck(false);
    },
    ml: (el) => matchTap('l', +el.dataset.i, el),
    mr: (el) => matchTap('r', +el.dataset.i, el),
    revive: () => { const S = P.S; st().gems -= 30; S.hearts = 1; S.revived = true; CQ.store.save(); CQ.sfx('level'); const over = E().advance(S); if (over) return P.finish(); P.reset(); P.render(); },
    'give-up': () => { P.S.revived = true; P.finish(); },
    done: () => P.close(),
    again: () => { const r = P.lastRun; P.close(); P.start(r.mode, r.p); },
    'again-levelup': () => { const r = P.lastRun; P.close(); P.start('levelup', r.p); },
  };

  function matchTap(side, i, el) {
    if (P.phase !== 'answer') return;
    const it = E().current(P.S);
    const m = P.match;
    m[side] = m[side] === i ? null : i;
    CQ.sfx('tap');
    document.querySelectorAll('.mcol')[side === 'l' ? 0 : 1].querySelectorAll('.tile').forEach((b, k) => b.classList.toggle('sel', k === m[side]));
    if (m.l != null && m.r != null) {
      const a = it.left[m.l], b = it.right[m.r];
      const lb = document.querySelectorAll('.mcol')[0].querySelectorAll('.tile')[m.l];
      const rb = document.querySelectorAll('.mcol')[1].querySelectorAll('.tile')[m.r];
      if (a.i === b.i) {
        m.done.add(a.i);
        [lb, rb].forEach((x) => { x.classList.remove('sel'); x.classList.add('matched', 'pop'); x.disabled = true; });
        CQ.sfx('correct');
      } else {
        m.bad++;
        [lb, rb].forEach((x) => { x.classList.remove('sel'); x.classList.add('bad'); setTimeout(() => x.classList.remove('bad'), 500); });
        CQ.sfx('wrong');
      }
      m.l = m.r = null;
      if (m.done.size === it.pairs.length) setTimeout(() => P.check(), 350);
    }
  }

  // keyboard: 1-9 choose, Enter = primary button
  document.addEventListener('keydown', (e) => {
    if (!P.S || !$('#overlay').hidden) return;
    const typing = document.activeElement && (document.activeElement.id === 'ans');
    if (e.key === 'Enter' && !typing) {
      const b = $('#primary');
      if (b && !b.disabled) { e.preventDefault(); b.click(); }
    } else if (/^[1-9]$/.test(e.key) && !typing && P.phase === 'answer') {
      const b = document.querySelectorAll('.choice')[+e.key - 1];
      if (b) b.click();
    } else if (e.key === 'Escape') {
      P.askQuit();
    }
  });
})();

</script>
<script>
/* js/app.js */
/* Comet Quest — boot. */
(function () {
  const CQ = window.CQ;
  const NAV = [['learn', 'home', 'Learn'], ['review', 'review', 'Review'], ['sheet', 'sheet', 'Cheat sheet'], ['profile', 'user', 'Profile']];

  function renderNav() {
    const btns = NAV.map(([t, i, l]) => '<button data-act="tab" data-tab="' + t + '">' + CQ.ic(i) + '<span>' + l + '</span></button>').join('');
    document.getElementById('rail').innerHTML = '<div class="brand">' + CQ.ui.nova('happy', 44) + '<span>Comet Quest</span></div>' + btns + '<div class="rail-foot">PHYS 2325 · CHEM 1311 · MECH 1208</div>';
    document.getElementById('tabbar').innerHTML = btns;
  }

  function boot() {
    const store = CQ.store;
    store.load();
    if (!CQ.courses[store.state.course]) store.state.course = CQ.courseOrder[0];
    CQ.ui.applyTheme();
    const tab = (location.hash || '').replace('#', '');
    if (['learn', 'review', 'sheet', 'profile'].includes(tab)) CQ.ui.tab = tab;
    renderNav();
    CQ.ui.render();
    if (!store.state.onboarded) CQ.ui.onboard();
    if (store.flash) {
      const f = store.flash;
      setTimeout(() => CQ.ui.toast(f.type === 'freeze' ? CQ.ic('snow') + ' A streak freeze saved your streak' + (f.n > 1 ? ' (' + f.n + ' days)' : '') + '.' : 'Your ' + f.n + '-day streak ended. Start a new one today.', f.type === 'freeze' ? 'blue' : ''), 600);
      store.flash = null;
      store.save();
    }
    store.onChange(() => { if (!CQ.player.S) CQ.ui.render(); });
    store.cloud.init();
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) { store.rollDay(); if (!CQ.player.S) CQ.ui.render(); }
      else store.cloud.flush();
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
