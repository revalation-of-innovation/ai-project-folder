<title>Comet Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A gamified study path for UT Dallas PHYS 2325, CHEM 1311 and MECH 1208.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&family=STIX+Two+Text:ital,wght@0,500;0,600;1,500&display=swap">
<style>
/* Comet Quest
   Layout: three-column game shell (nav rail · winding skill path · status panel)
   that collapses to the path plus a bottom tab bar on phones. */
:root {
  --bg: #f4f3fb;
  --bg-glow: #e9e5ff;
  --surface: #ffffff;
  --surface2: #f2f0fb;
  --fg: #1e1b3a;
  --muted: #66628a;
  --line: #e2dff2;
  --line2: #d2cee8;
  --accent: #ff6b3d;
  --accent-dk: #d4481d;
  --good: #20ad5a;
  --good-dk: #158543;
  --good-bg: #e2f7ea;
  --good-fg: #0f6b35;
  --bad: #e5484d;
  --bad-dk: #b22b30;
  --bad-bg: #fde9e9;
  --bad-fg: #a3242a;
  --gold: #ffb020;
  --gold-dk: #cf8700;
  --gold-bg: #fff4d9;
  --gem: #1aa3ec;
  --gem-dk: #0b7fbf;
  --gem-bg: #e3f4fe;
  --purple: #8b5cf6;
  --purple-bg: #f0eaff;
  --teal: #13a99a;
  --locked: #dcd9ea;
  --locked-dk: #c1bdd6;
  --locked-fg: #9692b4;
  --shadow: 0 1px 2px rgba(30, 27, 58, 0.06), 0 8px 28px rgba(30, 27, 58, 0.07);
  --scrim: rgba(22, 19, 48, 0.5);
  --f-display: "Fredoka", "Nunito", ui-rounded, system-ui, sans-serif;
  --f-body: "Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-math: "STIX Two Text", "Cambria Math", "Cambria", "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0b1e; --bg-glow: #1d1846; --surface: #19163a; --surface2: #221e48; --fg: #f2f0ff; --muted: #a8a4cf;
    --line: #2d295a; --line2: #3a3572; --accent: #ff7a4d; --accent-dk: #c4451c;
    --good: #2ccb6b; --good-dk: #1a9550; --good-bg: #12352a; --good-fg: #7ff0ad;
    --bad: #ff5d62; --bad-dk: #bf363b; --bad-bg: #3a1825; --bad-fg: #ffb0b3;
    --gold: #ffc23d; --gold-dk: #c38b00; --gold-bg: #3a2f12; --gem: #3fbfff; --gem-dk: #1b88c2; --gem-bg: #12304a;
    --purple: #a685ff; --purple-bg: #2a2150; --teal: #2fd3c2;
    --locked: #2b2752; --locked-dk: #1f1c40; --locked-fg: #6d6999;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 10px 30px rgba(0, 0, 0, 0.28); --scrim: rgba(4, 3, 14, 0.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0b1e; --bg-glow: #1d1846; --surface: #19163a; --surface2: #221e48; --fg: #f2f0ff; --muted: #a8a4cf;
  --line: #2d295a; --line2: #3a3572; --accent: #ff7a4d; --accent-dk: #c4451c;
  --good: #2ccb6b; --good-dk: #1a9550; --good-bg: #12352a; --good-fg: #7ff0ad;
  --bad: #ff5d62; --bad-dk: #bf363b; --bad-bg: #3a1825; --bad-fg: #ffb0b3;
  --gold: #ffc23d; --gold-dk: #c38b00; --gold-bg: #3a2f12; --gem: #3fbfff; --gem-dk: #1b88c2; --gem-bg: #12304a;
  --purple: #a685ff; --purple-bg: #2a2150; --teal: #2fd3c2;
  --locked: #2b2752; --locked-dk: #1f1c40; --locked-fg: #6d6999;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 10px 30px rgba(0, 0, 0, 0.28); --scrim: rgba(4, 3, 14, 0.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  background-image: radial-gradient(900px 520px at 78% -8%, var(--bg-glow), transparent 70%);
  background-attachment: fixed;
  color: var(--fg);
  font: 500 16px/1.55 var(--f-body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
body.in-session { overflow: hidden; }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, textarea:focus-visible { outline: 3px solid var(--gem); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 600; line-height: 1.2; margin: 0; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.center { text-align: center; }
.eyebrow { font: 700 12px/1.2 var(--f-display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.eyebrow .ic { width: 16px; height: 16px; }
.eyebrow.center { display: block; }
.ic { width: 22px; height: 22px; fill: currentColor; flex: none; display: inline-block; vertical-align: middle; }
.ic.rot { transform: rotate(-90deg); width: 16px; height: 16px; opacity: 0.6; }
.tag { font: 700 12px var(--f-display); text-transform: uppercase; letter-spacing: 0.06em; color: var(--good); }
.red-text { color: var(--bad) !important; }

/* ---------- buttons ---------- */
.btn {
  --b: var(--accent); --bd: var(--accent-dk);
  font: 600 16px/1 var(--f-display); letter-spacing: 0.04em; text-transform: uppercase;
  color: #fff; background: var(--b); border: 0; border-radius: 14px; padding: 14px 22px;
  box-shadow: 0 4px 0 var(--bd); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform 0.06s, box-shadow 0.06s, filter 0.15s; touch-action: manipulation; text-align: center;
}
.btn:hover:not(:disabled) { filter: brightness(1.06); }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 var(--bd); }
.btn:disabled { background: var(--locked); box-shadow: 0 4px 0 var(--locked-dk); color: var(--locked-fg); cursor: default; }
.btn .ic { width: 18px; height: 18px; }
.btn.big { min-width: 170px; padding: 16px 28px; font-size: 17px; }
.btn.sm { padding: 9px 14px; font-size: 13px; border-radius: 12px; box-shadow: 0 3px 0 var(--bd); }
.btn.wide { width: 100%; }
.btn.green { --b: var(--good); --bd: var(--good-dk); }
.btn.red { --b: var(--bad); --bd: var(--bad-dk); }
.btn.blue { --b: var(--gem); --bd: var(--gem-dk); }
.btn.gold { --b: var(--gold); --bd: var(--gold-dk); color: #3b2700; }
.btn.ghost { background: var(--surface); color: var(--b); border: 2px solid var(--line2); box-shadow: 0 4px 0 var(--line2); }
.btn.ghost.red { color: var(--bad); }
.btn-ghost {
  background: transparent; border: 2px solid var(--line2); color: var(--muted); border-radius: 14px; padding: 12px 18px;
  font: 600 14px/1 var(--f-display); text-transform: uppercase; letter-spacing: 0.04em;
  display: inline-flex; gap: 8px; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 3px 0 var(--line2);
  transition: transform 0.06s, box-shadow 0.06s; touch-action: manipulation;
}
.btn-ghost:active { transform: translateY(3px); box-shadow: none; }
.btn-ghost .ic { width: 18px; height: 18px; }
.btn-ghost.sm { padding: 8px 12px; font-size: 12px; border-radius: 12px; }
.btn-ghost.wide { width: 100%; }
.btn-stack { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100%; }
@media (min-width: 760px) { .app { grid-template-columns: 210px minmax(0, 1fr); } }
@media (min-width: 1140px) { .app { grid-template-columns: 236px minmax(0, 1fr) 340px; } }
main { width: 100%; max-width: 660px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 120px; overflow-x: clip; outline: none; }
.nav button { background: none; border: 0; cursor: pointer; }
.rail { display: none; }
@media (min-width: 760px) {
  .rail { display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh; padding: 22px 14px; border-right: 2px solid var(--line); }
  .rail .brand { display: flex; align-items: center; gap: 8px; padding: 0 8px 18px; font: 600 22px var(--f-display); color: var(--accent); }
  .rail .brand .nova { flex: none; }
  .rail button[data-tab] { display: flex; align-items: center; gap: 14px; padding: 11px 14px; border-radius: 14px; border: 2px solid transparent; font: 600 15px var(--f-display); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); text-align: left; }
  .rail button[data-tab] .ic { width: 28px; height: 28px; }
  .rail button[data-tab]:hover { background: var(--surface2); }
  .rail button[data-tab].on { background: var(--gem-bg); border-color: var(--gem); color: var(--gem-dk); }
  .rail .rail-foot { margin-top: auto; padding: 0 8px; font-size: 12px; color: var(--muted); }
}
:root[data-theme="dark"] .rail button[data-tab].on { color: var(--gem); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .rail button[data-tab].on { color: var(--gem); } }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: space-around;
  background: var(--surface); border-top: 2px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
.tabbar button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 10px; border-radius: 12px; color: var(--muted); font: 600 11px var(--f-display); letter-spacing: 0.04em; text-transform: uppercase; min-width: 64px; }
.tabbar button .ic { width: 28px; height: 28px; }
.tabbar button.on { color: var(--gem); background: var(--gem-bg); }
@media (min-width: 760px) { .tabbar { display: none; } }
.side { display: none; }
@media (min-width: 1140px) {
  .side { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 18px max(20px, env(safe-area-inset-right, 0px)) 24px 4px; }
}
.panel { border: 2px solid var(--line); border-radius: 18px; padding: 16px; background: var(--surface); display: flex; flex-direction: column; gap: 12px; }
.panel h3 { font-size: 17px; }

/* ---------- top bar ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 8; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 12px; margin-inline: -16px; padding-inline: 16px; background: var(--bg) radial-gradient(900px 520px at 78% -8%, var(--bg-glow), transparent 70%) fixed; }
@media (min-width: 1140px) { .topbar .pills { display: none; } }
.page-title { font-size: 26px; }
.pills { display: flex; gap: 4px; }
.side .pills { justify-content: space-between; padding: 4px 0; }
.pill { display: inline-flex; align-items: center; gap: 5px; border: 0; background: none; padding: 6px 8px; border-radius: 12px; cursor: pointer; font: 600 17px var(--f-display); color: var(--muted); }
.pill:hover { background: var(--surface2); }
.pill .ic { width: 24px; height: 24px; }
.pill.streak .ic { color: var(--locked-fg); }
.pill.streak.lit { color: var(--accent); }
.pill.streak.lit .ic { color: var(--accent); }
.pill.gems { color: var(--gem); }
.pill.lvl { color: var(--gold-dk); }
.pill.lvl .ic { color: var(--gold); }
.course-switch { display: flex; align-items: center; gap: 10px; border: 2px solid var(--line2); background: var(--surface); border-radius: 14px; padding: 6px 12px 6px 6px; cursor: pointer; box-shadow: 0 3px 0 var(--line2); min-width: 0; }
.course-switch .cs-ic { width: 36px; height: 36px; border-radius: 10px; background: var(--hue); color: #fff; display: grid; place-items: center; box-shadow: 0 3px 0 var(--hue-dk); flex: none; }
.course-switch .cs-ic .ic { width: 22px; height: 22px; }
.course-switch .cs-txt { display: flex; flex-direction: column; text-align: left; line-height: 1.15; min-width: 0; }
.course-switch b { font: 600 15px var(--f-display); white-space: nowrap; }
.course-switch small { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px; }

/* ---------- course & unit headers ---------- */
.today-strip { margin: 4px 0 14px; }
@media (min-width: 1140px) { .today-strip { display: none; } }
.goal-card { display: flex; align-items: center; gap: 14px; }
.goal-card.compact { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 10px 12px; }
.goal-card .gc-txt { display: flex; flex-direction: column; flex: 1; line-height: 1.25; }
.goal-card .gc-txt b { font-family: var(--f-display); font-weight: 600; }
.goal-card .gc-txt span { color: var(--muted); font-size: 14px; }
.ring .ring-bg { fill: none; stroke: var(--line); }
.ring .ring-fg { fill: none; stroke: var(--gold); stroke-linecap: round; transition: stroke-dashoffset 0.6s; }
.ring text { font: 700 14px var(--f-display); fill: var(--fg); }
.course-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 20px; border-radius: 20px; background: var(--surface); border: 2px solid var(--line); margin-bottom: 26px; }
.course-head h1 { font-size: 28px; margin: 4px 0 4px; color: var(--hue); }
.course-head p { color: var(--muted); font-size: 14px; }
.course-head .ring .ring-fg { stroke: var(--hue); }
.unit { margin-bottom: 18px; }
.unit-banner { background: var(--hue); color: #fff; border-radius: 18px; padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; box-shadow: 0 5px 0 var(--hue-dk); flex-wrap: wrap; }
.unit-banner .eyebrow { color: rgba(255, 255, 255, 0.82); }
.unit-banner h2 { font-size: 22px; margin: 3px 0; }
.unit-banner p { opacity: 0.9; font-size: 14px; }
.unit-banner .ub-txt { flex: 1 1 240px; min-width: 0; }
.unit-banner .ub-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.unit-banner .btn-ghost { color: #fff; border-color: rgba(255, 255, 255, 0.45); box-shadow: 0 3px 0 rgba(0, 0, 0, 0.15); background: rgba(255, 255, 255, 0.08); }
.unit.locked .unit-banner { background: var(--locked); box-shadow: 0 5px 0 var(--locked-dk); color: var(--locked-fg); }
.unit.locked .unit-banner .eyebrow { color: var(--locked-fg); }
.unit.locked .unit-banner .btn-ghost { color: var(--fg); border-color: var(--line2); background: var(--surface); }

/* ---------- the path ---------- */
.path { display: flex; flex-direction: column; align-items: center; gap: 26px; padding: 34px 0 30px; }
.node-wrap { position: relative; transform: translateX(var(--x)); display: flex; flex-direction: column; align-items: center; }
.node-wrap.has-bubble { margin-top: 40px; }
.node {
  position: relative; width: 74px; height: 68px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--hue); color: #fff; box-shadow: 0 7px 0 var(--hue-dk), inset 0 -3px 0 rgba(0, 0, 0, 0.08);
  display: grid; place-items: center; transition: transform 0.07s, box-shadow 0.07s; touch-action: manipulation;
}
.node::after { content: ""; position: absolute; top: 9px; left: 16px; width: 22px; height: 10px; border-radius: 50%; background: rgba(255, 255, 255, 0.28); transform: rotate(-18deg); }
.node:active { transform: translateY(6px); box-shadow: 0 1px 0 var(--hue-dk); }
.node .ic { width: 34px; height: 34px; }
.node.locked { background: var(--locked); box-shadow: 0 7px 0 var(--locked-dk); color: var(--locked-fg); }
.node.locked::after { display: none; }
.node.legend { background: var(--gold); box-shadow: 0 7px 0 var(--gold-dk); color: #fff; }
.node.current::before { content: ""; position: absolute; inset: -10px -10px -16px; border-radius: 50%; border: 5px solid var(--hue); opacity: 0.32; animation: pulse 1.8s ease-in-out infinite; }
.node .crowns { position: absolute; bottom: -19px; display: flex; gap: 3px; }
.node .crowns i, .node .crowns s { width: 14px; height: 6px; border-radius: 3px; background: var(--gold); text-decoration: none; }
.node .crowns s { background: var(--line2); }
.node.chest { width: 64px; height: 58px; border-radius: 18px; background: var(--gold); box-shadow: 0 6px 0 var(--gold-dk); }
.node.chest.locked { background: var(--locked); box-shadow: 0 6px 0 var(--locked-dk); }
.node.chest.ready { animation: wiggle 2.4s ease-in-out infinite; }
.node.chest.claimed { background: var(--surface2); box-shadow: 0 6px 0 var(--line2); color: var(--muted); }
.node.chest::after, .node.boss::after { display: none; }
.node.boss { width: 92px; height: 84px; border-radius: 26px; }
.node.boss .ic { width: 44px; height: 44px; }
.node.boss.beaten { background: var(--gold); box-shadow: 0 7px 0 var(--gold-dk); }
.node.boss.current::before { border-radius: 32px; }
.node-label { margin-top: 26px; font: 700 13px/1.25 var(--f-body); color: var(--muted); max-width: 160px; text-align: center; }
.start-bubble { position: absolute; top: -50px; z-index: 2; background: var(--surface); color: var(--hue); border: 2px solid var(--line2); font: 600 15px var(--f-display); letter-spacing: 0.06em; padding: 7px 16px; border-radius: 12px; animation: bob 1.6s ease-in-out infinite; white-space: nowrap; }
.start-bubble::after { content: ""; position: absolute; bottom: -8px; left: 50%; width: 12px; height: 12px; background: var(--surface); border-right: 2px solid var(--line2); border-bottom: 2px solid var(--line2); transform: translateX(-50%) rotate(45deg); }
.start-bubble.boss { color: var(--bad); }
.path-nova { position: absolute; top: -6px; }
.path-nova.r { left: calc(50% + 50px); }
.path-nova.l { right: calc(50% + 50px); }
.path-nova .nova { animation: float 3s ease-in-out infinite; }
.path-end { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; color: var(--muted); padding: 10px 0 30px; }

/* ---------- side panel bits ---------- */
.bar { position: relative; height: 14px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--gold); border-radius: 99px; transition: width 0.5s; }
.bar span { position: absolute; inset: 0; display: grid; place-items: center; font: 700 10px var(--f-display); color: var(--fg); letter-spacing: 0.04em; }
.bar.xp { height: 20px; }
.bar.xp i { background: linear-gradient(90deg, var(--gold), var(--accent)); }
.bar.xp span { font-size: 12px; }
.quest { display: flex; align-items: center; gap: 12px; }
.quest .q-txt { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.quest .q-txt b { font-size: 14px; }
.quest .q-gem { display: inline-flex; align-items: center; color: var(--gem); font: 700 14px var(--f-display); }
.quest .q-gem .ic { width: 18px; height: 18px; }
.quest .q-claimed { color: var(--good); }
.quest.claimed { opacity: 0.6; }
.quest.done .bar i { background: var(--good); }
.modal .quest { margin-top: 14px; }
.upnext { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--surface2); border: 2px solid var(--line); border-radius: 14px; padding: 8px 10px; cursor: pointer; }
.upnext:hover:not(:disabled) { border-color: var(--hue); }
.upnext:disabled { opacity: 0.6; cursor: default; }
.upnext .un-ic { width: 34px; height: 34px; border-radius: 10px; background: var(--hue); color: #fff; display: grid; place-items: center; flex: none; }
.upnext .un-ic .ic { width: 20px; height: 20px; }
.upnext .un-txt { flex: 1; display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.upnext small { font: 700 11px var(--f-display); color: var(--muted); letter-spacing: 0.06em; }
.upnext b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.upnext > .ic { color: var(--hue); width: 18px; height: 18px; }
.ready-row { display: grid; grid-template-columns: 70px 1fr 40px; align-items: center; gap: 8px; font-size: 14px; }
.ready-row b { text-align: right; font-family: var(--f-display); font-weight: 600; font-variant-numeric: tabular-nums; }
.ready-row .bar { height: 10px; }
.ready-row .bar i { background: var(--bad); }
.ready-row .bar.mid i { background: var(--gold); }
.ready-row .bar.good i { background: var(--good); }

/* ---------- modals ---------- */
.overlay { position: fixed; inset: 0; z-index: 100; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; opacity: 0; transition: opacity 0.2s; }
.overlay.show { opacity: 1; }
.modal {
  position: relative; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; background: var(--surface); border-radius: 26px 26px 0 0;
  padding: 26px max(22px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(22px, env(safe-area-inset-left, 0px));
  transform: translateY(40px); transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.3, 1.2); box-shadow: var(--shadow);

<script>
/* js/core.js */
/* Comet Quest — core utilities: namespace, RNG, number formatting/parsing,
   the lightweight math-markup renderer, and the icon set. */
(function () {
  const CQ = (window.CQ = window.CQ || {});

  /* ---------- random numbers ---------- */
  // Seedable PRNG (mulberry32) wrapped with the helpers generators use.
  CQ.rng = function (seed) {
    let s = (seed == null ? Math.random() * 4294967296 : seed) >>> 0;
    const next = () => {
      s = (s + 0x6d2b79f5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    const R = {
      next,
      int: (a, b) => a + Math.floor(next() * (b - a + 1)),
      // a..b rounded to dp decimals
      float: (a, b, dp = 1) => CQ.round(a + next() * (b - a), dp),
      // a, a+st, a+2st ... <= b
      step: (a, b, st) => CQ.round(a + st * Math.floor(next() * (Math.floor((b - a) / st + 1e-9) + 1)), 6),
      pick: (arr) => arr[Math.floor(next() * arr.length)],
      sign: () => (next() < 0.5 ? -1 : 1),
      chance: (p) => next() < p,
      shuffle: (arr) => {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(next() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      },
      // n distinct picks
      sample: (arr, n) => R.shuffle(arr).slice(0, n),
    };
    return R;
  };

  /* ---------- numbers ---------- */
  CQ.round = (x, dp = 0) => {
    const f = Math.pow(10, dp);
    return Math.round((x + Number.EPSILON * Math.sign(x)) * f) / f;
  };

  const SUP = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻', '+': '⁺' };
  CQ.supNum = (n) => String(n).split('').map((c) => SUP[c] || c).join('');

  // Round to sig significant figures, returning a display string.
  // Uses ×10ⁿ notation for very large / very small magnitudes.
  CQ.fmt = function (x, sig = 3, opts = {}) {
    if (!isFinite(x)) return String(x);
    if (x === 0) return '0';
    const neg = x < 0 ? '−' : '';
    const ax = Math.abs(x);
    let e = Math.floor(Math.log10(ax));
    let m = ax / Math.pow(10, e);
    m = CQ.round(m, sig - 1);
    if (m >= 10) { m /= 10; e += 1; }
    const lo = opts.lo != null ? opts.lo : -3;
    const hi = opts.hi != null ? opts.hi : 5;
    if (e < lo || e >= hi) {
      return neg + m.toFixed(Math.max(0, sig - 1)) + ' × 10' + CQ.supNum(e);
    }
    const dp = Math.max(0, sig - 1 - e);
    let s = (ax < 1e-12 ? 0 : CQ.round(ax, dp)).toFixed(dp);
    if (opts.trim) s = s.replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '');
    return neg + s;
  };
  // Trimmed variant (no trailing zeros) for clean question text.
  CQ.fmtT = (x, sig = 3) => CQ.fmt(x, sig, { trim: true });

  // Parse what a student typed: 6.02e23, 6.02x10^23, 6.02 × 10^-23, −4, 1,200, 3/4, 25 m/s
  const UNSUP = { '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9', '⁻': '-', '⁺': '+' };
  CQ.parseNum = function (raw) {
    if (raw == null) return NaN;
    let s = String(raw).trim();
    if (!s) return NaN;
    s = s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺]/g, (c) => UNSUP[c]);
    s = s.replace(/[−–—]/g, '-').replace(/,/g, '').replace(/\s+/g, '');
    // 6.02x10^23 / 6.02*10^23 / 6.02×10^23 / 6.02x10-23 → 6.02e23
    s = s.replace(/[x×*·]10\^?\(?([-+]?\d+)\)?/i, 'e$1');
    // bare 10^5
    s = s.replace(/^([-+]?)10\^\(?([-+]?\d+)\)?/, '$11e$2');
    const frac = s.match(/^([-+]?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);
    if (frac) return parseFloat(frac[1]) / parseFloat(frac[2]);
    const m = s.match(/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?/i);
    if (!m) return NaN;
    return parseFloat(m[0]);
  };

  // Is the typed value close enough? tol is relative; abs is used when the answer is ~0.
  CQ.numMatch = function (val, ans, tol = 0.02, abs) {
    if (!isFinite(val)) return false;
    if (Math.abs(ans) < 1e-12) return Math.abs(val) <= (abs != null ? abs : 1e-6);
    if (abs != null && Math.abs(val - ans) <= abs) return true;
    return Math.abs(val - ans) / Math.abs(ans) <= tol;
  };

  // Normalize short text answers (formulas, names) for comparison.
  CQ.normText = function (s, caseSensitive) {
    let t = String(s || '')
      .replace(/[₀₁₂₃₄₅₆₇₈₉]/g, (c) => String('₀₁₂₃₄₅₆₇₈₉'.indexOf(c)))
      .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺]/g, (c) => UNSUP[c])
      .replace(/[−–—]/g, '-')
      .replace(/\s+/g, ' ')
      .trim();
    if (!caseSensitive) t = t.toLowerCase();
    return t.replace(/\s*([()\[\]])\s*/g, '$1');
  };

  // Unicode subscripts for chemical formulas written as plain text: "H2SO4" → "H₂SO₄"
  CQ.chem = (s) => String(s).replace(/([A-Za-z\)\]])(\d+)/g, (m, a, d) => a + d.split('').map((c) => '₀₁₂₃₄₅₆₇₈₉'[+c]).join(''));

  /* ---------- markup ---------- */
  // Inline markup (no backslashes, so it is safe inside JS template strings):
  //   **bold**  *italic*  $formula$ (or `formula`)  ==highlight==
  //   ^{sup} _{sub} x^2   [[num|den]] fraction   √{x} radical   vec{F} vector arrow
  CQ.inl = function (src) {
    if (src == null) return '';
    let s = String(src);
    s = s.replace(/\^\{([^{}]*)\}/g, '<sup>$1</sup>');
    s = s.replace(/_\{([^{}]*)\}/g, '<sub>$1</sub>');
    // shorthand subscripts: x_cm, P_A, v_esc
    s = s.replace(/([^\s_<>])_([A-Za-z0-9]{1,12})(?![A-Za-z0-9])/g, '$1<sub>$2</sub>');
    s = s.replace(/\^(-?[0-9]+|[a-zA-Z])(?![a-zA-Z0-9])/g, '<sup>$1</sup>');
    s = s.replace(/vec\{([^{}]*)\}/g, '<span class="vec">$1</span>');
    for (let k = 0; k < 4; k++) {
      s = s.replace(/√\{([^{}]*)\}/g, '<span class="sqrt">√<span class="rad">$1</span></span>');
      s = s.replace(/\[\[([^\[\]|]*)\|([^\[\]]*)\]\]/g, '<span class="fr"><span class="fn">$1</span><span class="fd">$2</span></span>');
    }
    s = s.replace(/`([^`]+)`/g, '<span class="m">$1</span>');
    s = s.replace(/\$([^$]+)\$/g, (m, f) => '<span class="m">' + f.trim() + '</span>');
    s = s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    s = s.replace(/(^|[\s(“"'>])\*(?!\s)([^*]+?)\*(?![\w*])/g, '$1<i>$2</i>');
    s = s.replace(/==(.+?)==/g, '<mark>$1</mark>');
    return s;
  };

  // Block markup: paragraphs, "## " headings, "- " / "1. " lists, "$$ display $$" formulas,
  // pipe tables, and callouts: ">* " key idea, ">! " exam trap, ">? " think, ">> " real world.
  const CALLOUT = { '*': ['key', 'Key idea'], '!': ['trap', 'Exam trap'], '?': ['think', 'Think about it'], '>': ['world', 'Real world'] };
  CQ.md = function (src) {
    if (src == null) return '';
    const lines = String(src).replace(/^\n+|\s+$/g, '').split('\n').map((l) => l.replace(/^\s{0,6}/, ''));
    const out = [];
    let para = [];
    let list = null;
    let callout = null;
    let table = null;
    const flushPara = () => { if (para.length) { out.push('<p>' + CQ.inl(para.join(' ')) + '</p>'); para = []; } };
    const flushList = () => { if (list) { out.push('<' + list.tag + '>' + list.items.map((i) => '<li>' + CQ.inl(i) + '</li>').join('') + '</' + list.tag + '>'); list = null; } };
    const flushCallout = () => {
      if (callout) {
        const [cls, label] = CALLOUT[callout.kind];
        out.push('<div class="callout ' + cls + '"><div class="callout-h">' + label + '</div><div>' + callout.lines.map(CQ.inl).join('<br>') + '</div></div>');
        callout = null;
      }
    };
    const flushTable = () => {
      if (table) {
        const rows = table.filter((r) => !/^\|?\s*:?-{2,}/.test(r));
        const cells = (r) => r.replace(/\[\[[^\[\]]*\]\]/g, (f) => f.replace(/\|/g, '\u0001')).replace(/^\||\|$/g, '').split('|').map((c) => c.trim().replace(/\u0001/g, '|'));
        let h = '<div class="tbl-wrap"><table><thead><tr>' + cells(rows[0]).map((c) => '<th>' + CQ.inl(c) + '</th>').join('') + '</tr></thead><tbody>';
        rows.slice(1).forEach((r) => { h += '<tr>' + cells(r).map((c) => '<td>' + CQ.inl(c) + '</td>').join('') + '</tr>'; });
        out.push(h + '</tbody></table></div>');
        table = null;
      }
    };
    const flushAll = () => { flushPara(); flushList(); flushCallout(); flushTable(); };
    for (const line of lines) {
      let m;
      if (!line.trim()) { flushAll(); continue; }
      if ((m = line.match(/^>([*!?>])\s?(.*)$/))) {
        flushPara(); flushList(); flushTable();
        if (!callout || callout.kind !== m[1]) { flushCallout(); callout = { kind: m[1], lines: [] }; }
        callout.lines.push(m[2]);
        continue;
      }
      flushCallout();
      if ((m = line.match(/^\$\$(.+?)\$\$\s*$/))) {
        flushAll();
        const [f, note] = m[1].split('::');
        out.push('<div class="formula"><span class="m">' + CQ.inl(f.trim()) + '</span>' + (note ? '<span class="fnote">' + CQ.inl(note.trim()) + '</span>' : '') + '</div>');
        continue;
      }
      if (line.trim().startsWith('|')) { flushPara(); flushList(); (table = table || []).push(line.trim()); continue; }
      flushTable();
      if ((m = line.match(/^##\s+(.*)$/))) { flushAll(); out.push('<h4>' + CQ.inl(m[1]) + '</h4>'); continue; }
      if ((m = line.match(/^[-•]\s+(.*)$/))) {
        flushPara();
        if (!list || list.tag !== 'ul') { flushList(); list = { tag: 'ul', items: [] }; }
        list.items.push(m[1]);
        continue;
      }
      if ((m = line.match(/^\d+[.)]\s+(.*)$/))) {
        flushPara();
        if (!list || list.tag !== 'ol') { flushList(); list = { tag: 'ol', items: [] }; }
        list.items.push(m[1]);
        continue;
      }
      flushList();
      para.push(line);
    }
    flushAll();
    return out.join('');
  };

  CQ.esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  CQ.strip = (html) => String(html || '').replace(/<[^>]+>/g, '');

  // Small stable string hash (for content ids).
  CQ.hash = function (str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return (h >>> 0).toString(36);
  };

  /* ---------- dates ---------- */
  CQ.dayKey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  CQ.dayNum = (d = new Date()) => Math.floor((new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime()) / 86400000);
  CQ.keyToNum = (k) => { const [y, m, d] = k.split('-').map(Number); return CQ.dayNum(new Date(y, m - 1, d)); };

  /* ---------- icons ---------- */
  const P = (d, extra = '') => '<path d="' + d + '"' + extra + '/>';
  const S = (inner, cls = '') => '<svg class="ic ' + cls + '" viewBox="0 0 24 24" aria-hidden="true">' + inner + '</svg>';
  const stroke = ' fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"';
  CQ.icons = {

    check: S(P('M5 12.5l4.5 4.5L19 7.5', stroke)),
    x: S(P('M6 6l12 12M18 6L6 18', stroke)),
    lock: S('<rect x="5" y="10.5" width="14" height="10" rx="2.5"/>' + P('M8 10.5V8a4 4 0 0 1 8 0v2.5', ' fill="none" stroke="currentColor" stroke-width="2.4"')),
    crown: S(P('M3 8.2l4.6 3.9L12 5l4.4 7.1L21 8.2l-1.9 10.3H4.9z') + '<rect x="4.9" y="19.6" width="14.2" height="2" rx="1"/>'),
    trophy: S(P('M7 3h10v5a5 5 0 0 1-10 0z') + P('M7 5H4v1.5A3.5 3.5 0 0 0 7.5 10M17 5h3v1.5a3.5 3.5 0 0 1-3.5 3.5', ' fill="none" stroke="currentColor" stroke-width="2"') + '<rect x="10.8" y="12.5" width="2.4" height="4"/><rect x="7.5" y="17" width="9" height="3.5" rx="1"/>'),
    flame: S(P('M12.2 2c.7 3.7 5.3 6 5.3 11.3A5.5 5.5 0 0 1 12 19a5.5 5.5 0 0 1-5.5-5.7c0-2.7 1.5-4.4 2.6-5.3-.1 2 .8 3.4 2 3.6.2-3.1-.6-6.1 1.1-9.6z') + P('M12 21.5a3 3 0 0 1-3-3c0-1.6 1.1-2.6 1.8-3.2 0 1 .5 1.8 1.2 1.8.3-1 .4-1.6.2-3.2 1.6 1 2.8 2.6 2.8 4.6a3 3 0 0 1-3 3z', ' opacity=".55"')),
    gem: S(P('M6.5 3h11L22 8.6 12 21 2 8.6z') + P('M2 8.6h20M9 3l-2 5.6L12 21M15 3l2 5.6L12 21', ' fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.2"')),
    heart: S(P('M12 20.6S3.5 15.3 3.5 9.4A4.6 4.6 0 0 1 12 6.9a4.6 4.6 0 0 1 8.5 2.5c0 5.9-8.5 11.2-8.5 11.2z')),

  CQ.ic = (name, cls) => (cls ? (CQ.icons[name] || '').replace('class="ic ', 'class="ic ' + cls + ' ') : CQ.icons[name] || '');

<script>
/* js/content-api.js */
/* Comet Quest — content registry and the small DSL the course files use.

   Card types
     T(title, md)                       teach card (markup, optional fig)
     EX(title, problem, steps[])        worked example, revealed step by step
     MC(q, [correct, ...wrong], why)    multiple choice; an option may be [text, feedbackIfPicked]
     MULTI(q, [[text, isRight]...], why) select all that apply
     TF(q, true|false, why)             true / false
     NUM(q, answer, unit, why)          numeric entry (tol: relative tolerance, default 2%)
     TXT(q, accepted|[accepted], why)   short text (cs: true for case-sensitive formulas)
     FILL(q with ___, [answers], [distractors], why)   word-bank fill-in
     MATCH(q, [[left, right]...], why)  tap-to-match pairs
     ORDER(q, [items in order], why)    put steps in order
     G(generatorId)                     a generated problem (fresh numbers every time)
   Extra options (last argument): lvl 1-4, hint, steps, fig, tol, abs, exam, fixed */
(function () {
  const CQ = window.CQ;
  CQ.courses = {};
  CQ.courseOrder = [];
  CQ.gens = {};
  CQ.idx = { lessons: {}, units: {}, cards: {} };

  CQ.defineCourse = function (def) {
    def.units = [];
    CQ.courses[def.id] = def;
    CQ.courseOrder.push(def.id);
    return def;
  };

  CQ.addUnits = function (courseId, units) {
    const c = CQ.courses[courseId];
    units.forEach((unit) => {
      unit.course = courseId;
      unit.n = c.units.length + 1;
      c.units.push(unit);
      CQ.idx.units[unit.id] = unit;
      unit.lessons.forEach((l, i) => {
        l.unit = unit.id;
        l.course = courseId;
        l.n = i + 1;
        const seen = {};
        l.cards.forEach((card) => {
          card.lesson = l.id;
          let k = l.id + ':' + CQ.hash((card.t || '') + '|' + (card.q || card.g || card.title || ''));
          if (seen[k]) { seen[k]++; k += '-' + seen[k]; } else seen[k] = 1;
          card.key = k;
          CQ.idx.cards[k] = card;
        });
        CQ.idx.lessons[l.id] = l;
      });
    });
  };

  CQ.gen = function (id, fn) { CQ.gens[id] = fn; };

  // Build multiple-choice options from numbers: correct first, unique, formatted.
  CQ.numOpts = function (correct, wrongs, sig = 3, unit = '') {
    const f = (x) => CQ.fmt(x, sig) + (unit ? ' ' + unit : '');
    const c = f(correct);
    const out = [c];
    for (const w of wrongs) {
      if (!isFinite(w)) continue;
      const s = f(w);
      if (!out.includes(s)) out.push(s);
      if (out.length >= 4) break;
    }
    // pad with scaled distractors if needed
    let k = 2;
    while (out.length < 4) {
      const s = f(correct * (k % 2 ? k : 1 / k));
      if (!out.includes(s)) out.push(s);
      k++;
    }
    return out;
  };

  const X = (o, x) => Object.assign(o, x || {});
  CQ.dsl = {
    L: (id, title, meta, cards) => X({ id, title, cards }, meta),
    U: (id, title, meta, lessons) => X({ id, title, lessons }, meta),
    T: (title, md, x) => X({ t: 'teach', title, md }, x),
    EX: (title, q, steps, x) => X({ t: 'example', title, q, steps }, x),
    MC: (q, opts, why, x) => X({ t: 'mc', q, opts, why, lvl: 1 }, x),
    MULTI: (q, opts, why, x) => X({ t: 'multi', q, opts, why, lvl: 2 }, x),
    TF: (q, a, why, x) => X({ t: 'tf', q, a, why, lvl: 1 }, x),
    NUM: (q, a, unit, why, x) => X({ t: 'num', q, a, unit, why, lvl: 3 }, x),
    TXT: (q, a, why, x) => X({ t: 'txt', q, a: [].concat(a), why, lvl: 2 }, x),
    FILL: (q, a, bank, why, x) => X({ t: 'fill', q, a, bank, why, lvl: 2 }, x),
    MATCH: (q, pairs, why, x) => X({ t: 'match', q, pairs, why, lvl: 2 }, x),
    ORDER: (q, items, why, x) => X({ t: 'order', q, items, why, lvl: 2 }, x),
    G: (g, x) => X({ t: 'gen', g, lvl: 3 }, x),
  };

  CQ.isExercise = (c) => c && c.t !== 'teach' && c.t !== 'example' && c.t !== 'rescue';

  CQ.lessonsOf = (courseId) => {
    const out = [];
    CQ.courses[courseId].units.forEach((u) => u.lessons.forEach((l) => out.push(l)));
    return out;
  };
})();

</script>
<script>
/* js/diagrams.js */
/* Comet Quest — diagram builders. Every figure is inline SVG styled through
   theme tokens (see .dg rules in app.css), so it reads in light and dark. */
(function () {
  const CQ = window.CQ;
  const D = (CQ.dg = {});
  const r1 = (x) => Math.round(x * 10) / 10;
  const rad = (d) => (d * Math.PI) / 180;

  D.svg = (w, h, inner, label) => '<svg class="dg" viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" role="img" aria-label="' + CQ.esc(label || 'diagram') + '">' + inner + '</svg>';
  D.line = (x1, y1, x2, y2, cls = 'ln') => '<line x1="' + r1(x1) + '" y1="' + r1(y1) + '" x2="' + r1(x2) + '" y2="' + r1(y2) + '" class="' + cls + '"/>';
  // "n_A" or "F_{g}" in labels becomes a real subscript
  const subs = (s) => String(s).replace(/_\{?([A-Za-z0-9]+)\}?/g, '<tspan baseline-shift="sub" font-size="10">$1</tspan>');
  D.text = (x, y, s, cls = '', anchor = 'middle') => '<text x="' + r1(x) + '" y="' + r1(y) + '" text-anchor="' + anchor + '" dominant-baseline="middle" class="' + cls + '">' + subs(s) + '</text>';
  // Arrow with a solid head; the shaft stops short so the tip stays sharp.
  D.arrow = function (x1, y1, x2, y2, cls = 'c1', head = 11) {
    const a = Math.atan2(y2 - y1, x2 - x1);
    const L = Math.hypot(x2 - x1, y2 - y1);
    if (L < 1) return '';
    const sx = x2 - Math.cos(a) * head * 0.7, sy = y2 - Math.sin(a) * head * 0.7;
    const p1 = [x2 - head * Math.cos(a - 0.42), y2 - head * Math.sin(a - 0.42)];
    const p2 = [x2 - head * Math.cos(a + 0.42), y2 - head * Math.sin(a + 0.42)];
    return D.line(x1, y1, sx, sy, cls) + '<polygon points="' + [x2, y2, p1[0], p1[1], p2[0], p2[1]].map(r1).join(',') + '" class="' + cls + '"/>';
  };
  // Arrow given a start point, an angle (deg, math convention: 0 = right, 90 = up) and a length.
  D.arrowA = (x, y, deg, len, cls) => D.arrow(x, y, x + len * Math.cos(rad(deg)), y - len * Math.sin(rad(deg)), cls);
  D.arc = function (cx, cy, r, a0, a1, cls = 'thin') {
    const p = (a) => [cx + r * Math.cos(rad(a)), cy - r * Math.sin(rad(a))];
    const [x0, y0] = p(a0), [x1, y1] = p(a1);
    const large = Math.abs(a1 - a0) > 180 ? 1 : 0;
    const sweep = a1 > a0 ? 0 : 1;
    return '<path d="M' + r1(x0) + ' ' + r1(y0) + ' A' + r + ' ' + r + ' 0 ' + large + ' ' + sweep + ' ' + r1(x1) + ' ' + r1(y1) + '" class="' + cls + '"/>';
  };
  D.ground = function (x1, x2, y, n) {
    let h = D.line(x1, y, x2, y, 'ln');
    const k = n || Math.floor((x2 - x1) / 14);
    for (let i = 0; i < k; i++) { const x = x1 + 6 + i * ((x2 - x1 - 6) / k); h += D.line(x, y, x - 8, y + 9, 'hatch'); }
    return h;
  };

  /* vector with its components */
  D.vector = function (o = {}) {
    const th = o.deg != null ? o.deg : 35, L = o.len || 170, ox = 44, oy = 176;
    const ex = ox + L * Math.cos(rad(th)), ey = oy - L * Math.sin(rad(th));
    let h = D.arrow(16, oy, 262, oy, 'thin', 8) + D.arrow(ox, 196, ox, 12, 'thin', 8);
    h += D.text(254, oy + 14, 'x', 't-m') + D.text(ox - 12, 18, 'y', 't-m');
    if (o.comps !== false) {
      h += D.arrow(ox, oy, ex, oy, 'c2') + D.arrow(ex, oy, ex, ey, 'c3');

  /* block on an incline */
  D.incline = function (o = {}) {
    const th = o.deg || 30, t = rad(th);
    const b = Math.min(270, 165 / Math.tan(t));
    const A = [300 - b, 196], B = [300, 196], C = [300, 196 - b * Math.tan(t)];

    const s = (o.at || 0.55) * b / Math.cos(t);

    h += '<rect x="-21" y="-21" width="42" height="42" rx="4" class="obj" transform="translate(' + r1(c[0]) + ' ' + r1(c[1]) + ') rotate(' + -th + ')"/>';
    h += D.arc(A[0], A[1], 42, 0, th) + D.text(A[0] + 56 * Math.cos(t / 2), A[1] - 56 * Math.sin(t / 2), 'θ', 't-it');

      h += D.arrow(c[0], c[1], c[0], c[1] + 78, 'c1') + D.text(c[0] + 14, c[1] + 82, 'mg', 'c1 t-it', 'start');

  /* free-body diagram: forces = [{a: deg, len, label, cls}] */
  D.fbd = function (o = {}) {

  /* projectile trajectory */
  D.projectile = function (o = {}) {
    const th = o.deg || 45, x0 = 34, y0 = 184, Rp = o.flat ? 0 : 270;

    if (o.cliff) {

      h = '<rect x="10" y="' + top + '" width="70" height="' + (y0 - top) + '" class="gnd"/>' + D.line(10, top, 80, top) + D.line(80, top, 80, y0) + D.line(10, y0, 330, y0);

  /* simple graph: pts in data units */
  D.graph = function (o = {}) {
    const W = 300, Hh = 196, ox = 46, oy = 160, gw = 230, gh = 130;
    const xs = o.pts.map((p) => p[0]), ys = o.pts.map((p) => p[1]);
    const xmax = o.xmax || Math.max(...xs), ymax = o.ymax != null ? o.ymax : Math.max(0, ...ys), ymin = o.ymin != null ? o.ymin : Math.min(0, ...ys);
    const X = (x) => ox + (x / xmax) * gw, Y = (y) => oy - ((y - ymin) / (ymax - ymin || 1)) * gh;
    const y0 = Y(0);
    let h = D.arrow(ox, oy + 6, ox, oy - gh - 14, 'thin', 7) + D.arrow(ox - 4, y0, ox + gw + 14, y0, 'thin', 7);
    if (o.shade) h += '<polygon points="' + [[X(xs[0]), y0]].concat(o.pts.map((p) => [X(p[0]), Y(p[1])])).concat([[X(xs[xs.length - 1]), y0]]).map((p) => p.map(r1).join(',')).join(' ') + '" class="fillsoft"/>';

  /* uniform circular motion */
  D.circle = function (o = {}) {
    const cx = 130, cy = 112, R = 80, a = o.deg || 50;

  /* Atwood machine */

  /* banked curve cross-section */
  D.banked = function (o = {}) {
    const th = o.deg || 20, t = rad(th);
    let h = '<polygon points="20,190 300,190 300,' + r1(190 - 280 * Math.tan(t)) + '" class="gnd"/>' + D.line(20, 190, 300, 190 - 280 * Math.tan(t));

  /* mass on a horizontal spring */

    let h = D.arrow(ox, oy, 330, oy, 'thin', 7) + D.arrow(ox, oy, ox, 14, 'thin', 7) + D.text(322, oy + 14, 'strain ε', 't-m', 'end') + D.text(ox + 6, 18, 'stress σ', 't-m', 'start');
    h += '<path d="M' + ox + ' ' + oy + ' L 84 70 Q 92 62 104 66 Q 150 72 200 44 Q 240 30 262 48 Q 282 66 296 96" class="c2" style="fill:none;stroke-width:3"/>';
    h += '<circle cx="84" cy="70" r="4.5" class="c1"/>' + D.text(76, 58, 'yield S_y', 'c1', 'end');
    h += '<circle cx="236" cy="33" r="4.5" class="c4"/>' + D.text(236, 20, 'ultimate S_u', 'c4');
    h += '<text x="296" y="110" text-anchor="middle" class="t-m">fracture ×</text>';
    h += D.text(74, 168, 'E = slope', 'c3', 'start') + D.text(150, oy - 10, 'plastic region', 't-m') + D.line(84, oy - 4, 84, oy + 4, 'thin');
    return D.svg(340, 200, h, 'Stress–strain curve showing elastic slope E, yield strength, ultimate strength and fracture');
  };

  // pin in single or double shear
  D.shear = function (o = {}) {
    let h = '';
    if (!o.double) {
      h += '<rect x="20" y="40" width="170" height="24" rx="4" class="obj"/><rect x="110" y="64" width="170" height="24" rx="4" class="obj2"/>';
      h += '<rect x="140" y="28" width="16" height="72" rx="3" class="fillgold" style="stroke:var(--fg);stroke-width:2"/>';
      h += D.arrow(30, 52, -4 + 8, 52, 'c1') + D.arrow(270, 76, 304, 76, 'c1') + D.text(12, 36, 'F', 'c1 t-it') + D.text(296, 98, 'F', 'c1 t-it');
      h += D.line(130, 64, 166, 64, 'c6') + D.text(200, 18, '1 shear plane', 'c6');
    } else {
      h += '<rect x="20" y="30" width="170" height="20" rx="4" class="obj"/><rect x="20" y="78" width="170" height="20" rx="4" class="obj"/><rect x="110" y="54" width="170" height="20" rx="4" class="obj2"/>';
      h += '<rect x="140" y="20" width="16" height="88" rx="3" class="fillgold" style="stroke:var(--fg);stroke-width:2"/>';
      h += D.arrow(270, 64, 304, 64, 'c1') + D.text(296, 86, 'F', 'c1 t-it') + D.arrow(30, 64, 6, 64, 'c1') + D.text(14, 50, 'F', 'c1 t-it');
      h += D.line(130, 52, 166, 52, 'c6') + D.line(130, 76, 166, 76, 'c6') + D.text(210, 14, '2 shear planes', 'c6');
    }
    return D.svg(320, 120, h, o.double ? 'Pin in double shear' : 'Bolt in single shear');
  };

  // orthographic projection of a stepped block (third-angle)
  D.ortho = function () {
    const u = 30;
    let h = '';
    // isometric sketch
    const iso = (x, y, z) => [70 + (x - z) * u * 0.87, 100 - y * u + (x + z) * u * 0.5];
    const face = (pts, cls) => '<polygon points="' + pts.map((p) => iso(...p).map(r1).join(',')).join(' ') + '" class="' + cls + '"/>';
    h += face([[0, 0, 0], [3, 0, 0], [3, 1, 0], [1.5, 1, 0], [1.5, 2, 0], [0, 2, 0]], 'obj');
    h += face([[0, 2, 0], [1.5, 2, 0], [1.5, 2, -2], [0, 2, -2]], 'obj2') + face([[1.5, 1, 0], [3, 1, 0], [3, 1, -2], [1.5, 1, -2]], 'obj2');
    h += face([[1.5, 1, 0], [1.5, 2, 0], [1.5, 2, -2], [1.5, 1, -2]], 'fillgold') + face([[3, 0, 0], [3, 1, 0], [3, 1, -2], [3, 0, -2]], 'fillgold');
    h += D.text(70, 150, 'isometric', 't-m');
    // views
    const fx = 190, fy = 150, s = 22;
    h += '<polygon points="' + [[0, 0], [3, 0], [3, 1], [1.5, 1], [1.5, 2], [0, 2]].map(([x, y]) => (fx + x * s) + ',' + (fy - y * s)).join(' ') + '" class="obj"/>' + D.text(fx + 1.5 * s, fy + 14, 'FRONT', 't-m');
    h += '<rect x="' + fx + '" y="' + (fy - 2 * s - 18 - 2 * s) + '" width="' + 3 * s + '" height="' + 2 * s + '" class="obj"/>' + D.line(fx + 1.5 * s, fy - 4 * s - 18, fx + 1.5 * s, fy - 2 * s - 18, 'ln') + D.text(fx + 1.5 * s, fy - 4 * s - 26, 'TOP', 't-m');
    h += '<rect x="' + (fx + 3 * s + 18) + '" y="' + (fy - 2 * s) + '" width="' + 2 * s + '" height="' + 2 * s + '" class="obj"/>' + D.line(fx + 3 * s + 18, fy - s, fx + 5 * s + 18, fy - s, 'ln') + D.text(fx + 4 * s + 18, fy + 14, 'RIGHT', 't-m');
    return D.svg(340, 172, h, 'Stepped block in isometric view and its front, top and right orthographic views');
  };

  // conduction through a wall
  D.wall = function () {
    let h = '<rect x="120" y="20" width="70" height="140" class="fillgold" style="stroke:var(--fg);stroke-width:2"/>';
    h += D.text(70, 40, 'T_hot', 'c6 t-it') + D.text(240, 40, 'T_cold', 'c2 t-it');
    h += D.arrow(40, 90, 280, 90, 'c1') + D.text(160, 78, 'q', 'c1 t-it');
    h += D.line(120, 172, 190, 172, 'thin') + D.line(120, 166, 120, 178, 'thin') + D.line(190, 166, 190, 178, 'thin') + D.text(155, 186, 'L', 't-it');
    h += D.text(155, 130, 'κ, area A', 't-m');
    return D.svg(310, 196, h, 'Heat conducting through a wall of thickness L from the hot side to the cold side');
  };

  // floating block with buoyant force
  D.buoy = function () {
    let h = '<rect x="20" y="70" width="280" height="110" class="fillsoft"/>' + D.line(20, 70, 300, 70, 'c2');
    h += '<rect x="120" y="40" width="80" height="70" rx="4" class="obj"/>';
    h += D.arrow(160, 75, 160, 150, 'c1') + D.text(172, 146, 'W = mg', 'c1 t-it', 'start') + D.arrow(150, 110, 150, 18, 'c3') + D.text(138, 20, 'F_B', 'c3 t-it', 'end');
    h += D.text(250, 150, 'fluid ρ', 't-m');
    return D.svg(320, 190, h, 'Floating block: buoyant force balances weight');
  };

  // pipe narrowing: continuity
  D.pipe = function () {
    let h = '<path d="M20 40 H140 L200 70 H310 M20 150 H140 L200 120 H310" class="ln"/>';
    h += '<rect x="20" y="40" width="120" height="110" class="fillsoft"/><polygon points="140,40 200,70 200,120 140,150" class="fillsoft"/><rect x="200" y="70" width="110" height="50" class="fillsoft"/>';
    h += D.arrow(40, 95, 100, 95, 'c2') + D.text(70, 80, 'v₁, A₁', 'c2 t-it') + D.arrow(220, 95, 300, 95, 'c1') + D.text(258, 84, 'v₂, A₂', 'c1 t-it');
    return D.svg(330, 170, h, 'Pipe narrowing: the fluid speeds up where the area is smaller');
  };
})();

<script>
/* content/phys-1.js */
/* PHYS 2325 · Mechanics — course definition and Units 1–3 (Young & Freedman Ch 1–3) */
(function () {
  const CQ = window.CQ;
  const { L, U, T, EX, MC, MULTI, TF, NUM, FILL, MATCH, ORDER, G } = CQ.dsl;
  const f = CQ.fmtT;
  const F = (x, s = 3) => CQ.fmt(x, s);
  const g = 9.8;
  const D = CQ.dg;
  const deg = (r) => (r * 180) / Math.PI;
  const rad = (d) => (d * Math.PI) / 180;

  CQ.defineCourse({
    id: 'phys', code: 'PHYS 2325', name: 'Mechanics', icon: 'rocket', color: '#4f6bff', dark: '#3347c2',
    book: 'Young & Freedman, University Physics · Ch 1–15',
    exams: [
      { id: 'phys-e1', name: 'Exam 1', units: ['p1', 'p2', 'p3', 'p4', 'p5'], n: 20, mins: 50, note: 'Ch 1–5' },
      { id: 'phys-e2', name: 'Exam 2', units: ['p6', 'p7', 'p8'], n: 20, mins: 50, note: 'Ch 6–8' },
      { id: 'phys-e3', name: 'Exam 3', units: ['p9', 'p10', 'p11'], n: 20, mins: 50, note: 'Ch 9–11' },
      { id: 'phys-fin', name: 'Final', units: ['p1', 'p2', 'p3', 'p4', 'p5', 'p6', 'p7', 'p8', 'p9', 'p10', 'p11', 'p12', 'p13', 'p14'], n: 30, mins: 90, note: 'Cumulative' },
    ],
  });

  /* ================= generators: Unit 1 ================= */
  CQ.gen('p.unitconv', (R) => {
    const k = R.int(0, 4);
    if (k === 0) {
      const v = R.pick([36, 54, 72, 90, 108, 126, 45, 63, 81]);
      return { t: 'num', q: 'Convert **' + v + ' km/h** to m/s.', a: v / 3.6, unit: 'm/s', hint: '1 km = 1000 m and 1 h = 3600 s.', steps: [v + ' km/h × [[1000 m|1 km]] × [[1 h|3600 s]]', '= [[' + v + '|3.6]] = **' + F(v / 3.6) + ' m/s**'] };
    }
    if (k === 1) {
      const d = R.pick([0.92, 1.25, 2.7, 7.87, 11.3, 13.6, 19.3]);
      return { t: 'num', q: 'A material has a density of **' + d + ' g/cm³**. Express it in kg/m³.', a: d * 1000, unit: 'kg/m³', hint: '1 g = 10⁻³ kg and 1 cm³ = 10⁻⁶ m³.', steps: ['1 g = 10⁻³ kg, and 1 cm³ = (10⁻² m)³ = 10⁻⁶ m³', d + ' × [[10⁻³|10⁻⁶]] = ' + d + ' × 1000 = **' + F(d * 1000) + ' kg/m³**'] };
    }
    if (k === 2) {
      const a = R.pick([250, 340, 480, 620, 750, 1200]);
      return { t: 'num', q: 'A tabletop has an area of **' + a + ' cm²**. What is that in m²?', a: a / 1e4, unit: 'm²', hint: 'Square the conversion factor: 1 m² = (100 cm)².', steps: ['1 m = 100 cm, so 1 m² = (100 cm)² = 10⁴ cm²', a + ' cm² ÷ 10⁴ = **' + F(a / 1e4) + ' m²**'] };
    }
    if (k === 3) {
      const um = R.pick([45, 75, 90, 120, 250]);
      return { t: 'num', q: 'A human hair is about **' + um + ' μm** thick. Express it in meters.', a: um * 1e-6, unit: 'm', hint: 'μ (micro) means 10⁻⁶.', steps: ['micro = 10⁻⁶', um + ' × 10⁻⁶ m = **' + F(um * 1e-6) + ' m**'] };
    }
    const mph = R.pick([60, 75, 85, 95, 100]);
    return { t: 'num', q: 'A fastball travels at **' + mph + ' mi/h**. What is that in m/s? (1 mi = 1609 m)', a: (mph * 1609) / 3600, unit: 'm/s', steps: [mph + ' mi/h × [[1609 m|1 mi]] × [[1 h|3600 s]]', '= **' + F((mph * 1609) / 3600) + ' m/s**'] };
  });

  CQ.gen('p.sigcount', (R) => {
    const pool = [['0.00450', 3], ['1200.', 4], ['3.0050', 5], ['6.02 × 10²³', 3], ['0.07', 1], ['45.00', 4], ['100.0', 4], ['2.10 × 10⁻⁵', 3], ['508', 3], ['0.010', 2], ['9.8', 2], ['1.000', 4]];
    const [n, c] = R.pick(pool);
    const opts = [c, c + 1, c - 1 || c + 2, c + 2].map(String);
    return { t: 'mc', q: 'How many significant figures are in **' + n + '**?', opts: [...new Set(opts)], why: 'Leading zeros never count. Zeros between nonzero digits count. Trailing zeros count only if there is a decimal point.', lvl: 2 };
  });

  CQ.gen('p.vcomp', (R) => {
    const A = R.pick([12, 15, 20, 25, 30, 40, 50, 65, 80]);
    const th = R.pick([25, 30, 37, 40, 53, 60, 120, 135, 150, 210, 240, 300, 330]);
    const want = R.pick(['x', 'y']);
    const ax = A * Math.cos(rad(th)), ay = A * Math.sin(rad(th));
    const a = want === 'x' ? ax : ay;
    return {
      t: 'num', q: 'A displacement vector has magnitude **' + A + ' m** at **' + th + '°** counterclockwise from the +x axis. Find its **' + want + '-component**.', a, unit: 'm', abs: 0.05,
      hint: 'A' + (want === 'x' ? 'ₓ = A cos θ' : 'ᵧ = A sin θ') + ', using the angle from the +x axis. The sign comes out on its own.',
      steps: ['Angle is from +x, so A' + (want === 'x' ? 'ₓ = A cos θ' : 'ᵧ = A sin θ'), '= ' + A + ' × ' + (want === 'x' ? 'cos' : 'sin') + '(' + th + '°) = **' + F(a) + ' m**'],
      why: th > 90 ? 'Past 90° the components can be negative. Using the angle from +x makes the calculator handle the sign.' : '',
    };
  });

  CQ.gen('p.vmag', (R) => {
    const ax = R.pick([-12, -8, -6, -5, 3, 4, 5, 6, 8, 9, 12, 15]), ay = R.pick([-9, -7, -4, 2, 5, 7, 8, 12, 16]);
    const m = Math.hypot(ax, ay);
    return { t: 'num', q: 'A vector has components **Aₓ = ' + ax + ' N** and **Aᵧ = ' + ay + ' N**. What is its magnitude?', a: m, unit: 'N', steps: ['A = √(Aₓ² + Aᵧ²)', '= √(' + ax * ax + ' + ' + ay * ay + ') = **' + F(m) + ' N**'], hint: 'Pythagorean theorem.' };
  });

  CQ.gen('p.vang', (R) => {
    const ax = R.pick([-12, -8, -5, -3, 4, 6, 9]), ay = R.pick([-10, -6, -4, 3, 5, 8, 11]);
    let th = deg(Math.atan2(ay, ax));
    if (th < 0) th += 360;
    const naive = deg(Math.atan(ay / ax));
    const quad = ax < 0 ? 'Aₓ < 0, so the vector is in quadrant ' + (ay > 0 ? 'II' : 'III') + ': add 180°' : ay < 0 ? 'Quadrant IV: add 360° to get a positive angle' : 'Quadrant I: the calculator answer is already right';
    return { t: 'num', q: 'Vector **A = ' + ax + 'î + ' + ay + 'ĵ**. What angle does it make, measured counterclockwise from the +x axis (0° to 360°)?', a: th, unit: '°', abs: 0.6, lvl: 4,
      hint: 'Find arctan(Aᵧ/Aₓ), then check which quadrant the vector is in.',
      steps: ['arctan(' + ay + '/' + ax + ') = ' + F(naive) + '°', quad, 'θ = **' + F(th) + '°**'],
      why: 'Calculators only return angles between −90° and +90°. Always sketch the vector to check the quadrant.' };
  });

  CQ.gen('p.vadd', (R) => {
    const A = R.pick([10, 12, 15, 20]), a1 = R.pick([0, 20, 30, 45]), B = R.pick([8, 10, 14, 18]), a2 = R.pick([90, 110, 120, 135, 150]);
    const rx = A * Math.cos(rad(a1)) + B * Math.cos(rad(a2)), ry = A * Math.sin(rad(a1)) + B * Math.sin(rad(a2));
    const m = Math.hypot(rx, ry);
    return { t: 'num', lvl: 4, q: 'A hiker walks **' + A + ' km at ' + a1 + '°**, then **' + B + ' km at ' + a2 + '°** (angles counterclockwise from east). How far is she from her starting point?', a: m, unit: 'km',
      hint: 'Break each leg into x and y components, add them, then use Pythagoras.',
      steps: ['Rₓ = ' + A + ' cos ' + a1 + '° + ' + B + ' cos ' + a2 + '° = ' + F(rx) + ' km', 'Rᵧ = ' + A + ' sin ' + a1 + '° + ' + B + ' sin ' + a2 + '° = ' + F(ry) + ' km', 'R = √(Rₓ² + Rᵧ²) = **' + F(m) + ' km**'] };
  });

  CQ.gen('p.vaddij', (R) => {
    const a = [R.int(-5, 6), R.int(-5, 6)], b = [R.int(-5, 6), R.int(-4, 6)];
    const c1 = R.pick([1, 2, 3]), sgn = R.pick([1, -1]);
    const rx = c1 * a[0] + sgn * b[0], ry = c1 * a[1] + sgn * b[1];
    const lab = (c1 === 1 ? '' : c1) + 'A ' + (sgn > 0 ? '+' : '−') + ' B';
    return { t: 'num', q: 'A = ' + a[0] + 'î + ' + a[1] + 'ĵ and B = ' + b[0] + 'î + ' + b[1] + 'ĵ. Find the magnitude of **' + lab + '**.', a: Math.hypot(rx, ry), unit: '', abs: 0.02,
      steps: ['x: ' + c1 + '(' + a[0] + ') ' + (sgn > 0 ? '+' : '−') + ' (' + b[0] + ') = ' + rx, 'y: ' + c1 + '(' + a[1] + ') ' + (sgn > 0 ? '+' : '−') + ' (' + b[1] + ') = ' + ry, '|' + lab + '| = √(' + rx * rx + ' + ' + ry * ry + ') = **' + F(Math.hypot(rx, ry)) + '**'] };
  });

  CQ.gen('p.dot', (R) => {
    const a = [R.int(-4, 5), R.int(-4, 5), R.int(-3, 4)], b = [R.int(-4, 5), R.int(-4, 5), R.int(-3, 4)];
    const d = a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    const v = (x) => x[0] + 'î ' + (x[1] < 0 ? '− ' + -x[1] : '+ ' + x[1]) + 'ĵ ' + (x[2] < 0 ? '− ' + -x[2] : '+ ' + x[2]) + 'k̂';
    return { t: 'num', q: 'A = ' + v(a) + ' and B = ' + v(b) + '. Find **A · B**.', a: d, unit: '', abs: 0.01, steps: ['A·B = AₓBₓ + AᵧBᵧ + A_{z}B_{z}', '= (' + a[0] + ')(' + b[0] + ') + (' + a[1] + ')(' + b[1] + ') + (' + a[2] + ')(' + b[2] + ') = **' + d + '**'], hint: 'Multiply matching components and add.' };
  });

  CQ.gen('p.angleBetween', (R) => {
    const a = [R.int(1, 5), R.int(-3, 4), 0], b = [R.int(-3, 4), R.int(1, 5), 0];
    const d = a[0] * b[0] + a[1] * b[1];
    const ma = Math.hypot(a[0], a[1]), mb = Math.hypot(b[0], b[1]);
    const th = deg(Math.acos(d / (ma * mb)));
    return { t: 'num', lvl: 4, q: 'Find the angle between **A = ' + a[0] + 'î + ' + a[1] + 'ĵ** and **B = ' + b[0] + 'î + ' + b[1] + 'ĵ**.', a: th, unit: '°', abs: 0.6,
      hint: 'cos φ = (A·B)/(AB).', steps: ['A·B = ' + d, 'A = ' + F(ma) + ', B = ' + F(mb), 'cos φ = ' + d + '/(' + F(ma) + ' × ' + F(mb) + ') = ' + F(d / (ma * mb)), 'φ = **' + F(th) + '°**'] };
  });

  CQ.gen('p.cross', (R) => {
    const a = [R.int(-4, 5), R.int(-4, 5)], b = [R.int(-4, 5), R.int(-4, 5)];
    const z = a[0] * b[1] - a[1] * b[0];
    return { t: 'num', q: 'A = ' + a[0] + 'î + ' + a[1] + 'ĵ and B = ' + b[0] + 'î + ' + b[1] + 'ĵ. **A × B** points along ±k̂. What is its z-component?', a: z, unit: '', abs: 0.01, lvl: 3,
      hint: '(A × B)_z = AₓBᵧ − AᵧBₓ', steps: ['(A × B)_z = AₓBᵧ − AᵧBₓ', '= (' + a[0] + ')(' + b[1] + ') − (' + a[1] + ')(' + b[0] + ') = **' + z + '**'] };
  });

  /* ================= generators: Unit 2 ================= */
  CQ.gen('p.avgvel', (R) => {
    const x1 = R.int(-20, 60), x2 = x1 + R.pick([-1, 1]) * R.int(15, 90), t = R.pick([2, 2.5, 4, 5, 6, 8, 10]);
    const v = (x2 - x1) / t;
    return { t: 'num', q: 'A runner is at x = ' + x1 + ' m at t = 0 and at x = ' + x2 + ' m at t = ' + t + ' s. What is her **average velocity**?', a: v, unit: 'm/s', abs: 0.01, steps: ['v_av = [[Δx|Δt]] = [[' + x2 + ' − (' + x1 + ')|' + t + ']]', '= **' + F(v) + ' m/s**' + (v < 0 ? ' (negative: she moved in −x)' : '')], why: 'Velocity carries a sign. Moving toward −x gives a negative velocity.' };
  });

  CQ.gen('p.avgspeedTrip', (R) => {
    const d = R.pick([30, 40, 60, 80, 120]), v1 = R.pick([20, 30, 40]), v2 = R.pick([50, 60, 80, 90].filter((x) => x !== v1));
    const tt = d / v1 + d / v2;
    const avg = (2 * d) / tt;
    return { t: 'num', lvl: 4, q: 'You drive **' + d + ' km at ' + v1 + ' km/h**, then another **' + d + ' km at ' + v2 + ' km/h**. What is your average speed for the whole trip?', a: avg, unit: 'km/h',
      hint: 'Average speed = total distance ÷ total time. Find each leg\'s time first.',
      steps: ['t₁ = ' + d + '/' + v1 + ' = ' + F(d / v1) + ' h, t₂ = ' + d + '/' + v2 + ' = ' + F(d / v2) + ' h', 'total time = ' + F(tt) + ' h', 'avg speed = ' + 2 * d + ' km / ' + F(tt) + ' h = **' + F(avg) + ' km/h**'],
      why: 'Not ' + (v1 + v2) / 2 + ' km/h. You spend more time at the slower speed, so the average leans toward it.' };
  });

  CQ.gen('p.deriv', (R) => {
    const A = R.pick([1, 2, 3, 0.5, 4]), B = R.pick([-6, -4, -3, 2, 5]), C = R.pick([-8, -2, 3, 6, 10]), t = R.pick([1, 2, 3, 4]);
    const want = R.pick(['v', 'a']);
    const v = 3 * A * t * t + 2 * B * t + C, a = 6 * A * t + 2 * B;
    const pol = A + 't³ ' + (B < 0 ? '− ' + -B : '+ ' + B) + 't² ' + (C < 0 ? '− ' + -C : '+ ' + C) + 't';
    return { t: 'num', q: 'A particle moves along x with **x(t) = ' + pol + '** (x in m, t in s). Find its ' + (want === 'v' ? '**velocity**' : '**acceleration**') + ' at t = ' + t + ' s.', a: want === 'v' ? v : a, unit: want === 'v' ? 'm/s' : 'm/s²', abs: 0.01,
      hint: want === 'v' ? 'v = dx/dt. Bring each power down: d(tⁿ)/dt = n tⁿ⁻¹.' : 'a = d²x/dt². Differentiate twice.',
      steps: ['v(t) = dx/dt = ' + 3 * A + 't² ' + (2 * B < 0 ? '− ' + -2 * B : '+ ' + 2 * B) + 't ' + (C < 0 ? '− ' + -C : '+ ' + C), want === 'v' ? 'v(' + t + ') = **' + F(v) + ' m/s**' : 'a(t) = dv/dt = ' + 6 * A + 't ' + (2 * B < 0 ? '− ' + -2 * B : '+ ' + 2 * B), ...(want === 'a' ? ['a(' + t + ') = **' + F(a) + ' m/s²**'] : [])] };

    L('p1l2', 'Sig Figs & Estimation', {
      goal: 'Report answers with sensible precision and estimate orders of magnitude.',
      key: 'Count sig figs: nonzero digits count, zeros between them count, leading zeros never count, trailing zeros count only with a decimal point. When multiplying or dividing, keep the fewest sig figs of any input. When adding or subtracting, keep the fewest decimal places. To estimate, round every input to one digit times a power of ten.',

    L('p1l3', 'Vector Components', {
      goal: 'Break any vector into x and y components and rebuild it from them.',
      key: 'With θ measured counterclockwise from +x: $Aₓ = A cos θ$, $Aᵧ = A sin θ$. Going back: $A = √{Aₓ² + Aᵧ²}$ and $θ = arctan(Aᵧ/Aₓ)$, then check the quadrant, because a calculator\'s arctan only returns −90° to +90°. If the angle is measured from the y-axis, sine and cosine swap.',
      formulas: ['Aₓ = A cos θ   ·   Aᵧ = A sin θ', 'A = √{Aₓ² + Aᵧ²}', 'θ = arctan(Aᵧ/Aₓ)  (+ quadrant check)'],
    }, [
      T('Scalars vs vectors', `
A **scalar** is just a number with units: mass, time, speed, energy.

      MC('A force of magnitude F acts at **25° from the +y axis**, tilted toward +x. What is Fₓ?', ['F sin 25°', ['F cos 25°', 'That would be right if 25° were measured from the x-axis. Here it\'s from y.'], 'F tan 25°', 'F / cos 25°'], 'The angle is measured from the y-axis, so the x component is opposite the angle: F sin 25°.', { lvl: 2 }),

      formulas: ['R = A + B → Rₓ = Aₓ + Bₓ, Rᵧ = Aᵧ + Bᵧ', 'A = Aₓî + Aᵧĵ + A_zk̂', '|A − B| ≤ |A + B| ≤ A + B'],

      FILL('To subtract B from A, add A to the ___ of B. In components, (A − B)ₓ = ___.', ['negative', 'Aₓ − Bₓ'], ['inverse', 'Aₓ + Bₓ', 'magnitude'], 'A − B = A + (−B), so subtract component by component.'),

      goal: 'Compute dot and cross products and know what each one tells you.',
      key: 'Dot product (a scalar): $A·B = AB cos φ = AₓBₓ + AᵧBᵧ + A_{z}B_{z}$. It is zero when the vectors are perpendicular. Cross product (a vector): $|A×B| = AB sin φ$, direction by the right-hand rule, zero when parallel, and $A×B = −B×A$. Unit vectors: î×ĵ = k̂, ĵ×k̂ = î, k̂×î = ĵ. Work uses the dot product; torque and angular momentum use the cross product.',
      formulas: ['A·B = AB cos φ = AₓBₓ + AᵧBᵧ + A_{z}B_{z}', '|A × B| = AB sin φ', '(A × B)_z = AₓBᵧ − AᵧBₓ', 'î × ĵ = k̂, ĵ × k̂ = î, k̂ × î = ĵ'],

  const u2 = U('p2', 'Motion in a Line', { sub: 'Velocity, acceleration & the Big Four', ch: 'Ch 2' }, [
    L('p2l1', 'Displacement, Velocity & Speed', {
      goal: 'Tell displacement from distance and velocity from speed.',
      key: 'Displacement $Δx = x₂ − x₁$ is signed and only cares about the start and end. Distance is the total path length. Average velocity $= Δx/Δt$ (signed). Average speed = total distance / total time. For a round trip the average velocity is 0, but the average speed is not. To average speeds over legs of a trip, divide total distance by total time. Never average the speeds directly.',
      formulas: ['Δx = x₂ − x₁', 'v_av = [[Δx|Δt]]', 'avg speed = [[total distance|total time]]'],
    }, [
      T('Where you are vs how far you went', `

      G('p.avgspeedTrip'),

    L('p2l2', 'Instantaneous Velocity & Acceleration', {
      goal: 'Get velocity and acceleration as slopes or derivatives, and tell when something speeds up.',
      key: '$v = dx/dt$ is the slope of the x–t graph. $a = dv/dt = d²x/dt²$ is the slope of the v–t graph. Power rule: $d(tⁿ)/dt = n tⁿ⁻¹$. An object **speeds up** when v and a have the same sign and **slows down** when they have opposite signs. v = 0 does not mean a = 0, for example at the top of a throw.',
      formulas: ['v = [[dx|dt]]   ·   a = [[dv|dt]] = [[d²x|dt²]]', 'd(tⁿ)/dt = n tⁿ⁻¹'],
    }, [
      T('Slopes and derivatives', `
Shrink Δt toward zero and the average velocity becomes the **instantaneous velocity**:
$$ v = [[dx|dt]] :: slope of the tangent line on an x–t graph $$
Acceleration is how fast velocity changes:
$$ a = [[dv|dt]] = [[d²x|dt²]] :: slope of a v–t graph $$

      T('Speeding up or slowing down?', `

      EX('Differentiate twice', 'x(t) = 2t³ − 4t (meters). Find v and a at t = 2 s.', ['v = dx/dt = 6t² − 4', 'v(2) = 24 − 4 = **20 m/s**', 'a = dv/dt = 12t', 'a(2) = **24 m/s²**. Same sign as v, so it\'s speeding up.']),
      MC('On a position–time graph, the **slope** at a point equals the…', ['instantaneous velocity', 'acceleration', 'displacement', 'distance traveled'], 'v = dx/dt is the slope of x vs t.'),

    L('p2l3', 'The Big Four', {
      goal: 'Solve any constant-acceleration problem by choosing the right kinematic equation.',
      key: 'With constant a there are five variables (Δx, v₀, v, a, t) and four equations, each missing one variable: $v = v₀ + at$ (no Δx), $Δx = v₀t + ½at²$ (no v), $v² = v₀² + 2aΔx$ (no t), $Δx = ½(v₀ + v)t$ (no a). List what you know, find the variable you neither know nor need, and use the equation without it.',

      goal: 'Read displacement from areas and handle acceleration that changes with time.',

>* Acceleration **parallel** to v changes the speed. Acceleration **perpendicular** to v changes the direction only. That's why circular motion at constant speed still has acceleration.`),
      EX('Drone velocity', 'r(t) = (2t²)î + (3t)ĵ m. Find the speed at t = 1 s.', ['v = (4t)î + 3ĵ', 'At t = 1: v = 4î + 3ĵ m/s', 'speed = √(16 + 9) = **5 m/s**']),
      MC('A car moves at constant **speed** around a curve. Its acceleration is…', ['nonzero and perpendicular to its velocity', 'zero', 'parallel to its velocity', 'opposite to its velocity'], 'The direction is changing, so there is an acceleration. Perpendicular acceleration turns the velocity without changing its size.'),
      G('p.2dv'),
      TF('In 2D motion, the x and y components of motion can be treated as independent 1-D problems.', true, 'This is what makes projectile motion easy: only the time links them.'),
      MC('A particle\'s position is r = (3t)î + (5 − t²)ĵ. Which statement about its acceleration is true?', ['It is constant: −2ĵ', 'It is zero', 'It points along +x', 'It grows with time'], 'vₓ = 3, vᵧ = −2t → aₓ = 0, aᵧ = −2. Constant and along −y.', { lvl: 2 }),
      G('p.2dv'),
    ]),
    L('p3l2', 'Horizontal Launch', {
      goal: 'Solve "rolls off a table / thrown off a cliff" problems.',
      key: 'Treat horizontal and vertical motion separately. The only thing they share is time. Horizontally there\'s no acceleration, so $x = v₀t$. Vertically it\'s free fall starting from vᵧ = 0, so $h = ½gt²$ and $t = √{2h/g}$. Fall time depends only on height, so a dropped ball and a ball thrown horizontally from the same height land at the same moment.',
      formulas: ['t = √{2h/g}', 'x = v₀t', 'v_{impact} = √{v₀² + 2gh}'],
    }, [
      T('Split it in two', `
Launch something **horizontally** at speed v₀ from height h:
- **Horizontal:** no force, so constant velocity: $x = v₀t$
- **Vertical:** free fall from rest: $h = ½gt²$

The two motions **share only the time**.
$$ t = √{2h/g}   →   x = v₀ √{2h/g} $$
>* Fall time depends only on height. Throwing the ball faster sends it farther but doesn't keep it in the air any longer.`, { fig: D.projectile({ cliff: true }) }),
      EX('Off the table', 'A marble rolls off a 1.2 m high table at 2.0 m/s. Where does it land?', ['Vertical: 1.2 = 4.9t² → t = √(1.2/4.9) = 0.495 s', 'Horizontal: x = 2.0 × 0.495 = **0.99 m** from the table\'s edge']),
      MC('One ball is dropped and another is fired horizontally from the same height at the same moment. Which lands first?', ['They land at the same time', 'The dropped ball', 'The fired ball', 'It depends on the firing speed'], 'Both have vᵧ₀ = 0 and the same vertical acceleration.'),
      G('p.proj.h'),
      TF('During horizontal launch, the horizontal velocity increases as the object falls.', false, 'No horizontal force means vₓ stays constant. Only vᵧ grows.'),
      G('p.proj.h'),
      G('p.proj.hv'),
    ]),
    L('p3l3', 'Angled Launch', {
      goal: 'Find range, max height and flight time for any launch angle.',
      key: 'Resolve: $v₀ₓ = v₀ cos θ$ and $v₀ᵧ = v₀ sin θ$. At the top vᵧ = 0, but vₓ is still $v₀ cos θ$. On level ground: $T = 2v₀ sin θ/g$, $H = v₀² sin²θ/2g$, $R = v₀² sin 2θ/g$. Maximum range is at 45°, and complementary angles (30° and 60°) give equal range. If the landing height differs from the launch height, don\'t use the range formula. Find t from the vertical motion and then x = vₓt.',
      formulas: ['v₀ₓ = v₀ cos θ   ·   v₀ᵧ = v₀ sin θ', 'T = [[2v₀ sin θ|g]]   ·   H = [[v₀² sin²θ|2g]]', 'R = [[v₀² sin 2θ|g]] (level ground only)'],
    }, [
      T('Resolve, then run two clocks', `
$$ v₀ₓ = v₀ cos θ   ·   v₀ᵧ = v₀ sin θ $$
Horizontal: $x = v₀ₓ t$. Vertical: $y = v₀ᵧt − ½gt²$.
**Level ground** shortcuts:
$$ R = [[v₀² sin 2θ|g]]   ·   H = [[v₀² sin² θ|2g]]   ·   T = [[2 v₀ sin θ|g]] $$
>! The range formula only works when it **lands at the launch height**. For walls, cliffs or rooftops, use the component equations.`, { fig: D.projectile({ deg: 50 }) }),
      EX('A punted ball', 'A ball is kicked at 20 m/s at 30° above level ground. Find T and R.', ['v₀ₓ = 20 cos 30° = 17.3 m/s, v₀ᵧ = 20 sin 30° = 10.0 m/s', 'T = 2(10.0)/9.8 = **2.04 s**', 'R = 17.3 × 2.04 = **35.3 m**', 'Check: v₀² sin 60°/g = 400(0.866)/9.8 = 35.3 ✓']),
      MC('At the very top of a projectile\'s path, its velocity is…', ['horizontal, equal to v₀ cos θ', 'zero', 'vertical', 'equal to v₀'], 'Only vᵧ is zero at the top. vₓ never changes.'),
      MC('Which pair of launch angles gives the **same range** on level ground (same speed)?', ['30° and 60°', '30° and 45°', '20° and 40°', '45° and 90°'], 'sin 2θ is the same for complementary angles: sin 60° = sin 120°.'),
      G('p.proj.R'),
      G('p.proj.R'),
      FILL('On level ground, maximum range happens at ___ and the time of flight depends only on the ___ component of the launch velocity.', ['45°', 'vertical'], ['90°', 'horizontal', '30°'], 'sin 2θ peaks at θ = 45°. T = 2v₀ᵧ/g.'),
      G('p.proj.R', { lvl: 3 }),
      G('p.proj.wall'),
    ]),
    L('p3l4', 'Uniform Circular Motion', {
      goal: 'Compute centripetal acceleration from speed or period.',
      key: 'Moving in a circle at constant speed still means accelerating, because the direction keeps changing. The acceleration points toward the center: $a_{rad} = v²/R$. With period T: $v = 2πR/T$, so $a_{rad} = 4π²R/T²$. The velocity is always tangent to the circle.',
      formulas: ['a_{rad} = [[v²|R]]', 'v = [[2πR|T]]', 'a_{rad} = [[4π²R|T²]]'],
    }, [
      T('Constant speed, changing direction', `
On a circle at constant speed, the velocity is always **tangent** to the circle and keeps turning. That turning requires an acceleration pointing **toward the center**:
$$ a_{rad} = [[v²|R]] :: centripetal (center-seeking) acceleration $$
If it takes time T for one lap: $v = 2πR/T$, so $a_{rad} = 4π²R/T²$.`, { fig: D.circle({ deg: 50 }) }),
      EX('Merry-go-round', 'A child sits 2.0 m from the center of a ride that turns once every 4.0 s. Find her acceleration.', ['v = 2π(2.0)/4.0 = 3.14 m/s', 'a = v²/R = 3.14²/2.0 = **4.93 m/s²**, toward the center']),
      MC('For uniform circular motion, the acceleration points…', ['toward the center', 'along the velocity', 'outward from the center', 'nowhere, since it is zero'], 'Centripetal means center-seeking.'),
      TF('An object moving in a circle at constant speed has zero acceleration.', false, 'Its velocity direction changes, so a = v²/R ≠ 0.'),
      G('p.ucm.a'),
      MC('If a car doubles its speed around the same curve, its centripetal acceleration…', ['quadruples', 'doubles', 'stays the same', 'halves'], 'a = v²/R, so (2v)² = 4v².', { lvl: 2 }),
      G('p.ucm.T'),
      G('p.ucm.a'),
    ]),
    L('p3l5', 'Relative Velocity', {
      goal: 'Combine velocities between reference frames (rivers, planes, trains).',
      key: 'Velocities add like vectors: $v_{A/C} = v_{A/B} + v_{B/C}$. The inner letters match and cancel. For a boat aimed straight across a river, crossing time = width / boat speed, and the current only adds downstream drift. To land straight across, aim upstream at angle θ with $sin θ = v_{river}/v_{boat}$.',
      formulas: ['vec{v}_{A/C} = vec{v}_{A/B} + vec{v}_{B/C}', 'aim upstream: sin θ = [[v_{river}|v_{boat}]]'],
    }, [
      T('Whose point of view?', `
Velocity depends on who is watching. If A moves relative to B, and B moves relative to C:
$$ vec{v}_{A/C} = vec{v}_{A/B} + vec{v}_{B/C} $$
The inner subscripts (B) "cancel", like dominoes.
>> A boat aimed straight across a river at 4 m/s, with the current at 3 m/s, moves at 5 m/s relative to the shore and drifts downstream as it crosses.`),
      EX('Crossing a river', 'A boat heads straight across a 100 m river at 4.0 m/s (relative to the water). The current is 3.0 m/s. Find the crossing time and the downstream drift.', ['Across: only the boat\'s 4.0 m/s counts → t = 100/4.0 = **25 s**', 'Downstream: 3.0 m/s × 25 s = **75 m** of drift', 'Speed relative to shore: √(4² + 3²) = 5.0 m/s']),
      MC('A passenger walks toward the front of a train at 2 m/s while the train moves at 20 m/s. Relative to the ground, the passenger moves at…', ['22 m/s', '18 m/s', '20 m/s', '2 m/s'], 'v_P/G = v_P/T + v_T/G = 2 + 20.'),
      G('p.rel.1d'),
      G('p.rel.boat'),
      TF('A stronger current makes a boat (aimed straight across) take longer to cross the river.', false, 'Crossing time depends only on the across-component, so the current only adds drift.'),
      G('p.rel.boat'),
      G('p.rel.heading'),
    ]),
  ]);

  CQ.addUnits('phys', [u1, u2, u3]);
})();
