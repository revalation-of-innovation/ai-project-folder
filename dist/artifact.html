      key: '1 atm = 760 mmHg = 760 torr = 101.325 kPa. Boyle: $P₁V₁ = P₂V₂$ (constant T, n). Charles: $V₁/T₁ = V₂/T₂$ (constant P, n). Avogadro: V ∝ n. Combined: $P₁V₁/T₁ = P₂V₂/T₂$. ALWAYS use kelvin for T.',
      formulas: ['1 atm = 760 mmHg = 101.325 kPa', 'P₁V₁ = P₂V₂', '[[V₁|T₁]] = [[V₂|T₂]]', '[[P₁V₁|T₁]] = [[P₂V₂|T₂]]'],
    }, [
      T('Squeeze it, heat it', `
**Pressure** = force per area. 1 atm = 760 mmHg = 760 torr = 101.325 kPa.
| Law | Holds constant | Relationship |
|---|---|---|
| Boyle | T, n | P₁V₁ = P₂V₂ |
| Charles | P, n | V₁/T₁ = V₂/T₂ |
| Avogadro | P, T | V₁/n₁ = V₂/n₂ |
| Combined | n | P₁V₁/T₁ = P₂V₂/T₂ |
>! Temperatures must be in **kelvin**. Doubling from 10 °C to 20 °C does NOT double the volume.`),
      G('c.pconv'),
      G('c.gaslaw'),
      MC('At constant temperature, if you halve a gas\'s volume, its pressure…', ['doubles', 'halves', 'stays the same', 'quadruples'], 'Boyle: P ∝ 1/V.'),
      G('c.gaslaw'),
      G('c.pconv'),
      G('c.gaslaw'),
    ]),
    L('c12l2', 'Ideal Gas Law', {
      goal: 'Use PV = nRT in every form, including density and molar mass.',
      key: '$PV = nRT$ with R = 0.08206 L·atm/(mol·K) (P in atm, V in L, T in K). STP = 0 °C (273.15 K) and 1 atm, where 1 mol of ideal gas occupies 22.41 L. Rearranged: density $d = PM/RT$, and molar mass $M = dRT/P$. Heavier gases are denser at the same P and T.',
      formulas: ['PV = nRT', 'R = 0.08206 L·atm/mol·K', 'd = [[PM|RT]]   ·   M = [[dRT|P]]', 'STP: 22.41 L/mol'],
    }, [
      T('One equation to rule them all', `
$$ PV = nRT :: R = 0.08206 L·atm/(mol·K) $$
Units must match R: **atm, L, mol, K**.
At **STP** (273.15 K, 1 atm), 1 mol of any ideal gas fills **22.41 L**.
**Density and molar mass** (substitute n = m/M):
$$ d = [[PM|RT]]   ·   M = [[dRT|P]] $$`),
      EX('Molar mass from density', 'A gas has d = 1.96 g/L at STP. Find M.', ['M = dRT/P = (1.96)(0.08206)(273.15)/1.00', 'M = **43.9 g/mol**, probably CO₂']),
      G('c.ideal'),
      G('c.ideal'),
      MC('At the same temperature and pressure, which gas is the **densest**?', ['CO₂', 'N₂', 'He', 'CH₄'], 'd ∝ M. CO₂ (44 g/mol) is the heaviest.'),
      G('c.ideal'),
      G('c.ideal'),
    ]),
    L('c12l3', 'Partial Pressures & Gas Stoichiometry', {
      goal: 'Use Dalton\'s law and connect gas volumes to stoichiometry.',
      key: 'Dalton: each gas in a mixture behaves independently, so $P_{total} = P_A + P_B + …$ and $P_A = χ_A P_{total}$, where χ_A = n_A/n_total. Gas collected over water: $P_{gas} = P_{total} − P_{H₂O}$. Gas stoichiometry: grams → mol (via the equation\'s ratios) → V = nRT/P, or the reverse.',
      formulas: ['P_{total} = ΣPᵢ', 'Pᵢ = χᵢP_{total}', 'over water: P_{gas} = P_{total} − P_{H₂O}'],
    }, [
      T('Gases share a container, not a pressure', `
**Dalton's law:** each gas pushes as if it were alone:
$$ P_{total} = P_A + P_B + …   ·   P_A = χ_A P_{total} $$
where $χ_A = n_A / n_{total}$ is the mole fraction.
**Collecting over water:** the gas is mixed with water vapor, so subtract it: $P_{gas} = P_{total} − P_{H₂O}$.
**Gas stoichiometry:** use PV = nRT to switch between liters and moles, then use the balanced equation as usual.`),
      G('c.dalton'),
      G('c.dalton'),
      G('c.gasstoich'),
      TF('The mole fraction of a gas equals its fraction of the total pressure.', true, 'P_A/P_total = n_A/n_total.'),
      G('c.gasstoich'),
    ]),
    L('c12l4', 'Kinetic Theory, Speed & Effusion', {
      goal: 'Explain gas behavior with kinetic molecular theory and compute speeds and effusion rates.',
      key: 'KMT: gas particles have negligible volume, no attractions, elastic collisions, and an average kinetic energy ∝ absolute temperature (all gases have the same average KE at the same T). $u_{rms} = √{3RT/M}$ (R = 8.314 J/mol·K, M in kg/mol), so lighter means faster. Graham\'s law: $rate₁/rate₂ = √{M₂/M₁}$. Real gases deviate from ideal behavior at high pressure (particle volume matters) and low temperature (attractions matter). The van der Waals equation corrects for both.',
      formulas: ['u_{rms} = √{[[3RT|M]]} (M in kg/mol)', '[[rate₁|rate₂]] = √{[[M₂|M₁]]}', 'ideal: low P, high T'],
    }, [
      T('Why gases behave the way they do', `
**Kinetic molecular theory:**
1. Particles are tiny compared with the space between them
2. No attractions or repulsions
3. Collisions are perfectly elastic
4. Average kinetic energy ∝ **absolute temperature**
$$ u_{rms} = √{[[3RT|M]]} :: R = 8.314 J/(mol·K), M in kg/mol $$
$$ [[rate₁|rate₂]] = √{[[M₂|M₁]]} :: Graham's law of effusion $$
>! Use **kg/mol** in u_rms, so O₂ is 0.03200 kg/mol, not 32.00.
>* **Real gases** misbehave at **high pressure** (molecules take up space) and **low temperature** (attractions kick in).`),
      G('c.rms'),
      G('c.graham'),
      MC('At the same temperature, H₂ and O₂ molecules have the same…', ['average kinetic energy', 'average speed', 'mass', 'rms speed'], 'KE depends only on T. The lighter H₂ moves faster.'),
      MC('Under which conditions does a real gas behave most ideally?', ['high temperature, low pressure', 'low temperature, high pressure', 'low temperature, low pressure', 'high temperature, high pressure'], 'Fast, far-apart particles act like ideal points.'),
      G('c.rms'),
      G('c.graham'),
    ]),
  ]);

  CQ.addUnits('chem', [u11, u12]);
})();

<script>
/* content/mech-1.js */
/* MECH 1208 · Intro to Mechanical Engineering II — course definition and Units 1–4
   (Wickert & Lewis, An Introduction to Mechanical Engineering, Ch 1–4, plus the truss labs) */
(function () {
  const CQ = window.CQ;
  const { L, U, T, EX, MC, MULTI, TF, NUM, TXT, FILL, MATCH, ORDER, G } = CQ.dsl;
  const F = (x, s = 3) => CQ.fmt(x, s);
  const D = CQ.dg;
  const PI = Math.PI;
  const rad = (d) => (d * PI) / 180, deg = (r) => (r * 180) / PI;
  const sin = (d) => Math.sin(rad(d)), cos = (d) => Math.cos(rad(d));

  CQ.defineCourse({
    id: 'mech', code: 'MECH 1208', name: 'Intro to Mechanical Engineering II', icon: 'gear', color: '#c2255c', dark: '#8c1a43',
    book: 'Wickert & Lewis, An Introduction to Mechanical Engineering · plus CAD and truss labs',
    exams: [
      { id: 'mech-mid', name: 'Midterm', units: ['m1', 'm2', 'm3', 'm4'], n: 20, mins: 50, note: 'Units 1–4' },
      { id: 'mech-fin', name: 'Final', units: ['m1', 'm2', 'm3', 'm4', 'm5', 'm6', 'm7', 'm8'], n: 25, mins: 75, note: 'Cumulative' },
    ],
  });

  /* ================= generators: Unit 1 ================= */
  CQ.gen('m.uconv', (R) => {
    const k = R.int(0, 6);
    const c = [
      () => { const v = R.pick([50, 100, 225, 500, 1200]); return ['A load of **' + v + ' lbf** is how many newtons? (1 lbf = 4.448 N)', v * 4.448, 'N', [v + ' lbf × [[4.448 N|1 lbf]] = **' + F(v * 4.448) + ' N**']]; },
      () => { const v = R.pick([0.25, 0.5, 1.5, 3.75]); return ['Convert **' + v + ' in** to millimeters. (1 in = 25.4 mm)', v * 25.4, 'mm', [v + ' × 25.4 = **' + F(v * 25.4) + ' mm**']]; },
      () => { const v = R.pick([30, 45, 100, 150, 3000]); return ['A tire pressure of **' + v + ' psi** is how many kPa? (1 psi = 6.895 kPa)', v * 6.895, 'kPa', [v + ' × 6.895 = **' + F(v * 6.895) + ' kPa**']]; },
      () => { const v = R.pick([5, 25, 150, 300, 500]); return ['A **' + v + ' hp** engine produces how many kW? (1 hp = 0.7457 kW)', v * 0.7457, 'kW', [v + ' × 0.7457 = **' + F(v * 0.7457) + ' kW**']]; },
      () => { const v = R.pick([20, 50, 120, 250]); return ['A bolt is tightened to **' + v + ' ft·lbf**. Express that torque in N·m. (1 ft = 0.3048 m, 1 lbf = 4.448 N)', v * 0.3048 * 4.448, 'N·m', ['1 ft·lbf = 0.3048 × 4.448 = 1.356 N·m', v + ' × 1.356 = **' + F(v * 1.3558) + ' N·m**']]; },
      () => { const v = R.pick([10, 60, 200]); return ['Convert **' + v + ' MPa** to ksi. (1 ksi = 6.895 MPa)', v / 6.895, 'ksi', [v + '/6.895 = **' + F(v / 6.895) + ' ksi**']]; },
      () => { const v = R.pick([5, 12, 30, 65]); return ['Convert **' + v + ' mi/h** to ft/s. (1 mi = 5280 ft)', (v * 5280) / 3600, 'ft/s', [v + ' × 5280/3600 = **' + F((v * 5280) / 3600) + ' ft/s**']]; },
    ][k]();
    return { t: 'num', q: c[0], a: c[1], unit: c[2], steps: c[3] };
  });

  CQ.gen('m.lbm', (R) => {
    const k = R.int(0, 2);
    if (k === 0) { const m = R.pick([10, 50, 150, 3000]); return { t: 'num', q: 'What is the mass in **slugs** of an object with a mass of **' + m + ' lbm**? (1 slug = 32.174 lbm)', a: m / 32.174, unit: 'slug', steps: [m + ' lbm × [[1 slug|32.174 lbm]] = **' + F(m / 32.174) + ' slug**'] }; }
    if (k === 1) { const m = R.pick([2, 5, 10, 25]); return { t: 'num', q: 'What is the weight (in lbf) of a **' + m + ' slug** object on Earth? (g = 32.2 ft/s²)', a: m * 32.174, unit: 'lbf', steps: ['w = mg = ' + m + ' slug × 32.174 ft/s²', '1 slug·ft/s² = 1 lbf → **' + F(m * 32.174) + ' lbf**'] }; }
    const kg = R.pick([1, 5, 20, 70, 1500]); return { t: 'num', q: 'A **' + kg + ' kg** object has a mass of how many lbm? (1 lbm = 0.4536 kg)', a: kg / 0.4536, unit: 'lbm', steps: [kg + '/0.4536 = **' + F(kg / 0.4536) + ' lbm**'] };
  });

  /* ================= generators: Unit 2 ================= */
  CQ.gen('m.comp', (R) => {
    const Fm = R.pick([100, 250, 400, 650, 800, 1200]), th = R.pick([20, 30, 35, 45, 60, 70, 120, 150]);
    const want = R.pick(['x', 'y']);
    const v = want === 'x' ? Fm * cos(th) : Fm * sin(th);
    return { t: 'num', q: 'A cable pulls on a bracket with **' + Fm + ' N** at **' + th + '°** above the +x axis. What is its **' + want + '-component**?', a: v, unit: 'N', abs: 0.5,
      steps: ['F' + (want === 'x' ? 'ₓ = F cos θ' : 'ᵧ = F sin θ'), '= ' + Fm + ' × ' + (want === 'x' ? 'cos' : 'sin') + ' ' + th + '° = **' + F(v) + ' N**'] };
  });

  CQ.gen('m.resultant', (R) => {
    const f = [[R.pick([200, 300, 400]), R.pick([0, 15, 30])], [R.pick([150, 250, 350]), R.pick([60, 75, 90, 120])], [R.pick([100, 200]), R.pick([200, 225, 250, 300])]];
    const n = R.pick([2, 3]);
    const fs = f.slice(0, n);
    const rx = fs.reduce((a, [m, t]) => a + m * cos(t), 0), ry = fs.reduce((a, [m, t]) => a + m * sin(t), 0);
    const want = R.pick(['mag', 'mag', 'ang']);
    let ang = deg(Math.atan2(ry, rx)); if (ang < 0) ang += 360;
    return { t: 'num', lvl: 4, q: n + ' forces act on an eyebolt: ' + fs.map(([m, t]) => '**' + m + ' N at ' + t + '°**').join(', ') + ' (angles from +x). Find the ' + (want === 'mag' ? '**magnitude** of the resultant.' : '**direction** of the resultant (degrees from +x, 0–360).'), a: want === 'mag' ? Math.hypot(rx, ry) : ang, unit: want === 'mag' ? 'N' : '°', abs: want === 'mag' ? 0.5 : 0.6,
      fig: D.fbd({ forces: fs.map(([m, t], i) => ({ a: t, len: 40 + m / 10, label: m + ' N', cls: ['c1', 'c2', 'c4'][i] })) }),
      steps: ['Rₓ = Σ F cos θ = ' + F(rx) + ' N', 'Rᵧ = Σ F sin θ = ' + F(ry) + ' N', want === 'mag' ? 'R = √(Rₓ² + Rᵧ²) = **' + F(Math.hypot(rx, ry)) + ' N**' : 'θ = atan2(Rᵧ, Rₓ) = **' + F(ang) + '°**'] };
  });

  CQ.gen('m.moment', (R) => {
    const Fm = R.pick([50, 80, 120, 200, 450]), d = R.pick([0.15, 0.25, 0.3, 0.4, 0.6]), th = R.pick([90, 60, 45, 30]);
    const M = Fm * d * sin(th);
    return { t: 'num', q: 'A **' + Fm + ' N** force is applied to a wrench **' + d * 100 + ' cm** from the bolt, at **' + th + '°** to the handle. What moment does it create about the bolt?', a: M, unit: 'N·m', fig: D.torque({ deg: th }),
      steps: ['Perpendicular distance (lever arm) = d sin θ = ' + d + ' × sin ' + th + '° = ' + F(d * sin(th)) + ' m', 'M = F × d⊥ = ' + Fm + ' × ' + F(d * sin(th)) + ' = **' + F(M) + ' N·m**'] };
  });

  CQ.gen('m.momentcomp', (R) => {
    const x = R.pick([0.2, 0.3, 0.5, 0.8]), y = R.pick([0.1, 0.25, 0.4]), Fx = R.pick([-150, -80, 60, 120]), Fy = R.pick([-200, -100, 90, 250]);
    const M = x * Fy - y * Fx;
    return { t: 'num', lvl: 4, q: 'A force **F = (' + Fx + ' N) î + (' + Fy + ' N) ĵ** acts at point **(' + x + ' m, ' + y + ' m)**. Find its moment about the origin (counterclockwise +).', a: M, unit: 'N·m', abs: 0.2,
      hint: 'Moment components method: M = x·Fᵧ − y·Fₓ.',
      steps: ['M = x·Fᵧ − y·Fₓ', '= (' + x + ')(' + Fy + ') − (' + y + ')(' + Fx + ')', 'M = **' + F(M) + ' N·m** ' + (M >= 0 ? '(counterclockwise)' : '(clockwise)')] };
  });

  CQ.gen('m.equil', (R) => {
    const W = R.pick([200, 400, 600, 900]), th = R.pick([30, 40, 45, 60]);
    const want = R.pick(['T', 'H']);
    const Tc = W / sin(th), H = W / Math.tan(rad(th));
    return { t: 'num', lvl: 3, q: 'A **' + W + ' N** sign hangs from the end of a light horizontal boom held by a cable at **' + th + '°** above the boom. Find the ' + (want === 'T' ? '**cable tension**.' : '**horizontal compressive force in the boom**.'), a: want === 'T' ? Tc : H, unit: 'N',
      steps: ['At the end joint: ΣFᵧ = 0 → T sin ' + th + '° = ' + W, 'T = ' + F(Tc) + ' N', 'ΣFₓ = 0 → boom force = T cos ' + th + '° = ' + F(H) + ' N', 'Answer: **' + F(want === 'T' ? Tc : H) + ' N**'] };
  });

  /* ================= generators: Unit 3 ================= */
  CQ.gen('m.reactions', (R) => {
    const L2 = R.pick([2, 3, 4, 5, 6]), P = R.pick([500, 800, 1200, 2000]), a = R.pick([0.5, 1, 1.5, 2].filter((x) => x < L2));
    const RB = (P * a) / L2, RA = P - RB;
    const want = R.pick(['A', 'B']);
    return { t: 'num', q: 'A **' + L2 + ' m** simply supported beam (pin at A, roller at B) carries a **' + P + ' N** load **' + a + ' m** from A. Find the reaction at **' + want + '**.', a: want === 'A' ? RA : RB, unit: 'N',
      fig: D.beam({ supports: [{ x: 0, type: 'pin', label: 'R_A' }, { x: 1, type: 'roller', label: 'R_B' }], loads: [{ x: a / L2, label: P + ' N' }], dims: [[0, a / L2, a + ' m']] }),
      hint: 'Sum moments about the support you are NOT solving for.',
      steps: ['ΣM_A = 0: R_B(' + L2 + ') − ' + P + '(' + a + ') = 0 → R_B = ' + F(RB) + ' N', 'ΣFᵧ = 0: R_A = ' + P + ' − ' + F(RB) + ' = ' + F(RA) + ' N', 'R_' + want + ' = **' + F(want === 'A' ? RA : RB) + ' N**'] };
  });

  CQ.gen('m.reactions2', (R) => {
    const L2 = R.pick([4, 5, 6, 8]), P1 = R.pick([400, 600, 1000]), a1 = R.pick([1, 1.5]), P2 = R.pick([300, 500, 800]), a2 = R.pick([3, 3.5]);
    if (a2 >= L2) return CQ.gens['m.reactions2'](R);
    const RB = (P1 * a1 + P2 * a2) / L2, RA = P1 + P2 - RB;
    const want = R.pick(['A', 'B']);
    return { t: 'num', lvl: 4, q: 'A **' + L2 + ' m** beam is pinned at A (left end) and on a roller at B (right end). It carries **' + P1 + ' N** at **' + a1 + ' m** and **' + P2 + ' N** at **' + a2 + ' m** from A. Find R_' + want + '.', a: want === 'A' ? RA : RB, unit: 'N',
      fig: D.beam({ supports: [{ x: 0, type: 'pin', label: 'R_A' }, { x: 1, type: 'roller', label: 'R_B' }], loads: [{ x: a1 / L2, label: P1 + ' N' }, { x: a2 / L2, label: P2 + ' N', cls: 'c4' }] }),
      steps: ['ΣM_A = 0: R_B(' + L2 + ') = ' + P1 + '(' + a1 + ') + ' + P2 + '(' + a2 + ')', 'R_B = ' + F(RB) + ' N', 'R_A = ' + (P1 + P2) + ' − ' + F(RB) + ' = ' + F(RA) + ' N', 'R_' + want + ' = **' + F(want === 'A' ? RA : RB) + ' N**'] };
  });

  CQ.gen('m.truss', (R) => {
    const P = R.pick([1000, 2000, 3000, 5000]), th = R.pick([30, 40, 45, 50, 60]);
    const fAC = P / (2 * sin(th)), fAB = fAC * cos(th);
    const want = R.pick(['AC', 'AB']);
    return { t: 'num', lvl: 4, exam: true, q: 'A symmetric triangular truss has supports at A and B and a **' + P + ' N** downward load at apex C. Members AC and BC make **' + th + '°** with the bottom chord AB. Find the force in member **' + want + '** (magnitude), and decide whether it\'s in tension or compression.', a: want === 'AC' ? fAC : fAB, unit: 'N',
      fig: D.truss({ deg: th, P: P + ' N' }),
      hint: 'Reactions are P/2 each by symmetry. Then do joint A: ΣFᵧ gives AC, ΣFₓ gives AB.',
      steps: ['By symmetry R_A = R_B = ' + P / 2 + ' N (up)', 'Joint A, ΣFᵧ = 0: F_AC sin ' + th + '° = ' + P / 2 + ' → F_AC = ' + F(fAC) + ' N (pushes on the joint, so **compression**)', 'Joint A, ΣFₓ = 0: F_AB = F_AC cos ' + th + '° = ' + F(fAB) + ' N (pulls on the joint, so **tension**)', want + ': **' + F(want === 'AC' ? fAC : fAB) + ' N**, ' + (want === 'AC' ? 'compression' : 'tension')] };
  });

  CQ.gen('m.lever', (R) => {
    const din = R.pick([0.2, 0.3, 0.45, 0.6]), dout = R.pick([0.02, 0.03, 0.05, 0.08]), Fin = R.pick([40, 60, 100, 150]);
    const MA = din / dout;
    const want = R.pick(['MA', 'Fout']);
    return { t: 'num', q: 'Bolt cutters: you squeeze **' + din * 100 + ' cm** from the pivot, and the jaws cut **' + dout * 100 + ' cm** from the pivot. ' + (want === 'MA' ? 'What is the mechanical advantage?' : 'If you squeeze with **' + Fin + ' N**, what force do the jaws apply?'), a: want === 'MA' ? MA : MA * Fin, unit: want === 'MA' ? '' : 'N',
      steps: ['Moment balance about the pivot: F_in·d_in = F_out·d_out', 'MA = d_in/d_out = ' + din + '/' + dout + ' = ' + F(MA), ...(want === 'Fout' ? ['F_out = MA × F_in = **' + F(MA * Fin) + ' N**'] : ['MA = **' + F(MA) + '**'])] };
  });

  /* ================= generators: Unit 4 ================= */
  const MATL = [['1020 steel', 200e9, 350e6, 30e6, 51e3], ['6061-T6 aluminum', 70e9, 275e6, 10e6, 40e3], ['Ti-6Al-4V titanium', 114e9, 880e6, 16.5e6, 128e3], ['brass', 100e9, 200e6, 15e6, 29e3]];
  CQ.gen('m.stress', (R) => {
    const d = R.pick([5, 8, 10, 12, 20]) / 1000, Fp = R.pick([2000, 5000, 10000, 25000]);
    const A = (PI * d * d) / 4, s = Fp / A;
    const comp = R.chance(0.3);
    return { t: 'num', q: 'A **' + d * 1000 + ' mm** diameter rod carries a **' + Fp + ' N** ' + (comp ? 'compressive' : 'tensile') + ' load. What is the normal stress, in MPa?', a: s / 1e6, unit: 'MPa',
      steps: ['A = πd²/4 = π(' + d + ')²/4 = ' + F(A) + ' m²', 'σ = F/A = ' + Fp + '/' + F(A) + ' = ' + F(s) + ' Pa', '= **' + F(s / 1e6) + ' MPa** (' + (comp ? 'compression' : 'tension') + ')'] };
  });

  CQ.gen('m.elong', (R) => {
    const [mat, E] = R.pick(MATL);
    const d = R.pick([6, 10, 12, 16]) / 1000, L2 = R.pick([0.5, 1, 1.5, 2]), Fp = R.pick([5000, 10000, 20000]);
    const A = (PI * d * d) / 4, dL = (Fp * L2) / (E * A);
    const want = R.pick(['dL', 'eps']);
    return { t: 'num', lvl: 3, q: 'A **' + mat + '** rod (E = ' + E / 1e9 + ' GPa), **' + L2 + ' m** long and **' + d * 1000 + ' mm** in diameter, carries **' + Fp + ' N** of tension. ' + (want === 'dL' ? 'How much does it stretch, in mm?' : 'What is the strain?'), a: want === 'dL' ? dL * 1000 : dL / L2, unit: want === 'dL' ? 'mm' : '',
      steps: ['A = πd²/4 = ' + F(A) + ' m²', 'σ = F/A = ' + F(Fp / A / 1e6) + ' MPa', 'ε = σ/E = ' + F(dL / L2), ...(want === 'dL' ? ['ΔL = εL = [[FL|EA]] = ' + F(dL) + ' m = **' + F(dL * 1000) + ' mm**'] : ['ε = **' + F(dL / L2) + '** (dimensionless)'])] };
  });

  CQ.gen('m.shear', (R) => {
    const dbl = R.chance(0.5), d = R.pick([6, 8, 10, 12, 16]) / 1000, Fp = R.pick([3000, 5000, 8000, 12000]);

      T('Why triangles?', `

2. Loads are applied only at **joints**
3. Member weights are neglected
So every member is a **two-force member**, with its force along the member's axis:
- **Tension (T):** the member pulls on its joints (it is being stretched)
- **Compression (C):** the member pushes on its joints (it is being squeezed)`, { fig: D.truss({ deg: 40 }) }),

5. Carry the known forces to the next joint
>! Steep members carry less force. Shallow trusses (small θ) see huge member forces, which is why bridge trusses are tall.`, { fig: D.truss({ deg: 45, P: 'P' }) }),
      EX('Apex-loaded triangle', 'A 2000 N load sits at the apex of a symmetric truss with 45° sides. Find F_AC and F_AB.', ['Reactions: R_A = R_B = 1000 N', 'Joint A, ΣFᵧ: F_AC sin 45° = 1000 → F_AC = 1414 N, pushing → **compression**', 'Joint A, ΣFₓ: F_AB = 1414 cos 45° = **1000 N tension**']),
      G('m.truss'),
      ORDER('Order the method-of-joints steps.', ['Solve the support reactions', 'Pick a joint with at most two unknown member forces', 'Draw unknowns as tension (away from the joint)', 'Apply ΣFₓ = 0 and ΣFᵧ = 0', 'Move to the next joint using the forces just found']),
      G('m.truss'),
      MC('Your joint equation gives a member force of −850 N, with tension assumed. The member is…', ['in compression, 850 N', 'in tension, 850 N', 'a zero-force member', 'overloaded'], 'Negative means the assumed direction was wrong: compression.'),
      G('m.truss'),
    ]),
    L('m3l4', 'Levers & Mechanical Advantage', {
      goal: 'Analyze levers, pliers and other simple machines with moment balance.',
      key: 'Moment balance about the pivot gives $F_{in}·d_{in} = F_{out}·d_{out}$, so the mechanical advantage is $MA = F_{out}/F_{in} = d_{in}/d_{out}$. Long handles and short jaws (pliers, bolt cutters) give a large force. The trade-off: the output moves a shorter distance (work in = work out, ideally). Lever classes: 1st (pivot between, like a seesaw or pliers), 2nd (load between, like a wheelbarrow), 3rd (effort between, like tweezers or your forearm).',
      formulas: ['MA = [[F_{out}|F_{in}]] = [[d_{in}|d_{out}]]', 'F_{in}d_{in} = F_{out}d_{out}'],
    }, [
      T('Trading distance for force', `
$$ F_{in} d_{in} = F_{out} d_{out}   ⇒   MA = [[d_{in}|d_{out}]] $$
| Class | Arrangement | Example |
|---|---|---|
| 1st | pivot between effort and load | pliers, seesaw |
| 2nd | load between pivot and effort | wheelbarrow, nutcracker |
| 3rd | effort between pivot and load | tweezers, your forearm |
>* There's no free lunch: a large MA means the output moves a short distance. Ideally the work in equals the work out.`),
      G('m.lever'),
      MC('Which lever class is a wheelbarrow?', ['2nd class', '1st class', '3rd class', 'not a lever'], 'Wheel = pivot, the load sits in the middle, you lift the handles.'),
      G('m.lever'),
      TF('A 3rd-class lever (like tweezers) has a mechanical advantage less than 1.', true, 'Effort is closer to the pivot than the load, so you trade force for motion.'),
      G('m.lever'),
    ]),
  ]);

  /* ================= Unit 4 ================= */
  const u4 = U('m4', 'Materials & Stresses', { sub: 'Stress, strain, shear & safety factor', ch: 'Ch 4' }, [
    L('m4l1', 'Tension & Compression Stress', {
      goal: 'Compute normal stress in rods and bars.',
      key: 'Normal stress = internal force per cross-sectional area: $σ = F/A$. Tension is positive and compression negative. Units: Pa = N/m² (often MPa = N/mm²) or psi = lbf/in² (ksi = 1000 psi). For a round rod, $A = πd²/4$. Stress, not force, decides whether a part fails, so a thin rod and a thick rod with the same load have very different stresses.',
      formulas: ['σ = [[F|A]]', 'A_{circle} = [[πd²|4]]', '1 MPa = 1 N/mm² · 1 ksi = 6.895 MPa'],
    }, [
      T('Force spread over area', `
$$ σ = [[F|A]] :: normal stress $$
- **Tension** (+): the member is pulled
- **Compression** (−): the member is pushed
Units: **MPa = N/mm²** is handy, because you can use forces in N and areas in mm² directly.
>! Use the **diameter** correctly: A = πd²/4, not πd². A wrong area is the most common stress mistake.`),
      EX('Hanging load', 'A 10 mm diameter steel rod holds 8.0 kN. Find σ.', ['A = π(10)²/4 = 78.5 mm²', 'σ = 8000 N / 78.5 mm² = **102 MPa** (tension)']),
      G('m.stress'),
      MC('If you double the diameter of a rod under the same load, the stress becomes…', ['¼ as large', '½ as large', 'the same', '2 times larger'], 'Area ∝ d², so 4× the area means ¼ the stress.'),
      G('m.stress'),
      TF('1 MPa equals 1 N/mm².', true, '10⁶ N/m² = 1 N/(10⁻³ m)².'),
      G('m.stress'),
    ]),
    L('m4l2', 'Strain & Hooke\'s Law', {
      goal: 'Relate stress, strain and elongation with the elastic modulus.',
      key: 'Strain is the fractional elongation: $ε = ΔL/L$ (dimensionless). In the elastic region, Hooke\'s law gives $σ = Eε$, where E is the elastic (Young\'s) modulus: steel ≈ 200 GPa (30 Mpsi), aluminum ≈ 70 GPa (10 Mpsi), titanium ≈ 114 GPa. Combined: $ΔL = FL/(EA)$. Stiffness (E) is not the same as strength (S_y): aluminum alloys can be strong but are still only ⅓ as stiff as steel.',
      formulas: ['ε = [[ΔL|L]]', 'σ = Eε', 'ΔL = [[FL|EA]]'],
    }, [
      T('Stretchiness and stiffness', `
$$ ε = [[ΔL|L]]   ·   σ = Eε   ⇒   ΔL = [[F L|E A]] $$
| Material | E (GPa) | E (Mpsi) |
|---|---|---|
| steel | 200 | 30 |
| titanium | 114 | 16.5 |
| aluminum | 70 | 10 |
| polymers | 1–3 | 0.2–0.5 |
>! **Stiffness ≠ strength.** E tells you how much it stretches. Yield strength tells you when it permanently deforms.`),
      G('m.elong'),
      MC('An aluminum rod and a steel rod are identical in size and load. Which stretches more?', ['aluminum, by about 3×', 'steel', 'they stretch equally', 'neither stretches'], 'ΔL ∝ 1/E, and E_Al ≈ ⅓ E_steel.'),
      G('m.elong'),
      TF('Strain has units of millimeters.', false, 'Strain is length/length: dimensionless.'),
      G('m.elong'),
    ]),
    L('m4l3', 'Stress–Strain Curve & Material Behavior', {
      goal: 'Read a stress–strain curve and tell ductile from brittle behavior.',
      key: 'Tensile-test curve: a linear elastic region (slope E) up to the proportional/elastic limit. Unloading in this region returns the part to its original length. The **yield strength** S_y is where permanent (plastic) deformation begins, and it is the usual design limit. The **ultimate strength** S_u is the maximum stress. Then necking and fracture. Ductile materials (steel, aluminum) deform a lot before fracture, giving a visible warning. Brittle materials (cast iron, glass, ceramics) fracture with little deformation. Poisson\'s ratio $ν = −ε_{lateral}/ε_{axial}$ (about 0.3 for metals): stretching makes a bar thinner.',
      formulas: ['S_y: yield (design limit)', 'S_u: ultimate (maximum)', 'ν = −[[ε_{lat}|ε_{axial}]] ≈ 0.3'],
    }, [
      T('Reading the curve', `
Pull a sample until it breaks:
1. **Elastic region:** straight line, slope = E. Release the load and it springs back.
2. **Yield point (S_y):** permanent deformation starts. **Design to stay below this.**
3. **Plastic region:** strain hardening up to **ultimate strength (S_u)**
4. **Necking and fracture**
**Ductile** (steel, aluminum, copper): big plastic region, bends before breaking.
**Brittle** (glass, cast iron, ceramics): breaks with almost no plastic strain.`, { fig: D.stressStrain() }),
      MATCH('Match each point on the stress–strain curve to its meaning.', [['slope of the linear region', 'elastic modulus E'], ['yield strength', 'start of permanent deformation'], ['ultimate strength', 'maximum stress'], ['fracture', 'the sample breaks']]),
      MC('Which stress do designers usually keep parts below?', ['the yield strength', 'the ultimate strength', 'the fracture stress', 'the elastic modulus'], 'Above yield, parts permanently deform, which counts as failure in most designs.'),
      MC('Which material is **brittle**?', ['glass', 'mild steel', 'copper', 'aluminum'], 'Glass fractures with almost no plastic deformation.'),
      G('m.poisson'),
      TF('A ductile material gives visible warning (stretching or bending) before it fractures.', true, 'Its large plastic region shows up as obvious deformation.'),
    ]),
    L('m4l4', 'Shear Stress', {
      goal: 'Compute shear stress in pins and bolts in single and double shear.',
      key: 'Shear stress = force parallel to a surface divided by that area: $τ = V/A$. For a pin or bolt, the shear area is its cross-section, $A = πd²/4$, at each shear plane. **Single shear** (two overlapping plates): 1 plane, $τ = F/A$. **Double shear** (clevis, 3 plates): 2 planes share the load, $τ = F/(2A)$, so the same pin carries twice the load. Shear strength is roughly 0.5–0.6 × S_y for ductile metals.',
      formulas: ['τ = [[V|A]]', 'single: τ = [[F|A]] · double: τ = [[F|2A]]'],
    }, [
      T('Slicing forces', `
When forces try to slide one part of a material past another, they create **shear stress**:
$$ τ = [[V|A]] $$
**Pins and bolts:** count the planes where the pin could be cut.
- **Single shear** (two plates overlap): 1 plane → $τ = F/A$
- **Double shear** (a clevis, 3 plates): 2 planes → $τ = F/(2A)$
>* Same pin, same load: double shear halves the stress. That's why clevis joints are everywhere.`, { fig: D.shear({ double: true }) }),
      G('m.shear'),
      MC('A clevis joint puts its pin in double shear. Compared with single shear, the pin\'s shear stress for the same load is…', ['half', 'double', 'the same', 'a quarter'], 'Two planes share the load.'),
      G('m.shear'),
      TF('In shear, the force is perpendicular to the area that resists it.', false, 'Shear forces act parallel to the area. Normal stresses are perpendicular.'),
      G('m.shear'),
    ]),
    L('m4l5', 'Materials Selection & Factor of Safety', {
      goal: 'Choose material families and design with a factor of safety.',
      key: 'Material families: metals (strong, stiff, ductile, conduct: steel, aluminum, titanium), polymers (light, cheap, low E, temperature-limited), ceramics (hard, heat-resistant, brittle), composites (fibers in a matrix, high strength-to-weight: carbon fiber, fiberglass). Selection weighs strength, stiffness, density, cost, manufacturability and environment. Factor of safety: $FS = S_y/σ_{actual}$ (failure stress ÷ working stress). Design: allowable stress = S_y/FS, and required area = F/σ_allow. Typical FS is 1.5–4, higher for uncertain loads or materials or for life-safety parts.',
      formulas: ['FS = [[S_y|σ]]', 'σ_{allow} = [[S_y|FS]]', 'A_{req} = [[F|σ_{allow}]]'],
    }, [
      T('Pick the right stuff', `
| Family | Strengths | Weaknesses | Examples |
|---|---|---|---|
| metals | strong, stiff, ductile | heavy (steel), corrosion | steel, Al, Ti |
| polymers | light, cheap, easy to mold | low stiffness, heat limits | ABS, nylon |
| ceramics | hard, heat- and wear-resistant | brittle | alumina, SiC |
| composites | high strength/weight | cost, hard to repair | carbon fiber |`),
      T('Factor of safety', `
$$ FS = [[S_y|σ_{working}]] $$
FS = 2 means the part could take twice the expected stress before yielding.
**Sizing a part:** $σ_{allow} = S_y/FS$, then $A = F/σ_{allow}$, then pick the next standard size up.
>! FS < 1 means the part is predicted to yield. Higher FS is chosen when loads are uncertain or a failure would hurt people.`),
      G('m.fs'),
      MC('Which material family gives the best strength-to-weight ratio for a race-car body?', ['composites (carbon fiber)', 'ceramics', 'cast iron', 'unreinforced polymers'], 'Carbon-fiber composites are extremely strong for their weight.'),
      G('m.fs'),
      MC('A part has S_y = 300 MPa and a working stress of 100 MPa. Its factor of safety is…', ['3', '0.33', '200', '30'], 'FS = 300/100.'),
      G('m.fs'),
      TF('A factor of safety of 0.8 means the part is expected to yield.', true, 'The working stress exceeds the yield strength.'),
    ]),
  ]);

  CQ.addUnits('mech', [u1, u2, u3, u4]);
})();

<script>
/* content/mech-2.js */
/* MECH 1208 · Units 5–8: fluids, thermal & energy systems, motion & power transmission,
   design / drawings / CAD (Wickert & Lewis Ch 5–8, plus SolidWorks) */
(function () {
  const CQ = window.CQ;
  const { L, U, T, EX, MC, MULTI, TF, NUM, TXT, FILL, MATCH, ORDER, G } = CQ.dsl;
  const F = (x, s = 3) => CQ.fmt(x, s);
  const D = CQ.dg;
  const PI = Math.PI;
  const g = 9.81;

  /* ================= generators: Unit 5 ================= */
  CQ.gen('m.hydro', (R) => {
    const k = R.int(0, 1);
    if (k === 0) { const h = R.pick([2, 5, 10, 25, 50, 100]); const p = 1000 * g * h; return { t: 'num', q: 'What is the **gauge** pressure at a depth of **' + h + ' m** in fresh water (ρ = 1000 kg/m³)? Answer in kPa.', a: p / 1000, unit: 'kPa', steps: ['p_gauge = ρgh = 1000 × 9.81 × ' + h, '= ' + F(p) + ' Pa = **' + F(p / 1000) + ' kPa**'] }; }
    const h = R.pick([3, 10, 30]); const p = 101.3 + (1025 * g * h) / 1000;
    return { t: 'num', lvl: 3, q: 'A diver is **' + h + ' m** below the surface of seawater (ρ = 1025 kg/m³). What is the **absolute** pressure on her, in kPa? (atmospheric = 101.3 kPa)', a: p, unit: 'kPa', steps: ['p_abs = p_atm + ρgh', '= 101.3 + 1025(9.81)(' + h + ')/1000', '= **' + F(p) + ' kPa**'], why: 'Every 10 m of water adds about one atmosphere.' };
  });

  CQ.gen('m.buoy', (R) => {
    const k = R.int(0, 1);
    if (k === 0) { const V = R.pick([0.002, 0.01, 0.05, 0.2]); return { t: 'num', q: 'A sealed **' + V * 1000 + ' L** container is held completely under fresh water. What buoyant force acts on it?', a: 1000 * g * V, unit: 'N', fig: D.buoy(), steps: ['F_B = ρ_fluid g V_displaced', '= 1000 × 9.81 × ' + V + ' = **' + F(1000 * g * V) + ' N**'] }; }
    const rho = R.pick([600, 700, 850, 920]), fl = R.pick([['fresh water', 1000], ['seawater', 1025]]);
    return { t: 'num', lvl: 3, q: 'A block with density **' + rho + ' kg/m³** floats in ' + fl[0] + ' (ρ = ' + fl[1] + ' kg/m³). What fraction of its volume is submerged? (decimal)', a: rho / fl[1], unit: '', fig: D.buoy(),
      steps: ['Floating: F_B = W → ρ_fluid g V_sub = ρ_block g V', 'V_sub/V = ρ_block/ρ_fluid = **' + F(rho / fl[1]) + '**'], why: rho === 920 ? 'That\'s why about 90% of an iceberg is underwater.' : '' };
  });

  CQ.gen('m.re', (R) => {
    const fl = R.pick([['water', 1000, 1.0e-3], ['air', 1.2, 1.8e-5], ['SAE 30 oil', 917, 0.26]]);
    const v = R.pick([0.1, 0.5, 1, 2, 5]), d = R.pick([0.01, 0.025, 0.05, 0.1]);
    const Re = (fl[1] * v * d) / fl[2];
    const regime = Re < 2000 ? 'laminar' : Re > 4000 ? 'turbulent' : 'transitional';
    if (R.chance(0.5)) return { t: 'num', lvl: 3, q: fl[0][0].toUpperCase() + fl[0].slice(1) + ' (ρ = ' + fl[1] + ' kg/m³, μ = ' + F(fl[2], 2) + ' kg/(m·s)) flows at **' + v + ' m/s** through a pipe of diameter **' + d * 100 + ' cm**. What is the Reynolds number?', a: Re, unit: '',
      steps: ['Re = [[ρvd|μ]]', '= (' + fl[1] + ')(' + v + ')(' + d + ')/' + F(fl[2], 2), 'Re = **' + F(Re) + '** → ' + regime] };
    return { t: 'mc', lvl: 3, q: fl[0][0].toUpperCase() + fl[0].slice(1) + ' (ρ = ' + fl[1] + ', μ = ' + F(fl[2], 2) + ' SI) flows at **' + v + ' m/s** in a **' + d * 100 + ' cm** pipe. The flow is…', opts: [regime].concat(['laminar', 'turbulent', 'transitional'].filter((x) => x !== regime)),
      steps: ['Re = ρvd/μ = ' + F(Re), 'Pipe flow: Re < ~2000 laminar, > ~4000 turbulent'] };
  });

  CQ.gen('m.drag', (R) => {
    const v = R.pick([15, 20, 25, 30, 35]), A = R.pick([1.8, 2.0, 2.2, 2.5]), Cd = R.pick([0.25, 0.3, 0.35, 0.45]);
    const Fd = 0.5 * 1.2 * v * v * A * Cd;
    const want = R.pick(['F', 'P']);
    return { t: 'num', lvl: want === 'P' ? 4 : 3, q: 'A car with frontal area **' + A + ' m²** and drag coefficient **C_D = ' + Cd + '** drives at **' + v + ' m/s** through air (ρ = 1.2 kg/m³). ' + (want === 'F' ? 'What is the drag force?' : 'How much power (kW) goes into overcoming drag?'), a: want === 'F' ? Fd : (Fd * v) / 1000, unit: want === 'F' ? 'N' : 'kW',
      steps: ['F_D = ½ρv²AC_D = ½(1.2)(' + v + ')²(' + A + ')(' + Cd + ') = ' + F(Fd) + ' N', ...(want === 'P' ? ['P = F_D v = ' + F(Fd) + ' × ' + v + ' = ' + F(Fd * v) + ' W = **' + F((Fd * v) / 1000) + ' kW**'] : ['F_D = **' + F(Fd) + ' N**'])],
      why: 'Drag grows with v², and drag power with v³. That\'s why highway speed costs so much fuel.' };
  });

  CQ.gen('m.flow', (R) => {
    const d1 = R.pick([4, 5, 6, 8, 10]) / 100, d2r = R.pick([0.5, 0.4, 0.6]), v1 = R.pick([0.5, 1, 1.5, 2]);
    const d2 = d1 * d2r;
    const want = R.pick(['v2', 'Q']);
    const A1 = (PI * d1 * d1) / 4, Q = A1 * v1, v2 = v1 / (d2r * d2r);
    if (want === 'Q') return { t: 'num', q: 'Water flows at **' + v1 + ' m/s** in a pipe with inner diameter **' + d1 * 100 + ' cm**. What is the volumetric flow rate in liters per second?', a: Q * 1000, unit: 'L/s', steps: ['A = πd²/4 = ' + F(A1) + ' m²', 'Q = Av = ' + F(Q) + ' m³/s = **' + F(Q * 1000) + ' L/s**'] };
    return { t: 'num', lvl: 3, q: 'Water flows at **' + v1 + ' m/s** in a **' + d1 * 100 + ' cm** pipe, which narrows to **' + F(d2 * 100) + ' cm**. How fast does it flow in the narrow section?', a: v2, unit: 'm/s', fig: D.pipe(),
      steps: ['Continuity: A₁v₁ = A₂v₂', 'v₂ = v₁(d₁/d₂)² = ' + v1 + ' × (' + F(1 / d2r) + ')² = **' + F(v2) + ' m/s**'] };
  });

  /* ================= generators: Unit 6 ================= */
  CQ.gen('m.energy', (R) => {
    const k = R.int(0, 3);
    if (k === 0) { const kwh = R.pick([1, 2.5, 10, 30]); return { t: 'num', q: 'How many megajoules are in **' + kwh + ' kWh**?', a: kwh * 3.6, unit: 'MJ', steps: ['1 kWh = 1000 W × 3600 s = 3.6 × 10⁶ J', kwh + ' × 3.6 = **' + F(kwh * 3.6) + ' MJ**'] }; }
    if (k === 1) { const btu = R.pick([1000, 5000, 12000, 100000]); return { t: 'num', q: 'An air conditioner is rated at **' + btu + ' Btu**. How many kJ is that? (1 Btu = 1.055 kJ)', a: btu * 1.055, unit: 'kJ', steps: [btu + ' × 1.055 = **' + F(btu * 1.055) + ' kJ**'] }; }
    if (k === 2) { const P = R.pick([60, 100, 1200, 1500]), h = R.pick([2, 5, 8, 24]); return { t: 'num', q: 'A **' + P + ' W** device runs for **' + h + ' h**. How much energy does it use, in kWh?', a: (P * h) / 1000, unit: 'kWh', steps: ['E = Pt = ' + P / 1000 + ' kW × ' + h + ' h = **' + F((P * h) / 1000) + ' kWh**'] }; }
    const m = R.pick([1, 5, 20, 50]), dT = R.pick([10, 25, 50, 80]); return { t: 'num', lvl: 3, q: 'How much heat (kJ) raises **' + m + ' kg** of water by **' + dT + ' °C**? (c = 4.19 kJ/kg·°C)', a: m * 4.19 * dT, unit: 'kJ', steps: ['Q = mcΔT = ' + m + ' × 4.19 × ' + dT + ' = **' + F(m * 4.19 * dT) + ' kJ**'] };
  });

  CQ.gen('m.eff', (R) => {
    const k = R.int(0, 2);
    if (k === 0) { const e = [R.pick([0.35, 0.4, 0.45]), R.pick([0.9, 0.95]), R.pick([0.85, 0.9])]; const tot = e[0] * e[1] * e[2]; return { t: 'num', lvl: 3, q: 'A power plant converts fuel energy with **' + e[0] * 100 + '%** efficiency, its generator is **' + e[1] * 100 + '%** efficient, and transmission loses enough to be **' + e[2] * 100 + '%** efficient. What is the overall efficiency (%)?', a: tot * 100, unit: '%', steps: ['Efficiencies in series multiply', 'η = ' + e.join(' × ') + ' = **' + F(tot * 100) + '%**'] }; }
    if (k === 1) { const P = R.pick([50, 100, 150]), eta = R.pick([0.25, 0.3, 0.35]), HV = 45; const fuel = (P / eta / (HV * 1000)) * 3600; return { t: 'num', lvl: 4, exam: true, q: 'An engine with **' + eta * 100 + '%** efficiency delivers **' + P + ' kW** of shaft power. Gasoline has a heating value of **45 MJ/kg**. How many kg of fuel does it burn per hour?', a: fuel, unit: 'kg/h', steps: ['Fuel power needed = ' + P + '/' + eta + ' = ' + F(P / eta) + ' kW', 'Fuel rate = ' + F(P / eta) + ' kJ/s ÷ 45,000 kJ/kg = ' + F(P / eta / 45000) + ' kg/s', '× 3600 = **' + F(fuel) + ' kg/h**'] }; }
    const In = R.pick([500, 1000, 1500]), Out = In * R.pick([0.6, 0.75, 0.85]); return { t: 'num', q: 'An electric motor draws **' + In + ' W** and delivers **' + F(Out) + ' W** of mechanical power. What is its efficiency (%)?', a: (100 * Out) / In, unit: '%', steps: ['η = output/input = ' + F(Out) + '/' + In + ' = **' + F((100 * Out) / In) + '%**'] };
  });

  CQ.gen('m.cond', (R) => {
    const mats = [['brick', 0.7], ['glass', 0.8], ['concrete', 1.4], ['fiberglass insulation', 0.04], ['wood', 0.15], ['steel', 50]];
    const [mat, k] = R.pick(mats);
    const A = R.pick([1, 2, 5, 10]), Lw = R.pick([0.005, 0.01, 0.05, 0.1, 0.2]), dT = R.pick([10, 20, 30]);
    const q = (k * A * dT) / Lw;
    return { t: 'num', lvl: 3, q: 'Heat conducts through a **' + mat + '** panel (κ = ' + k + ' W/m·°C), **' + A + ' m²** in area and **' + Lw * 100 + ' cm** thick, with a **' + dT + ' °C** temperature difference across it. What is the heat flow rate?', a: q, unit: 'W', fig: D.wall(),
      steps: ['Fourier\'s law: q = [[κAΔT|L]]', '= (' + k + ')(' + A + ')(' + dT + ')/' + Lw, 'q = **' + F(q) + ' W**'] };
  });

  CQ.gen('m.carnot', (R) => {
    const Th = R.pick([400, 500, 600, 800, 1000]), Tl = R.pick([20, 25, 30]);
    const eta = 1 - (Tl + 273) / (Th + 273);
    return { t: 'num', lvl: 3, q: 'A heat engine runs between a hot source at **' + Th + ' °C** and the environment at **' + Tl + ' °C**. What is its maximum (Carnot) efficiency, in %?', a: eta * 100, unit: '%',
      steps: ['Convert to kelvin: T_h = ' + (Th + 273) + ' K, T_l = ' + (Tl + 273) + ' K', 'η_Carnot = 1 − T_l/T_h = 1 − ' + (Tl + 273) + '/' + (Th + 273), 'η = **' + F(eta * 100) + '%**'], why: 'Real engines reach only a fraction of the Carnot limit.' };
  });

  CQ.gen('m.engine', (R) => {
    const Qh = R.pick([1000, 2000, 5000, 8000]), eta = R.pick([0.2, 0.25, 0.3, 0.4]);
    const W = Qh * eta;

      G('m.power'),
    ]),
    L('m7l3', 'Gear Types & Gear Ratio', {
      goal: 'Name gear types and compute speed and torque through a gear pair.',
      key: 'Gear types: spur (parallel shafts, straight teeth), helical (parallel shafts, angled teeth, quieter), bevel (intersecting shafts, usually 90°), worm (perpendicular shafts, high reduction, often self-locking), rack and pinion (rotation ↔ translation). For a meshing pair: velocity ratio $VR = ω_{in}/ω_{out} = N_{out}/N_{in}$. The output turns in the opposite direction (external mesh). Ideal torque: $T_{out} = T_{in} × VR$ (power is conserved). Rack speed: v = r_pinion × ω.',
      formulas: ['VR = [[ω_{in}|ω_{out}]] = [[N_{out}|N_{in}]]', 'T_{out} = T_{in} × VR', 'rack: v = rω'],
    }, [
      T('Meet the gears', `
| Type | Shafts | Notes |
|---|---|---|
| spur | parallel | simplest, can be noisy |
| helical | parallel | angled teeth, smoother and quieter |
| bevel | intersecting (usually 90°) | cone-shaped, car differentials |
| worm | perpendicular, offset | huge reduction, often self-locking |
| rack & pinion | rotation ↔ translation | car steering |`),
      T('Teeth set the ratio', `
Meshing teeth move at the same pitch-line speed, so the gear with **more teeth turns slower**:
$$ VR = [[ω_{in}|ω_{out}]] = [[N_{out}|N_{in}]] $$
$$ T_{out} = T_{in} × VR :: ideal, no friction $$
>* A small pinion driving a big gear is a **speed reducer**: slower, but more torque.
>! Two external gears turn in **opposite** directions.`, { fig: D.gears({ n1: 12, n2: 30 }) }),
      MATCH('Match the gear type to its use.', [['bevel', 'turns power 90° (differentials)'], ['worm', 'big reduction, self-locking'], ['rack and pinion', 'rotation to straight-line motion'], ['helical', 'quiet, parallel shafts']]),
      G('m.gear'),
      G('m.gear'),
      G('m.rack'),
      TF('In a two-gear external mesh, both gears turn in the same direction.', false, 'They turn in opposite directions.'),
      G('m.gear'),
    ]),
    L('m7l4', 'Gear Trains', {
      goal: 'Analyze simple and compound gear trains.',
      key: 'Simple train (each shaft has one gear): VR = N_last/N_first. Idler gears in between don\'t change the ratio, they only reverse the direction. Compound train (two gears share a shaft and turn together): the overall VR = product of each stage\'s (N_driven/N_driver). Large reductions in a small space need compound trains. Direction: each external mesh reverses rotation.',
      formulas: ['simple: VR = [[N_{last}|N_{first}]]', 'compound: VR = Π [[N_{driven}|N_{driver}]]'],
    }, [
      T('Stacking reductions', `
**Simple train:** idler gears only flip the direction. The ratio depends on the first and last gears alone.
**Compound train:** two gears on one shaft turn at the **same speed**, so stage ratios **multiply**:
$$ VR = [[N₂|N₁]] × [[N₄|N₃]] $$
>* Two 3:1 stages give 9:1 in a compact package. A single 9:1 pair would need a huge gear.`, { fig: D.train() }),
      EX('Two-stage reducer', 'Gear 1 (15 T) drives gear 2 (45 T). Gear 3 (12 T) shares gear 2\'s shaft and drives gear 4 (48 T). Input is 1800 rpm. Find the output speed.', ['Stage 1: 45/15 = 3', 'Stage 2: 48/12 = 4', 'VR = 12 → output = 1800/12 = **150 rpm**, with 12× the torque (ideal)']),
      G('m.train'),
      MC('Adding an idler gear between a driver and a driven gear…', ['reverses the output direction but doesn\'t change the ratio', 'doubles the ratio', 'halves the output torque', 'has no effect at all'], 'Its teeth cancel out of the ratio.'),
      G('m.train'),
      TF('In a compound gear train, gears on the same shaft rotate at the same speed.', true, 'They are locked together.'),
      MC('A simple train has three gears in a row: 20 T → 40 T (idler) → 60 T. The overall velocity ratio is…', ['3', '6', '2', '1.5'], 'The idler cancels: VR = N_last/N_first = 60/20 = 3.', { lvl: 2 }),
      G('m.train'),
    ]),
    L('m7l5', 'Belts, Chains & Machine Elements', {
      goal: 'Analyze belt drives and recognize common machine elements.',
      key: 'Belt and chain drives transmit power between distant parallel shafts. With no slip, the belt speed is the same on both pulleys: $ω₁d₁ = ω₂d₂$, and both turn the same direction (open belt). V-belts grip by wedging, timing belts and chains don\'t slip. Machine elements: bearings (rolling-element ball/roller bearings or sliding journal bearings) support rotating shafts. Fasteners (bolts, screws, rivets). Springs store energy. Keys and couplings connect shafts to hubs or to other shafts. Shafts carry torque.',
      formulas: ['ω₁d₁ = ω₂d₂', 'belt: same direction'],
    }, [
      T('Belts, chains and the parts that hold machines together', `
**Belt drive:** belt speed is shared, so $ω₁ d₁ = ω₂ d₂$. Bigger pulley, slower shaft.
| Element | Job |
|---|---|
| ball / roller bearing | supports a spinning shaft with low friction |
| journal bearing | shaft rides on a fluid film |
| key | locks a gear or pulley to a shaft |
| coupling | joins two shafts end to end |
| bolt / screw | clamps parts together |
| spring | stores energy, provides force |
>* Chains and timing belts can't slip, so they keep shafts synchronized (like an engine's camshaft).`),
      G('m.belt'),
      MATCH('Match the machine element to its job.', [['bearing', 'supports a rotating shaft'], ['key', 'locks a pulley to its shaft'], ['coupling', 'connects two shafts end-to-end'], ['spring', 'stores mechanical energy']]),
      G('m.belt'),
      MC('Why use a timing belt or chain instead of a flat belt to drive an engine\'s camshaft?', ['They can\'t slip, so they keep the shafts in sync', 'They are always cheaper', 'They need no maintenance', 'They reverse the direction of rotation'], 'Positive engagement means no slip.'),
      TF('In an open belt drive, both pulleys rotate in the same direction.', true, 'Only a crossed belt reverses the direction.'),
    ]),
  ]);

  /* ================= Unit 8 ================= */
  const u8 = U('m8', 'Design, Drawings & CAD', { sub: 'Design process, multiview drawings, SolidWorks & manufacturing', ch: 'Ch 2 & 8 · SolidWorks' }, [
    L('m8l1', 'The Design Process', {
      goal: 'Walk a project from need to product and pick concepts with a decision matrix.',
      key: 'Design process: (1) recognize the need and define the problem, (2) research background (existing products, patents, standards), (3) set requirements (functional, measurable targets) and constraints (limits such as budget, size, regulations), (4) generate concepts (brainstorming, sketches, many ideas before judging), (5) evaluate and select (weighted decision matrix), (6) detailed design (analysis, CAD, materials, drawings), (7) prototype and test, (8) production, documentation and communication. It is iterative: testing sends you back to earlier steps.',
      formulas: ['need → research → requirements → concepts → select → detail → prototype → production', 'weighted score = Σ(weight × score)'],
    }, [
      T('From "we need…" to a real product', `
1. **Define the problem.** What's the need, and who's the user?
2. **Research.** Existing solutions, patents, standards
3. **Requirements & constraints.** Measurable goals (lift 50 kg) and hard limits (under 200 dollars, under 2 kg)
4. **Conceptual design.** Brainstorm many concepts and sketch them
5. **Evaluate & select.** Decision matrix
6. **Detailed design.** Analysis, CAD, material choice, drawings
7. **Prototype & test.** Does it meet the requirements?
8. **Production & documentation**
>* It's a **loop**, not a line. Failed tests send you back to concepts or details.`),
      T('Decision matrix', `
Score each concept on each criterion, multiply by the criterion's weight, and add:
| Criterion (weight) | Concept A | Concept B |
|---|---|---|
| cost (0.4) | 8 | 6 |
| weight (0.3) | 5 | 9 |
| durability (0.3) | 7 | 7 |
| **weighted total** | **6.8** | **7.2** |
>! Weights must reflect what the customer cares about, and they should add to 1.`),
      ORDER('Put the design-process stages in order.', ['Define the problem and need', 'Research background and existing solutions', 'Set requirements and constraints', 'Generate and evaluate concepts', 'Detailed design', 'Prototype and test']),
      G('m.decision'),
      MC('"The device must weigh less than 2 kg" is best described as a…', ['constraint', 'concept', 'prototype', 'test result'], 'A hard limit the design must satisfy.'),
      TF('In brainstorming, you should criticize weak ideas immediately to save time.', false, 'Defer judgment and generate many ideas first. Evaluate later.'),
      G('m.decision'),
      MC('Why is the design process called iterative?', ['Testing and analysis often send you back to earlier steps to improve the design', 'Every step is done exactly once in order', 'Designs are copied from previous products', 'Only the final step matters'], 'Each loop refines the design.'),
    ]),
    L('m8l2', 'Sketching & Orthographic Views', {
      goal: 'Read and create multiview (orthographic) drawings and isometric sketches.',
      key: 'Orthographic projection shows true-size 2D views looking straight at each face. US standard (third-angle projection): the front view is in the center, the top view directly ABOVE it, and the right-side view directly to its RIGHT. Views line up: width is shared by front and top, height by front and right. Line types: visible edges are thick solid, hidden edges are dashed, center lines are long-short-long dashes (axes of holes and cylinders). Isometric views show three faces at once, with the axes 120° apart.',
      formulas: ['third-angle: top above front, right to the right', 'visible: solid · hidden: dashed · center: long-short'],
    }, [
      T('Three views tell the whole story', `
**Third-angle projection** (US standard):
- **Front view**: the most descriptive view, placed in the center
- **Top view**: directly **above** the front view
- **Right-side view**: directly **to the right** of the front view
Views are **aligned**: front and top share width, front and right share height.
| Line | Looks like | Means |
|---|---|---|
| visible | thick solid | edge you can see |
| hidden | short dashes | edge behind material |
| center | long–short–long | axis of a hole or cylinder |`, { fig: D.ortho() }),
      MC('In a third-angle (US) multiview drawing, where is the top view placed?', ['directly above the front view', 'directly below the front view', 'to the left of the front view', 'anywhere convenient'], 'Top above, right side to the right.'),
      MATCH('Match the line type to its meaning.', [['thick solid line', 'visible edge'], ['dashed line', 'hidden edge'], ['long–short–long dash', 'center line / axis'], ['thin line with arrows', 'dimension line']]),
      MC('Which two views share the object\'s **height** dimension?', ['front and right side', 'front and top', 'top and right side', 'all three equally'], 'Height runs vertically in both the front and side views.'),
      TF('A hidden line represents an edge that is behind visible material in that view.', true, 'Drawn dashed.'),
      MC('An isometric drawing shows…', ['three faces of an object at once, axes 120° apart', 'only one face at true size', 'a cross-section', 'the object from directly above'], 'Pictorial view for quick visualization.'),
    ]),
    L('m8l3', 'CAD Modeling Workflow', {
      goal: 'Know the SolidWorks workflow from sketch to assembly and drawing.',
      key: 'Parametric solid modeling (SolidWorks): (1) choose a plane (Front/Top/Right), (2) sketch a 2D profile, (3) fully define it with dimensions and geometric relations (horizontal, coincident, tangent, equal). A fully defined sketch turns black, an under-defined one stays blue. (4) Add features: Extruded Boss/Base, Extruded Cut, Revolve, Sweep, Loft, Fillet (round edge), Chamfer (beveled edge), Shell, Hole Wizard, linear/circular Pattern, Mirror. (5) Build assemblies with mates (coincident, concentric, parallel, distance), (6) generate drawings automatically. Design intent: dimension so that changes behave the way you want.',
      formulas: ['plane → sketch → fully define → feature → assembly (mates) → drawing'],
    }, [
      T('Sketch, constrain, feature', `
1. **Pick a plane** (Front, Top or Right)
2. **Sketch** a 2D profile: lines, arcs, circles
3. **Fully define** with dimensions and **relations** (horizontal, vertical, coincident, tangent, equal, concentric). In SolidWorks, blue = under-defined, **black = fully defined**, red = over-defined.
4. **Feature** it into 3D:
| Feature | Does |
|---|---|
| Extruded Boss/Base | pulls a sketch straight out to add material |
| Extruded Cut | removes material |
| Revolve | spins a profile around an axis (shafts, bottles) |
| Fillet | rounds an edge |
| Chamfer | bevels an edge |
| Shell | hollows out a part |
| Pattern / Mirror | repeats features |`),
      T('Assemblies and design intent', `
**Assemblies** combine parts with **mates**: coincident (faces touch), concentric (shaft in hole), parallel, distance, angle.
**Drawings** are generated from the model and update automatically when it changes.
>* **Design intent:** dimension the sketch the way the part should behave when it changes. If a hole must stay centered, dimension it from the centerline, not from an edge.`),
      ORDER('Order the basic SolidWorks part workflow.', ['Select a sketch plane', 'Sketch the 2D profile', 'Add dimensions and relations until fully defined', 'Apply a feature such as Extruded Boss', 'Add finishing features such as fillets']),
      MATCH('Match the SolidWorks feature to what it makes.', [['Revolve', 'a shaft from a half-profile'], ['Fillet', 'a rounded edge'], ['Extruded Cut', 'a pocket or through-hole'], ['Shell', 'a hollow, thin-walled part']]),
      MC('In SolidWorks, a sketch whose lines are all **black** is…', ['fully defined', 'under-defined', 'over-defined', 'suppressed'], 'Blue means still free to move. Red means conflicting.'),
      MC('Which mate puts a shaft inside a hole on the same axis?', ['concentric', 'coincident', 'parallel', 'tangent'], 'Concentric aligns the cylinder axes.'),
      TF('Dimensioning a sketch in a way that captures design intent makes later changes behave predictably.', true, 'That\'s the core idea of parametric modeling.'),
    ]),
    L('m8l4', 'Dimensioning, Tolerances & Manufacturing', {
      goal: 'Apply dimensioning rules, compute fits from tolerances, and pick manufacturing processes.',
      key: 'Dimensioning rules: dimension each feature once (no redundant dimensions), place dimensions in the view where the feature is most clearly seen, avoid dimensioning to hidden lines, and give holes a diameter (Ø) with their centers located. Tolerances give the allowed variation: limits (25.00–25.05), bilateral ±, or unilateral. Fits: clearance (the shaft is always smaller than the hole), interference/press (always larger), or transition. Min clearance = smallest hole − largest shaft. Max clearance = largest hole − smallest shaft. Processes: casting (molten metal into a mold), forging, machining (milling, turning on a lathe, drilling), sheet-metal forming, injection molding (high-volume plastics), additive manufacturing / 3D printing (FDM, SLA: complex shapes, prototypes) and laser cutting (flat profiles). Choose by material, geometry, quantity and cost.',
      formulas: ['min clearance = hole_{min} − shaft_{max}', 'max clearance = hole_{max} − shaft_{min}'],
    }, [
      T('Telling the shop exactly what you want', `
**Dimensioning rules:**
- Each feature dimensioned **once**, so there are no redundant (double) dimensions
- Dimension where the feature is **most clearly seen**
- **Don't** dimension to hidden lines
- Holes: diameter (Ø) plus the location of the center
**Tolerances**: nothing is made exactly. 25.00 ± 0.05 allows 24.95–25.05.
**Fits:** clearance (always slides), interference (pressed together), transition (could be either).
>* Tighter tolerances cost more. Only specify precision where the function needs it.`),
      T('How parts get made', `
| Process | Best for |
|---|---|
| casting | complex metal shapes, many parts |
| forging | strong metal parts (wrenches, crankshafts) |
| milling / turning / drilling | precise metal parts, low–medium volume |
| sheet-metal forming | enclosures, brackets |
| injection molding | huge volumes of plastic parts |
| 3D printing (FDM, SLA) | prototypes, complex one-offs |
| laser cutting | flat profiles from sheet (truss lab!) |`),
      G('m.tol'),
      MC('Which process is best for making 100,000 identical plastic phone cases?', ['injection molding', '3D printing', 'CNC milling', 'hand carving'], 'High tooling cost, but very cheap per part at volume.'),
      G('m.tol'),
      MC('Which drawing practice is **wrong**?', ['Dimensioning the same feature in two different views', 'Locating hole centers', 'Placing dimensions where the feature is clearly visible', 'Using Ø for diameters'], 'Redundant dimensions can conflict. Dimension each feature once.'),
      MATCH('Match each part to a sensible manufacturing process.', [['custom prototype bracket (1 piece)', '3D printing'], ['flat acrylic truss members', 'laser cutting'], ['precision steel shaft', 'turning on a lathe'], ['engine block', 'casting']]),
      TF('An interference fit means the shaft is always larger than the hole.', true, 'They have to be pressed together.'),
    ]),
  ]);

  CQ.addUnits('mech', [u5, u6, u7, u8]);
})();

</script>
<script>
/* js/store.js */
/* Comet Quest — player state: persistence, XP & levels, streaks, spaced repetition,
   unlocks, readiness, daily quests and achievements. */
(function () {
  const CQ = window.CQ;
  const KEY = 'cometquest.v1';
  const INTERVALS = [0, 1, 3, 7, 16, 35]; // Leitner boxes 0..5 (days until due)

  const defaults = () => ({
    v: 1,
    updatedAt: 0,
    created: Date.now(),
    name: '',
    xp: 0,
    gems: 50,
    streak: { n: 0, best: 0, last: null, freezes: 1, frozen: [] },
    daily: null,
    history: {},
    settings: { sound: true, goal: 50, theme: 'system', freeRoam: false, motion: true, timer: true, haptics: true },
    course: 'phys',
    lessons: {}, // lessonId -> { c: crowns 0-3, best: accuracy, n: plays }
    units: {}, // unitId -> { boss: bool, jumped: bool, chest: bool }
    srs: {}, // cardKey -> [box, dueDay, wrong, seen]
    stats: { answered: 0, correct: 0, lessons: 0, perfect: 0, bosses: 0, exams: 0, maxCombo: 0, reviews: 0, rescues: 0, legends: 0, ms: 0, hints: 0, chests: 0, jumps: 0 },
    ach: {},
    exams: {}, // examId -> [{ d: dayKey, s: score 0-100 }]
    skin: 'classic',
    owned: ['classic'],
    onboarded: false,
  });

  const S = (CQ.store = {
    state: defaults(),
    listeners: [],
    onChange(fn) { this.listeners.push(fn); },
  });

  function deepMerge(base, over) {
    for (const k in over) {
      if (over[k] && typeof over[k] === 'object' && !Array.isArray(over[k]) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) deepMerge(base[k], over[k]);
      else base[k] = over[k];
    }
    return base;
  }

  S.load = function () {
    let raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
    if (raw) {
      try { S.state = deepMerge(defaults(), JSON.parse(raw)); } catch (e) { S.state = defaults(); }
    }
    S.rollDay();
  };

  let saveT = null;
  S.save = function (immediate) {
    S.state.updatedAt = Date.now();
    clearTimeout(saveT);
    const doSave = () => {
      try { localStorage.setItem(KEY, JSON.stringify(S.state)); } catch (e) { /* storage unavailable */ }
      S.cloud.push();
    };
    if (immediate) doSave(); else saveT = setTimeout(doSave, 300);
  };

  S.replace = function (obj) {
    S.state = deepMerge(defaults(), obj);
    S.rollDay();
    S.save(true);
    S.listeners.forEach((f) => f());
  };
  S.reset = function () { S.replace(defaults()); };

  S.exportCode = () => btoa(unescape(encodeURIComponent(JSON.stringify(S.state))));
  S.importCode = function (code) {
    const obj = JSON.parse(decodeURIComponent(escape(atob(String(code).trim()))));
    if (!obj || typeof obj !== 'object' || obj.v !== 1) throw new Error('That code is not a Comet Quest save.');
    S.replace(obj);
  };

  /* ---------- cloud sync (only when running as a claude.ai artifact) ---------- */
  S.cloud = {
    ref: null,
    busy: false,
    dirty: false,
    status: 'local',
    async init() {
      try {
        if (!window.claude || !window.claude.use) return;
        const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
        if (!db || !user) return;
        const id = await user.id();
        if (!id) return;
        this.ref = db.doc('data/users/' + id + '/progress');
        const snap = await this.ref.get();
        if (snap.exists) {
          const d = snap.data();
          const remote = d && d.s ? JSON.parse(d.s) : null;
          if (remote && (remote.updatedAt || 0) > (S.state.updatedAt || 0)) {
            S.state = deepMerge(defaults(), remote);
            S.rollDay();
            try { localStorage.setItem(KEY, JSON.stringify(S.state)); } catch (e) { /* ignore */ }
            S.listeners.forEach((f) => f());
          } else if ((S.state.updatedAt || 0) > (remote ? remote.updatedAt || 0 : 0)) {
            this.push();
          }
        } else if (S.state.updatedAt) {
          this.push();
        }
        this.status = 'synced';
      } catch (e) {
        this.ref = null;
        this.status = 'local';
      }
    },
    push() {
      if (!this.ref) return;
      this.dirty = true;
      clearTimeout(this.t);
      this.t = setTimeout(() => this.flush(), 2500);
    },
    async flush() {
      if (!this.ref || this.busy || !this.dirty) return;
      this.busy = true;
      this.dirty = false;
      try {
        await this.ref.set({ s: JSON.stringify(S.state), t: S.state.updatedAt });
        this.status = 'synced';
      } catch (e) {
        if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')) this.ref = null;
        this.status = 'local';
      }
      this.busy = false;
      if (this.dirty) this.push();
    },
  };

  /* ---------- days, streaks, daily counters ---------- */
  const freshDaily = (date) => ({ date, xp: 0, correct: 0, perfect: 0, combo: 0, reviews: 0, courses: [], bosses: 0, lessons: 0, claimed: [] });

  S.rollDay = function () {
    const st = S.state;
    const today = CQ.dayKey();
    if (!st.daily || st.daily.date !== today) st.daily = freshDaily(today);
    // streak maintenance: spend freezes on missed days, otherwise reset
    if (st.streak.last) {
      const gap = CQ.dayNum() - CQ.keyToNum(st.streak.last);
      if (gap > 1) {
        const missed = gap - 1;
        if (st.streak.n > 0 && st.streak.freezes >= missed) {
          st.streak.freezes -= missed;
          for (let i = 1; i <= missed; i++) {
            const d = new Date(); d.setDate(d.getDate() - i);
            st.streak.frozen.push(CQ.dayKey(d));
          }
          const y = new Date(); y.setDate(y.getDate() - 1);
          st.streak.last = CQ.dayKey(y);
          S.flash = { type: 'freeze', n: missed };
        } else if (st.streak.n > 0) {
          S.flash = { type: 'lost', n: st.streak.n };
          st.streak.n = 0;
        }
      }
    }
  };

  // Called whenever a session finishes. Returns true if the streak grew today.
  S.bumpStreak = function () {
    const st = S.state;
    const today = CQ.dayKey();
    if (st.streak.last === today) return false;
    const gap = st.streak.last ? CQ.dayNum() - CQ.keyToNum(st.streak.last) : 99;
    st.streak.n = gap === 1 ? st.streak.n + 1 : 1;
    st.streak.last = today;
    st.streak.best = Math.max(st.streak.best, st.streak.n);
    return true;
  };

  S.addXP = function (n) {
    const st = S.state;
    S.rollDay();
    st.xp += n;
    st.daily.xp += n;
    const k = CQ.dayKey();
    st.history[k] = (st.history[k] || 0) + n;
  };

  /* ---------- levels ---------- */
  const TITLES = [[1, 'Stardust'], [3, 'Meteor'], [6, 'Comet'], [10, 'Nova'], [15, 'Pulsar'], [20, 'Quasar'], [25, 'Supernova'], [32, 'Galaxy Brain']];
  const need = (n) => 40 * (n - 1) + 10 * (n - 1) * (n - 1); // total XP to reach level n
  S.level = function (xp = S.state.xp) {
    let n = 1;
    while (xp >= need(n + 1)) n++;
    let title = TITLES[0][1];
    for (const [lv, t] of TITLES) if (n >= lv) title = t;
    return { n, title, cur: xp - need(n), span: need(n + 1) - need(n) };
  };

  /* ---------- spaced repetition ---------- */
  S.srsRecord = function (key, ok) {
    if (!key) return;
    const today = CQ.dayNum();
    const r = S.state.srs[key] || [0, today, 0, 0];
    r[3]++;
    if (ok) { r[0] = Math.min(5, r[0] + 1); r[1] = today + INTERVALS[r[0]]; }
    else { r[0] = 0; r[1] = today; r[2]++; }
    S.state.srs[key] = r;
  };
  const courseOfKey = (key) => { const l = CQ.idx.lessons[key.split(':')[0]]; return l ? l.course : null; };
  S.dueKeys = function (courseId) {
    const today = CQ.dayNum();
    return Object.keys(S.state.srs)
      .filter((k) => CQ.idx.cards[k] && S.state.srs[k][1] <= today && (!courseId || courseOfKey(k) === courseId))
      .sort((a, b) => S.state.srs[a][0] - S.state.srs[b][0] || S.state.srs[a][1] - S.state.srs[b][1]);
  };
  S.weakKeys = function (courseId) {
    return Object.keys(S.state.srs)
      .filter((k) => CQ.idx.cards[k] && S.state.srs[k][2] > 0 && (!courseId || courseOfKey(k) === courseId))
      .sort((a, b) => {
        const ra = S.state.srs[a], rb = S.state.srs[b];
        return rb[2] / rb[3] - ra[2] / ra[3] || ra[0] - rb[0];
      });
  };

  /* ---------- progress & unlocks ---------- */
  S.crowns = (lid) => (S.state.lessons[lid] ? S.state.lessons[lid].c : 0);
  S.unitDone = (u) => u.lessons.every((l) => S.crowns(l.id) >= 1);
  S.unitBeaten = (u) => !!(S.state.units[u.id] && (S.state.units[u.id].boss || S.state.units[u.id].jumped));
  S.unitOpen = function (u) {
    if (S.state.settings.freeRoam || u.n === 1) return true;
    const c = CQ.courses[u.course];
    const prev = c.units[u.n - 2];
    return S.unitBeaten(prev) || !!(S.state.units[u.id] && S.state.units[u.id].jumped);
  };
  S.lessonOpen = function (l) {
    const u = CQ.idx.units[l.unit];
    if (!S.unitOpen(u)) return false;
    if (S.state.settings.freeRoam || l.n === 1 || S.unitBeaten(u)) return true;
    return S.crowns(u.lessons[l.n - 2].id) >= 1;
  };
  S.bossOpen = (u) => S.unitOpen(u) && (S.state.settings.freeRoam || S.unitDone(u) || S.unitBeaten(u));
  S.chestAfter = (u) => (u.lessons.length >= 3 ? 2 : 0); // chest sits after lesson #2
  S.chestOpen = (u) => S.unitOpen(u) && S.crowns(u.lessons[S.chestAfter(u) - 1].id) >= 1;

  // The lesson you'd naturally do next in a course.
  S.nextLesson = function (courseId) {
    const c = CQ.courses[courseId];
    for (const u of c.units) {
      if (!S.unitOpen(u)) return null;
      for (const l of u.lessons) if (S.crowns(l.id) < 1 && S.lessonOpen(l)) return { lesson: l };
      if (!S.unitBeaten(u) && S.bossOpen(u)) return { boss: u };
    }
    return null;
  };

  S.courseProgress = function (courseId) {
    const ls = CQ.lessonsOf(courseId);
    if (!ls.length) return 0;
    return ls.reduce((a, l) => a + Math.min(3, S.crowns(l.id)), 0) / (ls.length * 3);
  };

  // 0..1 estimate of how well a lesson is retained
  S.lessonMastery = function (l) {
    const c = S.crowns(l.id);
    if (!c) return 0;
    const keys = l.cards.filter(CQ.isExercise).map((x) => x.key).filter((k) => S.state.srs[k]);
    const box = keys.length ? keys.reduce((a, k) => a + S.state.srs[k][0], 0) / (keys.length * 5) : 0;
    return Math.min(1, 0.35 + 0.15 * c + 0.35 * box);
  };

  S.readiness = function (exam) {
    const ls = [];
    exam.units.forEach((uid) => { const u = CQ.idx.units[uid]; if (u) u.lessons.forEach((l) => ls.push(l)); });
    if (!ls.length) return 0;
    let m = ls.reduce((a, l) => a + S.lessonMastery(l), 0) / ls.length;
    const runs = S.state.exams[exam.id] || [];
    if (runs.length) {
      const recent = runs.slice(-2).reduce((a, r) => a + r.s, 0) / Math.min(2, runs.length) / 100;
      m = 0.45 * m + 0.55 * recent;
    }
    return Math.round(m * 100);
  };

  /* ---------- daily quests ---------- */
  const QUESTS = [
    { id: 'xp', label: (g) => 'Earn ' + g + ' XP', target: (st) => st.settings.goal, val: (d) => d.xp, gems: 15 },
    { id: 'correct', label: () => 'Answer 25 questions right', target: () => 25, val: (d) => d.correct, gems: 10 },
    { id: 'combo', label: () => 'Hit a 10-answer combo', target: () => 10, val: (d) => d.combo, gems: 15 },
    { id: 'perfect', label: () => 'Finish a lesson with no mistakes', target: () => 1, val: (d) => d.perfect, gems: 15 },
    { id: 'review', label: () => 'Complete a review session', target: () => 1, val: (d) => d.reviews, gems: 10 },
    { id: 'courses', label: () => 'Study 2 different courses', target: () => 2, val: (d) => d.courses.length, gems: 15 },
    { id: 'lessons', label: () => 'Complete 3 lessons', target: () => 3, val: (d) => d.lessons, gems: 15 },
    { id: 'boss', label: () => 'Beat a boss or pass a test', target: () => 1, val: (d) => d.bosses, gems: 20 },
  ];
  S.quests = function () {
    const st = S.state;
    S.rollDay();
    const seed = parseInt(CQ.hash(st.daily.date), 36);
    const R = CQ.rng(seed);
    const pool = QUESTS.filter((q) => q.id !== 'xp');
    const picks = [QUESTS[0]].concat(R.sample(pool, 2));
    return picks.map((q) => {
      const target = q.target(st);
      const val = Math.min(target, q.val(st.daily));
      return { id: q.id, label: q.label(target), target, val, done: val >= target, claimed: st.daily.claimed.includes(q.id), gems: q.gems };
    });
  };
  S.claimQuest = function (id) {
    const q = S.quests().find((x) => x.id === id);
    if (!q || !q.done || q.claimed) return 0;
    S.state.daily.claimed.push(id);
    S.state.gems += q.gems;
    S.save();
    return q.gems;
  };

  /* ---------- achievements ---------- */
  const s = () => S.state.stats;
  S.ACH = [
    { id: 'first', name: 'Liftoff', desc: 'Finish your first lesson', test: () => s().lessons >= 1 },
    { id: 'ten', name: 'Orbit Achieved', desc: 'Finish 10 lessons', test: () => s().lessons >= 10 },
    { id: 'fifty', name: 'Deep Space', desc: 'Finish 50 lessons', test: () => s().lessons >= 50 },
    { id: 'perfect', name: 'Flawless', desc: 'Finish a lesson with zero mistakes', test: () => s().perfect >= 1 },
    { id: 'perfect10', name: 'Precision Engineer', desc: '10 flawless lessons', test: () => s().perfect >= 10 },
    { id: 'combo10', name: 'On Fire', desc: 'Reach a 10-answer combo', test: () => s().maxCombo >= 10 },
    { id: 'combo25', name: 'Unstoppable', desc: 'Reach a 25-answer combo', test: () => s().maxCombo >= 25 },
    { id: 'boss', name: 'Boss Slayer', desc: 'Beat your first unit boss', test: () => s().bosses >= 1 },
    { id: 'boss10', name: 'Dragon Tamer', desc: 'Beat 10 bosses', test: () => s().bosses >= 10 },
    { id: 'streak3', name: 'Warming Up', desc: '3-day streak', test: () => S.state.streak.best >= 3 },
    { id: 'streak7', name: 'Week Warrior', desc: '7-day streak', test: () => S.state.streak.best >= 7 },
    { id: 'streak30', name: 'Unbreakable', desc: '30-day streak', test: () => S.state.streak.best >= 30 },
    { id: 'xp1k', name: 'Kilo-Learner', desc: 'Earn 1,000 XP', test: () => S.state.xp >= 1000 },
    { id: 'xp5k', name: 'Mega-Learner', desc: 'Earn 5,000 XP', test: () => S.state.xp >= 5000 },
    { id: 'legend', name: 'Legendary', desc: 'Earn a Legendary crown', test: () => s().legends >= 1 },
    { id: 'review5', name: 'Memory Palace', desc: 'Finish 5 review sessions', test: () => s().reviews >= 5 },
    { id: 'exam', name: 'Dress Rehearsal', desc: 'Take an exam simulator', test: () => s().exams >= 1 },
    { id: 'exam90', name: 'Exam Ready', desc: 'Score 90%+ on an exam simulator', test: () => Object.values(S.state.exams).some((r) => r.some((x) => x.s >= 90)) },
    { id: 'triple', name: 'Triple Threat', desc: 'Study all 3 courses in one day', test: () => S.state.daily && S.state.daily.courses.length >= 3 },
    { id: 'comeback', name: 'Comeback Kid', desc: 'Finish a lesson after a Rescue', test: () => s().rescues >= 1 },
    { id: 'owl', name: 'Night Owl', desc: 'Finish a lesson after 11 pm', test: () => S._owl },
    { id: 'lark', name: 'Early Bird', desc: 'Finish a lesson before 7 am', test: () => S._lark },
    { id: 'hundred', name: 'Sharpshooter', desc: 'Answer 500 questions right', test: () => s().correct >= 500 },
    { id: 'chest', name: 'Treasure Hunter', desc: 'Open 5 chests', test: () => s().chests >= 5 },
  ];
  S.checkAch = function () {
    const h = new Date().getHours();
    S._owl = h >= 23; S._lark = h < 7;
    const got = [];
    for (const a of S.ACH) {
      if (!S.state.ach[a.id] && a.test()) { S.state.ach[a.id] = CQ.dayKey(); got.push(a); }
    }
    return got;
  };

  S.SKINS = [
    { id: 'classic', name: 'Classic Comet', cost: 0, a: '#FF8A3D', b: '#FFD25A' },
    { id: 'ice', name: 'Ice Comet', cost: 120, a: '#4CC9F0', b: '#C8F3FF' },
    { id: 'plasma', name: 'Plasma', cost: 200, a: '#B14CFF', b: '#FF8DEB' },
    { id: 'aurora', name: 'Aurora', cost: 300, a: '#19C37D', b: '#B8FF6A' },
    { id: 'gold', name: 'Solid Gold', cost: 500, a: '#E0A100', b: '#FFF1A8' },
  ];
})();

</script>

/* js/audio.js */
/* Comet Quest — synthesized sound effects (no audio files). */
(function () {
  const CQ = window.CQ;
  let ctx = null;
  const ac = () => {
    if (!ctx) {
      const A = window.AudioContext || window.webkitAudioContext;
      if (!A) return null;
      ctx = new A();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  };
  function tone(freq, t0, dur, type = 'sine', vol = 0.18, slide) {
    const c = ac();
    if (!c) return;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, c.currentTime + t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, c.currentTime + t0 + dur);
    g.gain.setValueAtTime(0.0001, c.currentTime + t0);
    g.gain.exponentialRampToValueAtTime(vol, c.currentTime + t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(c.currentTime + t0);
    o.stop(c.currentTime + t0 + dur + 0.02);
  }
  const SFX = {
    tap: () => tone(660, 0, 0.05, 'triangle', 0.06),
    correct: () => { tone(880, 0, 0.12, 'triangle', 0.16); tone(1318.5, 0.08, 0.2, 'triangle', 0.14); },
    wrong: () => { tone(220, 0, 0.18, 'sawtooth', 0.07, 150); tone(165, 0.1, 0.22, 'square', 0.04, 110); },
    combo: () => [1046.5, 1318.5, 1568, 2093].forEach((f, i) => tone(f, i * 0.05, 0.12, 'triangle', 0.1)),
    reveal: () => tone(520, 0, 0.08, 'sine', 0.08, 780),
    complete: () => [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => tone(f, i * 0.09, 0.28, 'triangle', 0.14)),
    level: () => [392, 523.25, 659.25, 783.99, 1046.5, 1568].forEach((f, i) => tone(f, i * 0.07, 0.35, 'square', 0.05)),
    chest: () => [1568, 2093, 2637, 3136].forEach((f, i) => tone(f, i * 0.06, 0.16, 'sine', 0.09)),
    heart: () => tone(300, 0, 0.25, 'sine', 0.12, 120),
    fail: () => [392, 349.23, 311.13, 261.63].forEach((f, i) => tone(f, i * 0.16, 0.3, 'triangle', 0.1)),
  };
  CQ.sfx = function (name) {
    if (!CQ.store.state.settings.sound) return;
    try { SFX[name] && SFX[name](); } catch (e) { /* audio unavailable */ }
  };
  CQ.buzz = function (ms) {
    if (!CQ.store.state.settings.haptics) return;
    try { navigator.vibrate && navigator.vibrate(ms); } catch (e) { /* no haptics */ }
  };
})();
