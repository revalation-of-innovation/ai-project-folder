  /* ================= Unit 13 ================= */
  const u13 = U('p13', 'Periodic Motion', { sub: 'Springs, SHM & pendulums', ch: 'Ch 14' }, [
    L('p13l1', 'SHM Basics', {
      goal: 'Get ω, f and T for a mass on a spring.',
      key: 'Simple harmonic motion happens whenever the restoring force is proportional to displacement: $F = −kx$. For a mass on a spring, $ω = √{k/m}$, $f = ω/2π$ and $T = 1/f = 2π√{m/k}$. The period does NOT depend on amplitude. Stiffer springs oscillate faster, heavier masses slower.',
      formulas: ['ω = √{[[k|m]]}', 'f = [[ω|2π]]   ·   T = [[1|f]] = 2π√{[[m|k]]}'],
    }, [
      T('Restoring force ∝ displacement', `
If the force always pulls back toward equilibrium in proportion to how far you are from it,
$$ F = −kx $$
you get **simple harmonic motion (SHM)**. For a mass on a spring:
$$ ω = √{[[k|m]]}   ·   f = [[ω|2π]]   ·   T = 2π√{[[m|k]]} $$
>* The period doesn't depend on the amplitude. Pull it farther and it moves faster, taking the same time per cycle.`, { fig: D.spring({ x: 160, eq: 200, label: 'k' }) }),
      MATCH('Match each quantity to its meaning.', [['T (period)', 'seconds per cycle'], ['f (frequency)', 'cycles per second (Hz)'], ['ω (angular frequency)', 'radians per second'], ['A (amplitude)', 'maximum displacement']]),
      G('p.shm.basic'),
      MC('You double the amplitude of a mass-spring oscillator. Its period…', ['stays the same', 'doubles', 'halves', 'increases by √2'], 'T = 2π√(m/k) has no A in it.'),
      G('p.shm.basic'),
      MC('You replace the mass with one **4 times** heavier. The period becomes…', ['2 times longer', '4 times longer', 'half as long', 'unchanged'], 'T ∝ √m → √4 = 2.', { lvl: 2 }),
      G('p.shm.basic'),
    ]),
    L('p13l2', 'x(t), v(t) and a(t)', {
      goal: 'Read and use the SHM equations of motion.',
      key: 'Position: $x(t) = A cos(ωt + φ)$. Velocity: $v = −Aω sin(ωt + φ)$, so $v_{max} = Aω$ at x = 0. Acceleration: $a = −ω²x$, so $a_{max} = ω²A$ at x = ±A. At the turning points v = 0 and |a| is maximum, and at equilibrium |v| is maximum and a = 0. Always use radians for ωt.',
      formulas: ['x = A cos(ωt + φ)', 'v_{max} = ωA   ·   a_{max} = ω²A', 'a = −ω²x'],
    }, [
      T('Cosines all the way down', `
$$ x(t) = A cos(ωt + φ) $$
$$ v(t) = −ωA sin(ωt + φ)   ·   a(t) = −ω² x $$
| Where | x | v | a |
|---|---|---|---|
| turning point | ±A | 0 | max: ∓ω²A |
| equilibrium | 0 | max: ±ωA | 0 |
>! ωt is in **radians**. Switch your calculator to RAD for every SHM problem.`),
      EX('Reading x(t)', 'x(t) = (0.10 m) cos(4.0t). Find v_max, a_max, and x at t = 0.50 s.', ['A = 0.10 m, ω = 4.0 rad/s', 'v_max = ωA = 0.40 m/s, a_max = ω²A = 1.6 m/s²', 'x(0.50) = 0.10 cos(2.0 rad) = 0.10(−0.416) = **−0.042 m**']),
      MC('Where is the speed of a mass in SHM greatest?', ['At equilibrium (x = 0)', 'At the turning points', 'Halfway to the turning point', 'It is constant'], 'All the energy is kinetic at x = 0.'),
      G('p.shm.max'),
      MC('Where is the magnitude of the acceleration greatest?', ['At the turning points (x = ±A)', 'At equilibrium', 'It is constant', 'It is always zero'], 'a = −ω²x, which is largest where |x| is largest.'),
      G('p.shm.x'),
      G('p.shm.max'),
    ]),
    L('p13l3', 'Energy in SHM', {
      goal: 'Use energy conservation to find speeds at any position.',
      key: 'Total energy in SHM: $E = ½kA² = ½mv_{max}²$, constant. At any position: $½mv² + ½kx² = ½kA²$, so $v = ω√{A² − x²}$. Energy sloshes between kinetic (max at x = 0) and potential (max at x = ±A). At x = A/2, ¾ of the energy is kinetic.',
      formulas: ['E = ½kA²', '½mv² + ½kx² = ½kA²', 'v = ω√{A² − x²}'],
    }, [
      T('Energy sloshes back and forth', `
$$ E = ½mv² + ½kx² = ½kA² :: constant $$
- At x = ±A: all potential, $E = ½kA²$
- At x = 0: all kinetic, $E = ½mv_{max}²$
- In between: $v = ω√{A² − x²}$
>* Energy is the fastest way to get a speed at a given position. No trig and no time needed.`, { fig: D.bars({ items: [['x = A', 1, 'c4', 'U'], ['x = A/2', 0.25, 'c4', 'U'], ['x = 0', 0.01, 'c4', 'U']], max: 1, alt: 'Potential energy is maximum at the amplitude and zero at equilibrium' }) }),
      EX('Halfway out', 'A 0.50 kg mass on a k = 200 N/m spring has A = 0.10 m. Find E and the speed at x = 0.05 m.', ['E = ½(200)(0.10)² = **1.0 J**', 'ω = √(200/0.50) = 20 rad/s', 'v = 20√(0.10² − 0.05²) = **1.73 m/s**']),
      G('p.shm.E'),
      MC('At x = A/2, what fraction of the total energy is kinetic?', ['¾', '½', '¼', '0'], 'U = ½k(A/2)² = ¼E, so K = ¾E.', { lvl: 3 }),
      G('p.shm.E'),
      TF('In SHM, kinetic energy is maximum at the turning points.', false, 'v = 0 at the turning points, so K = 0 there.'),
      G('p.shm.E'),
    ]),
    L('p13l4', 'Pendulums', {
      goal: 'Compute periods of simple and physical pendulums, and know damping and resonance.',
      key: 'Simple pendulum (small angles): $T = 2π√{L/g}$. It is independent of mass and (for small swings) of amplitude. Physical pendulum: $T = 2π√{I/(mgd)}$, where d is the distance from the pivot to the center of mass (a rod pivoted at its end gives $T = 2π√{2L/3g}$). Damping makes the amplitude die out. Driving a system at its natural frequency causes resonance, a huge amplitude.',
      formulas: ['simple: T = 2π√{[[L|g]]}', 'physical: T = 2π√{[[I|mgd]]}'],
    }, [
      T('Pendulum clocks', `
For small swings (under about 15°), a simple pendulum is SHM with
$$ T = 2π√{[[L|g]]} $$
No mass, no amplitude. Only length and g.
A **physical pendulum** (any rigid swinging body) uses its moment of inertia:
$$ T = 2π√{[[I|mgd]]} :: d = pivot-to-CM distance $$
>> **Damping and resonance:** friction slowly drains the energy (damping). Pushing at the natural frequency builds up a huge amplitude (resonance), the same reason you pump a swing in rhythm.`, { fig: D.pendulum({ deg: 25 }) }),
      EX('A 1-second tick', 'How long is a pendulum with T = 2.0 s (one tick per second)?', ['L = g(T/2π)² = 9.8 × (2.0/6.283)²', 'L = **0.993 m**, almost exactly a meter']),
      G('p.pend'),
      MC('A pendulum clock is taken to the Moon (g is ⅙ as large). Its period…', ['increases by a factor of √6', 'decreases by a factor of √6', 'stays the same', 'increases by a factor of 6'], 'T ∝ 1/√g.'),
      G('p.pend'),
      TF('A heavier pendulum bob swings with a shorter period.', false, 'T = 2π√(L/g) doesn\'t depend on mass.'),
      MC('Soldiers break step when crossing a bridge mainly to avoid…', ['resonance', 'damping', 'friction', 'interference'], 'Marching in step at the bridge\'s natural frequency could drive large oscillations.'),
      G('p.pend'),
    ]),
  ]);

  /* ================= Unit 14 ================= */
  const u14 = U('p14', 'Mechanical Waves', { sub: 'Wave speed, wave functions & standing waves', ch: 'Ch 15' }, [
    L('p14l1', 'Wave Basics', {
      goal: 'Use v = fλ and tell transverse from longitudinal waves.',
      key: 'A wave carries energy, not matter. Transverse waves have the medium moving perpendicular to the wave (a string). Longitudinal waves have the medium moving along it (sound). $v = fλ = λ/T$. The **medium** sets the speed, and the **source** sets the frequency. When a wave passes into a new medium, f stays the same while v and λ change.',
      formulas: ['v = fλ', 'T = [[1|f]]'],
    }, [
      T('Waves move energy, not stuff', `
A wave is a disturbance that travels. The material just oscillates in place.
- **Transverse:** particles move ⊥ to the wave (a wave on a string, the stadium wave)
- **Longitudinal:** particles move ∥ to the wave (sound, a Slinky push)
$$ v = fλ :: speed = frequency × wavelength $$
>* The **medium** sets v and the **source** sets f. Change f and λ adjusts to keep v the same.`, { fig: D.wave({ dir: true }) }),
      G('p.wave.v'),
      MC('Sound passes from air into water, where it travels faster. Which stays the same?', ['frequency', 'wavelength', 'speed', 'all of them change'], 'The source sets f. v increases in water, so λ increases too.'),
      G('p.wave.v'),
      MATCH('Classify each wave.', [['Sound in air', 'longitudinal'], ['Wave on a guitar string', 'transverse'], ['Compression pulse on a Slinky', 'longitudinal (also)'], ['Stadium "wave"', 'transverse (also)']]),
      G('p.wave.v'),
    ]),
    L('p14l2', 'Wave Functions', {
      goal: 'Read A, k, ω, λ, f and v straight off y(x,t).',
      key: 'A sinusoidal wave moving toward +x: $y(x,t) = A cos(kx − ωt)$. (kx + ωt means it moves toward −x.) Wave number $k = 2π/λ$, angular frequency $ω = 2πf$, and the speed is $v = ω/k = fλ$. Each particle of the medium moves in SHM with the same ω. Don\'t confuse wave speed (v = ω/k) with particle speed ($∂y/∂t$, at most ωA).',
      formulas: ['y = A cos(kx − ωt)', 'k = [[2π|λ]]   ·   ω = 2πf', 'v = [[ω|k]]'],
    }, [
      T('Decoding y(x, t)', `
$$ y(x,t) = A cos(kx − ωt) $$
| Symbol | Meaning |
|---|---|
| A | amplitude |
| k = 2π/λ | wave number (rad/m) |
| ω = 2πf | angular frequency (rad/s) |
| v = ω/k | wave speed |
**−ωt** means the wave moves toward +x, and **+ωt** means toward −x.
>! The **wave** moves at v = ω/k. Each **particle** of the string just bobs up and down, with max speed ωA. Those are different speeds.`),
      EX('Read it off', 'y = 0.02 cos(4x − 20t) (SI). Find λ, f and v.', ['k = 4 rad/m → λ = 2π/4 = **1.57 m**', 'ω = 20 rad/s → f = 20/2π = **3.18 Hz**', 'v = ω/k = 20/4 = **5.0 m/s**, toward +x']),
      G('p.wave.fn'),
      MC('Which wave travels in the **−x** direction?', ['y = A cos(kx + ωt)', 'y = A cos(kx − ωt)', 'y = A sin(kx − ωt)', 'y = −A cos(kx − ωt)'], 'kx + ωt stays constant as t increases only if x decreases.'),
      G('p.wave.fn'),
      TF('The transverse speed of a particle on a string equals the wave speed.', false, 'The particle speed is ∂y/∂t (max ωA). The wave speed is ω/k.'),
      G('p.wave.fn'),
    ]),
    L('p14l3', 'Waves on a String', {
      goal: 'Compute wave speed from tension and mass density.',
      key: 'Wave speed on a string: $v = √{F/μ}$, where F is the tension and μ = mass/length (kg/m). Tighter string → faster waves; heavier string → slower waves. Quadrupling the tension doubles the speed. Waves carry power proportional to A² and ω² ($P_{av} = ½√{μF}ω²A²$).',
      formulas: ['v = √{[[F|μ]]}', 'μ = [[m|L]]', 'P_{av} = ½√{μF} ω²A²'],
    }, [
      T('Tension and inertia set the speed', `
$$ v = √{[[F_T|μ]]} :: μ = mass per unit length (kg/m) $$
The tension pulls the string back (restoring force) and μ resists it (inertia), just like k and m in a spring.
>* Guitar tuning: tighten a string → higher v → higher pitch. Thicker (bass) strings have bigger μ → lower pitch.
>! Energy carried goes as **A²** and **ω²**. Double the amplitude → 4× the power.`),
      EX('Piano wire', 'A 0.80 m wire of mass 4.0 g is under 500 N of tension. Find the wave speed.', ['μ = 0.0040/0.80 = 0.0050 kg/m', 'v = √(500/0.0050) = **316 m/s**']),
      G('p.wave.string'),
      MC('Two strings have the same tension, but string B has 4× the mass per length. Waves on B travel…', ['half as fast', 'twice as fast', '4 times slower', 'at the same speed'], 'v ∝ 1/√μ → 1/√4 = ½.'),
      G('p.wave.string'),
      TF('Doubling a wave\'s amplitude doubles the power it carries.', false, 'Power ∝ A², so it quadruples.'),
      NUM('A **2.0 m** rope has a mass of **0.50 kg** and is under **50 N** of tension. How long does a pulse take to travel its length?', 2 / Math.sqrt(50 / 0.25), 's', 'μ = 0.50/2.0 = 0.25 kg/m, v = √(50/0.25) = 14.1 m/s, t = 2.0/14.1 = 0.141 s.', { lvl: 4, steps: ['μ = m/L = 0.25 kg/m', 'v = √(F/μ) = √(50/0.25) = 14.1 m/s', 't = L/v = **0.141 s**'] }),
    ]),
    L('p14l4', 'Superposition & Standing Waves', {
      goal: 'Find harmonics on a string fixed at both ends.',
      key: 'Superposition: overlapping waves simply add (constructive or destructive interference). A string fixed at both ends supports standing waves with nodes at the ends: $λₙ = 2L/n$ and $fₙ = n·v/2L = n f₁$, for n = 1, 2, 3, … Nodes don\'t move, and antinodes oscillate the most. Adjacent harmonics differ by f₁. Harmonic n has n antinodes (n "loops").',
      formulas: ['λₙ = [[2L|n]]', 'fₙ = n[[v|2L]] = n f₁', 'f₁ = [[1|2L]]√{[[F|μ]]}'],
    }, [
      T('Waves that stand still', `
When two identical waves travel in opposite directions, they make a **standing wave**: fixed **nodes** (no motion) and **antinodes** (maximum motion).
A string fixed at both ends must have nodes at both ends, so only certain wavelengths fit:
$$ λₙ = [[2L|n]]   ·   fₙ = n [[v|2L]] = n f₁ $$
>* n = number of "loops". The fundamental (n = 1) is one loop, the 2nd harmonic is two loops, and so on.
>> Pressing a guitar fret shortens L, which raises every harmonic.`, { fig: D.standing({ n: 3, all: true }) }),
      EX('Guitar string', 'A 0.65 m string has v = 260 m/s. Find f₁ and f₃.', ['f₁ = v/2L = 260/1.30 = **200 Hz**', 'f₃ = 3f₁ = **600 Hz**']),
      G('p.standing'),
      MC('How many antinodes does the 4th harmonic on a string fixed at both ends have?', ['4', '3', '5', '8'], 'Harmonic n has n loops, and each loop has one antinode.'),
      G('p.standing'),
      MC('Two waves of equal amplitude A meet in phase. The resulting amplitude is…', ['2A', 'A', '0', 'A²'], 'Constructive interference: amplitudes add.'),
      G('p.standing'),
    ]),
  ]);

  CQ.addUnits('phys', [u12, u13, u14]);
})();

<script>
/* content/chem-1.js */
/* CHEM 1311 · General Chemistry I — course definition, chemistry toolkit and Units 1–4
   (Burdge & Overby, Chemistry: Atoms First, Ch 1–3) */
(function () {
  const CQ = window.CQ;
  const { L, U, T, EX, MC, MULTI, TF, NUM, TXT, FILL, MATCH, ORDER, G } = CQ.dsl;
  const F = (x, s = 3) => CQ.fmt(x, s);
  const D = CQ.dg;
  const ch = CQ.chem;
  const sup = CQ.supNum;

  CQ.defineCourse({
    id: 'chem', code: 'CHEM 1311', name: 'General Chemistry I', icon: 'flask', color: '#0fa985', dark: '#0a7a60',
    book: 'Burdge & Overby, Chemistry: Atoms First · Ch 1–11',
    exams: [
      { id: 'chem-e1', name: 'Exam 1', units: ['c1', 'c2', 'c3', 'c4'], n: 20, mins: 50, note: 'Ch 1–3' },
      { id: 'chem-e2', name: 'Exam 2', units: ['c5', 'c6', 'c7'], n: 20, mins: 50, note: 'Ch 4–6' },
      { id: 'chem-e3', name: 'Exam 3', units: ['c8', 'c9', 'c10'], n: 20, mins: 50, note: 'Ch 7–9' },
      { id: 'chem-fin', name: 'Final', units: ['c1', 'c2', 'c3', 'c4', 'c5', 'c6', 'c7', 'c8', 'c9', 'c10', 'c11', 'c12'], n: 30, mins: 110, note: 'Cumulative' },
    ],
  });

  /* ================= chemistry toolkit (shared by all chem files) ================= */
  const EL = {};
  [[1, 'H', 'hydrogen', 1.008], [2, 'He', 'helium', 4.003], [3, 'Li', 'lithium', 6.941], [4, 'Be', 'beryllium', 9.012], [5, 'B', 'boron', 10.81],
    [6, 'C', 'carbon', 12.01], [7, 'N', 'nitrogen', 14.01], [8, 'O', 'oxygen', 16.0], [9, 'F', 'fluorine', 19.0], [10, 'Ne', 'neon', 20.18],
    [11, 'Na', 'sodium', 22.99], [12, 'Mg', 'magnesium', 24.31], [13, 'Al', 'aluminum', 26.98], [14, 'Si', 'silicon', 28.09], [15, 'P', 'phosphorus', 30.97],
    [16, 'S', 'sulfur', 32.07], [17, 'Cl', 'chlorine', 35.45], [18, 'Ar', 'argon', 39.95], [19, 'K', 'potassium', 39.1], [20, 'Ca', 'calcium', 40.08],
    [21, 'Sc', 'scandium', 44.96], [22, 'Ti', 'titanium', 47.87], [23, 'V', 'vanadium', 50.94], [24, 'Cr', 'chromium', 52.0], [25, 'Mn', 'manganese', 54.94],
    [26, 'Fe', 'iron', 55.85], [27, 'Co', 'cobalt', 58.93], [28, 'Ni', 'nickel', 58.69], [29, 'Cu', 'copper', 63.55], [30, 'Zn', 'zinc', 65.38],
    [31, 'Ga', 'gallium', 69.72], [32, 'Ge', 'germanium', 72.63], [33, 'As', 'arsenic', 74.92], [34, 'Se', 'selenium', 78.97], [35, 'Br', 'bromine', 79.9],
    [36, 'Kr', 'krypton', 83.8], [37, 'Rb', 'rubidium', 85.47], [38, 'Sr', 'strontium', 87.62], [47, 'Ag', 'silver', 107.9], [50, 'Sn', 'tin', 118.7],
    [53, 'I', 'iodine', 126.9], [55, 'Cs', 'cesium', 132.9], [56, 'Ba', 'barium', 137.3], [79, 'Au', 'gold', 197.0], [80, 'Hg', 'mercury', 200.6], [82, 'Pb', 'lead', 207.2],
  ].forEach(([z, s, n, m]) => { EL[s] = { z, s, name: n, m }; });
  const BYZ = {};
  Object.values(EL).forEach((e) => { BYZ[e.z] = e; });

  // "Ca(NO3)2" → { Ca: 1, N: 2, O: 6 }
  function parse(f) {
    let i = 0;
    const num = () => { const m = f.slice(i).match(/^\d+/); if (m) { i += m[0].length; return +m[0]; } return 1; };
    const group = () => {
      const out = {};
      while (i < f.length && f[i] !== ')') {
        if (f[i] === '(') { i++; const inner = group(); i++; const n = num(); for (const k in inner) out[k] = (out[k] || 0) + inner[k] * n; }
        else { const m = f.slice(i).match(/^[A-Z][a-z]?/); if (!m) throw new Error('bad formula ' + f); i += m[0].length; const n = num(); out[m[0]] = (out[m[0]] || 0) + n; }
      }
      return out;
    };
    return group();
  }

    const Z = R.pick(CFG_POOL);

    const right = cfg(Z);
    const wrong = new Set();
    const subs = fill(Z);
    // distractors: shift an electron, forget 4s, wrong core, too many/few electrons
    wrong.add(cfgStr(fill(Z + 1), Z));
    wrong.add(cfgStr(fill(Z - 1), Z));
    if (subs.some((x) => x[0] === '3d' && x[1] > 0)) { const s2 = subs.map((x) => x.slice()); const four = s2.find((x) => x[0] === '4s'); const d3 = s2.find((x) => x[0] === '3d'); if (four[1] === 2 && d3[1] < 10) { four[1] = 0; d3[1] += 2; wrong.add(cfgStr(s2, Z)); } }

    if (lastP[0].endsWith('p') && lastP[1] > 1) { const s3 = subs.map((x) => x.slice()); s3[s3.length - 1][1]--; s3[s3.length - 2][1]++; wrong.add(cfgStr(s3, Z)); }
    const opts = [right].concat([...wrong].filter((w) => w !== right)).slice(0, 4);
    return { t: 'mc', lvl: 3, q: 'Which is the ground-state electron configuration of **' + e.name + ' (' + e.s + ', Z = ' + Z + ')**?', opts, why: 'Fill in order 1s 2s 2p 3s 3p 4s 3d 4p, using exactly ' + Z + ' electrons. Full form: ' + cfgFull(Z) + '.' };

      key: 'Energy comes in packets (photons): $E = hν = hc/λ$, with h = 6.626 × 10⁻³⁴ J·s. Per mole, multiply by N_A. Photoelectric effect: electrons are ejected only if hν exceeds the metal\'s work function Φ (the threshold frequency). Extra energy becomes kinetic energy: $KE = hν − Φ$. Brighter light (more photons) ejects MORE electrons, but not faster ones. Below the threshold, no amount of brightness works.',
      formulas: ['E = hν = [[hc|λ]]', 'h = 6.626 × 10⁻³⁴ J·s', 'KE = hν − Φ'],
    }, [
      T('Light comes in packets', `
Planck and Einstein: light energy is **quantized** into photons:
$$ E = hν = [[hc|λ]] :: h = 6.626 × 10⁻³⁴ J·s $$
Shorter wavelength → higher-energy photons. That's why UV gives sunburns and visible light doesn't.
**Photoelectric effect:** shining light on a metal ejects electrons only if each photon has enough energy:
$$ KE_{electron} = hν − Φ :: Φ = work function $$
>! Turning up the **brightness** of red light below the threshold does nothing. More photons, but each one is still too weak. Frequency matters, not intensity.`),
      EX('A green photon', 'Find the energy of one 532 nm photon, and of a mole of them.', ['E = hc/λ = (6.626×10⁻³⁴)(2.998×10⁸)/(532×10⁻⁹)', 'E = **3.73 × 10⁻¹⁹ J** per photon', '× 6.022×10²³ = 2.25 × 10⁵ J = **225 kJ/mol**']),
      G('c.photon'),
      MC('Light below a metal\'s threshold frequency is made much brighter. What happens?', ['Still no electrons are ejected', 'More electrons are ejected', 'Faster electrons are ejected', 'Electrons are ejected after a delay'], 'Each photon still lacks the energy. Intensity doesn\'t help.'),
      G('c.photon'),
      TF('A photon of UV light has more energy than a photon of infrared light.', true, 'UV has a shorter wavelength, so a higher hν.'),
      G('c.photoelectric'),
    ]),
    L('c3l3', 'Bohr Model & the Hydrogen Spectrum', {
      goal: 'Calculate the energy and wavelength of hydrogen\'s spectral lines.',
      key: 'Bohr: the electron in H occupies quantized energy levels $Eₙ = −2.18 × 10⁻¹⁸ J (1/n²)$. A jump down (emission) releases a photon with $|ΔE| = 2.18 × 10⁻¹⁸ J |1/n_f² − 1/n_i²|$ and $λ = hc/|ΔE|$. A jump up requires absorbing exactly that energy. Drops to n = 1 are UV (Lyman), to n = 2 visible (Balmer), to n = 3 IR (Paschen). Bigger gaps mean higher energy and shorter λ.',
      formulas: ['Eₙ = −2.18 × 10⁻¹⁸ J ([[1|n²]])', 'ΔE = 2.18 × 10⁻¹⁸ J ([[1|n_f²]] − [[1|n_i²]])', 'λ = [[hc|ΔE]]'],
    }, [
      T('Energy ladders', `
In the Bohr model, hydrogen's electron can only have certain energies:
$$ Eₙ = −2.18 × 10⁻¹⁸ J × [[1|n²]] $$
Levels crowd together at the top. When the electron **drops**, it emits a photon carrying exactly the energy difference. When it absorbs exactly that much, it **jumps up**.
| Series | Ends at | Region |
|---|---|---|
| Lyman | n = 1 | UV |
| Balmer | n = 2 | visible |
| Paschen | n = 3 | IR |
>! Moving **up** (n increases) **absorbs** light. Moving **down emits** light.`, { fig: D.levels({ trans: [[3, 2], [4, 2], [2, 1]] }) }),
      EX('The red line of hydrogen', 'Find λ for n = 3 → n = 2.', ['ΔE = 2.18×10⁻¹⁸ (1/4 − 1/9) = 3.03 × 10⁻¹⁹ J', 'λ = hc/ΔE = (1.986×10⁻²⁵)/(3.03×10⁻¹⁹) = 6.56 × 10⁻⁷ m', '= **656 nm**, the red Balmer line']),
      G('c.bohr'),
      MC('Which transition emits the **highest-energy** photon?', ['n = 4 → n = 1', 'n = 4 → n = 2', 'n = 3 → n = 2', 'n = 6 → n = 5'], 'Dropping all the way to n = 1 covers the biggest energy gap.', { lvl: 2 }),
      TF('An electron moving from n = 2 to n = 4 emits a photon.', false, 'Going up to a higher level requires absorbing energy.'),
      G('c.bohr'),
      G('c.bohr'),
    ]),
    L('c3l4', 'Matter Waves & Uncertainty', {
      goal: 'Use the de Broglie relation and explain why electrons need orbitals.',
      key: 'De Broglie: moving matter has a wavelength $λ = h/(mu)$, which is significant only for tiny masses like electrons. Heisenberg: you can\'t know both position and momentum exactly, $Δx·mΔu ≥ h/4π$, so electrons don\'t have exact orbits. Schrödinger\'s wave function ψ gives the probability of finding the electron: ψ² is the electron density. An orbital is the region where the electron is likely to be found.',
      formulas: ['λ = [[h|mu]]', 'Δx·mΔu ≥ [[h|4π]]'],
    }, [
      T('Electrons are waves too', `
**De Broglie:** anything moving has a wavelength:
$$ λ = [[h|mu]] $$
For a baseball, λ is about 10⁻³⁴ m, far too small to matter. For an electron, λ is about the size of an atom, so its wave nature dominates.
**Heisenberg uncertainty:** $Δx · mΔu ≥ h/4π$. Pin down the position and the momentum becomes fuzzy.
>* That's why the Bohr model's neat circular orbits fail for atoms other than hydrogen. Quantum mechanics gives **orbitals**, probability clouds described by ψ², instead.`),
      G('c.debroglie'),
      MC('Why don\'t we notice the wave nature of a thrown baseball?', ['Its de Broglie wavelength is far too small', 'Baseballs have no momentum', 'Only charged particles have wavelengths', 'Baseballs move too slowly'], 'λ = h/mu, and with a large m, λ is negligible.'),
      G('c.debroglie'),
      TF('An orbital is a fixed circular path that an electron follows around the nucleus.', false, 'An orbital is a probability region (ψ²), not a path.'),
      MC('According to the uncertainty principle, it is impossible to know an electron\'s exact…', ['position and momentum at the same time', 'charge', 'mass', 'energy level in hydrogen'], 'Δx·mΔu ≥ h/4π.'),
    ]),
    L('c3l5', 'Quantum Numbers & Orbitals', {
      goal: 'Assign and check quantum numbers and count orbitals and electrons.',
      key: 'n = 1, 2, 3, … (shell and size). ℓ = 0 to n − 1 (subshell shape: 0 = s, 1 = p, 2 = d, 3 = f). mℓ = −ℓ … +ℓ (orientation, giving 2ℓ + 1 orbitals per subshell). mₛ = +½ or −½ (spin). Each shell has n² orbitals and holds 2n² electrons. s orbitals are spherical, p orbitals dumbbell-shaped (px, py, pz). An orbital has ℓ angular nodes and n − 1 nodes in total.',
      formulas: ['ℓ = 0 … n−1', 'mℓ = −ℓ … +ℓ', 'orbitals per subshell = 2ℓ + 1', 'per shell: n² orbitals, 2n² e⁻'],
    }, [
      T('Every electron\'s address', `
| Quantum number | Allowed values | Describes |
|---|---|---|
| n | 1, 2, 3, … | shell (size, energy) |
| ℓ | 0 … n − 1 | subshell shape (s p d f) |
| mℓ | −ℓ … +ℓ | orientation |
| mₛ | +½ or −½ | spin |
| ℓ | 0 | 1 | 2 | 3 |
|---|---|---|---|---|
| letter | s | p | d | f |
| orbitals | 1 | 3 | 5 | 7 |
>! A 2d subshell doesn't exist: for n = 2, ℓ can only be 0 or 1.`),
      MATCH('Match each ℓ value to its subshell letter.', [['ℓ = 0', 's'], ['ℓ = 1', 'p'], ['ℓ = 2', 'd'], ['ℓ = 3', 'f']]),
      G('c.qn'),
      G('c.orbcount'),
      MC('Which subshell does **not** exist?', ['3f', '4f', '2p', '3d'], 'For n = 3, ℓ ≤ 2, so no f (ℓ = 3).'),
      G('c.orbcount'),
      G('c.qn'),
      TF('The 3p subshell contains 3 orbitals that can hold 6 electrons.', true, 'ℓ = 1 → 3 orbitals × 2 electrons.'),
    ]),
  ]);

  /* ================= Unit 4 ================= */
  const u4 = U('c4', 'Electron Configurations', { sub: 'Aufbau, Hund, ions & magnetism', ch: 'Ch 3' }, [
    L('c4l1', 'Aufbau, Pauli & Hund', {
      goal: 'Fill orbital diagrams using the three rules.',
      key: '**Aufbau:** fill the lowest-energy subshells first: 1s 2s 2p 3s 3p 4s 3d 4p 5s 4d 5p. **Pauli exclusion:** no two electrons share all four quantum numbers, so each orbital holds at most 2, with opposite spins. **Hund\'s rule:** within a subshell, put one electron in each orbital (same spin) before pairing any. Example: N is 1s² 2s² 2p³ with three unpaired 2p electrons.',
      formulas: ['1s 2s 2p 3s 3p 4s 3d 4p 5s 4d 5p'],
    }, [
      T('Three rules for filling', `
1. **Aufbau:** lowest energy first. Note **4s fills before 3d**.
2. **Pauli exclusion:** at most 2 electrons per orbital, with opposite spins (↑↓)
3. **Hund's rule:** spread out across equal-energy orbitals before pairing up (like people taking empty bus seats first)
>* Nitrogen: three 2p electrons go into three **separate** 2p orbitals, all spin-up.`, { fig: D.orbBoxes([['1s', 2], ['2s', 2], ['2p', 3]], { alt: 'Orbital diagram of nitrogen: 1s², 2s², and three unpaired 2p electrons' }) }),
      ORDER('Put these subshells in filling (Aufbau) order.', ['3s', '3p', '4s', '3d', '4p']),
      MC('Which rule says the three 2p electrons of nitrogen occupy separate orbitals?', ['Hund\'s rule', 'Pauli exclusion principle', 'Aufbau principle', 'Heisenberg principle'], 'Hund: maximize unpaired electrons in a subshell.'),
      MC('The Pauli exclusion principle limits each orbital to…', ['2 electrons with opposite spins', '2 electrons with the same spin', '8 electrons', '1 electron'], 'No two electrons can share all four quantum numbers.'),
      TF('The 4s subshell fills before the 3d subshell.', true, 'For neutral atoms, 4s is slightly lower in energy when filling.'),
      FILL('Oxygen has ___ electrons in its 2p subshell, which gives ___ unpaired electrons.', ['4', '2'], ['6', '3', '0'], '2p⁴: three orbitals fill singly, then one pairs, which leaves 2 unpaired.'),
    ]),
    L('c4l2', 'Writing Electron Configurations', {
      goal: 'Write full and noble-gas (condensed) configurations.',
      key: 'Count the electrons (Z for a neutral atom) and fill subshells in Aufbau order, writing each as $nℓ^{electrons}$. Condensed form: write the previous noble gas in brackets, then the rest: S = [Ne] 3s² 3p⁴, Fe = [Ar] 4s² 3d⁶. The superscripts should add up to Z.',
      formulas: ['S: 1s² 2s² 2p⁶ 3s² 3p⁴ = [Ne] 3s² 3p⁴', 'Fe: [Ar] 4s² 3d⁶'],
    }, [
      T('Spelling out the configuration', `
Full: list every subshell. Condensed: start from the previous noble gas.
| Element | Full | Condensed |
|---|---|---|
| Na (11) | 1s² 2s² 2p⁶ 3s¹ | [Ne] 3s¹ |
| S (16) | 1s² 2s² 2p⁶ 3s² 3p⁴ | [Ne] 3s² 3p⁴ |
| Fe (26) | 1s² 2s² 2p⁶ 3s² 3p⁶ 4s² 3d⁶ | [Ar] 4s² 3d⁶ |
| Br (35) | … 4s² 3d¹⁰ 4p⁵ | [Ar] 4s² 3d¹⁰ 4p⁵ |
>* Check: the superscripts must add up to the number of electrons.`),
      G('c.config'),
      G('c.config'),
      MC('What is the condensed configuration of phosphorus (Z = 15)?', ['[Ne] 3s² 3p³', '[Ne] 3s² 3p⁵', '[Ar] 3s² 3p³', '[Ne] 3p⁵'], '15 − 10 (Ne core) = 5 electrons: 3s² 3p³.'),
      G('c.config'),
      TF('The configuration [Ar] 4s² 3d¹⁰ 4p² belongs to germanium (Z = 32).', true, '18 + 2 + 10 + 2 = 32.'),
      G('c.config'),
    ]),
    L('c4l3', 'Blocks, Valence & Exceptions', {
      goal: 'Read configurations off the periodic table, count valence electrons, and know Cr and Cu.',
      key: 'The table is organized by the last subshell filled: s block (groups 1–2), p block (13–18), d block (3–12), f block. Valence electrons are those in the highest n shell: for main-group elements, the last digit of the group number (Cl: 7, O: 6). Exceptions: Cr = [Ar] 4s¹ 3d⁵ and Cu = [Ar] 4s¹ 3d¹⁰. Half-filled and filled d subshells are extra stable.',
      formulas: ['Cr: [Ar] 4s¹ 3d⁵', 'Cu: [Ar] 4s¹ 3d¹⁰'],
    }, [
      T('The table is a configuration map', `
- **s block:** groups 1–2
- **p block:** groups 13–18
- **d block:** transition metals, groups 3–12 (fill (n−1)d)
**Valence electrons** are in the outermost shell, and they drive chemistry. Main-group shortcut: the group's last digit.
>! **Exceptions** you have to know: chromium is [Ar] 4s¹ 3d⁵ and copper is [Ar] 4s¹ 3d¹⁰. One 4s electron moves to make a half-filled or full d subshell, which is extra stable.`, { fig: D.ptable({ hl: { Cr: 'c6', Cu: 'c6' } }) }),
      G('c.valence'),
      MC('What is the ground-state configuration of **copper** (Z = 29)?', ['[Ar] 4s¹ 3d¹⁰', ['[Ar] 4s² 3d⁹', 'That\'s what Aufbau predicts. Copper is an exception: a full 3d¹⁰ is more stable.'], '[Ar] 3d¹¹', '[Kr] 4s¹'], 'A filled 3d¹⁰ subshell is extra stable.'),
      MC('Which block of the periodic table is bromine in?', ['p block', 's block', 'd block', 'f block'], 'Br is in group 17, so its last electron enters 4p.'),
      G('c.valence'),
      MC('What is the ground-state configuration of **chromium** (Z = 24)?', ['[Ar] 4s¹ 3d⁵', ['[Ar] 4s² 3d⁴', 'Expected by Aufbau, but a half-filled 3d⁵ wins.'], '[Ar] 3d⁶', '[Ar] 4s² 4p⁴'], 'Half-filled 3d⁵ is extra stable.'),
      TF('All elements in group 17 have 7 valence electrons.', true, 'ns² np⁵.'),
    ]),
    L('c4l4', 'Ions & Magnetism', {
      goal: 'Write configurations for ions and predict paramagnetism.',
      key: 'Anions: add electrons to the next open orbital (Cl⁻ = [Ar]). Main-group cations lose their outermost electrons (Na⁺ = [Ne]). **Transition-metal cations lose ns electrons BEFORE (n−1)d**: Fe²⁺ = [Ar] 3d⁶ and Fe³⁺ = [Ar] 3d⁵. Paramagnetic means there are unpaired electrons (attracted to a magnet). Diamagnetic means all are paired. Isoelectronic species have the same number of electrons (N³⁻, O²⁻, F⁻, Ne, Na⁺, Mg²⁺, Al³⁺).',
      formulas: ['Fe²⁺: [Ar] 3d⁶ (4s lost first)', 'paramagnetic ⇔ unpaired e⁻'],
    }, [
      T('Ions: last in, first out? Not quite', `
**Anions** gain electrons into the next empty spot: O²⁻ = 1s² 2s² 2p⁶ = [Ne].
**Main-group cations** lose valence electrons: Mg²⁺ = [Ne].
**Transition-metal cations** lose **4s before 3d**, even though 4s filled first:
$$ Fe = [Ar] 4s² 3d⁶ → Fe²⁺ = [Ar] 3d⁶ → Fe³⁺ = [Ar] 3d⁵ $$
**Magnetism:** any unpaired electron makes the species **paramagnetic** (attracted to a magnet). All electrons paired makes it **diamagnetic**.`, { fig: D.orbBoxes([['3d', 5]], { alt: 'Fe3+ has five unpaired 3d electrons' }) }),
      G('c.ionconfig'),
      G('c.unpaired'),
      G('c.iso'),
      MC('Zn²⁺ ([Ar] 3d¹⁰) is…', ['diamagnetic', 'paramagnetic', 'ferromagnetic', 'impossible to determine'], 'A full 3d¹⁰ has every electron paired.'),
      G('c.unpaired'),
      TF('Fe²⁺ has the configuration [Ar] 4s² 3d⁴.', false, 'Iron loses its two 4s electrons: [Ar] 3d⁶.'),
      G('c.ionconfig'),
    ]),
  ]);

  CQ.addUnits('chem', [u1, u2, u3, u4]);
})();

<script>
/* content/chem-2.js */
/* CHEM 1311 · Units 5–7: periodic trends, compounds & formulas, Lewis structures (Burdge Ch 4–6) */
(function () {
  const CQ = window.CQ;
  const { L, U, T, EX, MC, MULTI, TF, NUM, TXT, FILL, MATCH, ORDER, G } = CQ.dsl;
  const F = (x, s = 3) => CQ.fmt(x, s);
  const D = CQ.dg;
  const ch = CQ.chem;
  const { EL, parse, molarMass } = CQ.chemkit;
  const uniq = (a) => [...new Set(a)];

  /* ================= data ================= */
  // [period, group, radius pm, IE1 kJ/mol, EN]
  const P = {
    Li: [2, 1, 152, 520, 1.0], Be: [2, 2, 112, 899, 1.5], B: [2, 13, 85, 801, 2.0], C: [2, 14, 77, 1086, 2.5], N: [2, 15, 75, 1402, 3.0], O: [2, 16, 73, 1314, 3.5], F: [2, 17, 72, 1681, 4.0],
    Na: [3, 1, 186, 496, 0.9], Mg: [3, 2, 160, 738, 1.2], Al: [3, 13, 143, 578, 1.5], Si: [3, 14, 118, 786, 1.8], P: [3, 15, 110, 1012, 2.1], S: [3, 16, 103, 1000, 2.5], Cl: [3, 17, 99, 1251, 3.0],
    K: [4, 1, 227, 419, 0.8], Ca: [4, 2, 197, 590, 1.0], Ga: [4, 13, 135, 579, 1.6], Ge: [4, 14, 122, 762, 1.8], As: [4, 15, 120, 947, 2.0], Se: [4, 16, 117, 941, 2.4], Br: [4, 17, 114, 1140, 2.8],
    Rb: [5, 1, 248, 403, 0.8], Sr: [5, 2, 215, 549, 1.0], I: [5, 17, 133, 1008, 2.5], Cs: [6, 1, 265, 376, 0.7], Ba: [6, 2, 222, 503, 0.9],
  };
  const ENV = Object.assign({ H: 2.1 }, Object.fromEntries(Object.entries(P).map(([k, v]) => [k, v[4]])));
  const VAL = { H: 1, Be: 2, B: 3, C: 4, N: 5, O: 6, F: 7, Si: 4, P: 5, S: 6, Cl: 7, Br: 7, I: 7, Xe: 8, Se: 6, Al: 3 };

  // ions: [formula, charge, name, polyatomic?]
  const CATS = [['Na', 1, 'sodium'], ['K', 1, 'potassium'], ['Li', 1, 'lithium'], ['Mg', 2, 'magnesium'], ['Ca', 2, 'calcium'], ['Ba', 2, 'barium'], ['Al', 3, 'aluminum'], ['NH4', 1, 'ammonium', 1], ['Zn', 2, 'zinc'], ['Ag', 1, 'silver'],
    ['Fe', 2, 'iron(II)'], ['Fe', 3, 'iron(III)'], ['Cu', 1, 'copper(I)'], ['Cu', 2, 'copper(II)'], ['Cr', 3, 'chromium(III)'], ['Co', 2, 'cobalt(II)'], ['Pb', 2, 'lead(II)'], ['Sn', 4, 'tin(IV)']];
  const ANS = [['F', -1, 'fluoride'], ['Cl', -1, 'chloride'], ['Br', -1, 'bromide'], ['I', -1, 'iodide'], ['O', -2, 'oxide'], ['S', -2, 'sulfide'], ['N', -3, 'nitride'], ['P', -3, 'phosphide'],
    ['OH', -1, 'hydroxide', 1], ['NO3', -1, 'nitrate', 1], ['NO2', -1, 'nitrite', 1], ['SO4', -2, 'sulfate', 1], ['SO3', -2, 'sulfite', 1], ['PO4', -3, 'phosphate', 1], ['CO3', -2, 'carbonate', 1],
    ['HCO3', -1, 'hydrogen carbonate', 1], ['C2H3O2', -1, 'acetate', 1], ['ClO4', -1, 'perchlorate', 1], ['ClO3', -1, 'chlorate', 1], ['MnO4', -1, 'permanganate', 1], ['CN', -1, 'cyanide', 1], ['Cr2O7', -2, 'dichromate', 1]];
  const gcd = (a, b) => (b ? gcd(b, a % b) : a);
  const part = (f, n, poly) => (n === 1 ? f : poly ? '(' + f + ')' + n : f + n);
  function ionic(cat, an) {
    const qc = cat[1], qa = -an[1], d = gcd(qc, qa);
    const nc = qa / d, na = qc / d;
    return { f: part(cat[0], nc, cat[3]) + part(an[0], na, an[3]), nc, na, name: cat[2] + ' ' + an[2] };
  }
  const chg = (q) => (Math.abs(q) > 1 ? CQ.supNum(Math.abs(q)) : '') + (q > 0 ? '⁺' : '⁻');
  const ionStr = (ion) => ch(ion[0]) + chg(ion[1]);
  CQ.chemkit.ions = { CATS, ANS, ionic, ionStr };

  /* ================= generators: Unit 5 ================= */
  const PROP = {
    radius: { col: 2, label: 'largest atomic radius', small: 'smallest atomic radius', why: 'Radius grows down a group (more shells) and shrinks across a period (higher Z_eff pulls electrons in).' },
    ie: { col: 3, label: 'highest first ionization energy', small: 'lowest first ionization energy', why: 'IE₁ rises across a period and falls down a group. Watch the dips at group 13 (after 2) and group 16 (after 15).' },
    en: { col: 4, label: 'highest electronegativity', small: 'lowest electronegativity', why: 'Electronegativity rises toward the upper right (fluorine is 4.0).' },
  };
  CQ.gen('c.trend', (R) => {
    const prop = R.pick(Object.keys(PROP)), big = R.chance(0.5);
    const keys = Object.keys(P);
    let set;
    if (R.chance(0.5)) { const per = R.pick([2, 3, 4]); set = R.sample(keys.filter((k) => P[k][0] === per), 3); }
    else { const grp = R.pick([1, 2, 17]); set = R.sample(keys.filter((k) => P[k][1] === grp), 3); }
    const col = PROP[prop].col;
    const vals = set.map((k) => P[k][col]);
    if (new Set(vals).size < 3) return CQ.gens['c.trend'](R);
    const best = set[vals.indexOf(big ? Math.max(...vals) : Math.min(...vals))];
    return { t: 'mc', lvl: 2, q: 'Which element has the **' + (big ? PROP[prop].label : PROP[prop].small) + '**?', opts: [best].concat(set.filter((k) => k !== best)), why: PROP[prop].why + ' Values: ' + set.map((k) => k + ' ' + P[k][col]).join(', ') + '.',
      fig: D.ptable({ hl: Object.fromEntries(set.map((k) => [k, 'c2'])), trend: prop === 'radius' ? 'radius' : prop }) };
  });

  CQ.gen('c.isoseries', (R) => {
    const series = R.pick([[['N³⁻', 7], ['O²⁻', 8], ['F⁻', 9], ['Na⁺', 11], ['Mg²⁺', 12], ['Al³⁺', 13]], [['P³⁻', 15], ['S²⁻', 16], ['Cl⁻', 17], ['K⁺', 19], ['Ca²⁺', 20]], [['Se²⁻', 34], ['Br⁻', 35], ['Rb⁺', 37], ['Sr²⁺', 38]]]);
    const pick = R.sample(series, 4).sort((a, b) => a[1] - b[1]);
    const big = R.chance(0.5);
    const ans = big ? pick[0] : pick[pick.length - 1];
    return { t: 'mc', lvl: 3, q: 'These ions are isoelectronic. Which is the **' + (big ? 'largest' : 'smallest') + '**?', opts: [ans[0]].concat(pick.filter((x) => x !== ans).map((x) => x[0])), why: 'Same number of electrons, so more protons pull them in tighter. Fewest protons → largest; most protons → smallest.' };
  });

  CQ.gen('c.iejump', (R) => {
    const data = [['Na', 1, [496, 4562, 6910, 9543]], ['Mg', 2, [738, 1451, 7733, 10540]], ['Al', 13, [578, 1817, 2745, 11577]], ['Si', 14, [786, 1577, 3232, 4356, 16091]], ['Ca', 2, [590, 1145, 4912, 6491]], ['K', 1, [419, 3052, 4420, 5877]]];
    const [s, grp, ies] = R.pick(data);
    const opts = ['group ' + grp].concat(['group 1', 'group 2', 'group 13', 'group 14'].filter((o) => o !== 'group ' + grp)).slice(0, 4);
    return { t: 'mc', lvl: 3, q: 'An element has successive ionization energies (kJ/mol): **' + ies.join(', ') + '**. Which group is it most likely in?', opts,
      why: 'The huge jump comes right after the valence electrons are gone and you start pulling core electrons. The jump after electron #' + grp % 10 + ' means ' + (grp % 10) + ' valence electrons (' + s + ').' };
  });

  CQ.gen('c.zeff', (R) => {
    const s = R.pick(['Na', 'Mg', 'Al', 'Si', 'P', 'S', 'Cl', 'Li', 'C', 'N', 'O', 'F', 'K']);
    const Z = EL[s].z, core = Z <= 2 ? 0 : Z <= 10 ? 2 : Z <= 18 ? 10 : 18;
    return { t: 'num', lvl: 2, q: 'Using Z_eff ≈ Z − (core electrons), estimate the effective nuclear charge felt by a valence electron of **' + s + '**.', a: Z - core, unit: '', abs: 0.01,
      steps: ['Z = ' + Z + ', core electrons = ' + core, 'Z_eff ≈ ' + Z + ' − ' + core + ' = **' + (Z - core) + '**'] };
  });

  /* ================= generators: Unit 6 ================= */
  CQ.gen('c.ionformula', (R) => {
    const cat = R.pick(CATS), an = R.pick(ANS);
    const r = ionic(cat, an);
    const acc = [r.f];

      MC('Which group has the most favorable (largest) electron affinities?', ['halogens (group 17)', 'noble gases (group 18)', 'alkali metals (group 1)', 'alkaline earth metals (group 2)'], 'One electron from a full shell, so they want it.'),
      G('c.trend'),
      MC('Which element is the most metallic?', ['Cs', 'Na', 'Mg', 'Al'], 'Metallic character increases down and to the left.'),
      TF('Electronegativity increases going down a group.', false, 'It decreases down a group and increases up and to the right.'),
      G('c.trend'),
    ]),
  ]);

  /* ================= Unit 6 ================= */
  const u6 = U('c6', 'Compounds & Formulas', { sub: 'Ionic vs molecular, naming, empirical formulas', ch: 'Ch 5' }, [
    L('c6l1', 'Ionic vs Molecular Compounds', {
      goal: 'Tell ionic from molecular compounds and write ionic formulas from charges.',
      key: 'A metal + a nonmetal makes an **ionic** compound: a lattice of cations and anions with no molecules. Nonmetals only make a **molecular** (covalent) compound. Main-group charges come from the group: 1 → +1, 2 → +2, Al → +3, 15 → −3, 16 → −2, 17 → −1. Write the formula so the charges cancel, using the lowest whole-number ratio (crisscross, then reduce). Lattice energy ∝ Q₁Q₂/d: bigger charges and smaller ions give a stronger lattice.',
      formulas: ['charges: G1 +1, G2 +2, Al +3, G15 −3, G16 −2, G17 −1', 'lattice energy ∝ [[Q₁Q₂|d]]'],
    }, [
      T('Two kinds of compounds', `
| | Ionic | Molecular |
|---|---|---|
| made of | metal + nonmetal | nonmetals only |
| particles | ions in a lattice | discrete molecules |
| example | NaCl, MgO | H₂O, CO₂ |
**Writing ionic formulas:** the total charge must be zero. Al³⁺ + O²⁻: crisscross the charges → Al₂O₃.
>! Always reduce: Mg²⁺ + O²⁻ is MgO, **not** Mg₂O₂.
>* **Lattice energy** follows Coulomb's law: $E ∝ Q₁Q₂/d$. MgO (2+, 2−) has a far larger lattice energy than NaF (1+, 1−).`),
      MC('Which compound is **ionic**?', ['CaCl₂', 'CO₂', 'NH₃', 'CH₄'], 'Calcium (metal) + chlorine (nonmetal).'),
      G('c.ionformula'),
      G('c.lattice'),
      MC('What charge does a sulfur ion usually have?', ['2−', '2+', '6+', '1−'], 'Group 16: gains 2 electrons to reach an octet.'),
      G('c.ionformula'),
      TF('Ionic compounds exist as discrete molecules.', false, 'They form extended lattices. The formula gives only the ratio of ions.'),
    ]),
    L('c6l2', 'Naming Ionic Compounds', {
      goal: 'Name ionic compounds, including metals with variable charges.',
      key: 'Cation name (unchanged) + anion name (-ide for a single-element anion). Metals that can have more than one charge (most transition metals, plus Sn and Pb) get a Roman numeral equal to the cation\'s charge: FeCl₃ = iron(III) chloride. Work the charge out backward from the anion. Never use Greek prefixes for ionic compounds. Fixed-charge metals (group 1, group 2, Al, Zn, Ag) get no numeral.',
      formulas: ['FeCl₃ → iron(III) chloride', 'CuO → copper(II) oxide'],
    }, [
      T('Cation first, anion second', `
- **Cation:** element name (sodium, calcium). Add a **Roman numeral** if the metal can take more than one charge.
- **Anion:** root + **-ide** for single atoms (chloride, oxide, nitride).
**Finding the numeral:** Fe₂O₃ has 3 O²⁻ = 6−, so 2 Fe = 6+ and each Fe is +3 → **iron(III) oxide**.
>! **No prefixes** in ionic names. CaCl₂ is "calcium chloride", never "calcium dichloride".
>* Group 1, group 2, Al³⁺, Zn²⁺ and Ag⁺ only have one charge, so they never get numerals.`),
      EX('Find the charge', 'Name CuCl₂ and Cu₂O.', ['CuCl₂: 2 Cl⁻ = 2−, so Cu is +2 → **copper(II) chloride**', 'Cu₂O: one O²⁻ = 2−, split over 2 Cu → each Cu is +1 → **copper(I) oxide**']),
      G('c.ionname'),
      G('c.namebuild'),
      MC('What is the name of **SnO₂**?', ['tin(IV) oxide', 'tin(II) oxide', 'tin dioxide', 'tin oxide'], 'Two O²⁻ = 4−, so Sn is +4.'),
      G('c.ionname'),
      TF('ZnCl₂ is named zinc(II) chloride.', false, 'Zinc only forms Zn²⁺, so no Roman numeral: zinc chloride.'),
      G('c.namebuild'),
    ]),
    L('c6l3', 'Polyatomic Ions', {
      goal: 'Know the common polyatomic ions cold.',
      key: 'Must-know ions: NH₄⁺ ammonium · OH⁻ hydroxide · NO₃⁻ nitrate / NO₂⁻ nitrite · SO₄²⁻ sulfate / SO₃²⁻ sulfite · PO₄³⁻ phosphate · CO₃²⁻ carbonate · HCO₃⁻ hydrogen carbonate (bicarbonate) · C₂H₃O₂⁻ acetate · ClO₄⁻ perchlorate, ClO₃⁻ chlorate, ClO₂⁻ chlorite, ClO⁻ hypochlorite · MnO₄⁻ permanganate · CrO₄²⁻ chromate · Cr₂O₇²⁻ dichromate · CN⁻ cyanide. Pattern: -ate has one more O than -ite (same charge). Per- adds an O, hypo- removes one. Use parentheses when you need more than one: Ca(NO₃)₂.',
      formulas: ['-ate: one more O than -ite', 'per-ate > -ate > -ite > hypo-ite', 'use ( ) for 2+ polyatomic ions'],
    }, [
      T('Ions that travel as a group', `
| Ion | Name | Ion | Name |
|---|---|---|---|
| NH₄⁺ | ammonium | OH⁻ | hydroxide |
| NO₃⁻ | nitrate | NO₂⁻ | nitrite |
| SO₄²⁻ | sulfate | SO₃²⁻ | sulfite |
| PO₄³⁻ | phosphate | CO₃²⁻ | carbonate |
| HCO₃⁻ | hydrogen carbonate | C₂H₃O₂⁻ | acetate |
| MnO₄⁻ | permanganate | CN⁻ | cyanide |
| CrO₄²⁻ | chromate | Cr₂O₇²⁻ | dichromate |
**Chlorine oxyanions:** ClO₄⁻ per**chlorate** · ClO₃⁻ chlor**ate** · ClO₂⁻ chlor**ite** · ClO⁻ **hypo**chlor**ite**
>! Need two? Wrap the ion in parentheses: Ca(OH)₂, Al₂(SO₄)₃.`),
      MATCH('Match each polyatomic ion to its name.', [['NO₃⁻', 'nitrate'], ['SO₄²⁻', 'sulfate'], ['PO₄³⁻', 'phosphate'], ['NH₄⁺', 'ammonium'], ['CO₃²⁻', 'carbonate']]),
      MATCH('Match each ion to its name.', [['NO₂⁻', 'nitrite'], ['SO₃²⁻', 'sulfite'], ['ClO⁻', 'hypochlorite'], ['C₂H₃O₂⁻', 'acetate'], ['MnO₄⁻', 'permanganate']]),
      G('c.ionformula'),
      MC('Which ion is **chlorite**?', ['ClO₂⁻', 'ClO₃⁻', 'ClO⁻', 'ClO₄⁻'], 'chlorate = ClO₃⁻, so chlorite has one fewer O.'),
      G('c.ionformula'),
      G('c.namebuild'),
    ]),
    L('c6l4', 'Molecular Compounds & Acids', {
      goal: 'Name binary molecular compounds and acids.',
      key: 'Molecular (two nonmetals): use Greek prefixes, 1 mono, 2 di, 3 tri, 4 tetra, 5 penta, 6 hexa, 7 hepta, 8 octa, 9 nona, 10 deca. Don\'t use "mono" on the first element, and drop the final a/o before "oxide" (pentoxide, monoxide). Acids: binary H–X becomes hydro-…-ic acid (HCl hydrochloric). Oxoacids: -ate → -ic acid (HNO₃ nitric, H₂SO₄ sulfuric), -ite → -ous acid (HNO₂ nitrous).',
      formulas: ['mono di tri tetra penta hexa hepta octa nona deca', 'HX → hydro-…-ic acid', '-ate → -ic acid · -ite → -ous acid'],

| Anion ending | Acid name | Example |

| -ite | …-**ous** acid | HNO₂ → nitrous acid |

      G('c.molname'),
      G('c.acid'),
      MC('What is the formula of **sulfur trioxide**?', ['SO₃', 'S₃O', 'SO₂', 'S₂O₃'], 'tri = 3 oxygens.'),
      G('c.molname'),
      G('c.acid'),
      TF('H₂SO₃ is named sulfuric acid.', false, 'SO₃²⁻ is sulfite, so H₂SO₃ is sulfurous acid.'),

    L('c6l5', 'Percent Composition & Empirical Formulas', {
      goal: 'Compute molar mass and % composition, and find empirical and molecular formulas.',
      key: 'Molar mass = Σ(atoms × atomic mass). Mass percent = (mass of element in 1 mol)/(molar mass) × 100. Empirical formula from percentages: assume 100 g so % becomes g, convert to moles, divide by the smallest, then multiply by a small integer if needed (×2 for .5, ×3 for .33 or .67). Molecular formula = empirical formula × n, where n = molar mass ÷ empirical-formula mass.',
      formulas: ['% = [[n × M_{el}|M_{compound}]] × 100', 'n = [[M_{molecular}|M_{empirical}]]'],
    }, [
      T('From percentages to formulas', `
**Empirical formula recipe** ("percent to mass, mass to mole, divide by small, multiply till whole"):
1. Assume 100 g, so each % becomes grams
2. Divide by atomic mass to get moles
3. Divide every value by the smallest
4. If you get x.5, x.33 or x.25, multiply everything by 2, 3 or 4
**Molecular formula:** $n = M/M_{emp}$, then multiply every subscript by n.
>! Don't round 1.5 to 2. A value like 1.5 means multiply everything by 2.`),
      EX('Glucose from scratch', 'A sugar is 40.0% C, 6.71% H, 53.3% O and has M = 180 g/mol. Find its empirical and molecular formulas.', ['Moles: C 40.0/12.01 = 3.33, H 6.71/1.008 = 6.66, O 53.3/16.00 = 3.33', '÷ 3.33: C 1, H 2, O 1 → **CH₂O** (30.03 g/mol)', 'n = 180/30.03 = 6 → **C₆H₁₂O₆**']),
      G('c.molarmass'),
      MC('When finding an empirical formula from mass percents, the convenient first step is to…', ['assume a 100 g sample so each percent becomes grams', 'assume 1 mol of compound', 'divide each percent by the molar mass of the compound', 'multiply each percent by Avogadro\'s number'], 'With 100 g, 40.0% C is simply 40.0 g C.'),
      G('c.percent'),
      TF('C₂H₄ and C₃H₆ have the same empirical formula.', true, 'Both reduce to CH₂.'),
      G('c.molarmass'),
      G('c.empirical'),
      G('c.molecular'),
      G('c.percent'),
    ]),
  ]);

  /* ================= Unit 7 ================= */
  const u7 = U('c7', 'Lewis Structures', { sub: 'Bond polarity, formal charge & resonance', ch: 'Ch 6' }, [
    L('c7l1', 'Electronegativity & Bond Polarity', {
      goal: 'Classify bonds as nonpolar covalent, polar covalent or ionic.',
      key: 'Electronegativity (EN) is an atom\'s pull on shared electrons, increasing toward fluorine (4.0). ΔEN sets the bond type: < 0.5 nonpolar covalent, 0.5–2.0 polar covalent (partial charges δ+ and δ−, with δ− on the more EN atom), ≥ 2.0 ionic. A bigger ΔEN means a more polar bond.',
      formulas: ['ΔEN < 0.5 nonpolar · 0.5–2.0 polar · ≥ 2.0 ionic'],
    }, [
      T('Tug-of-war for electrons', `
| ΔEN | Bond | Example |
|---|---|---|
| < 0.5 | nonpolar covalent | C–H (0.4), Cl–Cl (0) |
| 0.5 – 2.0 | polar covalent | O–H (1.4), H–Cl (0.9) |
| ≥ 2.0 | ionic | Na–Cl (2.1) |
In a polar bond, the more electronegative atom carries a partial negative charge: $^{δ+}H–Cl^{δ−}$
>* It's a continuum. The cutoffs are rules of thumb, and the larger the ΔEN, the more ionic the bond.`),
      G('c.bondtype'),
      G('c.mostpolar'),
      G('c.bondtype'),
      MC('In an H–F bond, which atom carries the partial negative charge?', ['F', 'H', 'neither', 'both'], 'F is far more electronegative.'),
      TF('A C–H bond is considered essentially nonpolar.', true, 'ΔEN = 0.4.'),
      G('c.mostpolar'),
    ]),
    L('c7l2', 'Drawing Lewis Structures', {
      goal: 'Draw a correct Lewis structure step by step.',
      key: '1) Count valence electrons (add one per negative charge, subtract one per positive charge). 2) Put the least electronegative atom in the center (never H; H and F are always terminal). 3) Connect with single bonds (2 e⁻ each). 4) Complete the outer atoms\' octets with lone pairs (H needs only 2). 5) Put leftover electrons on the central atom. 6) If the central atom is short of an octet, turn outer lone pairs into double or triple bonds.',
      formulas: ['total e⁻ = Σ valence − charge', 'central atom: least EN (not H)'],
    }, [
      T('The six-step recipe', `
1. **Count** valence electrons. Adjust: + for anion charge, − for cation charge
2. **Skeleton:** least electronegative atom in the center (never H)
3. **Single bonds** from the center to each outer atom
4. **Outer atoms:** complete octets with lone pairs (H gets only 2)
5. **Leftovers** go on the central atom as lone pairs
6. **Central atom short?** Move outer lone pairs in to make double or triple bonds
>* Check: count every electron in the drawing. It must equal your step 1 total.`, { fig: D.lewis({ w: 250, h: 110, atoms: [{ e: 'O', x: 50, y: 60, lp: [90, 180, 270] }, { e: 'C', x: 125, y: 60 }, { e: 'O', x: 200, y: 60, lp: [90, 0, 270] }], bonds: [[0, 1, 2], [1, 2, 2]], alt: 'Lewis structure of CO2: O=C=O' }) }),
      EX('Lewis structure of CO₂', 'Draw CO₂.', ['Valence e⁻: 4 + 2(6) = 16', 'Skeleton O–C–O uses 4 e⁻, leaving 12', 'Complete the O octets: 6 each, so 12 used, 0 left. But C has only 4 e⁻.', 'Move one lone pair from each O into a bond: **O=C=O**, each O with 2 lone pairs. All octets complete. ✓']),
      G('c.valcount'),
      G('c.valcount'),
      MC('Which atom is placed in the **center** of the Lewis structure of HCN?', ['C', 'H', 'N', 'any of them'], 'H is always terminal, and C is less electronegative than N.'),
      ORDER('Order the steps for drawing a Lewis structure.', ['Count total valence electrons', 'Choose the central atom and draw single bonds', 'Complete octets on the outer atoms', 'Place leftover electrons on the central atom', 'Form multiple bonds if the central atom lacks an octet']),
      MC('How many lone pairs are on the oxygen in H₂O?', ['2', '1', '3', '0'], '8 valence e⁻: 2 bonds use 4, which leaves 2 lone pairs on O.', { fig: D.lewis({ w: 200, h: 110, atoms: [{ e: 'H', x: 40, y: 80 }, { e: 'O', x: 100, y: 50 }, { e: 'H', x: 160, y: 80 }], bonds: [[0, 1, 1], [1, 2, 1]], alt: 'Water skeleton without lone pairs' }) }),
      G('c.valcount'),
    ]),
    L('c7l3', 'Formal Charge', {
      goal: 'Assign formal charges and pick the best Lewis structure.',
      key: 'Formal charge = (valence e⁻) − (nonbonding e⁻) − (number of bonds). Formal charges must add up to the overall charge. Best structure: formal charges as close to zero as possible, and any negative formal charge on the more electronegative atom. Avoid like charges on neighboring atoms.',
      formulas: ['FC = V − N − B', 'Σ FC = overall charge'],
    }, [
      T('Bookkeeping for electrons', `
$$ FC = V − N − B :: V valence, N nonbonding e⁻, B bonds $$
Count each lone-pair electron fully and each bond once (half of its 2 electrons).
**Choosing among valid structures:**
1. Formal charges closest to zero
2. Negative FC on the more electronegative atom
3. Sum of FCs = overall charge
>* In CO, carbon gets −1 and oxygen +1 (C≡O with a lone pair on each). Unusual, but it's the only way to give both atoms an octet.`, { fig: D.lewis({ w: 220, h: 100, atoms: [{ e: 'C', x: 70, y: 50, lp: [180], fc: '−1' }, { e: 'O', x: 150, y: 50, lp: [0], fc: '+1' }], bonds: [[0, 1, 3]], alt: 'Carbon monoxide with formal charges' }) }),
      EX('Formal charges in NO₃⁻', 'In one Lewis structure of nitrate, N has one double bond and two single bonds to O. Find each formal charge.', ['N: 5 − 0 − 4 = **+1**', 'Double-bonded O (2 lone pairs): 6 − 4 − 2 = **0**', 'Single-bonded O (3 lone pairs): 6 − 6 − 1 = **−1** each', 'Sum: +1 + 0 − 1 − 1 = −1 ✓ matches the ion\'s charge']),
      G('c.fc'),
      G('c.fc'),
      MC('Two valid Lewis structures differ only in formal charges. Which is preferred?', ['The one with formal charges closest to zero, and negative ones on the more electronegative atoms', 'The one with the most double bonds', 'The one with the most lone pairs', 'The one with positive charge on oxygen'], 'Minimize formal charge and put negative charge on electronegative atoms.'),
      G('c.fc'),
      TF('The formal charges in a neutral molecule must add up to zero.', true, 'Σ FC = overall charge.'),
    ]),
    L('c7l4', 'Resonance', {
      goal: 'Draw resonance structures and find average bond orders.',
      key: 'When more than one valid Lewis structure differs only in where the electrons sit (not the atoms), the real molecule is a resonance hybrid, an average of them. Examples: O₃ (2 structures), NO₃⁻ and CO₃²⁻ (3 each). All the equivalent bonds are identical and intermediate between single and double: bond order = total bonds ÷ number of positions (NO₃⁻: 4/3). Resonance structures never move atoms.',
      formulas: ['bond order = [[total bonds to outer atoms|number of outer atoms]]', 'NO₃⁻, CO₃²⁻: 4/3 · O₃, SO₂: 3/2'],

      T('One molecule, several drawings', `
Ozone can be drawn with the double bond on the left **or** on the right. Neither is the real molecule. Experiments show **both O–O bonds are identical**, about 1.5 bonds each.

      G('c.resonance'),
      MC('In the nitrate ion, the three N–O bonds are…', ['identical, each between a single and a double bond', 'one double and two single bonds', 'all double bonds', 'all single bonds'], 'Resonance spreads the double bond over all three positions.'),
      G('c.resonance'),
      TF('Resonance structures can differ in the arrangement of atoms.', false, 'Only electrons move. Atoms stay put.'),
      G('c.resonance'),
    ]),
    L('c7l5', 'Exceptions to the Octet Rule', {
      goal: 'Recognize incomplete octets, odd-electron molecules and expanded octets.',
      key: 'Three exceptions. **Incomplete octet:** Be (4 e⁻) and B (6 e⁻), as in BeCl₂ and BF₃. **Odd-electron** molecules (free radicals) have an odd total, so one electron is unpaired: NO, NO₂, ClO₂. **Expanded octet:** central atoms from period 3 or below (P, S, Cl, Xe, I) can hold more than 8 electrons because d orbitals are available: PCl₅ (10), SF₆ (12), XeF₄ (12). Period-2 atoms (C, N, O, F) can never exceed 8.',
      formulas: ['incomplete: Be, B', 'odd e⁻: NO, NO₂', 'expanded: period 3+ central atom'],
    }, [
      T('When eight isn\'t the rule', `
| Exception | Why | Examples |
|---|---|---|
| incomplete octet | Be and B are content with 4 or 6 | BeCl₂, BF₃ |
| odd-electron | odd total can't all pair | NO, NO₂ |
| expanded octet | period 3+ atoms have room | PCl₅, SF₆, XeF₄, I₃⁻ |
>! C, N, O and F **never** exceed an octet. Only period 3 and lower can expand.`, { fig: D.lewis({ w: 200, h: 160, atoms: [{ e: 'B', x: 100, y: 85 }, { e: 'F', x: 100, y: 25, lp: [0, 90, 180] }, { e: 'F', x: 45, y: 125, lp: [90, 180, 270] }, { e: 'F', x: 155, y: 125, lp: [0, 270, 90] }], bonds: [[0, 1, 1], [0, 2, 1], [0, 3, 1]], alt: 'BF3: boron with only six electrons' }) }),
      G('c.octet'),
      G('c.octet'),
      MC('Which central atom **cannot** have an expanded octet?', ['N', 'P', 'S', 'Xe'], 'Period-2 atoms have no d orbitals available.'),
      G('c.valcount'),
      TF('NO₂ has an odd number of valence electrons.', true, '5 + 2(6) = 17.'),
      G('c.octet'),
    ]),
  ]);

  CQ.addUnits('chem', [u5, u6, u7]);
})();

<script>

(function () {

  const MOL = [
    ['CH4', 0, 4, 0, 'tetrahedral', 'tetrahedral', '109.5°', 'sp³', false], ['NH3', 0, 4, 1, 'tetrahedral', 'trigonal pyramidal', 'about 107°', 'sp³', true],

    ['CHCl3', 0, 4, 0, 'tetrahedral', 'tetrahedral', 'about 109.5°', 'sp³', true], ['PCl3', 0, 4, 1, 'tetrahedral', 'trigonal pyramidal', 'about 107°', 'sp³', true],
    ['H2S', 0, 4, 2, 'tetrahedral', 'bent', 'about 92–104°', 'sp³', true], ['HCN', 0, 2, 0, 'linear', 'linear', '180°', 'sp', true],

      MC('A student reports a 112% yield. The most likely explanation is…', ['the product is still wet or impure', 'the reaction made extra atoms', 'the limiting reactant was in excess', 'the theoretical yield was too large'], 'Extra mass comes from water or impurities.'),
      G('c.pyield'),
      NUM('A reaction should produce **50.0 g** of product, and the typical yield is **85.0%**. How many grams do you expect to collect?', 42.5, 'g', 'actual = 0.850 × 50.0 = 42.5 g.', { lvl: 2, steps: ['actual = % yield × theoretical', '= 0.850 × 50.0 = **42.5 g**'] }),
      G('c.limiting'),
    ]),
  ]);

  /* ================= Unit 10 ================= */
  const u10 = U('c10', 'Aqueous Reactions', { sub: 'Solubility, net ionic, acids/bases, redox & titrations', ch: 'Ch 9' }, [
    L('c10l1', 'Electrolytes & Solubility', {
      goal: 'Classify electrolytes and predict solubility with the rules.',
      key: 'Strong electrolytes ionize completely: soluble ionic compounds, strong acids and strong bases. Weak electrolytes ionize partially: weak acids (HF, HC₂H₃O₂) and weak bases (NH₃). Nonelectrolytes don\'t ionize (sugar, alcohols). Solubility rules: compounds of group 1, NH₄⁺, NO₃⁻, C₂H₃O₂⁻ and ClO₄⁻ are always soluble. Cl⁻, Br⁻ and I⁻ are soluble except with Ag⁺, Hg₂²⁺ and Pb²⁺. SO₄²⁻ is soluble except with Ba²⁺, Sr²⁺, Ca²⁺, Pb²⁺, Hg₂²⁺ and Ag⁺. CO₃²⁻, PO₄³⁻, CrO₄²⁻ and S²⁻ are insoluble except with group 1 and NH₄⁺. OH⁻ is insoluble except with group 1, NH₄⁺ and Ba²⁺.',
      formulas: ['always soluble: group 1, NH₄⁺, NO₃⁻, acetate, ClO₄⁻', 'halides: not with Ag⁺, Hg₂²⁺, Pb²⁺', 'sulfates: not with Ba, Sr, Ca, Pb, Hg₂, Ag'],
    }, [
      T('What dissolves, and what conducts', `
| Type | Ionizes | Examples |
|---|---|---|
| strong electrolyte | completely | NaCl, HCl, NaOH |
| weak electrolyte | partly | HC₂H₃O₂, NH₃, HF |
| nonelectrolyte | not at all | sugar, ethanol |
**Strong acids to memorize:** HCl, HBr, HI, HNO₃, H₂SO₄, HClO₄, HClO₃.`),
      T('Solubility rules', `
**Always soluble:** group 1 ions, NH₄⁺, NO₃⁻, C₂H₃O₂⁻ (acetate), ClO₄⁻
**Usually soluble:**
- Cl⁻, Br⁻, I⁻, except with Ag⁺, Hg₂²⁺, Pb²⁺
- SO₄²⁻, except with Ba²⁺, Sr²⁺, Ca²⁺, Pb²⁺, Hg₂²⁺, Ag⁺
**Usually insoluble:**
- CO₃²⁻, PO₄³⁻, CrO₄²⁻, S²⁻, unless paired with group 1 or NH₄⁺
- OH⁻, unless group 1, NH₄⁺ or Ba²⁺
>* The "always soluble" ions beat everything: K₃PO₄ is soluble because of K⁺.`),
      G('c.electrolyte'),
      G('c.soluble'),
      G('c.soluble'),
      MC('Which is a **weak** electrolyte?', ['HC₂H₃O₂ (acetic acid)', 'HCl', 'NaCl', 'KOH'], 'Acetic acid only partly ionizes.'),
      G('c.soluble'),
      G('c.electrolyte'),
    ]),
    L('c10l2', 'Precipitation & Net Ionic Equations', {
      goal: 'Predict precipitates and write net ionic equations.',
      key: 'Mixing two ionic solutions: swap partners and check each new pair with the solubility rules. An insoluble pair forms a precipitate (s). Molecular equation → complete ionic equation (write strong electrolytes as separate ions) → cancel the spectator ions (unchanged on both sides) → net ionic equation. Example: Ag⁺(aq) + Cl⁻(aq) → AgCl(s). Solids, liquids, gases and weak electrolytes stay as formulas.',
      formulas: ['molecular → complete ionic → net ionic', 'cancel the spectators'],
    }, [
      T('Swap partners, keep what reacts', `
**AgNO₃(aq) + NaCl(aq)**
1. Swap partners: AgCl and NaNO₃
2. Solubility: AgCl is **insoluble**, NaNO₃ is soluble
3. Complete ionic: Ag⁺ + NO₃⁻ + Na⁺ + Cl⁻ → AgCl(s) + Na⁺ + NO₃⁻
4. Cancel spectators (Na⁺, NO₃⁻):
$$ Ag⁺(aq) + Cl⁻(aq) → AgCl(s) $$
>! Only split **strong electrolytes** in aqueous solution. Keep solids, water, gases and weak acids whole.`),
      G('c.precip'),
      G('c.precip'),
      MC('Spectator ions are ions that…', ['appear unchanged on both sides of the equation', 'form the precipitate', 'are always cations', 'only appear in the products'], 'They are present but don\'t take part.'),
      G('c.precip'),
      TF('In a net ionic equation, a precipitate is written as separate ions.', false, 'Solids are written as formulas with (s).'),
      G('c.precip'),
    ]),
    L('c10l3', 'Acid–Base Reactions', {
      goal: 'Identify strong acids and bases and write neutralization equations.',
      key: 'Arrhenius acids produce H⁺ in water and bases produce OH⁻. Brønsted acids donate H⁺ and bases accept H⁺. Strong acids: HCl, HBr, HI, HNO₃, H₂SO₄, HClO₄, HClO₃. Strong bases: group 1 hydroxides plus Ca(OH)₂, Sr(OH)₂, Ba(OH)₂. Neutralization: acid + base → salt + water. Strong acid + strong base net ionic: H⁺ + OH⁻ → H₂O. Weak acids and weak bases are written as molecules in net ionic equations.',
      formulas: ['acid + base → salt + H₂O', 'strong + strong: H⁺ + OH⁻ → H₂O'],
    }, [
      T('Proton swapping', `
**Strong acids** (memorize all 7): HCl, HBr, HI, HNO₃, H₂SO₄, HClO₄, HClO₃
**Strong bases:** LiOH, NaOH, KOH, RbOH, CsOH, Ca(OH)₂, Sr(OH)₂, Ba(OH)₂
**Neutralization:** HCl(aq) + NaOH(aq) → NaCl(aq) + H₂O(l)
$$ H⁺(aq) + OH⁻(aq) → H₂O(l) :: net ionic for strong acid + strong base $$
>! A **weak** acid stays as a molecule: HF(aq) + OH⁻(aq) → F⁻(aq) + H₂O(l).`),
      MC('Which is a **strong** acid?', ['HNO₃', 'HF', 'HC₂H₃O₂', 'H₂CO₃'], 'Nitric acid is on the strong-acid list.'),
      G('c.neutral'),
      MATCH('Classify each compound.', [['HCl', 'strong acid'], ['NaOH', 'strong base'], ['NH₃', 'weak base'], ['HF', 'weak acid']]),
      G('c.neutral'),
      TF('Every acid–base neutralization has the net ionic equation H⁺ + OH⁻ → H₂O.', false, 'Only strong acid + strong base. Weak species stay molecular.'),
      G('c.neutral'),
    ]),
    L('c10l4', 'Oxidation Numbers & Redox', {
      goal: 'Assign oxidation numbers and identify what is oxidized and reduced.',
      key: 'Oxidation-number rules: elements are 0; monatomic ions equal their charge; O is −2 (−1 in peroxides); H is +1 (−1 with metals); F is −1; group 1 is +1, group 2 is +2; the sum equals the overall charge. Oxidation = loss of electrons (oxidation number goes up). Reduction = gain of electrons (oxidation number goes down). OIL RIG. The species oxidized is the reducing agent, and the one reduced is the oxidizing agent. A metal displaces ions of metals below it on the activity series.',
      formulas: ['OIL RIG', 'oxidized = reducing agent · reduced = oxidizing agent', 'Σ ox numbers = charge'],
    }, [
      T('Following electrons', `
**Oxidation-number rules** (in priority order):
1. Free element: 0 (Fe, O₂, Cl₂)
2. Monatomic ion: its charge (Na⁺ = +1)
3. F: −1. O: −2 (−1 in peroxides). H: +1 (−1 with metals)
4. Sum = overall charge
**OIL RIG:** **O**xidation **I**s **L**oss, **R**eduction **I**s **G**ain (of electrons)
>* In Zn + Cu²⁺ → Zn²⁺ + Cu: Zn goes 0 → +2 (**oxidized**, the reducing agent) and Cu²⁺ goes +2 → 0 (**reduced**, the oxidizing agent).`),
      EX('Sulfur in sulfuric acid', 'Find the oxidation number of S in H₂SO₄.', ['H: 2(+1) = +2. O: 4(−2) = −8', 'Neutral: +2 + S − 8 = 0', 'S = **+6**']),
      G('c.oxnum'),
      G('c.redox'),
      G('c.oxnum'),
      G('c.activity'),
      TF('The species that is oxidized is called the oxidizing agent.', false, 'It\'s the reducing agent, because it gives electrons away.'),
      G('c.oxnum'),
    ]),
    L('c10l5', 'Molarity, Dilution & Titration', {
      goal: 'Work molarity, dilution and titration problems.',
      key: 'Molarity: M = mol solute / L solution, so mol = M × L. Dilution: $M₁V₁ = M₂V₂$ (the moles of solute stay the same). Solution stoichiometry: M × V → mol → mole ratio → mol → whatever you need. Titration: at the equivalence point, moles of H⁺ = moles of OH⁻. Watch for diprotic acids like H₂SO₄ (2 H⁺ each). M₁V₁ = M₂V₂ only works for 1:1 titrations and for dilution.',
      formulas: ['M = [[mol|L]]', 'M₁V₁ = M₂V₂ (dilution)', 'equivalence: mol H⁺ = mol OH⁻'],
    }, [
      T('Concentration as a conversion factor', `
$$ M = [[mol solute|L solution]] $$
So 0.250 L of 2.00 M NaCl contains 0.500 mol.
**Dilution** adds solvent but no solute: $M₁V₁ = M₂V₂$.
**Titration:** add base from a buret until the moles of OH⁻ exactly match the moles of H⁺.
>! H₂SO₄ gives 2 H⁺ per molecule, so it needs twice as much NaOH as the same moles of HCl.`),
      EX('Titrating an acid', '25.0 mL of HCl is neutralized by 32.4 mL of 0.100 M NaOH. Find [HCl].', ['mol NaOH = 0.100 × 0.0324 = 3.24 × 10⁻³ mol', '1 : 1 → mol HCl = 3.24 × 10⁻³', '[HCl] = 3.24×10⁻³ / 0.0250 = **0.130 M**']),
      G('c.molarity'),
      G('c.molarity'),
      G('c.titration'),
      MC('When you dilute a solution with water, what stays the same?', ['the moles of solute', 'the molarity', 'the volume', 'the density'], 'That\'s why M₁V₁ = M₂V₂.'),
      G('c.molarity'),
      G('c.titration'),
    ]),
  ]);

  CQ.addUnits('chem', [u8, u9, u10]);
})();

<script>
/* content/chem-4.js */
/* CHEM 1311 · Units 11–12: thermochemistry and gases (Burdge Ch 10–11) */
(function () {
  const CQ = window.CQ;
  const { L, U, T, EX, MC, MULTI, TF, NUM, TXT, FILL, MATCH, ORDER, G } = CQ.dsl;
  const F = (x, s = 3) => CQ.fmt(x, s);
  const D = CQ.dg;
  const ch = CQ.chem;
  const { molarMass } = CQ.chemkit;
  const Rg = 0.08206, R8 = 8.314;

  /* ================= data ================= */
  const CS = { water: 4.184, aluminum: 0.900, copper: 0.385, iron: 0.444, glass: 0.84, ethanol: 2.46, lead: 0.129 };
  const HF = { 'CO2(g)': -393.5, 'H2O(l)': -285.8, 'H2O(g)': -241.8, 'CH4(g)': -74.8, 'C2H6(g)': -84.7, 'C3H8(g)': -103.9, 'C2H5OH(l)': -277.0, 'C6H12O6(s)': -1274.5, 'NH3(g)': -46.1,
    'NO(g)': 90.4, 'NO2(g)': 33.9, 'CaCO3(s)': -1206.9, 'CaO(s)': -635.6, 'SO2(g)': -296.8, 'SO3(g)': -395.7, 'Fe2O3(s)': -822.2, 'Al2O3(s)': -1669.8, 'CO(g)': -110.5, 'C2H2(g)': 226.6, 'HCl(g)': -92.3,
    'O2(g)': 0, 'N2(g)': 0, 'H2(g)': 0, 'Fe(s)': 0, 'Al(s)': 0, 'Cl2(g)': 0 };
  // reactions for ΔH°f problems: [[coef, species]...] → [[coef, species]...]
  const HRX = [
    [[[1, 'CH4(g)'], [2, 'O2(g)']], [[1, 'CO2(g)'], [2, 'H2O(l)']]], [[[1, 'C3H8(g)'], [5, 'O2(g)']], [[3, 'CO2(g)'], [4, 'H2O(l)']]],
    [[[1, 'C2H5OH(l)'], [3, 'O2(g)']], [[2, 'CO2(g)'], [3, 'H2O(l)']]], [[[1, 'CaCO3(s)']], [[1, 'CaO(s)'], [1, 'CO2(g)']]],
    [[[4, 'NH3(g)'], [5, 'O2(g)']], [[4, 'NO(g)'], [6, 'H2O(g)']]], [[[2, 'SO2(g)'], [1, 'O2(g)']], [[2, 'SO3(g)']]],
    [[[1, 'Fe2O3(s)'], [3, 'CO(g)']], [[2, 'Fe(s)'], [3, 'CO2(g)']]], [[[2, 'Al(s)'], [1, 'Fe2O3(s)']], [[1, 'Al2O3(s)'], [2, 'Fe(s)']]],
    [[[2, 'NO(g)'], [1, 'O2(g)']], [[2, 'NO2(g)']]], [[[1, 'C6H12O6(s)'], [6, 'O2(g)']], [[6, 'CO2(g)'], [6, 'H2O(l)']]],
    [[[2, 'C2H2(g)'], [5, 'O2(g)']], [[4, 'CO2(g)'], [2, 'H2O(l)']]],
  ];
  const sp = (s) => ch(s.replace(/\(.*\)/, '')) + s.match(/\(.*\)/)[0];
  const sideStr = (side) => side.map(([c, s]) => (c > 1 ? c + ' ' : '') + sp(s)).join(' + ');

  /* ================= generators: Unit 11 ================= */
  CQ.gen('c.firstlaw', (R) => {
    const q = R.pick([-250, -120, 85, 150, 320]), w = R.pick([-90, -40, 30, 75, 110]);
    const qd = q > 0 ? 'absorbs **' + q + ' J** of heat' : 'releases **' + -q + ' J** of heat';
    const wd = w > 0 ? 'has **' + w + ' J** of work done on it' : 'does **' + -w + ' J** of work on the surroundings';
    return { t: 'num', lvl: 3, q: 'A system ' + qd + ' and ' + wd + '. What is ΔU of the system?', a: q + w, unit: 'J', abs: 0.5,
      hint: 'ΔU = q + w. Heat in is +q. Work done ON the system is +w.',
      steps: ['q = ' + (q > 0 ? '+' : '') + q + ' J (' + (q > 0 ? 'heat in' : 'heat out') + ')', 'w = ' + (w > 0 ? '+' : '') + w + ' J (' + (w > 0 ? 'work done on the system' : 'work done by the system') + ')', 'ΔU = q + w = **' + (q + w) + ' J**'] };
  });

  CQ.gen('c.pv', (R) => {
    const P = R.pick([1.00, 1.50, 2.00, 3.00]), V1 = R.pick([2.0, 5.0, 10.0]), dV = R.pick([1.5, 3.0, 4.0, 8.0]);
    const w = -P * dV * 101.3;
    return { t: 'num', lvl: 3, q: 'A gas expands from **' + V1 + ' L** to **' + (V1 + dV) + ' L** against a constant external pressure of **' + P + ' atm**. How much work is done **on** the gas? (1 L·atm = 101.3 J)', a: w, unit: 'J',
      steps: ['w = −P_ext ΔV = −(' + P + ' atm)(' + dV + ' L) = ' + F(-P * dV) + ' L·atm', '× 101.3 J/(L·atm) = **' + F(w) + ' J**', 'Negative: an expanding gas does work on its surroundings.'] };
  });

  CQ.gen('c.thermostoich', (R) => {
    const opts = [['CH4', -890.4, 'methane'], ['C3H8', -2220, 'propane'], ['C2H5OH', -1367, 'ethanol'], ['C8H18', -5471, 'octane'], ['C6H12O6', -2803, 'glucose']];
    const [f, dH, name] = R.pick(opts);
    const g = R.pick([5.00, 10.0, 25.0, 50.0, 100.]);
    const q = (g / molarMass(f)) * dH;
    return { t: 'num', lvl: 3, q: 'Burning ' + name + ' has **ΔH = ' + dH + ' kJ per mole of ' + ch(f) + '**. How much heat is released when **' + g + ' g** of ' + ch(f) + ' burns? (Give a positive number in kJ.)', a: -q, unit: 'kJ',
      steps: ['mol = ' + g + '/' + F(molarMass(f), 4) + ' = ' + F(g / molarMass(f)) + ' mol', 'q = mol × ΔH = ' + F(g / molarMass(f)) + ' × (' + dH + ') = ' + F(q) + ' kJ', 'Heat released = **' + F(-q) + ' kJ**'] };
  });

  CQ.gen('c.dHscale', (R) => {
    const base = R.pick([[[[2, 'H2(g)'], [1, 'O2(g)']], [[2, 'H2O(l)']], -571.6], [[[1, 'N2(g)'], [3, 'H2(g)']], [[2, 'NH3(g)']], -92.2], [[[1, 'CaCO3(s)']], [[1, 'CaO(s)'], [1, 'CO2(g)']], 178.3]]);
    const op = R.pick(['rev', 'half', 'double', 'revhalf']);
    const k = { rev: -1, half: 0.5, double: 2, revhalf: -0.5 }[op];
    const desc = { rev: 'the reverse reaction', half: 'the reaction with every coefficient halved', double: 'the reaction with every coefficient doubled', revhalf: 'the reverse reaction with every coefficient halved' }[op];
    return { t: 'num', lvl: 2, q: '**' + sideStr(base[0]) + ' → ' + sideStr(base[1]) + '**, ΔH = ' + base[2] + ' kJ.\n\nWhat is ΔH for ' + desc + '?', a: base[2] * k, unit: 'kJ',
      steps: ['Reversing a reaction flips the sign of ΔH', 'Multiplying the coefficients by n multiplies ΔH by n', 'ΔH = ' + base[2] + ' × (' + k + ') = **' + F(base[2] * k, 4) + ' kJ**'] };
  });

  CQ.gen('c.qmct', (R) => {
    const [mat, c] = R.pick(Object.entries(CS));
    const m = R.pick([25.0, 50.0, 100., 150., 250.]), dT = R.pick([5.0, 12.5, 20.0, 35.0, 60.0]);
    const k = R.int(0, 2);
    if (k === 0) return { t: 'num', q: 'How much heat (in J) is needed to warm **' + m + ' g** of ' + mat + ' (c = ' + c + ' J/g·°C) by **' + dT + ' °C**?', a: m * c * dT, unit: 'J', steps: ['q = mcΔT', '= ' + m + ' × ' + c + ' × ' + dT + ' = **' + F(m * c * dT) + ' J**'] };
    if (k === 1) { const q = m * c * dT; return { t: 'num', q: 'A **' + m + ' g** piece of ' + mat + ' (c = ' + c + ' J/g·°C) absorbs **' + F(q) + ' J**. By how much does its temperature rise?', a: dT, unit: '°C', steps: ['ΔT = [[q|mc]] = [[' + F(q) + '|' + m + ' × ' + c + ']] = **' + F(dT) + ' °C**'] }; }
    const q = m * c * dT;
    return { t: 'num', lvl: 3, q: 'It takes **' + F(q) + ' J** to raise the temperature of **' + m + ' g** of an unknown metal by **' + dT + ' °C**. What is its specific heat?', a: c, unit: 'J/g·°C', steps: ['c = [[q|mΔT]] = [[' + F(q) + '|' + m + ' × ' + dT + ']] = **' + F(c) + ' J/g·°C** (' + mat + ')'] };
  });

  CQ.gen('c.mix', (R) => {
    const [mat, c] = R.pick(Object.entries(CS).filter(([k]) => k !== 'water' && k !== 'ethanol'));
    const mm = R.pick([25.0, 50.0, 75.0, 100.]), Tm = R.pick([80.0, 95.0, 100.]), mw = R.pick([50.0, 100., 150., 200.]), Tw = R.pick([20.0, 22.0, 25.0]);
    const Tf = (mm * c * Tm + mw * 4.184 * Tw) / (mm * c + mw * 4.184);
    return { t: 'num', lvl: 4, exam: true, q: 'A **' + mm + ' g** block of ' + mat + ' (c = ' + c + ' J/g·°C) at **' + Tm + ' °C** is dropped into **' + mw + ' g** of water (c = 4.184 J/g·°C) at **' + Tw + ' °C** in an insulated cup. What is the final temperature?', a: Tf, unit: '°C', tol: 0.005,
      hint: 'Heat lost by the metal = heat gained by the water: −m_m c_m(T_f − T_m) = m_w c_w(T_f − T_w).',
      steps: ['q_metal + q_water = 0', mm + '(' + c + ')(T_f − ' + Tm + ') + ' + mw + '(4.184)(T_f − ' + Tw + ') = 0', 'T_f = [[' + F(mm * c, 4) + '(' + Tm + ') + ' + F(mw * 4.184, 4) + '(' + Tw + ')|' + F(mm * c + mw * 4.184, 4) + ']]', 'T_f = **' + F(Tf, 3) + ' °C**'] };
  });

  CQ.gen('c.coffee', (R) => {
    const V = R.pick([50.0, 100.]), M = R.pick([0.500, 1.00]), dT = R.pick([3.4, 4.5, 6.7, 6.8]);
    const mass = 2 * V, q = mass * 4.184 * dT, n = M * V / 1000;
    const dH = -q / n / 1000;
    return { t: 'num', lvl: 4, exam: true, q: 'In a coffee-cup calorimeter, **' + V + ' mL of ' + M + ' M HCl** is mixed with **' + V + ' mL of ' + M + ' M NaOH**. The temperature rises by **' + dT + ' °C**. Assuming the solution has the density (1.00 g/mL) and specific heat (4.184 J/g·°C) of water, what is ΔH for the neutralization, in kJ per mole of H₂O formed?', a: dH, unit: 'kJ/mol',
      steps: ['Mass of solution = ' + mass + ' g', 'q_soln = mcΔT = ' + mass + ' × 4.184 × ' + dT + ' = ' + F(q) + ' J', 'q_rxn = −q_soln = ' + F(-q) + ' J', 'mol H₂O = ' + M + ' × ' + V / 1000 + ' = ' + F(n) + ' mol', 'ΔH = ' + F(-q / 1000) + ' kJ / ' + F(n) + ' mol = **' + F(dH) + ' kJ/mol**'] };
  });

  const HESS = [
    { target: 'C(graphite) + ½O₂(g) → CO(g)', given: ['C(graphite) + O₂(g) → CO₂(g)   ΔH = −393.5 kJ', 'CO(g) + ½O₂(g) → CO₂(g)   ΔH = −283.0 kJ'], ans: -110.5, steps: ['Keep eq. 1 as written: −393.5', 'Reverse eq. 2: CO₂ → CO + ½O₂, +283.0', 'Add: −393.5 + 283.0 = **−110.5 kJ**'] },
    { target: 'N₂(g) + 2O₂(g) → 2NO₂(g)', given: ['N₂(g) + O₂(g) → 2NO(g)   ΔH = +180.6 kJ', '2NO(g) + O₂(g) → 2NO₂(g)   ΔH = −113.1 kJ'], ans: 67.5, steps: ['Both equations are already in the right direction', '2NO cancels', 'ΔH = 180.6 + (−113.1) = **+67.5 kJ**'] },
